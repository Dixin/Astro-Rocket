<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Fallbacks. BlogImageSVG overrides bg / ico / txt / ln / pil / ptx / cor
       with the brand tokens, in light and dark, so this drawing follows the
       reader's colour mode and whichever of the 12 palettes the site uses. */
    .bg  { fill: var(--brand-500); }
    .ico { stroke: var(--brand-100); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .txt { fill: var(--brand-50); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 800; }
    .ln  { stroke: var(--brand-300); stroke-width: 1; stroke-opacity: 0.35; }
    .pil { fill: var(--brand-400); fill-opacity: 0.25; stroke: var(--brand-200); stroke-opacity: 0.4; stroke-width: 1; }
    .ptx { fill: var(--brand-100); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; }
    .cor { stroke: var(--brand-300); stroke-width: 1.5; fill: none; stroke-opacity: 0.45; }

    /* The button label sits on a brand-50 fill, so it takes the page colour.
       Not one of the overridden classes — it reads the token directly, which
       is what keeps it correct in both modes. */
    .btn-label { fill: var(--brand-600); font-family: 'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif; font-weight: 700; }
  </style>

  <rect width="1200" height="630" class="bg"/>

  <!-- The card -->
  <rect x="330" y="96" width="540" height="440" rx="26" class="pil"/>

  <!-- Lock, in its soft disc -->
  <circle cx="600" cy="170" r="34" class="pil"/>
  <g transform="translate(588, 158) scale(1)" class="ico" stroke-width="1.8">
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </g>

  <text x="600" y="248" font-size="38" text-anchor="middle" letter-spacing="-1" class="txt">Members</text>
  <text x="600" y="284" font-size="17" text-anchor="middle" class="ptx" opacity="0.85">Enter the email address you are registered with.</text>
  <text x="600" y="308" font-size="17" text-anchor="middle" class="ptx" opacity="0.85">We&#8217;ll send you a link to sign in. No password needed.</text>

  <!-- Field -->
  <text x="370" y="358" font-size="15" class="ptx" opacity="0.9">Email address</text>
  <rect x="370" y="372" width="460" height="54" rx="12" class="pil"/>
  <text x="392" y="406" font-size="17" class="ptx" opacity="0.55">you@example.com</text>

  <!-- Button -->
  <rect x="370" y="444" width="460" height="56" rx="12" class="txt"/>
  <text x="588" y="479" font-size="18" text-anchor="middle" class="btn-label">Send me a link</text>
  <g transform="translate(674, 464) scale(0.85)" stroke="var(--brand-600)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M5 12h14"/>
    <path d="m12 5 7 7-7 7"/>
  </g>

  <text x="600" y="576" font-size="15" text-anchor="middle" class="ptx" opacity="0.6">Back to the site</text>

  <path d="M 36 60 L 36 36 L 60 36" class="cor"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" class="cor"/>
  <path d="M 36 570 L 36 594 L 60 594" class="cor"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" class="cor"/>
</svg>
