<p>《<b>孤單一吻</b>》是香港搖滾樂隊<ContentLink uid="wiki/beyond">Beyond</ContentLink>發行第一張單曲，《孤單一吻》把別具西班牙Famenco的風情的歌曲，抽取用單曲發行，炮製一個Noon-D Mix，開宗名義討喜當時的年輕人Noon Disco市場，收錄於《<ContentLink uid="wiki/亞拉伯跳舞女郎">亞拉伯跳舞女郎</ContentLink>》。
</p>
