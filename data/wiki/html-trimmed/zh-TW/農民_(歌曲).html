<p>《<b>農民</b>》屬於<ContentLink uid="wiki/beyond">Beyond</ContentLink>所創作，收錄於<ContentLink uid="wiki/beyond">Beyond</ContentLink>第八張專輯《<ContentLink uid="wiki/繼續革命">繼續革命</ContentLink>》。
</p><p>此曲有廣東話和<span class="link-same-language" data-href="/wiki/%E5%9C%8B%E8%AA%9E">國語</span>部份，內容大抵是描述一個<span class="link-same-language" data-href="/wiki/%E4%B8%AD%E5%9C%8B">中國</span>農民的生活，如何在艱困的生活中逆境自強。但廣東話和<span class="link-same-language" data-href="/wiki/%E5%9C%8B%E8%AA%9E">國語</span>的版本卻有著極大不同。廣東話版本是由<ContentLink uid="wiki/劉卓輝">劉卓輝</ContentLink>填詞，是對山區農民生活的影射；而國語版則由<span class="link-same-language" data-href="/wiki/%E5%A7%9A%E8%8B%A5%E9%BE%8D">姚若龍</span>填詞，內容更為廣泛，是描述北方人重視固有生活的個性。
</p>
