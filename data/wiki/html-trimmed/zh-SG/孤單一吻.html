s="link-new">KINN'S MUSIC LTD.</span></td></tr></tbody></table>
<p>《<b>孤单一吻</b>》是香港摇滚乐队<ContentLink uid="wiki/beyond">Beyond</ContentLink>发行第一张单曲，《孤单一吻》把别具西班牙Famenco的风情的歌曲，抽取用单曲发行，炮制一个Noon-D Mix，开宗名义讨喜当时的年轻人Noon Disco市场，收录于《<ContentLink uid="wiki/亞拉伯跳舞女郎">亚拉伯跳舞女郎</ContentLink>》。
</p>
