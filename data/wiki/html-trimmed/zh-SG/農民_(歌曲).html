<style class="frontmatter">{"title":"农民 (歌曲)","sourceUrl":"https://zh.wikipedia.org/zh-SG/農民_(歌曲)","uid":"農民-歌曲","description":"外部链接","publishedAt":"2026-07-25T05:49:06.145Z","author":"Beyond.ms","tags":["Beyond"],"locale":"zh-SG","featured":false}</style><p>《<b>农民</b>》属于<PostLink uid="post:beyond">Beyond</PostLink>所创作，收录于<PostLink uid="post:beyond">Beyond</PostLink>第八张专辑《<PostLink uid="post:繼續革命">继续革命</PostLink>》。
</p><p>此曲有广东话和<span class="link-same-language" data-href="/wiki/%E5%9C%8B%E8%AA%9E">国语</span>部分，内容大抵是描述一个<span class="link-same-language" data-href="/wiki/%E4%B8%AD%E5%9C%8B">中国</span>农民的生活，如何在艰困的生活中逆境自强。但广东话和<span class="link-same-language" data-href="/wiki/%E5%9C%8B%E8%AA%9E">国语</span>的版本却有着极大不同。广东话版本是由<PostLink uid="post:劉卓輝">刘卓辉</PostLink>填词，是对山区农民生活的影射；而国语版则由<span class="link-same-language" data-href="/wiki/%E5%A7%9A%E8%8B%A5%E9%BE%8D">姚若龙</span>填词，内容更为广泛，是描述北方人重视固有生活的个性。
</p>
