33周年 首齣紀錄片 《真的相識過》回望舊日的足迹\",\"image\":[\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782164988183.jpeg\",\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782164989170.jpeg\",\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782164989308.jpeg\",\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782165004782.jpeg\",\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782165005420.jpeg\",\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782165021287.jpeg\",\"https://cloudapp01.ulifestyle.com.hk/post/600-1-1-CR-1-RB-1/post_1782165021853.jpeg\"],\"datePublished\":\"2026-06-23 05:51:13+08:00\",\"url\":\"/community/detailpost/74ec883f-eae7-494b-a933-1b3564409ac8/娛樂/黃家駒逝世33周年/Johnny-Man/210224\",\"author\":{\"@type\":\"Person\",\"name\":\"Johnny Man\",\"url\":\"https://www.ulifestyle.com.hk/community/user_profile/210224/Johnny-Man\"},\"text\":\"今年6月是Beyond靈魂人物黃家駒逝世33周年紀念,他的首部紀錄片《真的相識過》(Because of You Ka Kui)之前一直只以特別場推出,至本月將正式在香港上映,讓樂迷深入回顧這位香港搖滾傳奇的音樂旅程。\\n\\n黃家駒在1993年6月時因在日本演出發生意外,逝世時只有31歲,但他創作的首首經典歌曲,仍然傳唱至今。\\n\\n《真的相識過》紀錄片由構思到完成,歷時超過廿載,由發掘Beyond樂隊的經理人陳健添與創隊成員葉世榮共同監製,彭瑞祥執導,攝製隊走訪多個城市進行拍攝,包括香港、北京、台北、東京、倫敦及多倫多。\\n\\n極罕生活片段\\n\\n片中訪問近20位曾與黃家駒共事及親近的人士,包括Beyond不同時期的成員、幕後團隊及摯友。有些是昔日訪談剪輯,也有全新的內容,由不同好友和工作夥伴眼中,深入了解家駒的音樂歷程與生活故事,感受他真摯堅毅執着一面:從默默奮鬥,到登上事業巔峰背後的創作故事。同時片中也呈現了家駒音樂以外鮮為人知生活,如童年飲食喜好、衣着品味,更披露了家駒的愛情面貌,其前女友之一林楚麒也有受訪,談及昔日的純真戀情。\\n\\n珍貴從未曝光演出\\n\\n長達兩小時影片,亦首次公開Beyond多個珍貴的現場演出片段、黃家駒從未曝光的影像和錄音,包括非洲肯尼亞全程日記及台北演唱會宣傳等珍貴素材。重新曝光的演唱會片段更超過30分鐘的,絕對十分珍貴。\\n\\n此外亦重現家駒曾經走過的成長歲月,如土瓜灣、 堅道明愛、銀礦灣、鵝頸橋、洗衣街「二樓後座」、 深水埗、蘇屋邨、紅館等。許多與家駒日常生活相關的場景,如渡輪、小巴、茶餐廳、喳咋、肉餅、 曾灶財墨寶等,勾勒出一幅屬於家駒與我們共同記憶的香港生活圖鑑,真摯而熟悉。\\n\\n紀錄片主題曲《Because of You真的相識過》,為黃家駒的遺作,由關栩溢與陳健添填詞,葉世榮演唱。今個6月亦是家駒誕生的月份,不論是否新舊樂迷,都可以一起重新認識家駒,好好記住這位香港永恒的搖滾傳奇。(上映日期:6月25日)\\n\\n\"},{\"@context\":\"https://schema.org\",\"@type\":\"DiscussionForumPosting\",\"headline\":\"黃家駒逝世33周年 首齣紀錄片 《真的相識過》回望舊日的足迹\",\"image\":[\"https://cloudapp01.ulifestyle.com.hk/post
