							<p class="ArticleDate">刊登日期 : 2023-06-08</p><div class="ArticleCredit"><div>撰文︰黃皓頤</div></div>														<div class="ArticleLead"><p>　　每年6月，都會想起黃家駒。他的生忌在6月10日，死忌是6月30日。</p>
<p>　　黃家駒是香港搖滾樂的代表人物，當年他領軍的Beyond樂隊，他創作的數百首歌曲，不少都是百聽不厭。黃家駒和Beyond的音樂，不單影響本地樂壇，也是那一代人的青春回憶，令人念念不忘。</p>
</div>
<h2>黃家駒自小愛上搖滾音樂 1981年自組樂隊燃燒音樂之火</h2>
<p><iframe src="https://www.youtube.com/embed/lAskx_ONj9o" class="youtubeiframe" width="1280" height="720" frameborder="0" allowfullscreen="allowfullscreen"/></p>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黃家駒" alt="黃家駒" loading="lazy">
<figcaption>少年時期的黃家駒，已經熱愛搖滾音樂。（網上圖片）</figcaption>
</img></figure>
<p>　　黃家駒一生熱愛音樂，縱使初期波折重重，他也未有動搖。</p>
<p>　　黃家駒自小與家人住在深水埗蘇屋邨，早期在一些派對活動和朋友影響下，接觸並愛上1970年代的歐美搖滾音樂，例如大衛寶兒、Deep Purple（深紫樂隊）等。雖然父母並不喜歡兒子接觸這類音樂，但黃家駒仍堅持喜好。</p>
<p>　　中學畢業後，他曾任職任職辦公室助理、五金、水電工程、電視台布景員等工作，但內心仍燃燒着音樂的火燄。1981年，他認識了葉世榮，加上兩位朋友鄧煒謙和李榮潮，組成樂隊，這也是Beyond的雛型。</p>
<h2>為何樂隊叫Beyond？ 黃家駒一身任四職全能音樂人</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="Beyond" alt="Beyond" loading="lazy">
<figcaption>Beyond樂隊曾經多次出現成員變動，直至1984年黃家駒的弟弟家強加入擔任低音結他手，及1985年黃貫中成為主音結他手後，就成為日後我們熟悉的Beyond樂隊了。（圖片來源：視覺中國）</figcaption>
</img></figure>
<p>　　Beyond的名字是何時出現？1983年，黃家駒等組成的樂隊，想參加《結他雜誌》舉行的比賽，報名需要有樂隊名字，最終當時的主音結他手鄧煒謙建議樂隊改名Beyond，意思是超越自己。</p>
<p>　　其後，Beyond經過多次成員變動，在1984年黃家駒的弟弟家強加入擔任低音結他手，1985年黃貫中成為主音結他手，到了這階段，便組成了我們熟悉的Beyond樂隊。</p>
<p>　　在Beyond中，黃家駒一直是樂隊的靈魂人物，他既擔任作曲、填詞，也負責主唱和彈奏結他，一人分飾四角，堪稱全能的音樂人。</p>
<p>　　受到西方搖滾音樂的影響，黃家駒初期的創作是以英文歌為主，曲風也是搖滾風格。直至1986年，Beyond終於由地下音樂走進流行樂壇。</p>
<p>　　<strong>延伸閱讀：</strong>陳百強逝世30年｜香港第一位偶像 「情歌王子」開創廣東歌浪漫時代</p>
<h2>黃家駒開創粵語搖滾曲風 Beyond在80年代尾踏足樂壇頒獎禮舞台</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黃家駒" alt="黃家駒" loading="lazy">
<figcaption>Beyond的作品中，大部分都是由黃家駒一手包辦作曲、作詞的，你最喜歡哪首作品？（網上圖片）</figcaption>
</img></figure>
<p>　　1987年，黃家駒創作了歌曲《永遠等待》，作為以粵語嘗試搖滾曲風的試金石，也是Beyond發表的第一首中文歌曲。雖然早期Beyond帶點反叛的形象，未能獲得大眾的廣泛接納，但也算可以拾級而上，逐步邁向成功之路。</p>
<p>　　自1988年起，Beyond的作品開始踏上各大流行歌曲頒獎禮的舞台，《大地》、《真的愛你》、《光輝歲月》、《俾面派對》、《Amani》及《海闊天空》等。歌曲旋律悅耳、歌詞坦率直接，有訴說理想、情感，也有反映社會議題、反戰思維，予人寫實，又充滿社會時代感的感覺。</p>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黃家駒，Beyond樂隊" alt="黃家駒，Beyond樂隊" loading="lazy">
<figcaption>黃家駒和Beyond樂隊曾在1990年跟隨香港電台到巴布亞新幾內亞，探訪當地的貧窮家庭，令Beyond四子感受良多。（網上圖片）</figcaption>
</img></figure>
<h2>Beyond影響力延伸至內地東南亞 黃家駒遇意外英年早逝令人惋惜</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黃家駒" alt="黃家駒" loading="lazy">
<figcaption>黃家駒離世30年，他留下很多經典作品，至今仍有不少歌手翻唱。（網上圖片）</figcaption>
</img></figure>
<p>　　Beyond不單漸漸受到大眾接納和喜愛，其事業亦闖進高峰，也開拓了香港樂壇一個搖滾音樂的時代。樂隊的影響力更不單限於香港，也伸延至東南亞、內地、台灣及日本等亞洲地方和國家。</p>
<p>　　正當Beyond的發展一片向好之際，在1993年6月24日，黃家駒在東京一個電視台拍攝遊戲節目途中，遇意外跌倒受重創，之後昏迷不醒，直至當年的6月30日與世長辭，終年31歲。</p>
<p>　　黃家駒離開30多年，但我們仍記得他留下給我們的好歌，《喜歡你》、《真的愛你》、《光輝歲月》、《海闊天空》……每次音樂奏起，對黃家駒的思念、回憶都一一湧現，未有因年月而淡忘。</p>
<p>　　<strong>延伸閱讀：</strong>莫文蔚愛挑戰 她是金曲歌后 也是《食神》火雞姐</p>							</article>

							<div class="Headline">
							<p><strong>　　古代開學禮，古代學子會向老師送上「束脩六禮」，那是甚麼呢？
</strong></p><p><p>　　「束脩」是指古代弟子拜師時所獻的學費或禮物。《論語》中記載孔子的話說：「自行束脩以上，吾未嘗無誨焉。」</p><p>　　「束脩六禮」就是拜師時向先生贈送的六種象徵性物品，分別是：芹菜，寓意為勤奮好學；蓮子，蓮子心苦，寓意苦心教育；紅豆，寓意紅運高照；紅棗，寓意早早高中；桂圓，寓意功德圓滿；乾瘦肉條，表達弟子心...</p></p>							</div>
