                        <div class="article-body" itemprop="articleBody">
                                        <p>模範夫妻朱茵、黃貫中帶著7歲女兒「叉燒包」登上陸綜《想想辦法吧！爸爸》，爸爸黃貫中挑戰獨自照顧女兒24天，而節目最後，朱茵終於現身和老公、女兒團聚，黃貫中深情對愛妻告白：「一家人再也不要分開，好不好？」讓朱茵感動到眼眶都紅了。</p>
    


                                        
                                        <div class="ad rwd with-placeholder" data-id="mobile-middle-banner">
                                            <div class="underlay-auto-scale">

                                        </div>
                                        
                                        
    


                                        <p>黃貫中為了陸綜，挑戰連續24天照顧7歲女兒「叉燒包」，黃貫中在節目中展現暖爸本色，叉燒包也很乖巧、懂事，還會照顧節目中其他的小小嘉賓，父女互動狂圈粉，不過最感動莫過於，在節目尾聲時，朱茵終於現身和老公、女兒團聚，叉燒包一看到媽咪現身，就興奮上前抱住朱茵。</p>
    


                                        
    


                                            
        <figure>
            <div class="photo-container">
                <img class="photo" loading="lazy" src="https://images.chinatimes.com/newsphoto/2020-11-27/656/20201127002748.jpg" alt="黃貫中對妻的真情告白，讓朱茵感動到眼眶都紅了。（圖／取材自ODC官方頻道 OnDemandChina Official Channel Youtube）" width="656" height="429">
            </img></div>
            <figcaption>黃貫中對妻的真情告白，讓朱茵感動到眼眶都紅了。（圖／取材自ODC官方頻道 OnDemandChina Official Channel Youtube）</figcaption>
        </figure>
    


                                        <p>隔了將近1個月，黃貫中終於見到朱茵，他也深情對愛妻說：「不管什麼理由，將來不要再這樣了，求求你，好不好？沒有你在旁分享她（女兒）的成長，我覺得我們這個家庭，缺了一大塊，一家人再也不要分開，好不好？」</p>

                                        <p>黃貫中真情告白讓朱茵感動到熱淚盈眶，她開心對著黃貫中點頭、並感性說：「謝謝老公」，說完兩人還大方熱吻，夫妻真情告白感動全場，外界也驚呼朱茵根本是嫁給愛情。</p>
