							<article id="article_detail" class="M">
							<p class="ArticleDate">刊登日期 : 2024-06-28</p><div class="ArticleCredit"><div>撰文︰黃皓頤</div></div>														<div class="ArticleLead"><p>　　在香港樂壇，黃家駒是不折不扣的搖滾樂代表人物，儘管他逝世逾30年，他和其領軍的Beyond樂隊，依然是樂迷忘不了的集體回憶。</p>
<p>　　讓我們一起回顧黃家駒和Beyond在音樂路上的點滴。</p>
</div>
<h2>Beyond為何不改中文名？</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond1_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond1_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond1_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond1_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond1_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="Beyond" alt="Beyond" loading="lazy">
<figcaption>早期的Beyond。（網上圖片）</figcaption>
</img></figure>
<p>　　1983年，由黃家駒、鼓手葉世榮、主音結他手鄧煒謙、低音結他手李榮潮組成的樂隊，為了參加《結他雜誌》舉行的樂隊比賽，而需要用樂隊名字來報名。後來，鄧煒謙提議了樂隊名稱Beyond，意指超越自己。</p>
<p>　　Beyond初出道時，很多人都不懂得其正確讀音，最常讀成「Be on」，因此曾想過改中文名，例如「別安」、「比安」、「彼岸」等。最終，還是覺得Beyond這名字最好，也沒再想要改中文名了。</p>
<h2>為何由搖滾形象換上阿拉伯服裝？</h2>
<div class="GalleryWrapper G2"><div><article><div class="Thumbnail"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="front gallery-image" title="Beyond" alt="Beyond" loading="lazy"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond2_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="back gallery-image" loading="lazy"/></img></div></article></div><div><article><div class="Thumbnail"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="front gallery-image" title="黃家駒" alt="黃家駒" loading="lazy"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond3_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="back gallery-image" loading="lazy"/></img></div></article></div></div>
<p>　　1986年，Beyond租用錄音室將創作歌曲《再見理想》製成錄音帶，嘗試找唱片行寄賣。1987年，推出第一張EP《永遠等待》，以搖滾樂隊面貌示人。</p>
<p>　　不過，同年推出的第一張專輯《亞拉伯跳舞女郎》（阿拉伯跳舞女郎），Beyond卻形象大變，穿上阿拉伯服裝演出，一切只為了尋求更大市場的突破。</p>
<p>　　80年代的香港，搖滾樂並不利於商業市場的推廣，而當時簽約唱片公司的Beyond，為了商業考慮，也不得不作出新嘗試。不過，這一變，卻惹來不少原本喜愛搖滾Beyond的樂迷批評。</p>
<p>　　<strong>伸延閱讀：</strong>青春的記憶Beyond 忘不了的靈魂人物黃家駒</p>
<h2>《大地》為何由黃貫中主唱？</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond7_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond7_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond7_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond7_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond7_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="Beyond" alt="Beyond" loading="lazy">
<figcaption>Beyond曾經過多次成員變動，直至1984年黃家駒的弟弟家強加入擔任低音結他手，1985年黃貫中成為主音結他手後，才組成我們熟悉的Beyond樂隊。（圖片來源：黃家強微博）</figcaption>
</img></figure>
<p>　　由黃家駒作曲、劉卓輝填詞、黃貫中演唱的《大地》，最初錄製成Demo（樣本帶）時，歌名為《黃河》，是描述離家者對故土的眷戀。後來，歌曲正式推出前，才改名《大地》。</p>
<p>　　Beyond大部分歌曲都是由黃家駒主唱，但當時為了讓Beyond更多元化發展，就決定讓黃貫中主唱《大地》作為新嘗試。</p>
<h2>Beyond哪首歌曲最入屋？</h2>
<p>　　Beyond有不少經典好歌，但論到真正令樂隊推上高峰的，是1989年歌頌母愛的《真的愛你》。</p>
<p>　　歌曲大受男女老幼歡迎，甚至成為中學音樂課的選歌之一，往後也成為每年母親節的必選之歌，絕對是成功入屋之作。</p>
<p>　　不過，有指黃家駒不太喜歡這首歌，認為它過於商業化。</p>
<h2>黃家駒的作曲靈感從何而來？</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond8_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond8_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond8_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond8_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond8_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黃家駒" alt="黃家駒" loading="lazy">
<figcaption>黃家駒曾創作數百首歌曲，他曾表示，最大的寫作動力是車輛行走時機器發出的噪音；作曲靈感則來自生活。（網上圖片）</figcaption>
</img></figure>
<p>　　這位一生寫下數百首歌曲的創作人，最大的寫作動力竟然是車輛行走時機器發出的噪音。他曾表示，在乘車時特別想寫東西。此外，黃家駒也愛在深夜寫歌，因此晚上不愛睡覺。</p>
<p>　　他的創作靈感常來自生活，例如1990年8月他隨香港電台到巴布亞新幾內亞，親睹當地民眾在戰爭和災荒下的苦難生活。返港後，他又在報章及電視上看到遭到囚禁黑牢27年的南非領袖曼德拉被釋放，很佩服對方的堅強信念，因此得到啟發寫下《光輝歲月》，向對方致敬。</p>
<p>　　<strong>伸延閱讀：</strong>同是樂壇傳奇 王菲天生唱將無人可代替</p>
<h2>《Amani》是和平之歌？</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond6_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond6_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond6_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond6_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2024/06/KomaBeyond6_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="Beyond" alt="Beyond" loading="lazy">
<figcaption>1991年2月，Beyond跟隨宣明會到非洲肯尼亞探訪當地兒童，親睹當地民眾的苦難生活，因而寫下大愛之歌《Amani》。（網上圖片）</figcaption>
</img></figure>
<p>　　對，《Amani》歌名的中文意思就是和平，而歌詞中經常重覆的Nakupenda We We，就是我們愛你的意思。</p>
<p>　　1991年，Beyond跟隨宣明會到非洲肯尼亞探訪當地兒童，黃家駒看到非洲民眾面對的苦難，深受觸動。於是，他問了繙譯員「愛、和平、我愛你、友誼」的當地語言說法和寫法，然後就彈着結他，彈奏出《Amani》的副歌，其後寫成了這首充滿大愛及和平精神的歌曲。</p>							</article>

							<div class="Headline">
							<p><strong>　　古代開學禮，古代學子會向老師送上「束脩六禮」，那是甚麼呢？
</strong></p><p><p>　　「束脩」是指古代弟子拜師時所獻的學費或禮物。《論語》中記載孔子的話說：「自行束脩以上，吾未嘗無誨焉。」</p><p>　　「束脩六禮」就是拜師時向先生贈送的六種象徵性物品，分別是：芹菜，寓意為勤奮好學；蓮子，蓮子心苦，寓意苦心教育；紅豆，寓意紅運高照；紅棗，寓意早早高中；桂圓，寓意功德圓滿；乾瘦肉條，表達弟子心...</p></p>							</div>

</p>
