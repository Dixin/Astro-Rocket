                    <article class="content-main editor-content-view"><p>太極樂隊 出道40周年，呢次接受《一周星星》 許文軒 專訪，就佢哋合作同相識遍天下，原來當年更曾擊敗過 Beyond，黃貫中 更笑言當年直情未有入圍，而憑Pat哥創作一首《暴風紅唇》勝出，仲特別編曲到每位成員都有表演機會，所以一舉橫掃多個獎項。</p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/7M8luc3HzEP43-O354cs9hbTtr8=/0x0/public/article/content/202603/3650e958-4856-4b6d-8acb-8669d598f9c0.jpg" alt="" data-desc="當年太極參賽連奪多獎" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>myTV SUPER重溫《一周星星》精彩內容<br/></p><p>阿Paul又問到太極各位成員，認為邊一個崗位最重要，德哥就認為成員缺一不可，就好似Beyond當年四位一體一樣。</p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/D3H2VTioVxBrZcyWmM8DDrcR_AY=/0x0/public/article/content/202603/c048d68c-1269-4709-9e44-18b37c814222.jpg" alt="" data-desc="德哥認為任何一隊樂隊都缺一不可" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/></p><p>《一周星星》逢星期日 22:00 翡翠台</p></article>
