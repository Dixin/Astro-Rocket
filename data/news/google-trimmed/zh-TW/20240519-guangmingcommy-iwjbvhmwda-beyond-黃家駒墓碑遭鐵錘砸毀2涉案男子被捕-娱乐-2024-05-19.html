<span> 分享</span></div>
 <span class="screen-reader-text">Facebook</span> <span class="screen-reader-text">Twitter</span> <span class="screen-reader-text">WhatsApp</span> <span class="screen-reader-text">Telegram</span> <span class="screen-reader-text">分享</span></div></div><div class="featured-area"><div class="featured-area-inner"><figure class="single-featured-image"><img width="800" height="420" src="https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz2-55.jpg" class="attachment-full size-full wp-post-image" alt="" decoding="async" fetchpriority="high" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz2-55.jpg 800w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz2-55-300x158.jpg 300w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz2-55-768x403.jpg 768w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz2-55-250x131.jpg 250w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz2-55-600x315.jpg 600w" sizes="(max-width: 800px) 100vw, 800px"/></figure></div></div><div class="entry-content entry clearfix"><div itemprop="articleBody"><p><span style="color: #0000ff;"><strong>香港殿堂級樂隊Beyond已故主唱黃家駒，位於將軍澳華人永遠墳場的墓碑遭2名男子大肆破壞，還將犯案影片PO上網，並用腳踢打黃家駒的遺照，甚至拿鐵錘砸毀墓碑，執法人員當場逮捕2人，此事更是引發歌迷及大衆的怒火。</strong></span></p><p>（香港19日讯）太过份了！</p><div class="code-block code-block-7" style="margin: 8px auto; text-align: center; display: block; clear: both;"><div style="color:#777777;text-align:center;font-size: 12px">Advertisement</div><div id="div-gpt-ad-1545447264610-5" style="text-align:center; margin-bottom:1.846em;">  </div></div><p>一名15岁光头少年偕23岁男子在19日早上到将军澳华人永远坟场，毁坏香港传奇乐队Beyond已故主音黄家驹坟墓，涉嫌刑事毁坏被捕。</p><div class="code-block code-block-8" style="margin: 8px auto; text-align: center; display: block; clear: both;">
</div><p>该刑毁片段被上载到网络，一名光头少年自称“社会破坏者”，先是唱著名曲《海阔天空》，接著开始粗言辱骂黄家驹，向墓碑淋泼汽水后上前舔走，用脚踩歌迷献上的鲜花祭品之余，在墓碑上写了“社会破坏者”、“光头Bob”等字眼，更用锤敲遗照，导致遗照毁烂。</p><div class="code-block code-block-10" style="margin: 8px auto; text-align: center; display: block; clear: both;"><div id="div-gpt-ad-1545447264610-7">  </div></div><p>负责砸毁墓碑的光头少年对镜头嚣张表示，要让大家记住自己，更放话：“我会拯救一切。”警方于早上11时许接获报案，经调查后拘捕2人。由于光头少年在影片中语无伦次，外界猜测可能精神状况不佳。</p><p>翻查资料，黄家驹墓碑曾多次遭人涂污及破坏，上一次是在2019年7月初，有粉丝前往拜祭时发现其墓碑损毁。</p><div class="code-block code-block-11" style="margin: 8px auto; text-align: center; display: block; clear: both;"><div id="div-gpt-ad-1545447264610-8" style="text-align:center; margin-bottom:1.846em;"><div style="color:#777777;text-align:center;font-size: 12px">ADVERTISEMENT</div>  </div></div><p><span style="color: #0000ff;"><strong>队友怒责“可恶”</strong></span></p><p>Beyond队友黄贯中受访时，第一句便问：“捉到了吗？”愤怒表示破坏亡者墓“小则肚痛，大则横死。”</p><div class="code-block code-block-16" style="margin: 8px 0; clear: both;"><p>另一位队友叶世荣表示，已获通知2名男子被捕，并指黄家驹在天之灵也不会放过他们，他较后在社交网发文：“今天发生在黄家驹坟墓的事情实在可恶，这2个人已经被逮捕，必须受到法律的制裁，黄家驹在天之灵也不会放过他们！”而黄家驹胞弟黄家强，至截稿为止尚未取得联络。</p><figure id="attachment_1856101" aria-describedby="caption-attachment-1856101" style="width: 1920px" class="wp-caption alignnone"><img decoding="async" class="size-full wp-image-1856101" src="https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483.jpg" alt="" width="1920" height="2504" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483.jpg 1920w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-230x300.jpg 230w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-785x1024.jpg 785w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-768x1002.jpg 768w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-192x250.jpg 192w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-1178x1536.jpg 1178w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-1570x2048.jpg 1570w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/51585491_2329CSS_1716109732483-600x783.jpg 600w" sizes="(max-width: 1920px) 100vw, 1920px"><figcaption id="caption-attachment-1856101" class="wp-caption-text">黄家驹于1993年6月24日在日本拍摄电视台游戏节目，不慎于高台堕下陷入昏迷，6月30日逝世，终年31岁。</figcaption></img></figure><figure id="attachment_1856102" aria-describedby="caption-attachment-1856102" style="width: 800px" class="wp-caption alignnone"><img decoding="async" class="size-full wp-image-1856102" src="https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz6-16.jpg" alt="" width="800" height="420" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz6-16.jpg 800w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz6-16-300x158.jpg 300w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz6-16-768x403.jpg 768w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz6-16-250x131.jpg 250w, https://webcdn.guangming.com.my/wp-content/uploads/2024/05/zz6-16-600x315.jpg 600w" sizes="(max-width: 800px) 100vw, 800px"><figcaption id="caption-attachment-1856102" class="wp-caption-text">光头少年恶意破坏黄家驹的坟墓，导致遗照遭敲毁。</figcaption></img></figure><p>&nbsp;</p><div class="code-block code-block-13" style="margin: 8px 0; clear: both;">  <div id="div-gpt-ad-1545447264610-9">  </div><div id="div-gpt-ad-1545447264610-4">  </div><div id="div-gpt-ad-1545447264610-10">  </div><div id="div-gpt-ad-1630982445971-0">  </div></div></div><div class="post-bottom-meta"><div class="post-bottom-meta-title"> 標籤</div><span class="tagcloud">黃家駒 墓碑 Beyond 鐵錘砸毀</span></div></div>  <div class="post-footer post-footer-on-bottom"><div class="share-links  share-centered icons-only"><div class="share-title">
