                    <div itemprop="articleBody">
                                            在台灣講到搖滾樂團<br>大部份人可能會想到<br>五月天 伍佰&amp;China Blue 信樂團<br><br>其實在1992年，也就是民國81年<br>台灣出現一個搖滾樂團Chyna<br><img src="https://attach.mobile01.com/attach/202008/mobile01-63df9c4f23b463f82de432b7affbef6a.jpg" fetchpriority="high" alt="【廢文復興】被Beyond尊為前輩的樂團，如流星一般的Chyna"><br><img src="https://attach.mobile01.com/attach/202008/mobile01-68689e529069397b03751994fa9f802f.jpg" loading="lazy" alt="【廢文復興】被Beyond尊為前輩的樂團，如流星一般的Chyna"><br><br><br>當時還在台灣各地及大學校團辦巡迴演唱會(免費)<br>專輯在排行首位達六周，銷售了四張百金唱片<br><br>小弟當時有幸在校園聽了Chyna的演唱會<br>主唱崔元姝極具爆炸力的聲線<br>別說當時的樂手<br>至今也很少有女歌手能相比擬的(歐陽菲菲 蘇芮 甄妮)<br>只可惜Chyna出了一張專輯及一張巡迴LIVE<br>就在歌壇消失了<br>不過<br>第一次感受樂團現場演唱，<br>那種震撼感覺至今仍記憶猶新<br><br>答案(唯一首有MV 畫質差 加減看)<br><lite-youtube videoid="_J0dyjwbjn0" playlabel="播放影片" style="background-image: url('https://i.ytimg.com/vi/_J0dyjwbjn0/hqdefault.jpg');" data-title=""><button type="button" class="lyt-playbtn lty-playbtn"><span class="lyt-visually-hidden">播放影片</span></button><noscript><iframe width="560" height="315" title="播放影片" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/_J0dyjwbjn0?autoplay=1&amp;playsinline=1"/></noscript></lite-youtube><br><br>全世界都在心跳 我很喜歡的一首<br><lite-youtube videoid="OdLeltW7Y7g" playlabel="播放影片" style="background-image: url(&quot;https://i.ytimg.com/vi_webp/OdLeltW7Y7g/hqdefault.webp&quot;);" data-title=""><button type="button" class="lyt-playbtn lty-playbtn"><span class="lyt-visually-hidden">播放影片</span></button><noscript><iframe width="560" height="315" title="播放影片" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/OdLeltW7Y7g?autoplay=1&amp;playsinline=1"/></noscript></lite-youtube><br><br>Because of you 抒情歌<br><lite-youtube videoid="M-9piUmWHDI" playlabel="播放影片" style="background-image: url(&quot;https://i.ytimg.com/vi/M-9piUmWHDI/sddefault.jpg&quot;);" data-title=""><button type="button" class="lyt-playbtn lty-playbtn"><span class="lyt-visually-hidden">播放影片</span></button><noscript><iframe width="560" height="315" title="播放影片" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/M-9piUmWHDI?autoplay=1&amp;playsinline=1"/></noscript></lite-youtube><br><br>以下是查到的資料<br><br>被Beyond尊為前輩的香港搖滾樂隊，女主唱的唱功很強 原文網址：https://kknews.cc/entertainment/zyqyrjg.html<br>2020-02-27 由 與聲緣 發表于娛樂<br><br><br>上世紀90年代的華語樂壇，有很多卓越的搖滾男歌手與男主唱，但也出現過一些不凡的搖滾女聲。今天介紹的這位女主唱叫做崔元姝，歐美化的演唱、絕佳的爆發力，在90年代初期的台灣樂壇獨樹一幟。<br><br>崔元姝加盟的Chyna樂隊，是一支幾經疊代的香港資深搖滾樂隊。樂隊成員與很多港台歌手都有過合作，比如譚詠麟、鍾鎮濤、葉倩文、王傑與蘇芮等。<br><br><br>1992年，台灣友善的狗公司推出了Chyna的首張國語《答案》，在業內非常受關注。當年香港衛視中文台經常播放《答案》的MV，磁帶版也被第一時間引進到內地。<br><br><br><br>樂隊成員來自不同的國家與地區，1992年時的陣容已經疊代多次，分別是：主唱崔元姝（Sarah）、鼓手唐龍（Donald Ashley）、鍵盤袁卓繁（Richard Yuen）、吉他吳士明（Peter Ng）、Jim Knettle與貝斯Stephen Hogg。<br>Chyna樂隊的成軍與疊代<br><br>鍵盤手袁卓繁（Richard Yuen）與吉他手吳士明（Peter Ng）相識在香港念高中的時候，六歲就開始學琴的袁卓繁當時還只是玩票性質，而吳士明早已經是半工半讀的樂手了。<br><br>1970年，袁卓繁到加拿大念大學，開始接觸當地的音樂，認識了不少樂團。加拿大的Stephen在樂隊擔任貝斯手兼主唱，袁卓繁加入成為鍵盤手，隨著樂隊在加拿大表演。後來，又在另一個樂隊結識了加拿大吉他手Jim。<br><br>在香港，吉他手吳士明積極籌組樂隊。1974年，他與朋友的Ramband成軍，不久唐龍（Donald Ashley）加入擔任鼓手。<br><br>唐龍6、7歲開始打鼓，天生具有強烈的節奏感，無師自通地領略到人與鼓之間的契合，當他看過吳士明的表演後，對他的技巧非常肯定，主動地向他表示合作的意願，開始了他們多年的搭檔。<br><br><br>唐龍的父親是美國人，母親是馬來西亞人，但自小在香港出生長大。1983年，Ramband解散之後唐龍另組新團，取名為Chyna。<br><br>Chyna的首張專輯推出後，以一曲英文歌《Within You'll remain》打入國際市場，被翻譯成多種語言，徐小鳳、林憶蓮等眾多知名歌手都翻唱過。<br><br>後來Chyna的成員有所變動，1985年底，唐龍與吳士明重新將Chyna組織起來，一年後袁卓繁從加拿大回香港加入Chyna。<br><br>1990年，Jim旅行到香港，在袁卓繁的邀請下，他參加了幾次香港藝人演唱會的表演，Jim決定留在香港樂壇發展，後來Stephen也從加拿大飛往香港與Jim一起加入Chyna。<br><br>這五個人與音樂為伍的時間，加起來超過一個世紀，種種因緣際會，他們終於在香港聚首，整裝待發。<br>女主唱催生國語專輯<br><br>韓籍女主唱崔元姝（Sarah）在高雄出生在台北長大，學生時代就與朋友共組樂隊，並在pub駐唱。1988年，她認識了「友善的狗」的沈光遠與羅紘武，並在一年後簽了藝人約，但做樂隊是她想要的表現方式。<br><br>沈光遠在為趙傳製作首張專輯《我很醜可是我很溫柔》時，在香港結識了唐龍及Chyna，當唐龍向沈光遠提出Chyna想在90年復出的想法，沈光遠立刻聯想到崔元姝，建議Chyna與崔元姝結合出版中文專輯。<br><br><br><br>他們一拍即合，經過一年多的創作、排練、錄製等工作，1992年這個曾經走紅國際樂壇的搖滾樂隊，終於以全新的面貌在台灣登陸，發行了他們的首張國語專輯《答案》。<br><br>五位樂手分別擔綱作曲，崔元姝連同台灣知名詞人詹德茂、陳桂珠、張方露，一起為專輯填寫了10首國語詞，《Within You'll remain》也有了國語版《未來的愛》。<br><br>整張專輯融入了硬搖滾與重金屬，曲風非常硬朗，《答案》《成長》與《沒有人希望走在黑暗中》等作品，彰顯了崔元姝出色的唱功。<br><br>Chyna在台灣做了多場的巡演，還發行了一張巡演live專輯《1992巡迴演唱會實錄》，記錄了樂隊老練的場控與即興表演。《答案》之後，崔元姝與Chyna沒有一起再合作新的原創專輯，Chyna樂隊也成為了歷史。<br><br><br>1995年，單飛的崔元姝推出了英文翻唱專輯《I Want To Know What Love Is》，翻唱了皇后、蠍子等歐美樂隊的很多搖滾作品。專輯採用樂隊真樂器方式錄製，原東方快車的吉他手楊振華、張雨生的鍵盤手櫻井弘二（Koji Sakurai）出現在陣容當中。<br><br>翻唱專輯要比《答案》專輯溫柔一些，同名主打歌《I wont To Know What Love Is》是「外國人」樂隊（Foreigner）的代表作。當年這首歌非常受歡迎，到今天有歐美與亞洲很多位歌手演繹過，比如瑪麗·亞凱莉、黃鶯鶯、高明駿，甚至美國演員湯姆·克魯斯等。這張翻唱專輯之後，崔元姝就基本淡出華語唱片行業了。<br><br><br><br>2014年，唐龍因病逝世，享年58歲。Beyond的黃貫中發微博悼念這位搖滾傳奇人物：「大哥，這次你解脫了，我心痛，但不碎。我們在另一面再會吧，我永遠愛你！」<br><br><br><br>不久，吉他手Jim Knettle也在香港去世。崔元姝後來來內地演出，曾經發微博懷念離世的樂隊成員。
                                        </br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></br></img></br></img></br></br></br></br></br></br></div>
