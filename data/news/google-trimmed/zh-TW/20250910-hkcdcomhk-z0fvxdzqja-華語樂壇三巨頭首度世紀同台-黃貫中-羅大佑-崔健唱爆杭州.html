							<h2 class="conten_title">華語樂壇三巨頭首度世紀同台 黃貫中、羅大佑、崔健唱爆杭州</h2>
							<div class="ti_con">
								<span class="ti_l">2025-09-10</span>
								
							</div>
							<div class="from_new">
								来源：香港商報網							</div>
							<div class="content_main">								
									<p>　華語樂壇再放震撼彈！三位重量級音樂傳奇——香港搖滾代表黃貫中（Paul）、台灣音樂教父羅大佑，以及內地搖滾先驅崔健，宣布攜手將於2025年10月11日在杭州奧體中心體育場（大蓮花）盛大舉行「時光Classic演唱會·三響杭州站」。三位音樂宗師今次首度世紀同台，被譽為華語音樂史上罕見時刻！</p><p><img src="https://www.hkcd.com.hk/userfiles/20250910/1757500903817656.jpg" alt="微信圖片_20250910173419_8960_5.jpg"/></p><p><img src="https://www.hkcd.com.hk/userfiles/20250910/1757500907646673.jpg" alt="微信圖片_20250910173417_8958_5.jpg"/></p><p><img src="https://www.hkcd.com.hk/userfiles/20250910/1757500911566168.jpg" alt="微信圖片_20250910173418_8959_5.jpg"/></p><p><strong>　國際水準製作 樂迷引頸以待</strong></p><p>　「三響演唱會」早前正式獲得浙江省文化廣電和旅遊廳批准，三位主角已積極備戰，Paul 
表示：「知道今次杭州大蓮花場館可以容納超過46000人，好期待大家一齊大合唱嘅震撼畫面。」他們同時預告將會獻不少金曲，誓必勾起不少樂迷的回憶殺。</p><p>　除了三位音樂巨頭外，演出團隊還匯聚來自兩岸三地的資深樂手，請馬達加斯加樂手參與，共同打造國際級音樂現場。而演唱會消息傳出後，即時在樂迷圈引發轟動，許多香港歌迷已開始打探購票與行程，直呼：「呢個組合真係有今生冇來世！」、「三位教父同台，簡直係終極夢想！」隨着門票發售日期確定，預料屆時將掀起一波音樂朝聖熱潮！</p>
