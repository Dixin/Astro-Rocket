					<h2 class="introduction">雖然Beyond和黃家駒都已不復存在，〈海闊天空〉和他們的多首代表歌曲還是存在許多人的心中，甚至像有了自己的生命一樣繼續發展出新意義，尤其這些歌曲所誕生的90年代，在許多香港人心中更代表著一個令人懷念的盛世</h2>

				


				<div class="content" id="div1">

					<p>&nbsp;</p>
<p>有些音樂人或許已不存在，音樂作品卻永遠的留傳下來影響著世人，還能隨著時代變化衍伸出新的意義，這正是流行音樂所具有的獨特力量和魅力所在，而被稱為是香港最具代表性樂團的Beyond，他們就是屬於這樣的音樂人，用歌曲跨越了語言的藩籬，成為不同世代的生活印記。</p>
<p>&nbsp;</p><br>


					
					<div class="pic text-center"/><br>



					<p><strong>以前衛樂團之姿打響名號</strong></p>
<p>&nbsp;</p>
<p>講到Beyond樂團一定得特別提到的是靈魂人物黃家駒。他初中開始愛上英美搖滾樂，偶像是David Bowie，1983年認識打鼓的葉世榮後一拍即合，再找了吉他手鄧煒謙和貝斯手李榮潮共組樂團，鄧煒謙將樂團命名為Beyond（超越），意思是要「超越自己」，也是在說要「Beyond Rock and Roll」，樂團以搖滾樂為主但玩的不止搖滾樂。李榮潮與鄧煒謙因為音樂理念不同相繼離團，黃家駒的弟弟黃家強加入，其他團員又經過一些更替，直到葉世榮把幫他們設計演出海報的黃貫中拉進來當吉他手，後來大家熟悉的Beyond陣容這才成形。黃家駒是樂團主要的歌曲創作者，除了原本以英語創作歌曲之外，這時也開始用粵語創作，音樂則含括藝術搖滾、後龐克、重金屬、華麗搖滾等豐富的各類風格。1985年他們向銀行貸款自費辦了一場演唱會，雖然票房虧損，卻以前衛樂團之姿就此在香港地下樂壇打響了名號。</p>
<p>&nbsp;</p>
<p>1987年，香港興起一陣樂團熱潮，他們也在此時進入主流公司發專輯，有比較多的人認識了他們，卻也有以往的粉絲不喜歡他們變得商業化的選擇；在商業和理想的兩難掙扎擺盪中，第三張專輯《秘密警察》以較大眾化的曲風大受歡迎，讓Beyond首次獲得銷量雙白金的佳績，有了〈喜歡妳〉、〈大地〉等代表歌曲，更首次奪得香港重要音樂獎項「十大勁歌金曲」。這成了Beyond邁向香港首席樂團的起點，之後他們屢屢創下銷售和得獎紀錄，團員也開始參演電影、主持電視節目，還以「過江龍」之姿來到台灣發行國語專輯。商業上的成功並未讓他們被沖昏頭，Beyond的作品依舊生猛十足，有批判社會現象、諷刺時弊的，也有表達理想與現實間的矛盾以及對未來憧憬盼望的，像是〈AMANI〉是他們應世界展望會之邀到非洲探訪後所寫，呼籲世界和平的大愛，〈光輝歲月〉是獻給南非著名反種族隔離革命家曼德拉的歌，〈真的愛你〉則是頌揚母愛的偉大。曲風上力求在主流中不失非主流色彩，大膽嘗試放入強烈的東方風格，也會結合放克音樂或重金屬搖滾樂的元素。Beyond從地下樂壇崛起，以接近底層小人物心聲的音樂被主流認可的歷程，是當時香港年輕人津津樂道的故事。</p>
<p>&nbsp;</p>
<p><strong>赴日發展遇意外，〈海闊天空〉成代表作</strong></p>
<p>&nbsp;</p>
<p>成為國際化的樂團一直是Beyond的夢想，這個夢想在他們赴日本NHK參加節目被Amuse經紀公司看上，近而簽約正式進軍日本樂壇而有了實踐的機會，不過這個契機也種下了日後的悲劇。1993年6月，他們應邀上富士電視台的遊戲節目宣傳專輯，在遊戲中，黃家駒不慎從近3公尺的高台上摔落，頭部直接著地重傷，在醫院昏迷6天後於6月30日過世，31年短暫的生命就此嘎然而止。就在這場令人傷心的節目錄影前一個月，他們才在香港發行了新專輯《樂與怒》，在專輯發行量高、暢銷榜更替速度快的90年代，《樂與怒》推出三週後已掉出銷量榜前十名，其中的歌曲也沒有引起太多後續討論，不過黃家駒的意外發生後，香港的電台、電視媒體，不約而同地發現專輯中一首歌曲〈海闊天空〉仿似在述說此時黃家駒的精神而開始強力播放。</p>
<p>&nbsp;</p>
<p>這首歌原是黃家駒在日本時所創作，表達他們四人離鄉背井追求夢想的心情和不放棄的精神。與他們慣常以吉他為主奏的硬式搖滾風格有很大的不同，這首歌以鋼琴前奏開歌，中段後加入管弦樂團伴奏與電音吉他的狂飆一路到結束，當初是請來30多位管弦樂手直接到錄音室中完成這氣勢滂礡的樂章錄音，也是Beyond第一次用真正的弦樂團來為歌曲伴奏。黃家駒逝世消息傳出，華人社會尤其是香港的歌迷大感震驚心碎，從他的遺體運送回香港到出殯當日萬人空巷的畫面，都讓歌迷的心情被渲染得更為低落，而媒體強力播放〈海闊天空〉的悲壯氛圍，加上彷彿預言黃家駒意外的歌詞「原諒我這一生不羈放縱愛自由，也會怕有一天會跌倒」，正好讓大眾的心緒有所抒發，使這首並非專輯主打歌的歌曲成為當時香港最流行的一首歌，《樂與怒》專輯銷量也一下子就衝破了30萬張。</p>
<p>&nbsp;</p>
<p>這首歌的故事並沒有隨著黃家駒過世而結束，他短暫又傳奇的一生讓這首歌成為了香港甚至不限於粵語地區的華人社會中，年輕人在追逐夢想、奮不顧身與體制對抗時的精神代表，隨著時代轉變、事件發生，不斷的引用傳唱，被賦予了不同的意義而成為經典。從2008年中國的汶川地震，到北京奧運會劉翔因傷退賽，這首歌都成了當時鼓舞士氣的歌曲，這讓中國各地都有人會用著不甚標準的粵語大聲合唱這首歌，可說是最被廣為傳唱的一首粵語歌曲。這首歌能帶來的凝聚力，在香港自然產生出更大的力量，這幾年從「和平佔中」的「雨傘革命」，到反對「港版國安法」的連串公民抗議活動中，幾乎只要人潮聚集起來，大家就會自動唱起這首歌，尤其最後歌詞唱著的「背棄了理想，誰人都可以，哪會怕有一天只你共我」，更能激發同仇敵愾之感。</p>
<p>&nbsp;</p>
<p>由於黃家駒一直是Beyond的創作主力，他的離世對Beyond造成嚴重的打擊，後來Beyond雖然繼續以三人陣容發行專輯及舉辦演唱會，但成績已不若以往，加上三人間陸續有一些嫌隙產生，後來直接宣布解散，3人各自發展音樂事業。雖然Beyond和黃家駒都已不復存在，〈海闊天空〉和他們的多首代表歌曲還是存在在許多人的心中，甚至像有了自己的生命一樣繼續發展出新意義，尤其這些歌曲所誕生的90年代，在許多香港人心中更代表著一個令人懷念的盛世。</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>（<span style="text-decoration: underline;"><strong>圖片來源：翻拍專輯封面</strong></span>）&nbsp;</p>
