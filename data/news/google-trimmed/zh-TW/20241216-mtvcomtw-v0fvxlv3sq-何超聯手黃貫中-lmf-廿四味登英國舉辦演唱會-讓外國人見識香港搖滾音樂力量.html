                </h1>
                <p class="lead">何超聯手黃貫中、LMF、廿四味登英國舉辦演唱會「讓外國人見識香港搖滾音樂力量！」</p>

    <section id="news-newsdetail" class="container my-5">
        <div class="row">
            <div class="col-md-8">
                		                                <img src="https://www.mtv.com.tw/uploads/files/38793/conversions/DragonRock-xl.jpg" class="w-100 mb-3" alt="何超聯手黃貫中、LMF、廿四味登英國舉辦演唱會「讓外國人見識香港搖滾音樂力量！」">
                                <h5 class="mt-2">
                    何超聯手黃貫中、LMF、廿四味登英國舉辦演唱會「讓外國人見識香港搖滾音樂力量！」

                                            
                            <i class="fal fa-heart fa-lg"/> 追蹤
                        
                                    </h5>
                <p class="text-secondary">2024-12-16</p>
                    <div class="row"><div class="col-lg-12 col-sm-12 column"><div class="ge-content ge-content-type-ckeditor ge-content-current" data-ge-content-type="ckeditor"><p style="text-align:justify"><span style="font-family:Noto Sans TC">搖滾女王何超（何超儀）領軍的「何超與海膽仔樂團（Josie and The Uni Boys）」將攜手傳奇搖滾樂團 Beyond 主唱兼吉他手黃貫中（Paul Wong）、殿堂級嘻哈團體大懶堂（LMF）及廿四味（24Herbs），於 2025 年 2 月 27 日旋風登陸英國倫敦，舉辦《Dragon Rock Concert indigo at The O2 UK 2025》。此次盛事象徵著香港搖滾精神的延續，跨越亞洲，走向國際舞台，大聲宣告：「讓外國人見識香港搖滾音樂的力量！」</span></p>

<p style="text-align:justify"><img alt="何超與海膽仔樂團（Josie-and-The-Uni-Boys）" height="auto" src="https://www.mtv.com.tw/uploads/files/38795/conversions/%E4%BD%95%E8%B6%85%E8%88%87%E6%B5%B7%E8%86%BD%E4%BB%94%E6%A8%82%E5%9C%98JosieandTheUniBoys-sl.jpg?v=1734317104" width="500px"/></p>

<p style="text-align:justify">(▲何超與海膽仔樂團（Josie and The Uni Boys）)</p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">一向熱愛搖滾的何超，於 2010 年成立「何超與海膽仔」樂團。她提到 80 年代的英倫搖滾對這一代人影響深遠：「當年我們在香港看《勁歌金曲》和週日的流行榜節目，接觸到許多關於英國音樂的資訊。我特別喜歡 The Cure、The Beatles、Pink Floyd 和 A-ha 這些樂團。之前參加 NME Indie Rock 頒獎典禮時，也發現英國的許多新樂隊表現亮眼，讓我覺得非常有趣。」因此，對於這次前往英國演出，她充滿期待和興奮。明年適逢樂團成軍 25 週年，除了宣告即將登陸英國外，何超也正籌備著全新作品預告明年發行！</span></p>

<p style="text-align:justify"><img alt="_Beyond-主唱兼吉他手黃貫中（Paul-Wong）" height="533" src="https://www.mtv.com.tw/uploads/files/38799/conversions/_Beyond%E4%B8%BB%E5%94%B1%E5%85%BC%E5%90%89%E4%BB%96%E6%89%8B%E9%BB%83%E8%B2%AB%E4%B8%ADPaulWong-sl.jpg?v=1734317104" width="400"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">(</span>▲<span style="font-family:Noto Sans TC">Beyond 主唱兼吉他手黃貫中（Paul Wong）)</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">值得一提的是，黃貫中早在 2008 年曾於香港舉辦《Let’s Fight》搖滾音樂會，當年卡司就包含何超與廿四味，所有出席歌手也一起發行了同名單曲作為紀念，彷如一場香港搖滾樂壇盛宴！歷經多年後，何超在 2024 年初，以召集人身份參與了香港歷來規模最大的純在地搖滾音樂節《The Wild Ones Music Festival》，像是傳承了黃貫中對音樂的堅持與執著，再次喚醒香港的搖滾精神。許久未同台的兩人，也預告將在《Dragon Rock Concert》帶來驚喜演出，令人十分期待。黃貫中則感慨地說：「香港與英國有深厚的連結，英國搖滾對我們的影響也很大。能夠在英國演出，對我們來說是一件意義非凡的事。」他更暖心向英國的粉絲喊話：「我知道英國現在天氣很冷，還下著雪。我有很多朋友在那邊，等我來溫暖一下你們。」</span></p>

<p style="text-align:justify"><img alt="大懶堂（LMF）" height="auto" src="https://www.mtv.com.tw/uploads/files/38803/conversions/%E5%A4%A7%E6%87%B6%E5%A0%82LMF-sl.jpg?v=1734317104" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">(</span>▲<span style="font-family:Noto Sans TC">饒舌團體 LMF（大懶堂）</span><span style="font-family:Noto Sans TC">)</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">香港殿堂級饒舌團體 LMF（大懶堂）以針砭時弊的作品聞名，對於這次與大夥的合作，他們率性表示這次參與演出的原因：「就是挺何超！」另外，此回 《Dragon Rock》的主題除了是由 LMF 成員阿庭（梁偉庭）構思之外，代表著「猛龍過江」、向李小龍致敬的龍頭 Logo 也出自他手。</span></p>

<p style="text-align:justify"><img alt="廿四味（24Herbs）" height="auto" src="https://www.mtv.com.tw/uploads/files/38805/conversions/%E5%BB%BF%E5%9B%9B%E5%91%B324Herbs-sl.jpg?v=1734317104" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">(</span>▲<span style="font-family:Noto Sans TC">嘻哈團體 </span>廿四味（24Herbs）<span style="font-family:Noto Sans TC">)</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">嘻哈團體「廿四味」成員包含何超老公陳子聰，他在歷經病魔糾纏後於今年《The Wild Ones》音樂節上首次回歸，日漸康復的他，明年《Dragon Rock》也將會是陳子聰難能可貴的演出之一。團員對首次登上英國舞台感到相當興奮，並表示能與一眾香港好友同台演出是莫大的榮幸，他們特別提到此次演出的場地十分具有「親密感」，將帶來原汁原味且震撼的表演。他們還回憶起曾參與黃貫中策劃的《Let’s Fight》音樂會：「那是我們第一次現場演出，之後我們一直期待能再次與黃貫中同台。而這次像是久別重逢，但我們都更成熟了，應該能激盪出全新的音樂火花！」</span></p>

<p style="text-align:justify"><img alt="何超(前排左）、聯手黃貫中（前排右）、LMF、廿四味登英國舉辦-《Dragon-Rock》演唱會" height="auto" src="https://www.mtv.com.tw/uploads/files/38797/conversions/%E4%BD%95%E8%B6%85%E5%89%8D%E6%8E%92%E5%B7%A6%E8%81%AF%E6%89%8B%E9%BB%83%E8%B2%AB%E4%B8%AD%E5%89%8D%E6%8E%92%E5%8F%B3LMF%E5%BB%BF%E5%9B%9B%E5%91%B3%E7%99%BB%E8%8B%B1%E5%9C%8B%E8%88%89%E8%BE%A6DragonRock%E6%BC%94%E5%94%B1%E6%9C%83-sl.jpg?v=1734317104" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">(</span>▲何超(前排左）、聯手黃貫中（前排右）、LMF、廿四味登英國舉辦 《Dragon Rock》演唱會<span style="font-family:Noto Sans TC">)</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">為紀念這次難得的演出機會，何超提議進行全體合照作為《Dragon Rock》的海報。雖然湊齊 4 組樂團、13 位音樂人看似困難，但大家聽到計畫後毫不猶豫地配合安排時間。黃貫中更大方提供練團室天臺作為拍攝場地，並讓大家在練團室內完成造型和化妝工作。</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">原訂 3 小時的拍攝行程，因眾人的高度默契，僅用 1 小時便順利完成。拍攝結束後，LMF 的阿庭僅用一天時間，便將攝影師提供的原始照片設計成正式海報。海報公開後，樂迷與網友好評連連，畫面有個性、架勢十足！整個演出企劃不僅展現對香港搖滾精神的熱情，更是對所有演出者珍貴友情的深刻詮釋。</span></p>

<p style="text-align:justify"><img alt="《Dragon-Rock》主視覺1" height="586" src="https://www.mtv.com.tw/uploads/files/38801/conversions/DragonRock%E4%B8%BB%E8%A6%96%E8%A6%BA1-sl.jpg?v=1734317104" width="469"/></p>
