-.009h-.001L7.88 4.79l-.003-.002-.005-.003-.008-.005h-.002l-.003-.002-.01-.004-.004-.002-.01-.003h-.002l-.003-.001-.009-.002h-.006l-.003-.001h-.004l-.002-.001h-.574a.156.156 0 0 0-.156.155v3.486c0 .086.07.155.156.155h.56c.087 0 .157-.07.157-.155v-2.07l1.6 2.16a.2.2 0 0 0 .039.038l.001.001.01.006.004.002.008.004.007.003.005.002.01.003h.003a.2.2 0 0 0 .04.006h.56c.087 0 .157-.07.157-.155V4.918a.156.156 0 0 0-.156-.156zm3.815.717v-.56a.156.156 0 0 0-.155-.157h-2.242a.16.16 0 0 0-.108.044h-.001l-.001.002-.002.003a.16.16 0 0 0-.044.107v3.486c0 .041.017.08.044.107l.002.003.002.002a.16.16 0 0 0 .108.043h2.242c.086 0 .155-.07.155-.156v-.56a.156.156 0 0 0-.155-.157H11.81v-.589h1.525c.086 0 .155-.07.155-.156v-.56a.156.156 0 0 0-.155-.157H11.81v-.589h1.525c.086 0 .155-.07.155-.156Z"/> </svg> </div>  </div> </div> </div> </div> <div class="news-box"> <div class="news-yt-set"> </div> <div class="news-body"> <figure class="image"><picture style="font-size: 0;"> <source srcset="https://i01.ftnn.com.tw/a/24/140/24140150402321018fc6d0.webp" type="image/webp"> <img alt="黃家駒的墓碑被人破壞。（翻攝自微博）" src="https://i01.ftnn.com.tw/a/24/140/24140150402321018fc6d0.jpg"/> </source></picture> <figcaption>黃家駒的墓碑被人破壞。（翻攝自微博）</figcaption> </figure> <p>圖文／鏡週刊</p> <p>香港樂團Beyond主唱黃家駒1993年在日本跌落舞台離世，享年31歲，之後葬於香港將軍澳華人永遠墳場，沒想到黃家駒的墓碑於昨（19）日被人破壞，團員兼弟弟的黃家強氣憤譴責，疑似影射凶手是中國大陸人，但引發中國網友撻伐，怒嗆他是「垃圾弟弟」。</p> <p>&nbsp;</p><p style="margin-bottom: 0px; text-align: center;">廣告 更多內容請繼續往下閱讀</p> <figure class="image"><picture style="font-size: 0;"> <source srcset="https://i01.ftnn.com.tw/a/24/140/24140150402512998b2f2b.webp" type="image/webp"> <img alt="香港樂團Beyond主唱黃家駒（左2）1993年在日本跌落舞台離世。（翻攝自微博）" src="https://i01.ftnn.com.tw/a/24/140/24140150402512998b2f2b.jpg"/> </source></picture> <figcaption class="image">香港樂團Beyond主唱黃家駒（左2）1993年在日本跌落舞台離世。（翻攝自微博）</figcaption> </figure> <p>黃家駒的墓碑被破壞，除了被潑灑可樂，遺照還被舔舐與鐵鎚攻擊，逮到凶手是23歲葉男、15歲少年網紅「光頭Bob」。對此，弟弟黃家強在臉書痛批凶手是「可悲、可恥、可憐、可恨的賤種」「這是個什麼樣的國家，道德淪亡到這個地步，千里迢迢來摧毁別人的墓園，你所做的一切會得到什麼，傷害別人真的會是你的流量密碼嗎？」暗指凶手從中國大陸到香港破壞。</p> <p>黃家強的言論在微博發酵，網友痛批「黃家強，你想影射什麼?這兩個破壞家駒墓碑的神經病是香港人，不是大陸人，你是不是要失望了？」並貼出多張黃家強與中國政府相互抵觸的言論，以隱晦的文字質問黃家強：「19年你的立場是什麼，你清楚，大家也清楚。你是什麼成分，大家也是心知肚明」。</p><p style="margin-bottom: 0px; text-align: center;">廣告 更多內容請繼續往下閱讀</p> <figure class="image"><picture style="font-size: 0;"> <source srcset="https://i01.ftnn.com.tw/a/24/140/24140150402769189fd05e.webp" type="image/webp"> <img alt="黃家強嚴厲譴責破壞墓碑的人。（翻攝自微博）" src="https://i01.ftnn.com.tw/a/24/140/24140150402769189fd05e.jpg"/> </source></picture> <figcaption class="image">黃家強嚴厲譴責破壞墓碑的人。（翻攝自微博）</figcaption> </figure> <p>中國網友也紛紛在留言區批評，對此，黃家強再次作出回應：「這是一種社會現象，當然需要國家來關注，難道我這個小市民可以改變這些變態行為嗎？我文中從來沒有提及是哪個省份的人幹的，自己國家不是國內，那應該是什麼？是語言能力有問題？還是別有用心，我心裡明白，把香港分割出來是這些人，搞對立、搞分化都是這些人。」</p> <br/>
