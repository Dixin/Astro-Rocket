						<div class="excerpt" style="">
															<p>曾經拜香港組合Beyond成員黃家強為師的內地歌手苟偉，於5月6日驚傳離世，終年44歲。苟偉於2004年參加音樂選秀節目《我型我SHOW》獲得亞軍，並與張杰合作創作歌曲《北斗星的愛》而紅遍全國，深受歌迷喜愛。苟偉的音樂人好友相繼在社交平台發文哀悼證實死訊噩耗。</p>
													</div>

									<h2 class="my-0">苟偉驚傳離世終年44歲</h2><p class="my-0">綜合內地傳媒報道，苟偉的家屬尚未公開詳細死因，但據傳與健康問題相關，同時有報導指患有鼻息肉肥大，鼻腔長滿息肉，原計劃於五一假期後接受手術，卻未及動刀便猝逝。</p><p><picture><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222645_4c42f5d612fe538ecce222e6b6b860f20c09aaed.webp" type="image/webp"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222645_4c42f5d612fe538ecce222e6b6b860f20c09aaed.png"><div class="pspv photoSwipe_container width_600"> <i class="photo-enlarge"/><picture><source class="card-placeholder" srcset="/media/rv/images/global/default600x400.jpg" width="600" height="400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222645_4c42f5d612fe538ecce222e6b6b860f20c09aaed.webp" type="image/webp" width="600" height="315">

                            <img class="content-picture-img" src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222645_4c42f5d612fe538ecce222e6b6b860f20c09aaed.png" onerror="this.closest('picture').querySelector('Source[srcset=\''+this.currentSrc+'\']').remove();" alt="Beyond黃家強徒弟驚傳離世終年44歲 好友證實死訊哀悼：願你一路走好" loading="lazy" width="600" height="315"/></source></source></source></source></picture></div></source></source></picture></p><p><picture><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222647_66b11745762dbc080aef39cd175a583380768ad7.webp" type="image/webp"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222647_66b11745762dbc080aef39cd175a583380768ad7.jpg"><div class="pspv photoSwipe_container width_600"> <i class="photo-enlarge"/><picture><source class="card-placeholder" srcset="/media/rv/images/global/default600x400.jpg" width="600" height="400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2025/05/20250507222647_66b11745762dbc080aef39cd175a583380768ad7.webp" type="image/webp" width="600" height="400">
