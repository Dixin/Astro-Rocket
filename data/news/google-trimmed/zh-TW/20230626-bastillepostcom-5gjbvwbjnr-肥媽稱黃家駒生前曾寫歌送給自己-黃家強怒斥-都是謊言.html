    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">事緣有指黃家駒今年有未曾面世的音樂作品面世，而這首歌是當年他為肥媽所寫，但從未被灌錄的作品，接着肥媽說：「呢個故事我都聽咗好多年，係10幾20年前嘅事！有一日家強同講，其實家駒寫咗首歌畀你架，肥媽！我話，真係好，有機會唱，如果有機會唱到就好！」肥媽口中的這首歌叫《感激這對手》，她又稱當日錄錄音時，唱頭兩段想著Beyond和家駒，她更一度哽咽說：「其實我都有同家駒講，因為我真係冇時間聽呢首歌，我淨係前兩日聽過一次，我同家駒講『你幫幫我』，我聽咗兩次入去（錄音）就得，我覺得佢都有幫我。我諗唔到佢會寫呢隻歌畀我，呢個好觸動到我嘅心，真係我嘅榮幸。」</p>
