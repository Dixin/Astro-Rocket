                <p class="lead">何超、黃貫中、大懶堂、廿四味《Dragon Rock Concert》震撼倫敦 獻唱〈章魚黑洞〉給填詞人大S</p>

    <section id="news-newsdetail" class="container my-5">
        <div class="row">
            <div class="col-md-8">
                		                                <img src="https://www.mtv.com.tw/uploads/files/40935/conversions/%E4%BD%95%E8%B6%85%E9%BB%83%E8%B2%AB%E4%B8%AD%E5%A4%A7%E6%87%B6%E5%A0%82%E5%BB%BF%E5%9B%9B%E5%91%B3Dragon-Rock-Concert-xl.jpg" class="w-100 mb-3" alt="何超、黃貫中、大懶堂、廿四味《Dragon Rock Concert》震撼倫敦 獻唱〈章魚黑洞〉給填詞人大S">
                                <h5 class="mt-2">
                    何超、黃貫中、大懶堂、廿四味《Dragon Rock Concert》震撼倫敦 獻唱〈章魚黑洞〉給填詞人大S

                                            
                            <i class="fal fa-heart fa-lg"/> 追蹤
                        
                                    </h5>
                <p class="text-secondary">2025-03-04</p>
                    <div class="row"><div class="col-lg-12 col-sm-12 column"><div class="ge-content ge-content-type-ckeditor ge-content-current" data-ge-content-type="ckeditor"><p style="text-align:justify"><span style="font-family:Noto Sans TC">搖滾女王何超（何超儀）與其樂團「何超與海膽仔樂團（Josie and The Uni Boys）」、傳奇搖滾樂團 Beyond 的主唱「黃貫中（Paul Wong）」、殿堂級嘻哈團體「大懶堂（LMF）」以及「廿四味（24Herbs）」上週（2/27）在倫敦 indigo at O2 舉辦的《Dragon Rock Concert》演唱會完美落幕！演唱會超過三個小時，35首歌曲，吸引近千名樂迷到場支持，並被英國當地媒體評價為「震撼倫敦，將香港音樂帶到國際的一次盛事。」這次能成功在英國完成演出不易，何超盼未來能在更多地方開唱，讓大家能看到香港搖滾音樂的熱血能量。</span></p>

<p style="text-align:justify"><img alt="演唱會由「廿四味」打頭陣，團員陳子聰在完成所有手術，全面康復後的首次亮相" height="auto" src="https://www.mtv.com.tw/uploads/files/40938/conversions/%E6%BC%94%E5%94%B1%E6%9C%83%E7%94%B1%E5%BB%BF%E5%9B%9B%E5%91%B3%E6%89%93%E9%A0%AD%E9%99%A3%E5%9C%98%E5%93%A1%E9%99%B3%E5%AD%90%E8%81%B0%E5%9C%A8%E5%AE%8C%E6%88%90%E6%89%80%E6%9C%89%E6%89%8B%E8%A1%93%E5%85%A8%E9%9D%A2%E5%BA%B7%E5%BE%A9%E5%BE%8C%E7%9A%84%E9%A6%96%E6%AC%A1%E4%BA%AE%E7%9B%B8-sl.jpg?v=1741060072" width="500px"/></p>

<p style="text-align:justify"><strong><span style="font-family:Noto Sans TC">廿四味開場炒熱氣氛，黃貫中經典作連發，何超獻唱〈章魚黑洞〉給填詞人大S</span></strong></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">演唱會由「廿四味」打頭陣，一出場便引發歌迷轟動，這是團員陳子聰在完成所有手術，全面康復後的首次亮相，他們又唱又跳演出〈Do or Die〉、〈Hong Kong Kowloon〉、〈Hot in the 852〉⋯⋯等作品，也大聲向在英國的粉絲打招呼，唱到來自 2011 年的經典作〈Wonderland〉時，更是迅速把觀眾情緒推至高點，讓全場跟著起舞。</span></p>

<p style="text-align:justify"><img alt="黃貫中經典作連發，以氣勢磅礡的吉他演奏登場" height="675" src="https://www.mtv.com.tw/uploads/files/40947/conversions/%E9%BB%83%E8%B2%AB%E4%B8%AD%E7%B6%93%E5%85%B8%E4%BD%9C%E9%80%A3%E7%99%BC%E4%BB%A5%E6%B0%A3%E5%8B%A2%E7%A3%85%E7%A4%A1%E7%9A%84%E5%90%89%E4%BB%96%E6%BC%94%E5%A5%8F%E7%99%BB%E5%A0%B4-sl.jpg?v=1741060072" width="450"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">搖滾傳奇黃貫中緊接以氣勢磅礡的吉他演奏登場，他充滿感觸說：「見到好多熟悉的面孔，我們剛剛在後台還說，感覺就像回到高山劇場一樣。」高山劇場是 80 年代不少樂團在香港的發源地，見到這些樂迷老朋友的感覺，就像回到早年熟悉的舞台般令他十分懷念。隨後黃貫中獻唱了經典歌曲〈無得比〉及〈天與地〉，讓全場再度陷入搖滾狂歡，跟著大聲合唱。</span></p>

<p style="text-align:justify"><img alt="何超在黃貫中演唱〈阿博二世〉時驚喜同台合唱" height="auto" src="https://www.mtv.com.tw/uploads/files/40943/conversions/%E4%BD%95%E8%B6%85%E5%9C%A8%E9%BB%83%E8%B2%AB%E4%B8%AD%E6%BC%94%E5%94%B1%E9%98%BF%E5%8D%9A%E4%BA%8C%E4%B8%96%E6%99%82%E9%A9%9A%E5%96%9C%E5%90%8C%E5%8F%B0%E5%90%88%E5%94%B1-sl.jpg?v=1741060072" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">接著何超以一頭金髮，以及一身皮衣與皮短裙登場，在黃貫中演唱〈阿博二世〉時驚喜同台合唱，點燃現場搖滾能量。隨後何超與海膽仔登台，以一首〈何飄移〉熱烈開場，何超特別感謝填詞人 Wyman 黃偉文也到現場觀看。她也獻唱由好友大S為她填詞的〈章魚黑洞〉，並感性表示把此曲獻給大S，令現場觀眾十分動容。</span></p>

<p style="text-align:justify"><strong><span style="font-family:Noto Sans TC">何超與男神新人 Iman 同台飆唱，自爆曾收強尼戴普親回「Good Band!」</span></strong></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">為了這次演出，何超與海膽仔特地選了一連串鐵肺熱血歌單，唱到〈Chilling & Blazin〉時，老公陳子聰跟著廿四味再度登台，難得在舞台上共舞、相擁的他們，更因此引來全場掌聲與尖叫。何超更在台上分享〈Johnny Depp〉的有趣故事，她自爆當年在寫完這首寫給強尼戴普的創作後，為了怕被提告侵權，曾親自寫信並把 CD 寄給強尼戴普希望獲得他的認同，結果對方還真的以書面回覆了「Good Band!」令他們十分驚喜，也讓全場笑翻。</span></p>

<p style="text-align:justify"><img alt="何超與男神新人-Iman-同台共舞飆歌" height="auto" src="https://www.mtv.com.tw/uploads/files/40945/conversions/%E4%BD%95%E8%B6%85%E8%88%87%E7%94%B7%E7%A5%9E%E6%96%B0%E4%BA%BAIman%E5%90%8C%E5%8F%B0%E5%85%B1%E8%88%9E%E9%A3%86%E6%AD%8C-sl.jpg?v=1741060072" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">除此之外，何超也邀請與近年力捧的加拿大男神級新人 Iman 同台合唱，充滿男人味的粗獷外型，讓現場女樂迷也跟著喊：「好靚仔（好帥啊）！」兩人合唱了美國爵士音樂家 Nat King Cole 的經典情歌〈L.O.V.E〉，有著柔情暖嗓的 Iman 與何超在台上跳起了爵士舞步，節奏感十足，表現令人驚艷！</span></p>

<p style="text-align:justify"><strong><span style="font-family:Noto Sans TC">大懶堂已故團員大飛獻聲，全體音樂人泛淚合唱〈一夥〉緬懷亡友</span></strong></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">最後，殿堂級嘻哈團體「大懶堂（LMF）」在觀眾歡呼聲中登場，唱到經典作〈WTF〉與〈冚家令〉時，他們嗨喊：「我希望你們把所有的不滿、憤怒、抱怨，在這首歌一次過全部發洩出來！」接著，LMF 邀請黃貫中再次登場合作同名作〈大懶堂〉，經典的吉他音色瞬間讓全場熱血沸騰，勾起所有人的回憶。</span></p>

<p style="text-align:justify"><img alt="大懶堂已故團員大飛獻聲，全體音樂人泛淚合唱〈一夥〉緬懷亡友" height="auto" src="https://www.mtv.com.tw/uploads/files/40939/conversions/%E5%A4%A7%E6%87%B6%E5%A0%82%E5%B7%B2%E6%95%85%E5%9C%98%E5%93%A1%E5%A4%A7%E9%A3%9B%E7%8D%BB%E8%81%B2%E5%85%A8%E9%AB%94%E9%9F%B3%E6%A8%82%E4%BA%BA%E6%B3%9B%E6%B7%9A%E5%90%88%E5%94%B1%E4%B8%80%E5%A4%A5%E7%B7%AC%E6%87%B7%E4%BA%A1%E5%8F%8B-sl.jpg?v=1741060072" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">演唱會尾聲，舞台播出 LMF 已故團員 Davy 大飛的聲音，此時所有演出藝人齊聚舞台，一起演唱黃貫中為紀念亡友創作的〈一夥〉，當時便把大飛生前的錄的鼓聲剪入歌曲，讓大飛也能參與其中。LMF 感性表示，這首歌原本是黃貫中與大飛的作品，如今大飛離世，黃貫中決定將此歌獻給大家，「無論你去到哪邊，大飛，我想告訴你，我們永遠都是一夥的。」團員與何超、黃貫中都唱得熱淚盈眶，場面感人。現場歌迷與台上音樂人的動人大合唱，讓這場演唱會劃下完美句點。</span></p>

<p style="text-align:justify"><strong><span style="font-family:Noto Sans TC">何超盼2025年有新作分享 期待未來能到世界更多地方演出</span></strong></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">香港搖滾音樂史最大規模海外演出《Dragon Rock Concert indigo at The O2 UK 2025》順利落幕，演唱會過後，樂迷更是紛紛留言：「三個多小時，四組音樂人，35首歌，非常超值！」、「很滿足，非常精彩，水準很高！」、「毫無冷場」，獲得許多好評。除此之外，更有粉絲前一晚便從曼徹斯特前來，千里迢迢前來觀看，也敲碗未來能再在其他城市看一次，足見這場演出的吸引力。</span></p>

<p style="text-align:justify"><img alt="何超、黃貫中、大懶堂、廿四味《Dragon Rock Concert》震撼倫敦" height="auto" src="https://www.mtv.com.tw/uploads/files/40941/conversions/%E4%BD%95%E8%B6%85%E9%BB%83%E8%B2%AB%E4%B8%AD%E5%A4%A7%E6%87%B6%E5%A0%82%E5%BB%BF%E5%9B%9B%E5%91%B3Dragon-Rock-Concert%E9%9C%87%E6%92%BC%E5%80%AB%E6%95%A6-sl.jpg?v=1741060072" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">《Dragon Rock》演唱會影音由名導雷利・史考特（Ridley Scott）旗下 Black Dog 製作公司拍攝，未來將擇期播出與樂迷回味。對於是否有機會將這場演出帶到其他城市，甚至來台灣舉辦？何超後續表示：「能夠成功舉辦已經是非常不容易的事，但如果未來有機會，我們絕對願意繼續演出，將香港的搖滾音樂帶到更多地方，讓更多人認識我們的音樂能量。」何超目前正積極籌備 2025 年的新作，期待能給樂迷更多驚喜！</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">照片提供 / Drill Team</span></p>
