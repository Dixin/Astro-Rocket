                                    <p>現年54歲的朱茵，拍過不少膾炙人口的電影，尤其在周星馳《西遊記大結局之仙履奇緣》中的「紫霞仙子」，更成為網民的集體回憶。出名凍齡的朱茵，近日跟丈夫黃貫中到了日本，在一間懷舊唱片專門店，被網民野生捕獲，她非常親民合照，但照片在小紅書流傳後，朱茵的身高頓成網民討論焦點，甚至有網民指她沒有官方公開的160cm身高，最後要由拍照的網民出來解釋真相。</p><ad id="ad-1"/><h2>朱茵日本唱片店被集郵</h2><p>朱茵在日本唱片店內被網民集郵，她身穿一件白色印字T恤，內搭灰色長袖上衣，配上一條舒適的淺灰色運動褲，打扮相當隨性自在。近乎素顏的朱茵，皮膚緊緻，氣色紅潤，臉上掛著親切的笑容，絲毫看不出歲月的痕跡。照片一出，大批網民紛紛讚嘆：「這狀態也太好了吧，完全是吃了防腐劑」、「紫霞仙子，仙氣依舊」、「素顏都這麼美」，朱茵的凍齡美貌，再次驚艷了無數粉絲。</p><ad id="ad-2"/><p>相關閱讀：54歲朱茵全面回春狀態巔峰 面容變化驚人極震撼 比43歲前TVB一線花旦更年輕？</p><ad id="ad-3"/><gallery-1/><h2>朱茵意外曝光真實身高</h2><p>朱茵除了容顏不老外，她的身高再次成為網民焦點，有眼尖的網民開始對朱茵的身高提出了疑問。根據官方資料，朱茵的身高為160cm，但在這張與粉絲的合照中，一些網民認為她看起來似乎未及此高度，感覺上比較嬌小，更有網民指平日朱茵出席活動，大多數穿上高跟鞋，而在相中卻未有看到她穿哪一款鞋子，只能憑拍攝者的高度，推測朱茵的真正身高。</p><ad id="ad-4"/><h2>朱茵跟丈夫黃貫中拍拖放閃</h2><p>朱茵身高成為網上熱話，而跟朱茵合照的網民馬上為朱茵平反，指自己是169cm身高，而朱茵當天是穿平底鞋，目測確有160cm，終於還朱茵一個清白。之後有網民問黃貫中有否同行，該名網民再次分享用手機拍下的黃貫中照片，原來朱茵是做「跟得夫人」，陪伴丈夫逛唱片店，網民大讚二人拍拖放閃，甚為登對。</p><ad id="ad-5"/><p>相關閱讀：朱茵老公黃貫中被指斷崖式衰老 再唱《光輝歲月》「有氣沒力」 意外撞樣政協港星</p><ad id="ad-6"/><gallery-2/>
