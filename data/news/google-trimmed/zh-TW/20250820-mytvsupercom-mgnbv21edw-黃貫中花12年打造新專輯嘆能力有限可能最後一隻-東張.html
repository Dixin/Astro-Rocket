                    <article class="content-main editor-content-view"><p>朱茵 同老公 黃貫中 呢排各有各忙，朱茵將會同蔡少芬、汪明荃等拍攝新劇《風華背後》，而入行40年嘅阿Paul亦準備推出新碟，呢隻碟更係阿Paul耗時12年心血打造嘅作品，當中嘅歌曲可以話係經過千挑萬選。</p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/V0u6qWXqrAwPdgyyDGAFFCDIxfk=/0x0/public/article/content/202508/2be30614-5968-4850-8291-313513d5bb18.jpeg" alt="" data-desc="阿Paul耗時12年製作嘅新碟即將推出" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>相隔多年再出碟，阿Paul表示並唔緊張：「平常心，其實今次係對自己一個交代，容許我自私啲，冇乜特別期望，只係為音樂而做。」佢仲話自己畢竟61歲，唔知自己幾時再有能力做一隻碟，話唔定呢一隻就係最後一隻。」</p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/jx9Qv0265bpwfZNXoJI_rDmsbsM=/0x0/public/article/content/202508/457a6f27-d13d-424a-a996-04068d2e2edb.jpeg" alt="" data-desc="佢仲指自己年紀唔輕，新碟可能係最後一作都唔定" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/></p></article>
