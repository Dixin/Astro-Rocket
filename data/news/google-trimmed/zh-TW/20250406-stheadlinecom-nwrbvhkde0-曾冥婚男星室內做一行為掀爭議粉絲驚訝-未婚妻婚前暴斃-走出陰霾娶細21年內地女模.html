                                    <p>傳奇樂隊Beyond鼓手葉世榮近年於內地及東南亞舉行不少音樂會，不過他的生活非常低調，連社交平台都甚少更新。日前抖音流傳一條葉世榮於室內吸煙的影片引起爭議，更令部份粉絲驚訝，指不知道原來葉世榮也有抽煙習慣。</p><ad id="ad-1"/><h2>葉世榮疑身處內地室內吸煙惹批評</h2><p>其實Beyond四位成員都有抽煙習慣，葉世榮曾透露自己本來沒有煙癮，卻因難忍成員們呼出的二手煙，最後決定同化自己，而染上抽煙的陋習。因此有不知葉世榮有抽煙習慣的粉絲，看到他吸煙的影片都表示驚訝。片中可見，葉世榮疑似身處內地，手上夾着香煙，雖然見他與友人正在用餐，有網民指出其實內地早已實施室內禁煙條例，好奇他是否身處餐廳，亦有網民指出如果同枱有人不吸煙，葉世榮卻在旁吸煙，行為似乎不太好。</p><ad id="ad-2"/><p>相關閱讀：黃家駒逝世31年丨黃貫中貼合照念故友：日子並沒有把事情沖淡 葉世榮四字盡訴心中情</p><ad id="ad-3"/><h2>葉世榮於室內吸煙惹爭議？</h2><gallery-1/><h2>葉世榮曾與已故女友冥婚</h2><p>葉世榮雖然是Band仔，但花邊新聞不算多，更是一位長情男星。葉世榮90年代有位拍拖7年的女友許韻珊（Cynthia），女方是拳王周比利的外甥女，二人已論及婚嫁，但年僅28歲的許韻珊卻在婚前不幸暴斃。據當時報道指，許韻珊2002年在與葉世榮同居單位內的浴室猝逝，被發現時全身赤裸，據調查後指死因無可疑。葉世榮婚前痛失未婚妻，他為許韻珊的喪事東奔西跑，將未婚妻的喪事當葉家白事來辦，甚至在喪禮上完成冥婚儀式，只為兌現娶妻承諾。葉世榮一度陷於「喪妻」陰霾，曾透露於許韻珊回魂夜發夢，在夢中與許韻珊重聚：「我發夢見到女友好溫柔咁伏我心口上面，我就用手掃佢頭髮同耳仔，種感覺好溫馨，我醒之後個心好舒服、好安樂，我終於都可以見番佢。」其後，葉世榮推出專輯紀念「亡妻」。</p><ad id="ad-4"/><p>相關閱讀：家駒墓被毀丨胞弟黃家強發文怒斥道德淪亡：此種不滅國亡不遠矣</p><ad id="ad-5"/><h2>葉世榮花多年走出陰霾娶內地妻</h2><p>葉世榮一直視許韻珊是「前妻」，花了多年才走出陰霾。他於2011年終於踏入人生另一階段，與比他年輕21年的內地模特兒張偉玲結婚，二人育有一名女兒葉凱淇，近年大部份時間都在內地生活。</p><ad id="ad-6"/><h2>黃貫中與朱茵12歲女兒黃鶯罕曝光？</h2><gallery-2/>
