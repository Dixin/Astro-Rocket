                    <article class="content-main editor-content-view"><p>為紀念BEYOND靈魂人物黃家駒逝世30年，周六晚（24日）無綫播出特備節目《永遠光輝 黃家駒》，記錄了不少Beyond與家駒生前的珍貴片段。節目中肥媽 (Maria Cordero) 透露黃家強曾告訴她，表示哥哥家駒生前寫過一首歌給自己，不過這番話卻惹來黃家強公開炮轟肥媽「全是謊話」，兩人各執一詞，演變成羅生門事件。<br/><br/>繼昨日（26日）肥媽在Facebook上載錄音帶相證清白，指黃家駒生前確實寫過歌曲給自己後，今早（27日）黃家強長文再回應肥媽，暗指家駒沒有為她寫歌。肥媽中午於Facebook出Post反擊，更指家強貴人善忘，並附上兩張黃家駒生前的手稿及衣物照片。<br/><br/>肥媽在長文直接回應家強，寫道：「二十多年前，在Event上，家強說，你知道家駒寫了一首歌給你嗎？雖然我是老人家，但別考我記性， 或者你貴人善忘吧。當日我聽到的都只是簡單一句，我從沒有跟任何人說，因為我不知道最後會否由我主唱。直至年初，經理人Leslie 致電給我，問我知唔唔知這件事，我說：「知道。」當佢再問我，可唔可以唱返這首歌，我就無條件去完成這首歌。而當中我沒有收過任何酬勞， 版權誰屬我亦不知道， 收益如何我都不知道，我肥媽唔需要抽水，都不需要藉此做任何宣傳，我唱這首歌只有一個原因，我欣賞家駒， 亦欣賞家駒的音樂。明明只是簡單紀念家駒的事， 我亦不明白為什麼最後會變得複雜。」</p></article>
