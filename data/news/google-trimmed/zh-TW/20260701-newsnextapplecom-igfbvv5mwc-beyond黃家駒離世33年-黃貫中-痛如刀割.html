                        <article class="article-body">    
                            <header>

                                    <li><h1>Beyond黃家駒離世33年　黃貫中：「痛如刀割」</h1>
                                                                            </li>
                                    
                                </ul>
                                
                                <div class="post-meta">
                                    <div>
                                    </div>
                                    <div class="social-btns">

                                        </div>
                                        <div class="social-btn">
                                            <div>我要爆料</div>
                                        </div>
                                        <div class="social-btn">
                                            <div>
                                                <div class="fb-share-button" data-href="https://news.nextapple.com/entertainment/20260701/FA214453AB2F01CC61957E8B0FE012CD" data-layout="button" data-size="large">分享</div>

                                            </div>

                                    </div>
                                </div>
                                <div style="font-size:15px; color: #878787;"> 
                                    <time style="margin-right: 5px;" datetime="2026-07-01T17:00:00+08:00">2026/07/01 17:00</time>
                                    <span class="author">            
                                                                        
                                                                                                                        記者  
                                          
                                         李家穎
                                                                                                                綜合報導
                                    </span>
                                </div>
                                
                                                                
                                                            
                                                                    <blockquote>
                                        <div>【李家穎／綜合報導】香港傳奇搖滾樂團Beyond主唱黃家駒1993年6月30日因錄製日本節目發生意外離世，享年31歲，至今已33年。每逢忌日，樂迷總會湧入社群追思，而Beyond成員黃貫中也在30日凌晨發文悼念，坦言從未刻意逼自己回憶家駒，因為每一次想起都「像刀割那麼痛」，字字句句流露對昔日戰友的深厚思念。</div>
                                    </blockquote>
                                
                                <figure>
                                    
                                                                                                                    <div style="position: relative;" data-fancybox="gallery" data-caption="Beyond黃家駒離世33年，好友黃貫中在他忌日哀悼。翻攝自黃貫中臉書" href="https://static-cdn.nextapple.tw/prod/2026-07/FA214453AB2F01CC61957E8B0FE012CD/b3878c33e4231eb3361cbc0f672c51ca_1280.webp">
                                        <picture>
                                        <source media="(min-width:1024px)" srcset="https://static-cdn.nextapple.tw/prod/2026-07/FA214453AB2F01CC61957E8B0FE012CD/b3878c33e4231eb3361cbc0f672c51ca_1280.webp">
                                        <img src="https://static-cdn.nextapple.tw/prod/2026-07/FA214453AB2F01CC61957E8B0FE012CD/b3878c33e4231eb3361cbc0f672c51ca_750.webp" width="890" height="500" fetchpriority="high" loading="eager" alt="Beyond黃家駒離世33年，好友黃貫中在他忌日哀悼。翻攝自黃貫中臉書">
                                        </img></source></picture>
                                        
                                        
                               
                                        

                                            
                                        </div>
                                                                        <figcaption>Beyond黃家駒離世33年，好友黃貫中在他忌日哀悼。翻攝自黃貫中臉書</figcaption>
                                </figure>
                                
                            </header>
                                                        <div class="post-content">
                                                                
                                                                                                                                        
                                                                                                            <p>黃貫中在社群寫下：「家駒：又到了630。」他表示，自己從未強迫自己去追憶黃家駒，也沒有刻意把那些早已埋藏的回憶重新喚醒，只因那些記憶「像刀割那麼痛」。他也感嘆，兩人的青春早已永遠定格在那段歲月裡，「記得曾經的你，曾經的我，從告別當天到現在已經是33個寒暑了。」</p>
                                    
                                                                                                                                            
                                                                                                                                                                                                                        <figure>
                                                    <div style="position: relative;" data-fancybox="gallery" data-caption="黃貫中哀悼好友。杭州煜禾演藝經紀有限公司提供" href="https://static-cdn.nextapple.tw/prod/2026-07/FA214453AB2F01CC61957E8B0FE012CD/35a7ef82c72d4a80a07690352af35b04_1280.webp">
                                                        <picture>
                                                        <source media="(min-width: 1024px)" data-srcset="https://static-cdn.nextapple.tw/prod/2026-07/FA214453AB2F01CC61957E8B0FE012CD/35a7ef82c72d4a80a07690352af35b04_750.webp">

                                                        </source></picture>

                                                        
                                                    </div>
                                                    <figcaption>黃貫中哀悼好友。杭州煜禾演藝經紀有限公司提供</figcaption>
                                                </figure>
                                                                                                                                                                                                <p>談到黃家駒如今是否身在何方，黃貫中則有感而發表示：「你現在在哪裡或許已經不重要了，因為你是真真正正活著的一個。」短短一句話，道出黃家駒雖然離開人世，但他的音樂與精神始終活在無數歌迷心中。貼文最後，黃貫中則以一句「永遠是塊碎片的我」作結，流露失去摯友後始終無法完整癒合的心情，也讓不少Beyond歌迷看了鼻酸。</p>
<p>黃家駒1993年6月24日在日本錄製綜藝節目時，因舞台意外從高處墜落，昏迷6天後於6月30日辭世，終年31歲。33年來，他創作的《海闊天空》、《真的愛你》、《光輝歲月》等經典作品，至今仍深受華語樂迷喜愛，也讓Beyond成為華語樂壇難以取代的傳奇樂團。</p>
