                    <article class="content-main editor-content-view"><p>網上社交平台threads周三 (3月18日) 流傳一則帖子並且附上一段手機視頻，帖子表示「呢條友晚晚喺我屋企樓下高聲歌唱B記啲歌，有時十點幾就唱，有時點幾先唱 。如果佢醉啲嘅話，試過不停重複唱Amani 副歌」 。</p><p>該視頻中可見在跑馬地源遠街的街頭，一名身穿黑色短袖衫黑色長褲的戴眼鏡男子，一邊「彈空氣」，一邊高聲唱爆Beyon樂隊的金曲《真的愛你》，全程十分投入。</p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/ehIZm17OYjvmEPUc6dCO6WESzBA=/0x0/public/article/content/202603/f9e3a3a7-1882-4781-830f-b24afd5a7a36.jpg" alt="" data-desc="threads@kei_keing" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/ww10szbX_fY7KwrlsPcNpaUqlw4=/0x0/public/article/content/202603/ef0a803a-7cfe-4dfb-90f5-7100fcaf5d08.jpg" alt="" data-desc="threads@kei_keing" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/5BbgKLv1iFc8lhaMyqYH0XcutcQ=/0x0/public/article/content/202603/a2355586-6761-4d10-8f60-e621c8779ebe.jpg" alt="" data-desc="threads@kei_keing" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/></p><blockquote><strong>網民：彈果下high呀！</strong></blockquote><p>事件引起網民熱議，不少人留言並且表示「唱都唔high呀！彈果下high呀！」、「睇手勢都知唔識彈結他」、「試吓jam埋一份，你不斷大叫TUNA TAKA WE WE，等佢可以不斷AMANI NAKUPENDA NAKUPENDA WE WE」、「叫佢去二樓後座致敬」、「你就好啦有live music, 好羨慕, 我屋企太靜」、「Crossover 咗陶大宇」、「學老夫子喺樓下唱歌溝女？」等。</p><p><br/></p><blockquote><strong>《噪音管制條例》</strong></blockquote><p>據了解，香港第400章《噪音管制條例》旨在管制環境噪音，任何人於下午11時至翌日上午7時，或於公眾假日的任何時間，在住用處所或公眾地方發出或促使發出噪音，而該噪音對任何人而言是其煩擾的根源，即屬犯罪。</p><p>罰則因噪音類型而異，常見的住用處所或公眾地方「鄰里噪音」最高可罰款10,000元；建築地盤噪音首次定罪最高罰款100,000元，其後可增至200,000元及每日罰款20,000元；工商業噪音罰則最高可達200,000元。</p><p><br/></p></article>
