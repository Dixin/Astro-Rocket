<div class="_page_ _page_1 read-full">殿堂級搖滾樂隊太極為慶祝成軍40周年，將於今（8日）晚播出的《一周星星》擔任嘉賓！五子除了即席獻唱多首金曲，更會大談兄弟情。節目預告最爆的環節，是有神秘嘉賓黃貫中越洋「踩場」提問，更有傳聞指成員德哥是隊中首富，他將親自解開謎團！到底黃貫中問了甚麼尖銳問題？德哥的收入之謎真相又是如何？
</div>
<div class="read_btn" style="display:none;">閱讀全文</div>
<div class="_more_content_">
<div class="_page_ _page_2">
<h2>今晚獻唱4大金曲 樂迷集體回憶返晒嚟</h2>
<p>為慶祝成軍40周年的大日子，太極五子鄧建明、雷有輝、盛旦華、劉德賢及朱翰博在節目中絕不欺場，即場演繹了《紅色跑車》、《一生不再說別離》、《留住我吧》及《全人類高歌》四首經典金曲。強勁的搖滾節拍與熟悉的旋律，勢必勾起無數樂迷的集體回憶，重溫當年追隨太極的熱血歲月。單是這四首歌的現場演繹，已足以讓粉絲們熱血沸騰，守在電視機前一同高歌，重拾當年的搖滾魂。</p>
<h2>黃貫中泳兒驚喜提問 Dear Jane Supper Moment齊挑機</h2>
<p>節目組在「你問我答」環節中為太極準備了巨大驚喜，竟然找來黃貫中、泳兒，以及後輩樂隊Dear Jane、Supper Moment等人向他們隔空提問，甚至連主音Patrick的仔仔雷瑋陶（Matt）都加入其中！樂壇猛人與後起之秀齊齊「挑機」，問題內容絕對是觀眾焦點所在。究竟同為殿堂級樂隊的黃貫中會問甚麼秘聞？而Dear Jane及Supper Moment又會如何向前輩「致敬」？這個跨代音樂人對話的環節，火花十足，絕對不容錯過。
</p></div>

<div class="_page_ _page_3">
<h2>德哥被傳收入最高？ 親自解畫爆獨門「買嘢買Double」心得</h2>
<p>除了音樂交流，節目亦設有「本尊 Fact Check」環節，直面坊間傳聞！多年來一直有傳聞指，成員劉德賢（HiFi 德）是全隊中收入最高的一位，堪稱隱形富豪。在今晚播出的節目中，德哥將會親自解畫，回應這個流傳已久的傳聞。他更會大爆自己獨門的消費心得—「買嘢買 Double」？究竟他為何會有如此奇特的購物習慣？背後原因是否與他的豐厚收入有關？想知道答案，就要密切留意今晚10點05分播出的《一周星星》！</p>

<div class="qa_box" onclick="toggleFAQ(this)">
<p class="question"><span class="text">還有什麼演唱會消息？</span><i class="icon fa-angle-down"/></p>
<p class="answer"><span class="text">無論是本地歌手還是外地歌手都即將在香港舉行演唱會，即睇：<b>演唱會時間表及購票資訊</b>，包括<b>MIRROR演唱會門票兌換安排</b>、<b>容祖兒</b>、<b>鄭秀文</b>、<b>張學友</b>、<b>鄭中基</b>、<b>溫拿</b>、<b>羅志祥</b>等。</span></p>
</div>
<div class="qa_box" onclick="toggleFAQ(this)">
<p class="question"><span class="text">除了演唱會，還有什麼消閒娛樂活動？</span><i class="icon fa-angle-down"/></p>
<p class="answer"><span class="text">喜愛宅在家的話，觀看<b>Netflix劇集</b>和<b>BL劇</b>最好不過。如果喜歡外出走走的你，也可到這些<b>室內好去處</b>室內遊樂場、溜冰場、自助烘焙店等盡玩室內活動。想要親親大自然，也可到離島走一走，即睇：<b>離島行程攻略</b>或是行山，這些<b>行山好去處</b>路線簡易，新手也適合。</span></p>
</div>
</div>
</div>
