                </h1>
                <p class="lead">麋先生朝聖傳奇樂團Beyond錄音室 喆安榮幸試彈Beyond黃家駒40年珍藏吉他  驚呼「比我們還資深」</p>

    <section id="news-newsdetail" class="container my-5">
        <div class="row">
            <div class="col-md-8">
                		                                <img src="https://www.mtv.com.tw/uploads/files/55983/conversions/%E9%BA%8B%E5%85%88%E7%94%9F%E6%9C%9D%E8%81%96%E5%82%B3%E5%A5%87%E6%A8%82%E5%9C%98Beyond%E9%8C%84%E9%9F%B3%E5%AE%A4-%E5%96%86%E5%AE%89%E6%A6%AE%E5%B9%B8%E8%A9%A6%E5%BD%88Beyond%E9%BB%83%E5%AE%B6%E9%A7%9240%E5%B9%B4%E7%8F%8D%E8%97%8F%E5%90%89%E4%BB%96--%E9%A9%9A%E5%91%BC%E6%AF%94%E6%88%91%E5%80%91%E9%82%84%E8%B3%87%E6%B7%B1-xl.jpg" class="w-100 mb-3" alt="麋先生朝聖傳奇樂團Beyond錄音室 喆安榮幸試彈Beyond黃家駒40年珍藏吉他  驚呼「比我們還資深」">
                                <h5 class="mt-2">
                    麋先生朝聖傳奇樂團Beyond錄音室 喆安榮幸試彈Beyond黃家駒40年珍藏吉他  驚呼「比我們還資深」

                                            
                            <i class="fal fa-heart fa-lg"/> 追蹤
                        
                                    </h5>
                <p class="text-secondary">2026-04-03</p>
                    <div class="row"><div class="col-lg-12 col-sm-12 column"><div class="ge-content ge-content-type-ckeditor ge-content-current" data-ge-content-type="ckeditor"><p style="text-align:justify"><span style="font-family:Noto Sans TC">金曲樂團麋先生MIXER〈馬戲團運動 CircUs〉世界巡迴演唱會征服北高萬人雙巨蛋的殿堂後，2026無極限再升級、打破空前創舉！將在高雄從無到有、劃地建造，打造「全帳篷」式馬戲團演唱會王國，於5月一連五場開唱。麋先生正在如火如荼準備【大誠保經 x 麋先生 MIXER〈大馬戲團 CircUs Max〉2026馬戲團運動嘉年華】的演出之外，他們上星期也飛到香港擔任五月天演唱會嘉賓，更抽空專程前往香港殿堂級搖滾樂團Beyond「二樓後座」錄音室朝聖，為演出找更多靈感。</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">「二樓後座」錄音室是Beyond於80年代末至90年代的重要創作基地，樂團多首經典作品皆在此誕生，對香港樂迷乃至亞洲搖滾樂壇都具有深遠意義。參觀期間，麋先生得知錄音室所在的大廈將於4月9日後被拆除重建，永遠消失在世上，眾人均表示非常可惜，感嘆：「這個代表著香港搖滾歷史的地方很珍貴，如今將從此消失，真的好可惜。幸好我們趕得上這最後一波參觀！」</span></p>

<p style="text-align:justify"><img alt="麋先生喆安榮幸試彈Beyond黃家駒40年珍藏吉他。（相信音樂提供）" height="auto" src="https://www.mtv.com.tw/uploads/files/55987/conversions/%E9%BA%8B%E5%85%88%E7%94%9F%E5%96%86%E5%AE%89%E6%A6%AE%E5%B9%B8%E8%A9%A6%E5%BD%88Beyond%E9%BB%83%E5%AE%B6%E9%A7%9240%E5%B9%B4%E7%8F%8D%E8%97%8F%E5%90%89%E4%BB%96%E7%9B%B8%E4%BF%A1%E9%9F%B3%E6%A8%82%E6%8F%90%E4%BE%9B-sl.jpg?v=1775524132" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">第一次踏足Beyond的二樓後座，主唱聖皓表示：「Beyond在我們心目中是一個非常經典的樂團，都有聽過他們的歌，這一次親身走到他們的錄音室工作室，是非常感動跟震撼。踏進去就像走進他們的故事裡面，真實感受到那些曾經在耳機裡面的音樂。」吉他手喆安於二樓後座，拿起Beyond黃家駒的古董吉他試彈，得知是近40年歷史的1987年吉他，眾人高呼「這把吉他是前輩等級，資歷比我們還深！」吉他上還貼有價錢是90幾萬港幣，也嚇了他們一跳，最後才知道，那個價錢貼是Beyond黃貫中搞笑寫上去的。</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">鼓手逸凡更在錄音室獲得了一份極具意義的禮物——Beyond鼓手葉世榮送贈的鼓棍，逸凡透露將會在四月到香港開演唱會時使用這份珍貴的紀念品。鼓手逸凡被問到會否效法Beyond鼓手葉世榮當年演唱會solo 20分鐘，他笑言：「如果大家真的這麼想看，我是絕對奉陪的。」</span></p>

<p style="text-align:justify"><img alt="麋先生逸凡美食入口嗨喊：Solo 40分鐘沒問題！（相信音樂提供）" height="auto" src="https://www.mtv.com.tw/uploads/files/55986/conversions/%E9%BA%8B%E5%85%88%E7%94%9F%E9%80%B8%E5%87%A1%E7%BE%8E%E9%A3%9F%E5%85%A5%E5%8F%A3%E5%97%A8%E5%96%8ASolo-40%E5%88%86%E9%90%98%E6%B2%92%E5%95%8F%E9%A1%8C%E7%9B%B8%E4%BF%A1%E9%9F%B3%E6%A8%82%E6%8F%90%E4%BE%9B-sl.jpg?v=1775524132" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">朝聖錄音室後，麋先生更前往Beyond當年最常光顧的餐廳，Beyond世榮電話中推薦了附近一家老店，並透露黃家駒最愛吃「煎豬扒、羅宋湯及一個餐包」，而世榮自己則有時會吃牛排。麋先生隨即按圖索驥前往該餐廳，品嚐Beyond同款美食，他們形容這趟既是「朝聖之旅」，也是「美食之旅」。逸凡吃了美食後，更直說：「我覺得我可以solo 40分鐘！」其他團員隨即起鬨要大家拭目以待，也為即將到來的〈馬戲團運動 CircUs〉世界巡迴演唱會香港站埋下伏筆，預告已為香港站準備了「限定內容」，絕對不會讓香港樂迷失望。</span></p>

<p style="text-align:justify"><img alt="金曲樂團麋先生朝聖傳奇樂團Beyond錄音室得靈感。（相信音樂提供）" height="auto" src="https://www.mtv.com.tw/uploads/files/55989/conversions/%E9%87%91%E6%9B%B2%E6%A8%82%E5%9C%98%E9%BA%8B%E5%85%88%E7%94%9F%E6%9C%9D%E8%81%96%E5%82%B3%E5%A5%87%E6%A8%82%E5%9C%98Beyond%E9%8C%84%E9%9F%B3%E5%AE%A4%E5%BE%97%E9%9D%88%E6%84%9F%E7%9B%B8%E4%BF%A1%E9%9F%B3%E6%A8%82%E6%8F%90%E4%BE%9B-sl.jpg?v=1775524132" width="500px"/></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">唱完香港站，麋先生緊接著帶來【大誠保經 x 麋先生 MIXER〈大馬戲團 CircUs Max〉2026馬戲團運動嘉年華】，無極限再升級，幻化造夢從無到有打造「全帳篷」式馬戲團演唱會王國。演唱會將於5月1日（五）、5月2日（六）、5月3日（日）、5月9日（六）、5月10日（日）於高雄輕軌夢時代站旁盛大舉辦，門票預計於4月11日（六）12:00於拓元售票系統正式開賣。更多麋先生活動近況，請密切關注麋先生及相信音樂官方Instagram、臉書粉絲專頁及官方微博、微信公眾號。</span></p>

<p style="text-align:justify"><strong><span style="font-family:Noto Sans TC">✧ 大誠保經 x 麋先生 MIXER〈大馬戲團 CircUs Max〉2026馬戲團運動嘉年華 ✦</span></strong></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">演出時間｜2026/5/1(五)．5/2(六)．5/3(日)．5/9(六)．5/10(日) 19:00</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">演出地點｜高雄輕軌夢時代站旁（時代大道和成功二路交叉口）</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">演出票價｜3000 / 2800</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">（【大馬戲團MAX站區】為站席，依序號入場；其餘票區為座席，請對號入座）</span></p>

<p style="text-align:justify"><span style="font-family:Noto Sans TC">售票日期｜2026/4/11(六) 中午12:00 拓元售票</span></p>
