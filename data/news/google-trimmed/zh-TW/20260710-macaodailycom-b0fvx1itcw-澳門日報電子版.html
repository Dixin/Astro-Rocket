<font size="2"> 黃家駒首部個人紀錄片《真的相識過》
</font>

 
  <div id="ozoom" style="ZOOM: 100%"> <founder-content><P>&nbsp;&nbsp;&nbsp;&nbsp;黃家駒紀錄片上映</P><P>&nbsp;&nbsp;&nbsp;&nbsp;若問人生最愛樂隊，筆者定毫不猶豫地告訴你，由始至終，最愛都是粵語經典樂隊BEYOND。今年是BEYOND靈魂人物，主創、主唱兼結他手黃家駒逝世三十三周年，每年的六月三十日，也是全球BEYOND迷心碎的一天：九三年的六月廿四日，家駒於日本錄影電視節目時不慎由高處跌倒，六日後與世長辭。</P><P>&nbsp;&nbsp;&nbsp;&nbsp;今年家駒的紀錄片《真的認識過》上映，片內不少家駒身邊人物分享當年點滴，連帶不少珍貴錄像，令筆者再次變回年少的小歌迷。當年尚是兒童的筆者，辛辛苦苦以積蓄購入BEYOND的卡式錄音帶及CD唱片，無時無刻細聽BEYOND歌曲已是筆者成長印記，直到家駒走後也一直支持剩下三子，至今仍不時翻聽他們的經典樂曲。</P><P>&nbsp;&nbsp;&nbsp;&nbsp;很想親口和家駒說聲真的愛你，遙望大地憶起早班火車，雖人生滿是灰色軌跡，但你教會了我縱然冷雨夜歲月無聲也不再猶豫，即使無語問蒼天，也要海闊天空，活着便精彩。你更教會我，縱使是緣是情是童真，還是意外，比當初已改變，牽強地相處，惟人生雖短暫，也無悔共你穿梭天邊與海岸，因為，我與你也彼此真的相識過。謝謝你，黃家駒，感謝你在我生命出現，感恩認識過。</P><P>&nbsp;&nbsp;&nbsp;&nbsp;司徒文進</P></founder-content></div>
