                                                                    <blockquote>
                                        <div>【記者王郁惠／台北報導】羅大佑、黃貫中、崔健三位殿堂級音樂人首度同台，將於杭州奧體中心體育場（大蓮花）舉辦《三響演唱會》，消息一出立刻，直接被樂迷封為「一生至少要看一次」的音樂盛事。<br/>
</div>

                                        <source media="(min-width:1024px)" srcset="https://static-cdn.nextapple.tw/prod/2025-09/E65AF227C6B4E914B139E41484A096BC/1a855cee83f2829cddbc9531b998807d_1280.webp">

                                </figure>

                                                        <div class="post-content">
                                                                
                                                                                                                                        
                                                                                                            <p>《三響演唱會》集結台灣、香港與中國大陸三地的音樂傳奇，象徵跨時代、跨地域的文化對話。羅大佑以《童年》、《光陰的故事》等作品道盡台灣集體記憶，從1980年代《之乎者也》專輯開始，將人文關懷與社會觀察帶進流行音樂，奠定「音樂教父」地位。</p>
<p>&nbsp;</p>
<p><br>黃貫中作為Beyond靈魂吉他手，帶來《海闊天空》、《光輝歲月》等經典，唱出香港人的堅韌情感，也為華語樂壇奠下搖滾標竿。多年來他延續樂團精神，持續用音樂表達不妥協的創作靈魂。</br></p>
<p>&nbsp;</p>
<p><br>崔健則以《一無所有》開啟中國搖滾篇章，《花房姑娘》、《假行僧》、《新長征路上的搖滾》等作品至今仍是時代的回聲。他融合搖滾與民謠，將音樂化作一整個世代的吶喊。</br></p>
<p>&nbsp;</p>
<p><br>三位重量級音樂人首度同台，被樂迷盛讚是「華語音樂的巔峰對話」。當經典旋律齊響，勢必掀起萬人合唱，現場將成為跨世代的共同記憶。</br></p>
