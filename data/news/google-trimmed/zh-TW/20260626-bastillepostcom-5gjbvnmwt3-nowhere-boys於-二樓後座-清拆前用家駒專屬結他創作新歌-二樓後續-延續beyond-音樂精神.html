    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">寰亞樂隊Nowhere Boys（NWB）成員來自不同成長背景，但他們同樣深受香港Band壇傳奇Beyond的影響。Beyond專屬錄音室，位於旺角花墟的「二樓後座」，因市區重建歲月無聲地面臨清拆，緣份讓Nowhere Boys 一次偶然，用已故Beyond靈魂人物黃家駒最愛的木結他「小妖」創作了一首歌，在錄音室停止運作前順利完成錄音。《二樓後續》MV紀錄了「二樓後座」每個曾經有著Beyond與Nowhere Boys不同時空交錯的逝去日子，同時延續Beyond的光輝歲月！</p>

    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">Nowhere Boys作為Beyond的忠粉，身處偶像專屬錄音室「二樓後座」，創作新歌《二樓後續》及錄音，心情如赤血熱血般興奮與期待。結他手Ken說：「呢度係『二樓後座』，呢支木結他叫『小妖』，係黃家駒生前用嘅結他，我無親眼見但睇相見過佢玩，佢話『得閒就彈，唔得閒都會彈』。」結他藏於「二樓後座」，可以讓音樂人使用。Ken說：「有一次我好得閒，所以就攞嚟彈，之後Van話啲Rhythm可以用到，不如我哋試吓用。」</p>

                        <div class="article-body">
                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">今年是香港殿堂級樂隊Beyond靈魂人物黃家駒逝世33周年，對無數樂迷而言，他的音樂與精神從未離開。在這個特別的紀念年份，一部籌備超過廿載、首部關於黃家駒的紀錄片《真的相識過》（Because of You Ka Kui）將於6月11日正式在香港上映，為樂迷帶來一次深入靈魂的追憶。</p>
  
  
  
  
  
  
  

                            
                                
  
  
  
    
      
        <img src="https://image.bastillepost.com/853x/wp-content/uploads/hongkong/2026/05/20260522_EN_Movie_Beyond01_source-licensed_.jpg.webp" alt="紀錄片《真的相識過》將於6月11日正式在香港上映。">
        <p class="caption font-size-scaler-control" data-font="14">紀錄片《真的相識過》將於6月11日正式在香港上映。</p>
      </img>
    
    
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16"><strong>橫跨廿載六地拍攝 還原「黃伯」真性情</strong></p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">這部紀錄片不僅僅是回顧家駒從默默奮鬥到登上事業巔峰的傳奇音樂旅程。電影團隊耗時超過二十年，足跡遍及香港、北京、台北、東京、多倫多及倫敦六個城市進行拍攝，旨在呈現音樂以外，家駒鮮為人知的另一面——那個親切、真實的「黃伯」形象。影片將透過大量從未曝光的珍貴音樂、影像及私密故事，讓觀眾看到巨星光環下，一個有血有肉、充滿熱誠與夢想的黃家駒。</p>

    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">對於Beyond樂迷而言，最令人期待的莫過於影片中收錄的珍貴現場片段。據悉，紀錄片將包含超過30分鐘從未公開的演唱會及幕後影像，這些塵封多年的畫面，將帶領觀眾穿越時空，重回那個搖滾精神熾熱燃燒的黃金年代，親身感受家駒在舞台上的無窮魅力與音樂爆發力。</p>
