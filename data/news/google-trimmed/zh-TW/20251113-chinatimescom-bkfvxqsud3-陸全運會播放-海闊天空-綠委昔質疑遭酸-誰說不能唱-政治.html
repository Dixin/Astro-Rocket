                    <h1 class="article-title">陸全運會播放〈海闊天空〉 綠委昔質疑遭酸：誰說不能唱</h1>
                    
                    <div class="row align-items-center">

                        <div class="article-body" itemprop="articleBody">
                                        <p>中國陸港澳地區舉辦全國運動會，此次場地橫跨廣東、香港、澳門，是首次在港澳舉辦全運會，國家主席習近平9日親自參加了開幕式。由於本屆全運會香港也是主場之一，開幕式特別播放了經典歌曲〈海闊天空〉，曾質疑對岸能否唱這首歌的綠委王定宇，再次被酸爆。</p>
    


                                        
                                        <div class="ad rwd with-placeholder" data-id="mobile-middle-banner">
                                            <div class="underlay-auto-scale">
                                                <div class="clip-container">
                                                    <div class="position-container">

                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        
    


                                        <p>為維持全運會秩序，大陸網信辦4日宣布將展開「清朗」系列專項行動，其中包括散布涉十五運會和帕運會及相關地區公共政策、社會民生領域虛假訊息，捏造可能引起恐慌的災難事故、違法犯罪、食品產品質量問題、疫情防控等謠言；片面、歪曲傳播賽事期間可能出現的突發事件訊息，假冒當事人或相關人員身分發聲，關聯翻炒舊聞舊事；利用人工智能技術製作和發布有關虛假賽事影片；在帳號名稱、簡介、直播間等環節假冒相關地區官方機構、新聞媒體等。重點與在成都舉行第12屆世界運動會前後的清朗專項行動大致相同。</p>

                                        <p>6.3萬追蹤的粉專「刺綠酸水」PO出一段剪輯影片，前半段是綠委王定宇曾質疑對岸：「聲援劉德華（唱〈中國人〉）的中國（大陸），請問一下，〈光輝歲月〉可不可以唱？請問一下，〈海闊天空〉可不可以唱？」</p>

                                            </div>

                                        <p>然而影片隨即接到9日全運會開幕式的場景，只聞全場響徹香港Beyond樂團的經典歌曲〈海闊天空〉，已故主唱黃家駒的傳奇嗓音重現：「（粵語）原諒我這一聲不羈放縱愛自由！哪會怕有一天會跌倒？背棄了理想，誰人都可以，哪會怕有一天只你共我？」</p>
    


                                        
    


                                        <p>刺綠酸水直呼：「『八千附早餐哥』怎麼又翻車了？」</p>
    


                                        
    


                                        <p>網友表示「號稱廣東省省歌怎麼可能禁？還有福建省省歌〈愛拚才會贏〉」、「待在井底永遠是看不見外面的天空的」、「在廣東，到處都能聽到這首歌，前幾天坐計程車，聽到王世堅的〈沒出息〉，特別感慨呀」、「大陸節目有唱啊！我都聽了3次以上」、「八千怎麼不去對岸唱？」</p>
    


                                        
    


                                        <p>大陸第15屆全國運動會與全國第12屆帕運會暨第9屆特奧會，分別於11月9日及12月8日開幕，由廣東省、香港和澳門三地聯合承辦。</p>
