                                <div style="font-size:15px; color: #878787;"> 
                                    <time style="margin-right: 5px;" datetime="2025-07-02T11:22:00+08:00">2025/07/02 11:22</time>

                                                                    <blockquote>
                                        <div>【黃詩淳／綜合報導】香港搖滾樂隊Beyond主唱黃家駒1993年在日本錄節目時，意外墜落舞台身亡，6月30日是他逝世32周年，樂隊成員、吉他手黃貫中發文悼念他，「你的照片越來越模糊，但我對你的印象卻越來越深」道盡兄弟情。</div>
                                    </blockquote>
                                
                                <figure>
                                    
                                                                                                                    <div style="position: relative;" data-fancybox="gallery" data-caption="黃貫中發文悼念黃家駒。翻攝黃貫中臉書" href="https://static-cdn.nextapple.tw/prod/2025-07/541C267401C192A5E69B74A6EDAF4CBF/228f928b182bbf315e9212e58272c46d_1280.webp">
                                        <picture>
                                        <source media="(min-width:1024px)" srcset="https://static-cdn.nextapple.tw/prod/2025-07/541C267401C192A5E69B74A6EDAF4CBF/228f928b182bbf315e9212e58272c46d_1280.webp">
                                        <img src="https://static-cdn.nextapple.tw/prod/2025-07/541C267401C192A5E69B74A6EDAF4CBF/228f928b182bbf315e9212e58272c46d_750.webp" width="1280" height="1024" fetchpriority="high" loading="eager" alt="黃貫中發文悼念黃家駒。翻攝黃貫中臉書">
                                        </img></source></picture>
                                        
                                        
                               
                                        

                                            
                                        </div>
                                                                        <figcaption>黃貫中發文悼念黃家駒。翻攝黃貫中臉書</figcaption>
                                </figure>
                                
                            </header>
                                                        <div class="post-content">
                                                                
                                                                                                                                        
                                                                                                            <p>黃貫中上月30日在社群發文悼念，「家駒，離別已經32年了，你的照片越來越模糊，但我對你的印象卻越來越深，甚至感覺越來越近」，他也憶起以前兩人一起玩音樂時，都會擁抱在一起，「這個感覺真的很好」。</p>
<p>他接著表示，「做兄弟有今生無來世，但你知道嗎，我依然將你當成我的假想敵，哈哈哈，你要好好珍重。」</p>
<p>粉絲見狀也紛紛留言，「他雖走得早，他青春不老」、「他已經海闊天空，走遍千里，走進全世界每個人心裡」、「不會忘記家駒多麼燦爛的笑容」、「真的很羨慕你能認識這種互相競爭、成長的朋友」。</p>
