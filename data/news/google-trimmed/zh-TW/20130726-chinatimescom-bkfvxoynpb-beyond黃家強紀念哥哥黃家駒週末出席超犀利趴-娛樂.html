                        <div class="article-body" itemprop="articleBody">
                                        <p>相信音樂主辦的華語搖滾樂團年度盛事「超犀利趴」今年擴大舉辦，本週開唱團體陣容堅強，週五香港傳奇樂團Beyond前貝斯手黃家強舉辦「黃家強Its Alright」演唱會，也是黃家強在台灣的首度個人演唱會；最能代表台灣搖滾之一的董事長樂團將在週六舉辦「啊娘喂！首唱會」，週日是曾經入圍金曲獎最佳樂團的先知瑪莉及啾吉惦惦輪番登場。</p>
    


                                        
                                        <div class="ad rwd with-placeholder" data-id="mobile-middle-banner">
                                            <div class="underlay-auto-scale">
                                                <div class="clip-container">
                                                    <div class="position-container">
                                                        <div class="size-container placeholder">

                                                           
                                                            
                                                            
                                                            
                                                            
                                                           
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <p>今年是香港傳奇樂團Beyond成立30周年，也是靈魂人物黃家駒20周年的忌日，演唱會上黃家駒弟弟黃家強將會獻唱多首歌和哥哥致敬，和台灣的歌迷一起悼念黃家駒。而台灣經典搖滾團董事長樂團，將在週六舉辦〈啊娘喂！首唱會〉，董事長樂團將獻上和女歌手對唱的“第一次”，和閻韋伶合唱曲風偏電音的新歌〈幸福的滋味〉，新科金曲歌后李婭莎也力挺董事長樂團，以台語演出歌中劇〈新男性的復仇〉。</p>
    


                                        <p>躁鬱搖滾代表先知瑪莉及另類搖滾樂團啾吉惦惦即將在本週日同場犀利開趴。先知瑪莉主唱兼吉他手Josh在瞞著團員情況下，偷偷報名海國樂器舉辦的電吉他精英大賽，他在youtube上的比賽影片已累積破萬點閱，演唱會當天Josh也將現場獨秀長達六分多鐘的比賽曲目《Cause We've Ended As Lovers》，讓歌迷現場感受Josh高超的吉他功力，之後先知瑪莉為了預計將在十月推出的新專輯，開始閉關製作，週日的「犀利啥小趴」將成為先知瑪莉在發片前唯一的公開演唱。</p>
