    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">今年是香港殿堂級樂隊Beyond靈魂人物黃家駒逝世33周年，對無數樂迷而言，他的音樂與精神從未離開。在這個特別的紀念年份，一部籌備超過廿載、首部關於黃家駒的紀錄片《真的相識過》（Because of You Ka Kui）將於6月11日正式在香港上映，為樂迷帶來一次深入靈魂的追憶。</p>

    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">這部紀錄片不僅僅是回顧家駒從默默奮鬥到登上事業巔峰的傳奇音樂旅程。電影團隊耗時超過二十年，足跡遍及香港、北京、台北、東京、多倫多及倫敦六個城市進行拍攝，旨在呈現音樂以外，家駒鮮為人知的另一面——那個親切、真實的「黃伯」形象。影片將透過大量從未曝光的珍貴音樂、影像及私密故事，讓觀眾看到巨星光環下，一個有血有肉、充滿熱誠與夢想的黃家駒。</p>

                            <h3 class="bpcategory-special-color read-more-post" style="font-size: 28px; margin:0 0 15px 0;">信和公佈匹克球發展藍圖 現有15場地 年內再增3萬呎</h3>

                            <span class="news-large__data" style="display: block">&nbsp;</span>
                        </div>

                        <div class="banner-image desktop-only" style="min-width:728px;min-height:calc(90px + 30px);">
    <div id="desktop-leaderboard-3" class="banner-wrapper">
        
    </div>
</div>
                        <div class="banner-image mobile-only" style="min-width:300px;min-height:calc(250px + 30px);">
    <div id="mobile-box-3" class="banner-wrapper">
        
    </div>
</div>

                        <div class="article-body">
                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">信和集團公佈新一輪匹克球發展藍圖，以「盛事化、精英化、普及化」三大方向為核心，藉助旗下商場、住宅、酒店及社區網絡的優勢，把這項全球增長最快的新興運動進一步帶進香港社區。集團期望透過持續投放資源，打造可持續發展的匹克球生態圈，推動本地運動邁向專業化及產業化。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">集團自2024年起已積極投入推動匹克球普及。今年初，信和聯同中國香港網球總會推出「香港匹克球精英培育及社區推廣計劃」，把屯門市廣場的 tmtp commons 打造成匹克球港隊主場，為港隊備戰匹克球世界盃提供訓練基地。上星期，集團更在旗下商場奧海城舉行誓師大會，為一眾即將出戰的運動員打氣，以實際行動支持港隊徵戰國際舞台。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">在盛事化層面，集團鋭意推動國際級賽事落户香港，鞏固香港作為亞洲匹克球樞紐的地位。除支持中國香港代表隊出戰國際賽事外，信和亦贊助將於今年10月舉行的「PPA亞洲職業匹克球巡迴賽1500 ─ 恆生銀行香港大滿貫2026」，這項賽事屬全港最大規模的同類比賽。集團並會於旗下場地舉辦相關預賽及推廣活動，讓更多市民有機會參與其中，親身感受匹克球熱潮。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">人才培育方面，集團正式宣佈全力支持有「亞洲一哥」之稱的王康傑（Jack Wong），贊助範圍涵蓋練習、比賽場地及出賽支援等，協助他在國際舞台爭取更高成就。與此同時，信和將聯同合作伙伴 Bay Pickle Academy 推出「精英培育發展計劃」，並與中國香港網球總會的選拔及培訓體系互相銜接，發掘及培育更多本地新秀，為香港匹克球建立更完善的人才發展階梯。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">作為綜合地產發展商，信和一直善用旗下物業空間營造更具活力的社區體驗。目前集團旗下已有6個工商住舖物業設置合共15個匹克球場，總面積約42,000平方呎，屬本港規模最大的企業匹克球平台之一。除定期於 tmtp commons 舉辦 Open Play 及各類匹克球活動外，集團亦積極把匹克球帶入校園及社區，讓不同年齡及水平的人士都能輕鬆接觸這項運動，未來將舉辦更多社區及校園推廣活動，鼓勵更多市民參與。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">集團亦透過匹克球加強與業界夥伴的交流。早前信和於旗下商業大廈 Landmark South 內的山球館首度舉辦「Property Agency Pickleball Mini-Cup & Cocktail Party 2026」，藉此連繫11間商業地產代理行，把匹克球文化延伸至商業地產業界。與此同時，首支「信和匹克球隊」正式成立，將代表集團參與不同賽事、交流及推廣活動，以身作則推廣健康生活文化，展現團隊精神。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">因應匹克球在全球及香港迅速普及，信和將持續擴展相關設施網絡。除現有約42,000平方呎的匹克球設施外，集團計劃於今年內新增約30,000平方呎場地，進一步擴大匹克球版圖。隨著更多場地陸續投入服務，集團預期匹克球在香港將持續高速增長，有望成為最具發展潛力的新興運動之一。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">信和集團首席商務總裁蔡碧林女士表示，很高興看到匹克球近年於香港迅速發展。她指出，作為綜合地產發展商，集團一直思考如何善用旗下物業空間，創造更多元化及具活力的社區體驗。匹克球兼具運動、社交及跨代共融元素，與集團推動健康生活及社區連繫的理念不謀而合。她提到，集團旗下6個物業現已設有合共15個匹克球場，總面積約42,000平方呎，並將於今年內新增約30,000平方呎場地，期望透過持續投放資源及完善設施網絡，支持本港匹克球普及化及專業化發展，進一步推動香港運動經濟及社區活力。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">展望未來，信和將繼續發揮旗下商場、住宅、酒店及社區網絡的優勢，連繫體育、社區及青年一代，推動匹克球普及發展，把這項充滿活力的新興運動帶到更多人的生活之中，攜手打造香港可持續發展的匹克球生態圈。</p>
  
  
  
  
  
  
  

                            
                                
  
  
  
    
      
        <img src="https://image.bastillepost.com/1179x/wp-content/uploads/hongkong/2026/09/img_710fcf5c_01.jpg.webp" alt="屯門市廣場 tmtp commons 的專業匹克球場地設施">
