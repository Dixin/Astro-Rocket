                    <article class="content-main editor-content-view"><blockquote>香港傳奇樂隊 Beyond 位於旺角洗衣街一幢唐樓內的錄音室「二樓後座」，多年來被視為本地搖滾音樂的聖地，吸引不少樂迷前往「朝聖」。該錄音室早前已被納入市建局洗衣街與花墟道重建計劃的清拆範圍，惟在告別在即之際，卻發生離奇盜竊事件。</blockquote><p><br/></p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/3OqanQppqqi8e84dCeJGNioEJzc=/0x0/public/article/content/202603/24492023-3669-4bfb-9c19-0c92c292714a.jpg" alt="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-desc="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/7tIgxJ_Z9rwEdXKW44-Aen4xtGQ=/0x0/public/article/content/202603/eed2895b-17f4-4480-9a85-e56a11180f0c.jpg" alt="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-desc="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/CemQJcEM8ZctGkroBRb1M4-ee8U=/0x0/public/article/content/202603/7b03bdb8-de52-4a12-a3ca-6ba684958eb2.jpg" alt="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-desc="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/></p><p><br/></p><h2>男子偷Beyond「二樓後座」門牌</h2><p>「Re:spect Music Magazine 紙談音樂」昨日在社交平台專頁發文，指昨日（3月16日）深夜，職員返回錄音室時，發現寫有「二樓後座」字樣的門牌跌在地上，但仔細檢視後，確認並非原裝門牌，懷疑有人將真門牌偷走，再換上自製假門牌，但因尺寸不合未能固定，最終掉落地面。</p><p><br/></p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/Dxx_ZD5CUDS3tL_lD70A_LyTkpY=/0x0/public/article/content/202603/a77974fc-500a-4ff0-bb98-5ce6c1bc15a7.jpg" alt="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-desc="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/XllbT9ZHHBCQKZZu2WXf6Kui5j0=/0x0/public/article/content/202603/cdede1ed-d9be-4ecf-abe3-21adabeebfca.jpg" alt="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-desc="天眼直擊｜黑色雨衣赤腳男偷Beyond「二樓後座」門牌　鬼鼠轉掛盜版門牌" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/></p><p><br/></p><p>從閉路電視畫面所見，事發於3月16日深夜約12時，一名身穿黑色雨褸的男子赤腳走到錄音室門外，其間刻意低頭避開鏡頭，隨後疑似拆走原有門牌，並把自行製作的門牌裝上，之後疑捧着被偷走的門牌沿樓梯離開現場。</p><p><br/></p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/bGSbfK9HYg3oDu4JzdzHyIfuhQ8=/0x0/public/article/content/202603/b6639b22-741a-4207-98bb-239308f15161.png" alt="自製假門牌" data-desc="自製假門牌" data-href="" data-open="in-app" style="width: 100%;" decoding="async" loading="lazy"/></p><p><br/></p><p>專頁表示，已就事件到旺角警署報案，並將涉事木盒及閉路電視片段交予警方，協助調查。而警方證實，昨日接獲報案，指旺角洗衣街215號一所錄音室的門牌懷疑被人盜去。經初步調查後，警方將案件列作盜竊，現由旺角警區刑事調查隊第四隊跟進，暫未有人被捕。</p><p><br/></p><h2>相關新聞：</h2><h3>東張西望｜夾公仔舖「怪賊」唔偷公仔 竟被偷走CCTV？ 場主無奈：首次遇到</h3><h3>東張西望丨醉酒佬清晨尾隨美女返公司門口 聞報警發惡打人毀CCTV逃去</h3><h3>東張西望｜美甲店驚魂！事主大意遺留戒指 CCTV揭後續客人順手牽羊 店主態度消極報警先肯理</h3><h3>大圍男女疑食「霸王餐」 食肆網上急發CCTV截圖呼籲自行回店付款</h3><p><br/></p></article>
