<p><span><span><span>《</span>Dragon Rock Concert indigo at The O2 UK 2025<span>》，由搖滾女王何超（何超儀）領軍，與何超與海膽仔樂團（</span>Josie and The Uni Boys<span>）、</span>Beyond <span>的主唱黃貫中（</span>Paul Wong<span>）、嘻哈團體大懶堂（</span>LMF<span>）以及廿四味（</span>24Herbs<span>），將於</span>2/27<span>於英國倫敦搖滾開唱。</span></span></span></p>

<p><span><span><span>何超與海膽仔樂團日前他們受到英國雜誌《</span>Fault Magazine<span>》和美國媒體《</span>Galore<span>》評選為</span>2025<span>年必須關注的音樂人名單之一，並大讚《</span>Dragon Rock<span>》為</span>2025<span>年最具特色的現場音樂盛事之一，去年的新作〈沒完沒了的完美〉近期也獲得歐洲音樂文化雜誌《</span>Kaltblut<span>》推薦，成績斐然。</span></span></span></p>

<p><span><span><span>《</span>Dragon Rock Concert indigo at The O2 UK 2025<span>》演唱會由何超與海膽仔樂團攜手香港最重量級音樂人黃貫中、</span>LMF<span>與廿四味演出，融合搖滾與嘻哈跨界曲風，舞台屆時將擠滿超過</span>27<span>位表演者，也將帶來非常難得的同台畫面，何超分享：「我們這次的編排讓整體氛圍更震撼！最後還安排了一場大合唱，希望讓全場觀眾都能一起投入，感受搖滾的熱血能量！」</span></span></span></p>

<p><span><span><span>何超不僅與力捧的加拿大男神級新人</span>Iman<span>合唱，也是她老公陳子聰近年對抗病魔，完成所有手術後，回歸所屬團體廿四味在舞台上演出。他們興奮表示：「這次一定會很吵、很炸，大家記得儲存體力，準備一起來開派對！」</span></span></span></p>
