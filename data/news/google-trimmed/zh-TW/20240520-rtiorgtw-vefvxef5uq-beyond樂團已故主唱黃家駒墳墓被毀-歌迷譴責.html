                    <h1>Beyond樂團已故主唱黃家駒墳墓被毀 歌迷譴責</h1>
                    <div class="linkIcon">
                        <div class="dateWrap">
                            <div class="date">
                                <img src="https://www.rti.org.tw/Static/tw/image/date.png" alt="" loading="lazy"/>

                            </div>
                                    <div class="date">
                                        <span class="time"> 新聞引據：中央社</span>
                                    </div>
                                                            <div class="date">
                                    <img src="https://www.rti.org.tw/Static/tw/image/person.png" alt="" loading="lazy"/>
                                    <span class="time">

                        </div>
                        <div class="fbIcon">
                            
                                <img src="https://www.rti.org.tw/Static/tw/image/fb.svg" alt="分享到facebook" loading="lazy"/>
                            
                            
                                <img src="https://www.rti.org.tw/Static/tw/image/line.svg" alt="分享到line" loading="lazy"/>
                            
                        </div>
                    </div>

                                                                                        <div class="swiper-slide">
                                                    <div class="posImg">
                                                        <img src="https://webfile.rti.org.tw/web/rti.org.tw/tw/code/public/assets/images/2024/05/20/3bc4d966608c103b6c4ad5f77a300cc4.jpg" alt="Beyond樂團已故主唱黃家駒墓碑遭破壞。（微博）" loading="lazy"/>
                                                            <div class="source">圖片來源：其他</div>
                                                    </div>
                                                        <div class="text ivu-8">Beyond樂團已故主唱黃家駒墓碑遭破壞。（微博）</div>

                                                </div>
                                    </div>
                                    
                                </div>
                            </div>


                    <div class="text ivu-mt">
<p>香港Beyond樂團已故主唱歌手黃家駒的墳墓日前遭2名男子破壞，引發大批歌迷不滿，紛紛予以譴責。</p>

<p>事發於昨天上午，兩名15和23歲男子到黃家駒的墓碑前進行破壞，他們用汽水(可樂)潑向墓碑，又用鐵鎚砸破遺照等；墓地保安人員隨後報警求助，警方到場拘捕了這兩人。</p>

<p>綜合香港媒體報導，不少黃家駒的歌迷得知此事後，今(20日)早紛紛前往其基前悼念，其中包括遠道而來的中國大陸歌迷。</p>

<p>大陸歌迷郝先生向港媒表示，覺得事件很可悲，也令人非常痛心及不可理解。他說，「你可以不喜歡他，也可以不喜歡他的音樂，但不可以傷害他」。</p>

<p>黃家駒胞弟、Beyond成員黃家強也在網路留言，質疑破壞者在傷害別人時能夠得到什麼。</p>

<p>據報導，警方仍在調查這起事件，但外傳破壞者只是為了爭取網路點閱率、引人注意而犯案。</p>

<p>1980年代至1990年代初，Beyond在黃家駒的帶領下，成為香港著名樂隊，不少歌曲膾炙人口，比如「再見理想」、「光輝歲月」和「海闊天空」等。</p>

<p>1993年6月，Beyond應邀到日本富士電視台拍攝遊戲節目，期間黃家駒不慎滑倒，後腦著地受創，不治死亡，年僅31歲。</p>

<p>同年7月2日，黃家駒的遺體運回香港，7月4日在北角香港殯儀館設靈，翌日大殮。當靈車駛出殯儀館時，街上有數千名年輕歌迷送別，他們一度衝出馬路包圍靈車，場面頓時混亂。</p>

<p>黃家駒的遺體在九龍將軍澳華人永遠墳場下葬。</p>
