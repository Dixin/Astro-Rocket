    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">Beyond成軍37年，本月初剛宣布成員黃貫中（Paul）與葉世榮將於明年1月中在紅館舉行《2020年黃貫中．葉世榮 37 Beyond作品巡迴演唱會》，但今日（8日）中午凱藝娛樂代表Paul就退出今次演唱會發表聲明。</p>

    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">聲明中寫道「因各方就演唱會相關事宜的溝通始終未達成一致，且至今主辦方未與我司簽署任何與該演唱會相關具有法律效力的合約，至此我司及黃貫中先生決定退出此次演唱會及其一切相關活動。」Paul就事件回應謂：「公司已發出聲明作出回應，沒有其他補充了，謝謝關心！」</p>

    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">Paul跟世榮、黃家駒、黃家強於1983年組成Beyond，由地下樂隊起步，逐漸步入主流樂壇，成為華人樂壇具代表的搖滾樂隊之一。遺憾隊中靈魂入物家駒於1993年意外離世，樂隊於2004年底宣佈解散，並於2005年舉辦《Beyond The Story Live 2005》告別世界巡迴演唱會，之後各成員各自發展。時隔15年，在沒有家強的份下，Paul與世榮宣布明年1月17日至19日於紅館開騷，但最終Paul宣布退出演唱會。</p>
