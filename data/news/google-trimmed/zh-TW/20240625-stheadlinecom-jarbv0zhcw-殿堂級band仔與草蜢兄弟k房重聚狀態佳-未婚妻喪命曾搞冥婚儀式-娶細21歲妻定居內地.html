                                    <p>60歲的葉世榮是殿堂級組合Beyond的鼓手，Beyond、草蜢和太極於8、90年代已是樂壇組合的天花板。1993年因黃家駒意外去世，Beyond四子變三子，葉世榮多了參與唱歌，惟1999年底，Beyond宣佈暫時解散，各成員作個人發展。葉世榮亦正式展開其個人音樂事業，同時世界巡迴交流及演出，早年更將事業全力在內地發展。昨日（24日），蔡一智在IG貼片，分享與蔡一傑及葉世榮到卡拉OK高歌《歲月無聲》，三位昔日型男在K房對唱！</p><ad id="ad-1"/><p>相關閱讀：家駒墓被毀丨胞弟黃家強發文怒斥道德淪亡：此種不滅國亡不遠矣</p><ad id="ad-2"/><h2>蔡一智兄弟與葉世榮K房對唱：</h2><gallery-1/><p>蔡一智昨日在IG貼片，分享與老朋友葉世榮相約唱K，他寫道：「Be-蜢」，並hashtag「歲月無聲」，盡晒好交情。從影片可見蔡一智和葉世榮同是穿上黑色tee及戴上帽子，蔡一傑則穿黑色背心騷結實手臂，三人在K房High爆對唱，當時蔡一傑搭住葉世榮膊頭，赤腳踏住梳化腳踏，而蔡一智和葉世榮則換上拖鞋，三人肉緊合唱Beyond的經典金曲《歲月無聲》，十足開演唱會。</p><ad id="ad-3"/><p>久未露面的葉世榮獲網民大讚keep得好，「Still so handsome and hip」、「怎麼都沒老啊」，另外也有不少網民留意到他們換上拖鞋唱K，「人帥穿拖鞋唱歌都帥」、「同樣是KTV or招待會所，為什麼你們的比較好玩，而且還能穿拖鞋」、「感覺就很開心的聚會」。</p><ad id="ad-4"/><h2>Beyond昔日照片：</h2><gallery-2/><h2> </h2><h2>葉世榮一生兩段刻骨銘心的戀情</h2><p>葉世榮曾有兩段深刻的戀情，1995年他與圈外女友許韻珊（Cynthia）拍拖，但2002年10月1日，許韻珊在同居的愛巢沐浴時意外暴斃，年僅28歲。因兩人有結婚的計劃，所以葉世榮在女友的喪禮上舉行冥婚儀式，為她戴上結婚戒指，其喪禮亦以「葉府治喪」名義進行。其後，葉世榮推出了專輯紀念亡妻，《Remember You》是悼念「亡妻」逝世一周年。</p><ad id="ad-5"/><p>2011年12月27日，葉世榮在北京低調迎娶比自己年輕21歲的模特兒張偉鈴，婚禮甚少邀請圈中好友，就連Beyond的黃貫中、黃家強也沒有通知，婚後葉世榮與妻子定居內地，並育有一女。而2013年Beyond成立30周年，當時被傳媒問到會否開30周年演唱會，他回答時，強調指Beyond已解散，並斬釘截鐵表示不會再跟黃貫中、黃家強二人同台，因為不想予人Beyond重組感覺而又被炒作，但他絕不反對其他人開Beyond演唱會。</p><ad id="ad-6"/><p> </p><ad id="ad-7"/><p><strong>其他文章：</strong></p><ad id="ad-8"/><p>黃家駒逝世30周年丨昔日戰友撰文悼念摯友 黃貫中慨嘆：呢度仍是沙漠</p><ad id="ad-9"/><p>東張西望丨肥媽唱黃家駒歌不為出風頭 無須黃家強致歉：你唔話我已經開心</p><ad id="ad-10"/><p>黃家強好奇家駒Demo真偽 為保護哥哥令肥媽表錯情感抱歉</p><ad id="ad-11"/><p>黃家強再反擊肥媽錄音帶照片 親解盒上「有名」原因句句有骨：只有真理</p><ad id="ad-12"/><p>黃家駒60歲冥壽 黃貫中葉世榮發文悼念</p><ad id="ad-13"/>
