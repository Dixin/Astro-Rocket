                                    <p>今日（6月30日）是殿堂級樂隊Beyond靈魂人物黃家駒逝世33年。Beyond在1993年6月24日到東京富士電視台錄影遊戲節目《想做什麼就做什麼》（ウッチャンナンチャンのウリナリ!!）時，期間黃家駒不慎從高台墮下令頭部重創，經過多日在東京女子醫科大學醫院留醫搶救，最終不幸於6月30日逝世，終年31歲。</p><ad id="ad-1"/><h2>黃貫中「將我們的青春也都定格在裏面」</h2><p>Beyond兩位成員黃貫中（Paul）和葉世榮今日（30日）凌晨分別於微博留言悼念摯友，黃貫中說：「又到了630，從沒有強逼自己要去把你追憶，要去把那些遺忘呼喚回來，因為那像刀割那麼痛，可是我們的青春也都定格在裏面，記得曾經的你，曾經的我，從告別當天到現在已經是33個寒暑了。你現在在哪裏或許已經不重要了，因為你是真真正正活着的一個。」葉世榮則以「永遠懷念」憶故友。</p><ad id="ad-2"/><p>相關閱讀：黃家駒逝世31年丨黃貫中貼合照念故友：日子並沒有把事情沖淡 葉世榮四字盡訴心中情</p><ad id="ad-3"/><gallery-1/><h2>黃家駒首個紀錄片《真的相識過》已上映</h2><p>為了紀念黃家駒逝世33年，葉世榮和Beyond前經理人陳健添（Leslie）共同監製，黃家駒首個紀錄片《真的相識過》（Because of You Ka Kui）已於今年6月25日上映，電影將帶樂迷深入認識這位殿堂級樂隊Beyond的靈魂人物，回顧他傳奇的音樂旅程。影片全長129分鐘，除了包括超過30分鐘的演唱會片段，更收錄從未曝光珍貴音樂、影像及故事外，亦走訪香港、北京、台北、東京、多倫多及倫敦六地，訪問逾二十位曾在Beyond不同時期的成員、團隊工作人員與黃家駒的親密好友。當中兩位黃家駒舊女友潘先麗與林楚麒，但Beyond隊友黃家強與黃貫中未有參與受訪。</p><ad id="ad-4"/><h2>林楚麒是黃家駒唯一公開承認的女友</h2><p>林楚麒是黃家駒唯一公開承認的女友，在黃家駒離世後，曾傳出林楚麒想以「未亡人」身份出席喪3禮，但遭其家人拒絕，黃家強亦試過在微博公開力數對方：「如果不是林小姐利用家駒的未亡人身份來宣傳，我是不會說她的，只希望她不要再提家駒了，我不想家駒的歌迷被她欺騙，這是非常正常的事。」但林楚麒稱全屬誤會：「我已經不當幕前，有需要拿別人來宣傳自己嗎？偶爾跟大家說我們的往事，也衹是因為大家的苦苦哀求我才開始說的。更好笑的是也有些人覺得我是為了博眼球，想別人關注我的微博。說實話，別人關不關注我也沒得益，我有甚麼需要去博呢？」 ​​​林楚麒更曾聲稱花了10多年時間才接受黃家駒的離開：「在我心中已和家駒成為夫妻。」</p><ad id="ad-5"/><p>相關閱讀：黃家駒逝世30周年丨昔日戰友撰文悼念摯友 黃貫中慨嘆：呢度仍是沙漠</p><ad id="ad-6"/><h2><strong><span id="cke_bm_48012S" style="display: none;"> </span>林楚麒與黃家駒照片</strong>：</h2><gallery-2/>
