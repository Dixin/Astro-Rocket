				<p>香港搖滾音樂史最大規模海外演出「Dragon Rock Concert indigo at The O2 UK 2025」，搖滾女王何超（何超儀）和Beyond 的黃貫中（Paul Wong）、殿堂級嘻哈團體大懶堂（LMF）以及廿四味（24Herbs），將一同在2月27日於倫敦O2體育館開唱，引起樂迷相當大的討論。</p><p>  </p><p>  何超與海膽仔樂團近年在海外文化圈備受關注，日前他們受到英國雜誌「Fault Magazine」和美國媒體「Galore」評選為2025年必須關注的音樂人名單之一，新作「沒完沒了的完美」近期也獲得歐洲音樂文化雜誌「Kaltblut」推薦，成績斐然。</p>

<div class="inline-ads">

  <div class="udn-ads" id="ads-inline-Desktop-L">
    
  </div>
</div>

<p>  </p><p>  何超與海膽仔樂團、黃貫中、LMF 與廿四味除了各自的演出之外，也將帶來非常難得的同台畫面，何超分享：「我們這次的編排讓整體氛圍更震撼！最後還安排了一場大合唱，希望讓全場觀眾都能一起投入，感受搖滾的熱血能量！」</p><p>  </p><p>  何超也將與近期力捧的加拿大男神級新人Iman合唱，何超說：「其實我們認識很久了，還有一起寫詩的經歷，所以在音樂上的默契很好，拍子掌握得非常準確。」彩排時，她對Iman的表現驚艷不已，直言：「他的節奏感和舞蹈實力超乎想像，非常有天賦！」</p><p>  </p><p>  這次的演出更對廿四味更別具意義，因為這將是團員陳子聰在近年對抗病魔、、完成所有手術後，首次以最佳狀態全面回歸舞台。相較於2個月前在馬來西亞的演出，這次可說是廿四味的完整重聚，他們興奮表示：「這次一定會很吵、很炸，大家記得儲存體力，準備一起來開派對！」<figure class="article-content__content-image photo_center" style="--width: 1200px; --height: 1800px;">
