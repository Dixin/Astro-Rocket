ion_cantonese/about" aria-label="顯示 關於我們 個子版面" class="c-button c-button--medium c-button--default submenu-caret" type="button"><span class="visually-hidden">顯示 關於我們 個子版面</span><span><svg class="c-icon" width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true" focusable="false"><path d="M256 416C247.812 416 239.62 412.875 233.38 406.625L41.38 214.625C28.88 202.125 28.88 181.875 41.38 169.375C53.88 156.875 74.13 156.875 86.63 169.375L256 338.8L425.4 169.4C437.9 156.9 458.15 156.9 470.65 169.4C483.15 181.9 483.15 202.15 470.65 214.65L278.65 406.65C272.4 412.9 264.2 416 256 416Z"/></svg></span></button></div><div class="b-header-nav-chain__subsection-container "><ul class="b-header-nav-chain__subsection-menu" id="header_sub_section_cantonese/about"><li class="subsection-item" data-testid="nav-chain-subsection-item">聯絡我們</li><li class="subsection-item" data-testid="nav-chain-subsection-item">最新廣播頻率</li><li class="subsection-item" data-testid="nav-chain-subsection-item">聲音資料</li><li class="subsection-item" data-testid="nav-chain-subsection-item">聽眾報料</li></ul></div></li><li class="section-menu--bottom-placeholder"/></ul></div></div></div></nav></header><section role="main" tabindex="-1" class="b-rfa-right-rail-article__main"><div class="c-grid b-rfa-right-rail-article__rail-container"><div class="c-stack b-rfa-right-rail-article__main-interior-item" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><div class="c-stack b-rfa-right-rail-article__main-interior-item-1" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><h1 class="b-headline">【香港法庭】兩男認刑毁黃家駒墓　求情：有適當指引「可以教得好」</h1></div><div class="c-stack b-rfa-right-rail-article__main-interior-item-info" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><div class="b-rfa-info-chain"><time as="time" class="c-date b-date" dateTime="2024-07-16T14:50:00Z">2024.07.16</time><div class="b-rfa-info-chain__share-button"/></div></div><div class="c-stack b-rfa-right-rail-article__main-interior-item-2" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><article class="b-article-body"><p class="c-paragraph">Beyond已故主音黃家駒位於將軍澳墳場的墓碑，5月時被人腳踢、淋汽水及以鐵錘損毀，一名15歲男生及一名在旁拍片的23歲男子，事後被警方拘捕。總裁判官蘇惠德批評被告為嘩眾取寵，博取知名度而破壞知名歌手的墓地和做出侮辱性行為，形容兩人行為「相當可恥」，男生被判入更生中心，拍片男子則被判入勞教中心。</p><p class="c-paragraph">本案被告為15歲男學生及冷氣技工葉子滔（23歲），二人同承認於5月19日在將軍澳華人永遠墳場，損壞黃家駒的墓碑。首被告身穿藍色衫出庭，面帶微笑，聆訊期間不時四處張望；身穿黑衫的次被告則目無表情。</p><p class="c-paragraph">控方今甫開庭，即申請兩名被告向墓碑擁有人賠償9000元，首被告透過代表大律師表示無法負擔；次被告則指須於完成刑罰後才能繳交賠償，望法庭可寬限1個月內先賠償4500元。總裁判官蘇惠德指，基於刑罰有不確定性，指示控方可建議物主循民事索償。</p><p class="c-paragraph">辯方求情時引述報告指，二人還押期間，首被告的兒童院職員指被告行為良好、守規，相信有適當指引「可以教得好」；次被告就本性溫和，易受人影響，又指次被告已還柙約三星期，對他而言已是慘痛教訓，望法庭考慮判處非監禁式刑罰。</p><p class="c-paragraph"><strong>官指首被告受網上不良人士唆擺次被告另涉他案</strong></p><p class="c-paragraph">總裁判官判刑時指，墓地是表達對先人懷念和尊重，首被告單純為譁眾取寵、博取知名度，破壞一名已故知名歌手的墓碑及作出侮辱性行為，形容行為「相當可恥」，又指首被告現時滿16歲，法庭押後以待索取被告心理、精神及院所報告，顯示他患過度活躍、自閉症及強迫症，又指首被告受網上不良人士唆擺，去年加入「白卡聯盟」，鼓吹反政府、破壞社會安寧和滋擾他人的行為。</p><p class="c-paragraph">至於次被告，就引述勞教中心報告，指他現受僱為冷氣技工，除本案外另涉詐騙手段取得財產罪，並在獲警方保釋期間干犯本案，最終考慮後接納報告建議，分別判兩人入更生及勞教中心。</p><p class="c-paragraph">案件編號：KTCC984/2024</p><p class="c-paragraph">粵語組報道 網編：池煥衡</p></article></div></div><aside class="c-stack b-rfa-right-rail-article__main-right-rail" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><div class="c-stack b-rfa-simple-list" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><h2 class="c-heading"><div class="b-rfa-simple-list--title"><span>更多
