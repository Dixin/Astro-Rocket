				<p>大陸歌手苟偉驚傳於6日下午驟逝，享年44歲，死因並未公開。他的好友袁成傑證實死訊並發文弔唁：「那個曾經的抱著吉他唱著『海闊天空』的你，那個包著頭巾還是滿頭大汗的你，那個總是嘲笑著自己是個靈活大胖子的你，那個愛唱歌愛音樂愛Beyond的你，我會永遠記得你，苟偉老大。」</p><p>  </p><p>  苟偉在2004年參加「萊卡，我型我show」比賽獲得亞軍出道，比賽期間和張傑共同創作「北斗星的愛」，賽後拜BEYOND樂隊的黃家強為師，2010年受邀為5.12地震創作後續形象歌曲「四川依然美麗」，一直很受到歡迎。</p>
