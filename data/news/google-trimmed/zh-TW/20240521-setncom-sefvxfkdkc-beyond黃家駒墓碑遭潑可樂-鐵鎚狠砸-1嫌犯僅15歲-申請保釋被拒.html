                <p>大陸中心／梁雪婷報導</p>

<p style="text-align: center;"><img alt="香港Beyond樂隊推出多首膾炙人口的經典歌曲，主唱黃家駒卻因意外去世。（圖／翻攝自臉書）" src="https://attach.setn.com/newsimages/2021/06/30/3211217-PH.jpg" style="width:800px"/></p>

<p style="text-align:center">▲香港Beyond樂隊推出多首膾炙人口的經典歌曲，主唱黃家駒卻因意外去世。（圖／翻攝自臉書）</p>

<p>香港Beyond樂隊活躍於80、90年代，1983年成立後推出多首膾炙人口的經典歌曲，如〈真的愛你〉、〈光輝歲月〉、〈海闊天空〉等，一躍成為樂壇最具影響力的樂隊。不料主唱黃家駒1993年因意外去世，受歡迎程度大不如前，成員間亦經常屢傳出不和，最終樂隊於2005年宣布解散。然而，近日黃家駒的墓地遭到惡意破壞，引發大批網友憤怒。</p>

<p style="text-align: center;"><img alt="2名男子破壞黃家駒墓地。（圖／翻攝自微博）" src="https://attach.setn.com/newsimages/2024/05/19/4652490-PH.jpg" style="width:800px"/></p>

<p style="text-align:center">▲2名男子破壞黃家駒墓地。（圖／翻攝自微博）</p>

<div id="nonsend"><strong>更多新聞：台中捷運爆隨機砍人「英雄、英雌」曝！網大讚1招數：精準打擊</strong></div>

<p>5月19日，兩名男子拿罐裝可樂潑灑在黃家駒的墓地上。此外，二人還咬下祭拜用的花束花瓣、用奇異筆任意塗鴉黃家駒墓碑，寫下「社會破壞者」、「光頭Bob」等字眼、拿鐵鎚猛力砸毀墓碑。二人將整段犯案過程錄下並分享到網路上，影片曝光後除了受到網友關注以外，警方更以涉嫌刑事毀壞逮捕分別為15歲及23歲的涉案男子。</p>

<p>香港觀塘裁判法院今（21）日以刑事毀壞罪提審兩名男子。根據「大灣區之聲」微博報導指出，毀壞黃家駒墓碑的15歲被告申請保釋被拒，將交由兒童及青少年院看管，相關案件將於6月25日再訊。</p>

<div id="nonsend"><strong>更多新聞：中捷隨機砍人「防狼噴霧有用嗎」？網揭1重點：一定有用</strong></div>
