<div class="article-header s animated fadeInLeft-ub">
<div class="header-sticky persist-header">

<h1>黃貫中保養｜62歲黃貫中近照曝光 被指「斷崖式衰老」撞樣82歲葉振棠 樂迷慨嘆：希望時間走慢些</h1>
</div>
</div>

<ul class="article-tag sectionName">
<li>健康</li>
</ul>


</div>

</div>
</div>

</section>

<section class="ad-zone-mobile">
<div class="container">

</div>
</section>

<div class="container some-other-area persist-area">
<div class="row">

<div class="page-left col-xs-12 col-sm-12 col-md-8 col-lg-8">
<div class="author-box col-xs-12 col-sm-12 col-md-12 col-lg-12">
<div class="article-detail-share-icon">
</div>
<div class="publish-time text15 text-weight-300">發佈時間: 2026/07/02</div>

</div>



<div id="content-main" class="content-main margin-b15">
<div class="margin-b">
<div class="lazy">

<div class="content-section-region__article-details">

<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<p>現年62歲的殿堂級樂隊Beyond主音結他手黃貫中（Paul），近年主力在內地發展。日前，他與「音樂教父」羅大佑於深圳攜手舉行《天若有情1990-2026深圳時光演唱會》。黃貫中當晚在台上落力演出，接連演繹《海闊天空》、《不再猶豫》及《我是憤怒》等多首Beyond經典搖滾歌曲，帶動全場氣氛，令樂迷重溫其搖滾魅力。</p><p>同場加映：</p><p style="display:none;" articleId="4154948" showAd="true">{{hket:ul-video id="12673"}}{{/hket:ul-video}}</p><h2>黃貫中深圳開騷 零濾鏡生圖曝光</h2><p>當日，有大批樂迷前往黃貫中入住的酒店外守候，希望近距離一睹偶像風采。向來親民的黃貫中亦大方滿足粉絲要求，為樂迷現場簽名留念。事後有樂迷將近距離拍攝的「生圖」上傳至社交平台上分享，令黃貫中的最新外貌狀態隨之曝光，引起網民熱議。</p><p>從相關相片可見，黃貫中當日頭戴黑色棒球帽及太陽眼鏡，雖然遮去大半張臉，但仍難掩面容略顯疲憊。身形方面，他看起來較過往消瘦，臉頰凹陷，且即使戴上太陽眼鏡，深陷的法令紋仍然相當明顯。有網民更指出，他臉上疑似出現老人斑，顯得老態龍鍾，與昔日舞台上的搖滾形象相比，對比強烈。</p><div class="bulletpotint"><ul><li style="display:none;" caption="">{{hket:inline-image name="15656_60.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="樂隊組合Beyond成員黃貫中。（資料圖片）">{{hket:inline-image name="tomf20090724002_1024_1200.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="黃貫中日前深圳開騷，被樂迷拍攝到零濾鏡生圖。（小紅書）">{{hket:inline-image name="09161121.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="黃貫中日前深圳開騷。（小紅書）">{{hket:inline-image name="0916112124.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="有網民對黃貫中的轉變感到驚訝與惋惜，留言慨嘆歲月不饒人。（小紅書）">{{hket:inline-image name="cm_1.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="有網民對黃貫中的轉變感到驚訝與惋惜，留言慨嘆歲月不饒人。（小紅書）">{{hket:inline-image name="cm_2.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091301.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091409.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091419.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091438.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091509.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091608.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="從當晚粉絲分享的特寫鏡頭中，黃貫中臉上皺紋明顯。（小紅書）">{{hket:inline-image name="091617.png"}}{{/hket:inline-image}}</li><li style="display:none;" caption="有網民指黃貫中現時的樣貌與資深歌手葉振棠有幾分相似。（資料圖片）">{{hket:inline-image name="copy20241226543_1024_1200.jpg"}}{{/hket:inline-image}}</li></ul></div><h2>被指「斷崖式衰老」 樂迷慨嘆：希望時間走慢些</h2><p>雖然黃貫中在舞台上的狀態明顯回勇，彈結他獻唱時仍展現出搖滾巨星風采，但從當晚粉絲分享的特寫鏡頭中，其臉上顯眼的皺紋依舊暴露出清晰可見的歲月痕跡。</p><p>相片曝光後引起網絡熱話，不少網民對黃貫中的轉變感到驚訝與惋惜，紛紛留言慨嘆歲月不饒人：「阿Paul都生老人斑了」、「他自然的老去，我的青春也自然的流逝」、「paul真的老了，好遺憾沒能活在那個年代，上一次見他還是19年，轉眼又七年了」、「上次見也是19年，真的變化很大，不過還是很有精神」、「有點心酸，阿Paul是真的老了，希望時間走得慢一些吧」、「Paul這幾年老得好快。比其他兩個老得快好多」、「真成黃伯了」、「趁能看的時候多看」；甚至有網民直言，指他現時的樣貌與現年82歲的資深歌手葉振棠有幾分相似，「我以為係葉振棠」，但也有網民稱，62歲來說正常，別對明星外貌過高要求。</p><div class="bulletpotint"><ul><li style="display:none;" caption="">{{hket:inline-image name="15656_600.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="樂隊組合Beyond成員黃貫中。（資料圖片）">{{hket:inline-image name="faif20121120070_1024_1200.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="黃貫中和女兒。">{{hket:inline-image name="20_1200.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="黃貫中、朱茵和女兒。">{{hket:inline-image name="22_1200.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="黃貫中、朱茵和女兒。">{{hket:inline-image name="chuyan_07_1024_1200.jpg"}}{{/hket:inline-image}}</li></ul></div>
</div>
