                                    <p>曾因破壞Beyond主音黃家駒墳墓、猥褻女歌手炎明熹（Gigi）紙牌而惹上官司的網紅「光頭Bob」（梁俊言），今日（23日）其社交平台Threads突然發布其黑白「車頭相」，並宣布其死訊，指他「身體一直長期欠佳」，並於昨天已離世，但大批網民質疑其真實性，認為他再次「博出位」呃流量。</p><ad id="ad-1"/><h2>官方帳號宣佈光頭Bob離世</h2><p>今日下午，「光頭Bob」的Threads帳戶發出帖文，上載一張梁俊言的黑白照，相中寫有「梁俊言 2008-2026 享年18歲」字樣。帖文內容則指：「鑒於Bob仔身體狀況，一直長期欠佳加以睡眠不足 他已於昨天離開咗了我們，大家從此亦在看不到他的身影了 他的拍片生涯從今畫上句號。小編上 2026-7-23」。</p><ad id="ad-2"/><p>相關閱讀：Beyond黃家駒墓被毀｜KOL光頭Bob涉案被捕 曾自稱患有自閉症及過度活躍症</p><ad id="ad-3"/><gallery-1/><h2>光頭Bob去年10月再被捕</h2><p>曾自稱患有自閉症及過度活躍症的「光頭Bob」，過去曾有不少出位甚至違法的行徑。2024年5月，他涉嫌刑事毀壞黃家駒位於將軍澳華人永遠墳場的墳墓，被警方拘捕。2023年9月，他又在快餐店外對炎明熹的人形紙牌做出「強吻」等猥褻行為，並拍片上載網絡，聲稱「好X鍾意搞事，又唔X怕事」，引來網民炮轟。此外，他亦曾有搗亂山墳、飲廁所水等駭人聽聞的行為。而在去年10月，他亦因涉及網紅團體「白卡聯盟」的刀片信威嚇事件，與另外6人一同被捕。</p><ad id="ad-4"/><h2>網民質疑光頭Bob死訊</h2><p>對於「光頭Bob」的死訊，大部分網民都表示難以置信，認為「昨天離世，今日已有車頭相」並不合常理，網民紛紛留言質疑：「真定假？」、「聽日就拍片上嚟」、「尋日先去邊有咁X快有車頭相？」、「18歲個樣生得咁急嘅？」，不少人認為這又是他吸引注意力的伎倆。翻查資料，「光頭Bob」的Threads對上一次更新是在今年7月8日，當時他上載自己的兒童身份證，表示當天是自己18歲生日。</p><ad id="ad-5"/><p>相關閱讀：「白卡聯盟」恐嚇案｜盤點「白卡七子」出位劣行 破壞黃家駒墓最轟動</p><ad id="ad-6"/>
