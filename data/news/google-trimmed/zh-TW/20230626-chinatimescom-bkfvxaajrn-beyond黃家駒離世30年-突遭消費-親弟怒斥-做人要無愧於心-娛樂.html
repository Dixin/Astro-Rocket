                    <h1 class="article-title">Beyond黃家駒離世30年「突遭消費」 親弟怒斥：做人要無愧於心</h1>
                    
                    <div class="row align-items-center">
                        <div class="col-md">
                            
                            <div class="meta-info-wrapper">

                        <div class="article-body" itemprop="articleBody">
                                        <p>香港搖滾樂隊Beyond前成員黃家駒，1993年在日本錄製節目時從高台墜落，享年31歲，而在他離世30年之際香港無線播出特別節目《永遠光輝 黃家駒》，但香港歌手肥媽（瑪俐亞）自稱透過黃家強來電透露，是黃家駒為自己寫的歌，對此，黃家強發文反駁「關於我的都是謊言」。</p>
    


                                        
                                        <div class="ad rwd with-placeholder" data-id="mobile-middle-banner">
                                            <div class="underlay-auto-scale">
                                                <div class="clip-container">
                                                    <div class="position-container">
                                                        <div class="size-container placeholder">

                                                           
                                                            
                                                            
                                                            
                                                            
                                                           
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        
    


                                        <p>根據《香港01》報導，香港無線播出特別節目《永遠光輝 黃家駒》，播放出許多BEYOND與黃家駒生前片段，其中歌手肥媽透露去年接到黃家駒胞弟黃家強來電表示，黃家駒生前寫過一首歌送給自己，但當時沒有發布歌曲，因此希望為了紀念黃家駒，讓這首歌曲全球發行。</p>
    


                                        
    


                                        <p>此外，她提到，自己忙到錄音前兩天才聽歌「我聽了兩次去（錄音）就完成了，我覺得他都有幫我，我沒想到他會寫這首歌給我，很觸動我的心，真是我的榮幸」。</p>
    


                                        
                                        <div class="ad rwd">
                                            <div class="banner-in-read">
                                                
                                                
                                            </div>
                                        </div>
                                         
                                        
    


                                        <p>對此，黃家強今（26）日上午透過個人臉書發文怒斥該媒體報導「關於我的都是謊言，我哥哥雖然走了，我還活生生的，怎麼可以這樣不尊重人，無論是什麼途徑得到這首歌，誠實說出原因未必不能『感動』人」並在留言區強調，「是這個風雨飄搖的時代，我希望做人能無愧於心」。</p>
