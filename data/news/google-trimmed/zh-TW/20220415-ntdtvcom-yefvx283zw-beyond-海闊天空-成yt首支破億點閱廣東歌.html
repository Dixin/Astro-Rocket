					<h1>Beyond《海闊天空》成YT首支破億點閱廣東歌</h1>
									</div>
				<div class="print_date">北京時間：<span>2022-04-15 16:34</span></div>
										<div class="featured_image">
							<figure>
								<img alt="Beyond《海闊天空》成YT首支破億點閱廣東歌" src="https://i.ntdtv.com/assets/uploads/2022/04/1-crop-5-800x450.jpg" width="868" height="488"/>
							</figure>
							<span class="caption">（YT視頻截圖）</span>						</div>
										<div class="article_info">
					<div class="time">北京時間：<span>2022-04-15 16:34</span></div>
					<div class="article_share">
						<span class="fb">Facebook</span><span class="twitter">Twitter</span><span class="email">Email</span><span class="print_btn">Print</span><span class="change_size">Font Size</span><span class="gbb5">簡體</span>					</div>
				</div>
				<div class="post_content" itemprop="articleBody" id="wrap_post_content">
					<p>【新唐人北京時間2022年04月15日訊】香港樂隊Beyond的經典歌曲《海闊天空》1993年誕生，由已故主唱黃家駒作曲及填詞。MV於2011年9月在「滾石唱片」的YouTube頻道上傳，到4月12日，累計點擊量衝破1億，成為廣東歌的里程碑。（點看MV）</p>
<p>《海闊天空》是黃家駒在1993年親自作曲、填詞及主唱的歌曲。當時正值Beyond樂團成立10周年，歌詞以追求夢想為主題，承載了樂團10年來所經歷過的高低起伏，既有疲倦無奈，也有奮鬥不懈。歌詞中寫道：「多少次，迎著冷眼與嘲笑，從沒有放棄過心中的理想。一剎那恍惚，若有所失的感覺，不知不覺已變淡，心裡愛（誰明白我）。」</p>
<p>這首歌當年成為香港電台電視節目《驕陽歲月》的主題曲。而隨著世事變遷，歌曲後來被解讀為吻合了港人對香港移交主權後無奈與抗爭的心緒。</p>
<p>遺憾的是，黃家駒在完成此曲後不到2個月，即1993年6月30日在日本錄製節目時從2.7米高的舞台不慎墜下，最後重傷不治，終年31歲。</p>
<p>29年來，《海闊天空》傳遍全球。而每年的6月30日，都有大批歌迷以各種不同方式，表達對黃家駒這位殿堂級歌手的悼念。</p>
<p>2014年，港人選出了「和平占中」的主題曲，包括《海闊天空》和《光輝歲月》和《抗戰20年》，之後，3首歌曲更傳唱不衰，期間被港台藝人不斷翻唱，成為經典勵志的歌曲，也被譽為「香港的地下國歌」。</p>
<p>在2019年香港百萬「反送中」遊行隊伍中，許多市民高唱《海闊天空》等歌曲，表達不屈的意志和精神，畫面震撼全球。在當年55萬人參加的「七一」大遊行中，《海闊天空》的高亢歌聲再度在香港的上空迴響，一展港人保有的東方明珠的俠肝義膽和衷腸。</p>
