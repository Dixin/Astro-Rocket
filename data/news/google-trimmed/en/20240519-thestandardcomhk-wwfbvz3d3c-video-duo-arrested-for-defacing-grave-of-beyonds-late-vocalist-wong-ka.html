e-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_216531"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_216531"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_216531"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><iframe width="560" height="315" src="https://www.youtube.com/embed/8VXvHwJBWz4?si=kcSq2DwbO4u44X_J" frameBorder="0" allowFullScreen=""/><p>Police arrested two people who vandalized the grave of Wong Ka-kui - the rock band Beyond&#x27;s late lead vocalist - on Sunday.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>At 11.30 am, the duo - aged 15 and 23 - were found recording themselves vandalizing the legendary frontman&#x27;s grave in Tseung Kwan O Chinese Permanent Cemetery by pouring coke and licking it off, along with using foul language to insult Wong.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>In another clip, the bald vandal was seen cracking the photo on the grave with a hammer, and kissing Wong&#x27;s photo on the headstone. The man then doused himself with coke and asked the viewers to &quot;recognize&quot; him.</p><p>The bald also vandalized the grave with a marker pen and stepped on the flowers that his fans had offered to Wong.</p><p>The video and photos went viral online, leading to the anger of both netizens and fans.</p><p>Police received a report from the staff and arrested the duo in relation to the crime at the cemetery. Wong&#x27;s grave was covered with white cloth after the incident.</p><p>It was learned that the bald suspect is a YouTuber who frequently engages in outrageous actions to increase video views. He once filmed himself kissing a cardboard cutout of a female singer in front of a restaurant.</p><p>It was not the first time Wong&#x27;s grave was vandalized, with the latest incident occurring in 2019.</p><div class="image-gallery__container"><figure class="imgs-5"><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cca7f047151a04440a06e1c6987011ab/images/2024-05/20240519170902contentPhoto1.jpg"><img class="galleryimg" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cca7f047151a04440a06e1c6987011ab/images/2024-05/20240519170902contentPhoto1.jpg" srcSet="https://image.hkstandard.com.hk/f/1920p0/0x0/100/none/facbf5a950a7d732487a0b4c97c62a32/images/2024-05/20240519170902contentPhoto1.jpg 1920w,https://image.hkstandard.com.hk/f/1440p0/0x0/100/none/023152c779b245185d6fd3dcb63cbdcd/images/2024-05/20240519170902contentPhoto1.jpg 1440w,https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cca7f047151a04440a06e1c6987011ab/images/2024-05/2024
