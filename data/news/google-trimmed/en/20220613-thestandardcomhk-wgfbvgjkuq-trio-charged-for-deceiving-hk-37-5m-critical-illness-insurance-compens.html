transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/7adae5ee71edf2db247712c3fd220abc/images/2022-06/20220613145007indexPhoto.jpg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/7adae5ee71edf2db247712c3fd220abc/images/2022-06/20220613145007indexPhoto.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_191141"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_191141"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_191141"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_191141"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_191141"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>Three persons were charged by ICAC for allegedly conspiring to deceive an insurance company in applications for critical illness and medical insurance claims. The scam involved 10 insurance policies and the claims amounted to about HK$37.5 million.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>Wong Ka-keung, 43, former insurance agent of AIA International Limited (AIA); Lo Chun-kit, 44, driver; and Leung Wai-kin, 40, renovation worker, have been jointly charged with two counts of conspiracy to defraud. Wong alone further faces four similar offences and three counts of forgery.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>The defendants will appear in the Eastern Magistrates’ Courts on Tuesday for mention.</p><p>The alleged offences took place between October 2017 and December 2020. At the material time, Wong was an insurance agent of AIA who assisted Lo in taking out two insurance policies with AIA.</p><p>Two of the charges allege that Wong, Lo and Leung conspired together with other persons to defraud AIA by dishonestly falsely representing that Lo had been diagnosed with cancer and that the medical expenses incurred were for his treatments; thereby causing and inducing AIA to approve the critical illness and medical expenses claims made by Lo and to pay him compensations in accordance with the two insurance policies took out by Lo.</p><p>Four other charges allege that Wong conspired together with other persons to defraud AIA by dishonestly falsely representing that Wong and the two policyholders (the trio) had been diagnosed with different types of cancer; thereby causing and inducing AIA to approve the critical illness claims made by the trio and to pay them compensations in accordance with eight insurance policies taken out by them.</p><p>It is alleged that Wong, Lo arranged cancer patients, including Leung, to pose as relevant policyholders to undergo examinations at various clinical institutions so as to obtain the required medical certificates.</p><p>ICAC investigation revealed that Wong was the handling agent of all of the above 10 insurance policies and the policyholder of six of them. The critical illness and medical expenses claims in relation to those insurance policies amounted to about HK$37.5 million.</p><p>The remaining charges allege that Wong made three false certificates of sickness with the intention that one of the imposters in the scam should use them to induce somebody to accept them as genuine.</p><p>The ICAC calls on insurance practitioners to adhere to their pledge to integrity and urges members of public and policyholders not to take part in any insurance-related corrupt and illegal activities.</p><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/243622281545f5ebdb68d3ea7867d4ed/images/2022-06/20220613145007contentPhoto1.jpg"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/243622281545f5ebdb68d3ea7867d4ed/images/2022-06/20220613145007contentPhoto1.jpg"/></div></div></div></div></div></div><div class="article-detail-sidebar-handler__container outsideContent"><div class="general-sidebar__container article-detail"><div class="sidebar__lrec-container"><div class="ad-container LREC desktop  "/></div><div class="article-detail-topnews-section__container"><div class="homepage-general__main-section-tag">Top News</div></div></div></div></div></div></div></div><div class="article-detail__related-articles-container"><div class="article-content__container recommend-articles"><div class="article-list__container"><div class="article-list__main-section"><div class="article-list__read-more h4">Read More</div><div class="article-list__item-container-with-sidebar"><div class="article-list__item-container"><div class="grid-item-container" data-list-position="0"><div class="grid-item__img-container"><div class="grid-item__play-icon"><img alt="logo" loading="lazy" width="80" height="80" decoding="async" data-nimg="1" class="grid-item__play-icon-img invisible" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/play.6297fafb.svg"/></div><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/6948e9f234caec1ee5ccb4654989cc71/2026-09/04092026_morning.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div>
