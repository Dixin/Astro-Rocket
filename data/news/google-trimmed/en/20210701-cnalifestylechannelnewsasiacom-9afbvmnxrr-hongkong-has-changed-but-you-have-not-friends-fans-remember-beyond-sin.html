<section data-title="Content" class="block block-layout-builder block-field-blocknodearticlefield-content clearfix">
  
    

      


      <div>
              <div class="content-wrapper">
  



<div class="text">
  

            <div class="text-long"><p>Hongkong rock band Beyond is still one of Cantopop’s most loved music groups. Honestly, any karaoke sesh (remember those?) is not complete without you and your friends belting out the band’s rock classic ‘Boundless Oceans, Vast Skies' in broken Cantonese. <br><br>Beyond was formed in 1983 and was made up of lead vocalist Wong Ka Kui, his brother bassist Wong Ka Keung, guitarist Paul Wong and drummer Yip Sai Wing.<br><br>Sadly, at the height of the band's popularity, on June 30 1993, Ka Kui died after falling from a 3m-high stage during the filming of a variety show in Tokyo. He was 31.<br><br>The group continued to perform as a trio following Ka Kui’s tragic death but they eventually disbanded in 2005.<br><br>Beyond still holds a special place in the hearts of music lovers and Ka Kui lives on in the memories of many Hongkongers and remains an icon of youth culture.<br/></br></br></br></br></br></br></br></br></p></div>
      
</div>
</div>
              <div class="content-wrapper"><section class="block block- block--view-mode-default clearfix">
  
            
            
<figure class="figure block block- block--view-mode-default clearfix" data-img-id="">
            
            <img loading="lazy" src="https://dam.mediacorp.sg/image/upload/s--9O8u2Ipp--/c_fill,g_center,h_598,w_747/f_auto,q_auto/v1/tdy-migration/beyond-1-data_0.jpg?itok=ztAfg4vi" typeof="foaf:Image"/>



                    
      <figcaption class="figure__caption">
      1 of 1 This is Beyond (from left): Paul Wong, Wong Ka Keung, Wong Ka Kui &amp; Yip Sai Wing
    </figcaption>
  </figure>
  </section>
</div>
              <div class="content-wrapper">
  



<div class="text">
  

            <div class="text-long"><p>This year marks Ka Kui’s 28th death anniversary and to honour the occasion, Paul, who is married to Hongkong actress Athena Chu, took to social media to remember his pal.The 57-year-old wrote: “28 years ago, I lost a good friend. The world lost a genius. Actually, I know that you never left. You have always been here and that you are just by my side. Whenever the music comes on, you become closer to us than you ever were. Yes, you are not in heaven, you are also not in hell. You are right here in our hearts. Ka Kui, thank you for everything you have given us.”<br><br>Hongkong singer Tommy Yuen, 41, also paid tribute to Ka Kui in a Facebook post, which he titled: ‘He may have left us early, but he is forever young’. He wrote: “Today is the 28th death anniversary of my beloved Mr Wong Ka Kui. Hongkong has changed but you have not. Continue to cherish your memory, continue to revolt.”Beyond’s fans have flooded social media with tributes to Ka Kui. “The true leader of Hongkong’s rock spirit! He will live on forever!” wrote one netizen.<br><br>A Weibo post that was dedicated to the late singer was also read a whopping 30 million times— a testament that Ka Kui is still as loved in 2021 as he was in the '90s.<br><br><em>Photos: Paul Wong's Facebook, Tommy Yuen's Facebook, Weibo</em><br>
</br></br></br></br></br></br></br></p></div>
      
</div>
</div>
