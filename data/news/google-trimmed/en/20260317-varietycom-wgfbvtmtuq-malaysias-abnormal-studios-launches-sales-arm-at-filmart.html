<p class="paragraph larva // lrv-u-margin-lr-auto  lrv-a-font-body-m   ">
	The broader slate includes a curated body of Indonesian library titles across multiple genres, put together with platform and broadcast buyers in mind. The horror selection spans Rocky Soraya&#8217;s &#8220;Mata Batin&#8221; franchise and three films in the &#8220;Doll&#8221; series &mdash; &#8220;The Doll&#8221; (2016), &#8220;The Doll 2&#8221; (2017) and &#8220;Sabrina&#8221; (2018) &mdash; produced by Hitmaker Studios and Soraya Intercine Films. The Indonesian lineup also takes in the critically recognized dramas &#8220;5 cm&#8221; (2012) and &#8220;Tenggelamnya Kapal Van der Wijck&#8221; (2013); romance titles &#8220;Eiffel &hellip; I&#8217;m in Love&#8221; (2003), its 2018 sequel, and &#8220;Sunshine Becomes You&#8221; (2015); and three comedies fronted by Raditya Dika: &#8220;Single&#8221; (2015), &#8220;The Guys&#8221; (2017) and &#8220;Target&#8221; (2018).</p>



<p class="paragraph larva // lrv-u-margin-lr-auto  lrv-a-font-body-m   ">
	Among the new Southeast Asian features, Malaysian director James Lee brings &#8220;Next Stop, Somewhere,&#8221; a drama about loneliness and the experience of living away from one&#8217;s homeland, with veteran Hong Kong actor Anthony Wong in a lead role. A second Malaysian title, &#8220;KL Love Story,&#8221; is an ensemble urban drama from director Teng Bee set within Kuala Lumpur&#8217;s Chinese community, with a cast including Haoren, Ms. Puiyi, Thomas Kok, Jacqueline Tiang, Tong Bing Yu and Steve Yap.

</p>



<p class="paragraph larva // lrv-u-margin-lr-auto  lrv-a-font-body-m   ">
	From Vietnam, &#272;inh Tu&#7845;n V&#361; offers &#8220;The Hermit Crab,&#8221; a horror film in which a widower begins to suspect his wife&#8217;s death was not what it seemed.</p>



<p class="paragraph larva // lrv-u-margin-lr-auto  lrv-a-font-body-m   ">
	Abnormal Studios also arrives at FilMart with a diverse Cambodian lineup. Jimmy Henderson, who directed &#8220;Jailbreak&#8221; (2017), is in production on &#8220;What the Darkness Keeps,&#8221; an action horror in which a vacationing couple find themselves hunted to feed a mysterious creature. Other Cambodian titles include &#8220;Wedding Dress,&#8221; which relocates a Korean source story to Phnom Penh to explore love, resilience and loss; &#8220;The Ghost of Banana Tree,&#8221; a contemporary retelling of a local ghost legend; &#8220;Far Away Close to You,&#8221; a portrait of young love and paths not taken from director Mony Kann Darung; &#8220;Silent Murders,&#8221; a crime thriller set in Cambodia&#8217;s criminal underworld from filmmaker Amit Dubey; and &#8220;Her Deadly Eyes,&#8221; a revenge horror adapted from a popular Cambodian e-novel.</p>



<p class="paragraph larva // lrv-u-margin-lr-auto  lrv-a-font-body-m   ">
	The company is also bringing several projects to market in search of pre-sales, co-production and financing partners. These include &#8220;An Angel Lurks on the Streets of Kyoto,&#8221; helmed by Chen Gongming, which follows a Japanese housewife whose life is upended after a lottery win, and &#8220;Thaiwan Boyz,&#8221; an eight-episode cross-cultural LGBTQ action drama set in the world of Muay Thai. Two Taiwanese vertical drama series round out the development slate: &#8220;The Sister Who Carried Evil,&#8221; a supernatural horror series, and &#8220;Summer Serendipity,&#8221; a romantic drama.</p>



<p class="paragraph larva // lrv-u-margin-lr-auto  lrv-a-font-body-m   ">
	A subsidiary of Westec Media, Abnormal Studios has handled more than 400 titles since 2020 across Southeast Asia, Australia, New Zealand, Taiwan, Mongolia, and Nepal, releasing roughly 100 films a year. Its distribution credits include &#8220;How to Make Millions Before Grandma Dies&#8221; and &#8220;Twilight of the Warriors: Walled In.&#8221;</p>
