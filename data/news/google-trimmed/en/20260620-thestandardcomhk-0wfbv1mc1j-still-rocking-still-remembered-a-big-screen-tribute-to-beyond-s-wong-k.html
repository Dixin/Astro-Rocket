toolsbar"><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="Wong Ka-kui (leftmost) on stage in 1989." href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/86385e2402bbf97947cdc9969a0f9f8a/2026-06/89_concert_36.jpeg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/86385e2402bbf97947cdc9969a0f9f8a/2026-06/89_concert_36.jpeg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="Wong Ka-kui (leftmost) on stage in 1989." class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div><div class="article-detail__main-image-caption">Wong Ka-kui (leftmost) on stage in 1989.</div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_335152"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_335152"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_335152"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_335152"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_335152"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>More than three decades after his voice first became part of Hong Kong’s collective memory, Wong Ka-kui is returning to the big screen in his first documentary, Because of You Ka Kui.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>The film will be released in Hong Kong and Macau on June 25, offering fans a closer look at the late Beyond frontman whose music continues to resonate across generations.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p><iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen="" frameBorder="0" height="315" referrerPolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/84kd0KxSjBI?si=ytSXbE-EeVb6XQeR" title="YouTube video player" width="560"/></p><p>A defining figure in Hong Kong rock music, Wong sang with a rare mix of idealism, anger, tenderness and conviction. As the soul of Beyond, he helped shape a sound that spoke not only to love and youth, but also to freedom, struggle and the wider world.</p><p>Wong died in June 1993 following an accident in Japan. He was 31. Yet his songs have never really left the city, with classics such as Boundless Oceans, Vast Skies and Glorious Years still sung, covered and remembered by fans and musicians alike.</p><p>Because of You Ka Kui arrives in the month of his birth and on the 33rd anniversary of his passing. The 124-minute documentary traces Wong’s musical journey from his early years of perseverance to Beyond’s rise to stardom, while also showing a lesser-known side of the musician beyond the stage.</p><div class="image-gallery__container"><figure class="imgs-5"><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/dccc5d54b010612b6431763c0f53ca25/2026-06/1987_Beyond__0.jpeg"><img class="galleryimg" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/dccc5d54b010612b6431763c0f53ca25/2026-06/1987_Beyond__0.jpeg" srcSet="https://image.hkstandard.com.hk/f/1920p0/0x0/100/none/16c0d061b67328f8798d0d1 690378227a15/2026-06/Kodomo_1255_0.jpeg 640w" alt=""/><div class="img-more">+2</div></div></div><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/4f431b98924c8514dc5020729ee4fcf5/2026-06/Because_4__0.jpeg"><img class="galleryimg" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/4f431b98924c8514dc5020729ee4fcf5/2026-06/Because_4__0.jpeg" srcSet="https://image.hkstandard.com.hk/f/1920p0/0x0/100/none/0130419ce1038c18ab228e05beeca1a6/2026-06/Because_4__0.jpeg 1920w,https://image.hkstandard.com.hk/f/1440p0/0x0/100/none/5cde42a5d3944ded142cdfc0af895f1a/2026-06/Because_4__0.jpeg 1440w,https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/4f431b98924c8514dc5020729ee4fcf5/2026-06/Because_4__0.jpeg 1024w,https://image.hkstandard.com.hk/f/640p0/0x0/100/none/bd67ee853e61f375ef1a25fb7068c6b2/2026-06/Because_4__0.jpeg 640w" alt=""/></div></div><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/4cbcf711090e5edbbd8f0dfa1d8fd3bd/2026-06/W002_0.jpeg"><img class="galleryimg" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/4cbcf711090e5edbbd8f0dfa1d8fd3bd/2026-06/W002_0.jpeg" srcSet="https://image.hkstandard.com.hk/f/1920p0/0x0/100/none/73d039c91093b0b3fb0ec9e225b57f7b/2026-06/W002_0.jpeg 1920w,https://image.hkstandard.com.hk/f/1440p0/0x0/100/none/fcb48c8db7a607eb3a3502b103d3943a/2026-06/W002_0.jpeg 1440w,https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/4cbcf711090e5edbbd8f0dfa1d8fd3bd/2026-06/W002_0.jpeg 1024w,https://image.hkstandard.com.hk/f/640p0/0x0/100/none/4fd440e68b586ab7a6cd73a4b3c2c05c/2026-06/W002_0.jpeg 640w" alt=""/></div></div></figure></div><p>The documentary took more than two decades to complete, with filming conducted in Hong Kong, Beijing, Taipei, Tokyo, Toronto and London. It includes more than 30 minutes of concert footage, as well as previously unreleased music, images and stories.</p><p>For long-time fans, the film offers a chance to revisit the spirit of an artist whose work helped define an era. For younger audiences, it may serve as an introduction to a musician whose influence still lingers in Hong Kong’s cultural landscape.</p><p>Because of You Ka Kui opens in Hong Kong and Macau on June 25.<br/>Director: Rosa Pang<br/>Rating: IIB<br/>Running Time: 124mins<br/>Language: Cantonese (Chinese &amp; English Subtitles)<br/>Genre: Documentary</p><p>marco.lam@singtaonewscorp.com<br/> </p><div class="article-detail-keywords__container">BeyondWong Ka KuiBecause of You Ka KuiHong Kong movie</div><div class="article-detail__footer"><p>𝗗𝗼𝘄𝗻𝗹𝗼𝗮𝗱 𝗧𝗵𝗲 𝗦𝘁𝗮𝗻𝗱𝗮𝗿𝗱 𝗔𝗽𝗽 ↓</p>
