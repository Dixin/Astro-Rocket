<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
<p>Rock legends Yip Sai Wing&nbsp;and Paul Wong, better known as the drummer and lead guitarist of legendary Hong Kong band Beyond, will be performing in Malaysia this coming August.</p>
<p>The show is part of the duo’s ‘Impulse’ world tour, and will be held on August 24 at the Arena of Stars, Resorts World Genting.</p>
<p>The tour is a celebration of 36 years of Beyond’s music, with Yip and Paul combining to sing classic Beyond songs like&nbsp;<em>Big Land</em>,&nbsp;<em>Boundless Oceans Vast Skies</em>&nbsp;and&nbsp;<em>Glorious Years,</em>&nbsp;and many others.</p>
<p>The duo will playing them with fresh and dynamic re-arrangements, injecting new breed and soul to each song, while complemented with sophisticated stage design and sound-light effects. To date, the tour&nbsp;has toured major cities such as Shenzhen, Macau, Dalian, Suzhou and Foshan.</p>
<p>Formed in 1983, Beyond was one of the most popular rock bands in Asia during the 1980s and 1990s before the tragic death of frontman&nbsp;Wong Ka Kui in 1993 after a accident while filming a skit for a Japanese comedy show.</p>
<p><em>Yip Sai Wing (left) and Paul Wong will be playing classic Beyond songs with fresh new arrangements. Photo: Star Planet</em></p>
<p>Ka Kui had co-founded Beyond with drummer Yip Sai Wing in 1983 before they were joined by younger brother Wong Ka Keung on bass and Paul on guitar.</p>
<p>After Wong’s death, Beyond continued on as a three-piece band with a more alternative rock sound, but&nbsp;officially disbanded in 2005 after one last concert in Singapore.</p>
<p>Tickets for Yip and Paul’s concert are priced at RM200, RM320, RM440, RM560 and RM720 (VIP), and sales will commence on June 7, 11am onwards, with a 10% early bird discount for the first 1,000 tickets. &nbsp;To purchase, visit&nbsp;www.ticketcharge.com.my&nbsp;or&nbsp;www.rwgenting.com, or call the following numbers: &nbsp;03-9223 3667 (Star Planet), 03-9222 8811 (TicketCharge) and 03-2718 1118 (Genting).</p>
<p><em style="letter-spacing: -0.015em;">Source: Star 2</em></p>
