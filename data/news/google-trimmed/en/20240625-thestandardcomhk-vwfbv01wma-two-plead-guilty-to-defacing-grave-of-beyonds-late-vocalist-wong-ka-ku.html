r:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/f7d8b4c63765dd5872c38c9e6acac5df/images/2024-06/20240625173728indexPhoto.jpeg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/f7d8b4c63765dd5872c38c9e6acac5df/images/2024-06/20240625173728indexPhoto.jpeg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_217795"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_217795"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_217795"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_217795"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_217795"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>A 15-year-old student and a 23-year-old man pleaded guilty to one count of criminal damage over vandalizing the grave of late lead singer Wong Ka-kui from the local rock band Beyond with a hammer and coke.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>The defendants - an underage male student and an air-conditioning technician Yip Tsz-to, were accused of defacing Wong&#x27;s tombstone in Tseung Kwan O Chinese Permanent Cemetery on May 19.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>The duo appeared at Kwun Tong Magistrates&#x27; Court for a mention on Tuesday. </p><p>The prosecution said the male student confessed to committing the crime in an attempt to gain publicity. The defense said the 15-year-old was unpopular in school and suffered from ADHD, autism, and obsessive-compulsive disorder. </p><p>While he has no hatred for Wong, his attention seeking for hitrates became more aggressive after meeting online influencers and learning how to make films two years ago.  </p><p>The defense also noted that the other defendant, Yip, was not the mastermind behind the case. However, the Judge stated that Yip&#x27;s failure to stop the defacing acts meant his guilt was similar to that of the 15-year-old defendant.</p><p>Chief Magistrate Victor So Wai-tak asked for psychological and psychiatric reports for the male student and set sentencing for the duo for July 16.</p><p>An online video shows a shaven-headed man approaching Wong&#x27;s tombstone and splashing it with soft drinks, along with kicking it, kissing and licking the portrait and guitar engravings, and biting the petals off flowers that fans had placed there and then stomping on them.</p><p>He is also seen pouring soft drinks on himself while singing, writing and drawing random patterns with a black marker on Wong&#x27;s photo and guitar.</p><p>He later picks up a hammer and slams Wong&#x27;s photo along with using foul language to insult Wong.</p><p>According to the case, staff at the cemetery intercepted the two defendants on the spot before reporting the crime after discovering Wong Ka-kui&#x27;s grave had been vandalized on May 19. Law enforcement officers found multiple online videos showing the 15-year-old defendant pouring coke on the grave, biting the flowers, and destroying Wong&#x27;s photos with a hammer. </p><p>After a warning from police, the younger defendant said he committed the crime because he wanted to be famous, while Yip admitted to filming the scene.</p><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="File Photo" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/21b3ea99d9d62503fa7a05f4f755092c/images/2024-06/20240625173728contentPhoto1.jpeg"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/21b3ea99d9d62503fa7a05f4f755092c/images/2024-06/20240625173728contentPhoto1.jpeg" alt="File Photo" title="File Photo"/></div></div><div class="img_caption">File Photo</div></div></div></div></div><div class="article-detail-sidebar-handler__container outsideContent"><div class="general-sidebar__container article-detail"><div class="sidebar__lrec-container"><div class="ad-container LREC desktop  "/></div><div class="article-detail-topnews-section__container"><div class="homepage-general__main-section-tag">Top News</div></div></div></div></div></div></div></div><div class="article-detail__related-articles-container"><div class="article-content__container recommend-articles"><div class="article-list__container"><div class="article-list__main-section"><div class="article-list__read-more h4">Read More</div><div class="article-list__item-container-with-sidebar"><div class="article-list__item-container"><div class="grid-item-container" data-list-position="0"><div class="grid-item__img-container"><div class="grid-item__play-icon"><img alt="logo" loading="lazy" width="80" height="80" decoding="async" data-nimg="1" class="grid-item__play-icon-img invisible" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/play.6297fafb.svg"/></div><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/6948e9f234caec1ee5ccb4654989cc71/2026-09/04092026_morning.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div><div class="list-item__container line-clamp-2 h5"><div class="list-item__title h5">Morning Recap - September 4
