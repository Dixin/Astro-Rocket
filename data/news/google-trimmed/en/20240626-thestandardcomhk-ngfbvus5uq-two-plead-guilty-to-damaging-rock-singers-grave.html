s://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/df4096045aeb35197d41f32ed5717045/images/2024-06/50092949indexPhoto.jpg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/df4096045aeb35197d41f32ed5717045/images/2024-06/50092949indexPhoto.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_63914"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_63914"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_63914"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_63914"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_63914"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section">Stacy Shi<p>A 15-year-old boy and a 23-year-old man pleaded guilty to criminal damage at the Kwun Tong Magistrates&#x27; Courts for vandalizing the gravestone of Wong Ka-kui - the lead vocalist of the local rock band Beyond - last month.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div>Chief Magistrate Victor So Wai-tak adjourned the case to July 16 for sentencing, pending a series of reports for the duo, while the two would remain in custody.<p>According to the court, the 15-year-old unnamed student admitted under police caution that he vandalized the gravestone to gain public attention, and claimed he was a fan of Wong. </p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div>The student approached Yip Tsz-to, a 23-year-old air-conditioning technician, and asked him to assist in filming the vandalism.<p>Yip admitted to filming as requested by the teenager.</p>On May 19, the duo went to the Tseung Kwan O Junk Bay Chinese Permanent Cemetery, armed with an iron hammer and marker pens. <p>Video clips published online show the teenager splashing soft drinks onto the tombstone, as well as pouring the drinks on himself while singing, writing and drawing random patterns with a black marker on Wong&#x27;s photo and guitar, and slamming Wong&#x27;s photo with an iron hammer. </p>The footage also displays the teenager writing &quot;Bald Bob,&quot; &quot;Social Destroyer,&quot; and &quot;Successor of Carriage Lau&quot; in Chinese on the gravestone.<p>The defense argued that the student has been suffering from attention deficit hyperactivity disorder, autism spectrum disorder and obsessive-compulsive disorder, and was unpopular in school. </p>He learned to make videos after meeting the infamous YouTuber Lau Chun-hin, also known as &quot;Carriage Lau,&quot; and filmed the vandalism to gain more attention and satisfy his followers.<p>As for Yip, the defense argued he was not the lead person in the case, but So opined that Yip did not prevent the student from destroying the gravestone or quit, and considered the two as being equally culpable.</p>Sentencing was adjourned to July 16 to obtain rehabilitative, correctional and psychological reports for the teenager, as well as a rehabilitation report for Yip.stacy.shi@singtaonewscorp.com<div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="The damaged gravestone of Wong Ka-kui – lead vocalist of local rock band Beyond. Sing Tao" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/88508903b052f7c246263e8c6760ae4e/image
