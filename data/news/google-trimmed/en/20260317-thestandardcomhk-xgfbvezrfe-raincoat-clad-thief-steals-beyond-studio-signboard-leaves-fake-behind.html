tyle="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="Left: Real signboard; Right: Fake signboard" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/83403235d6f879e1710d340a410bd54b/2026-03/beyond_0.png"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/83403235d6f879e1710d340a410bd54b/2026-03/beyond_0.png" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="Left: Real signboard; Right: Fake signboard" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div><div class="article-detail__main-image-caption">Left: Real signboard; Right: Fake signboard</div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_326936"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_326936"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_326936"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_326936"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_326936"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>A man wearing a black raincoat was caught on CCTV stealing the signboard of the “2F Rear Studio” used by Hong Kong band Beyond, in Mong Kok.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p data-end="2737" data-start="2623">Police said the incident occurred at around 12.15am on Monday (Mar 16) at a tenement building on Sai Yee Street.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p data-end="2944" data-start="2739">The suspect, who was barefoot and dressed in a hooded raincoat and jeans, was seen walking up the stairs to the unit. He lowered his head to avoid security cameras before removing the original signboard.</p><p data-end="3048" data-start="2946">He then installed a self-made replacement, but it did not fit properly and later fell to the ground.</p><p data-end="3229" data-start="3050">The incident was discovered later that morning when staff returned to the studio and found a wooden box on the floor. The item was later confirmed to be a counterfeit signboard.</p><p data-end="3382" data-start="3231">According to a Facebook post, the case has been reported to police. CCTV footage and the wooden box have been handed over by staff for investigation.</p><p data-end="3563" data-start="3384">Police said the signboard was valued at about HK$100. The case has been classified as theft and is being handled by the Mong Kok district crime squad. No arrests have been made.</p><p data-end="3754" data-start="3565">The “2F Rear Studio” was previously used by Beyond for songwriting and rehearsals. The building has been included in a redevelopment project and is expected to be demolished.</p><div class="article-detail__footer"><p><em>Download The Standard app to stay informed with news, updates, and significant events:</em></p>
