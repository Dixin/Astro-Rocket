_toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="From left: ‘Strangelove’ inspired by the 1980s British electronic music pioneers Depeche Mode; ‘Mercury Half-Life’ inspired by the legendary rock band Queen; Hong Kong Ballet choreographer-in-residence Ricky Hu and his wife, Mai Jing-wen, weave Beyond’s classics into their new dance piece, ‘Martlet.’" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cccb614385a6e658e1d74704b48c0cd5/2026-03/123_0.jpg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cccb614385a6e658e1d74704b48c0cd5/2026-03/123_0.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="From left: ‘Strangelove’ inspired by the 1980s British electronic music pioneers Depeche Mode; ‘Mercury Half-Life’ inspired by the legendary rock band Queen; Hong Kong Ballet choreographer-in-residence Ricky Hu and his wife, Mai Jing-wen, weave Beyond’s classics into their new dance piece, ‘Martlet.’" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div><div class="article-detail__main-image-caption">From left: ‘Strangelove’ inspired by the 1980s British electronic music pioneers Depeche Mode; ‘Mercury Half-Life’ inspired by the legendary rock band Queen; Hong Kong Ballet choreographer-in-residence Ricky Hu and his wife, Mai Jing-wen, weave Beyond’s classics into their new dance piece, ‘Martlet.’</div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_325856"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_325856"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_325856"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_325856"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_325856"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>In the world of Chinese rock, the local band Beyond has united fans across Hong Kong, the mainland, Japan, and Southeast Asia. Though disbanded, Beyond&#x27;s influence has not ceased. Their timeless songs resonate through generations and continue to inspire art. Hong Kong Ballet choreographer-in-residence Ricky Hu Song-wei and his wife, Mai Jing-wen, weave Beyond&#x27;s classics into their new dance piece, &quot;Martlet,&quot; paying a heartfelt tribute to the legendary band on stage.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>&quot;Martlet&quot; will serve as the grand finale of Hong Kong Ballet&#x27;s new production &quot;Glam Rock,&quot; performed at the Hong Kong Academy for Performing Arts from April 10 to 12. At the convergence of Beyond&#x27;s passion and ballet&#x27;s grace, fans will rediscover their fond memories of the band through dance. The program will also feature two distinct contemporary dance works: &quot;Strangelove,&quot; inspired by the 1980s British electronic music pioneers Depeche Mode, and &quot;Mercury Half-Life,&quot; inspired by the legendary rock band Queen. The three works encapsulate wild rock in ballet dance, delivering an unprecedented sensory experience.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>As a local pop icon, Beyond embodies a generation of dreams, love, and perseverance: the song <em>Sky</em> is a youthful anthem symbolizing freedom and never giving up; <em>Like You</em> narrates the struggle between love and aspirations; <em>Wishing You Well</em> is Wong Ka-keung&#x27;s heartfelt tribute to his late brother Wong Ka-kui; <em>Dead Romance Part 1</em>, inspired by the famous case of the serial killer Lam Kor-wan, uses instrumental music to craft a chilling melody. Never confined to romantic themes prevalent in contemporary pop music, each track by Beyond conveys the band&#x27;s ideals and soulful rebellion.</p><p>Hong Kong Ballet revisits local and European classics by fusing Hong Kong rock classics and ballet. While &quot;Martlet&quot; draws inspiration from Beyond&#x27;s timeless hits, &quot;Strangelove&quot; – which was choreographed by Greek artist Andonis Foniadakis and premiered in Hong Kong in 2024 to standing ovations – is inspired by Depeche Mode&#x27;s sci-fi futurism and pulsating electronic rhythms. For this choreography, Foniadakis selected classics like <em>Waiting for the Night</em>, <em>People Are People</em>, and <em>Enjoy the Silence</em>.</p><p>British rock band Queen, whose style fuses progressive rock, hard rock, heavy metal, opera, and pop, is regarded as the epitome of glam rock. The iconic four-beat rhythm of their hit, <em>We Will Rock You</em>, remains etched in the memories of many. The Asian premiere of “Mercury Half-Life,” choreographed by American artist Trey McIntyre, weaves together 15 of Queen&#x27;s iconic songs – including <em>We Will Rock You</em>, <em>Bohemian Rhapsody</em>, and <em>Somebody to Love</em>. The performance also infuses these familiar songs with tap dance, inviting fans to relive Queen&#x27;s legacy through choreography.</p><div class="article-detail-keywords__container">Hong Kong BalletDanceArts FestivalCultureMusicPopRock</div><div class="article-detail__footer"><p><em>Download The Standard app to stay informed with news, updates, and significant events:</em></p>
