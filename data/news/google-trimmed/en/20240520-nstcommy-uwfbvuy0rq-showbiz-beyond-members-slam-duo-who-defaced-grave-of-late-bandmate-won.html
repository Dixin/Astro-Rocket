    <article-component :article="{&quot;processing_time&quot;:0.0030510425567626953,&quot;cached&quot;:1788477190,&quot;nid&quot;:1053423,&quot;title&quot;:&quot;#Showbiz: Beyond members slam duo who defaced grave of late bandmate Wong Ka Kui&quot;,&quot;created&quot;:1716269760,&quot;changed&quot;:1754732653,&quot;sponsored&quot;:0,&quot;highlighted&quot;:0,&quot;activate_related_bullet&quot;:false,&quot;status&quot;:1,&quot;url&quot;:&quot;https:\/\/www.nst.com.my\/lifestyle\/groove\/2024\/05\/1053423\/showbiz-beyond-members-slam-duo-who-defaced-grave-late-bandmate&quot;,&quot;internal_url&quot;:&quot;\/lifestyle\/groove\/2024\/05\/1053423\/showbiz-beyond-members-slam-duo-who-defaced-grave-late-bandmate&quot;,&quot;emotion&quot;:&quot;fear&quot;,&quot;segment&quot;:&quot;ArtsandEntertainment\/MusicandAudio\/RockMusic&quot;,&quot;sentiment&quot;:null,&quot;field_hide_related_articles&quot;:false,&quot;body&quot;:&quot;&lt;p&gt;KUALA LUMPUR: The members of legendary Hong Kong rock group Beyond have lashed out at two individuals for vandalising the grave of their late lead singer Wong Ka Kui.&lt;\/p&gt;&lt;p&gt;South China Morning Post reported recently that police arrested the duo \u2013 aged 15 and 23 \u2013 on May 19 for defacing Wong&#039;s grave with graffiti and pouring liquid over the singer&#039;s memorial plaque.&lt;\/p&gt;&lt;p&gt;A viral video also showed one of the vandals smashing the tombstone with a hammer and using foul language to insult Wong.&lt;\/p&gt;&lt;p&gt;In a Facebook post, Wong&#039;s younger brother Steve Wong Ka Keung, the former bassist of Beyond, called the suspects \&quot;shameless, pitiful and detestable\&quot;.&lt;\/p&gt;&lt;p&gt;The 59-year-old wrote: \&quot;Morality has decayed to such an extent that people are willing to travel great distances just to destroy someone&#039;s grave.&lt;\/p&gt;&lt;p&gt;\&quot;What do you hope to gain from your actions? Is hurting others really the key to your popularity?\&quot;&lt;\/p&gt;&lt;p&gt;According to reports, one of the suspects is a YouTuber who deliberately engages in outrageous actions for publicity.&lt;\/p&gt;&lt;p&gt;Paul Wong Koon Chung, the lead guitarist of the group, condemned the actions of the suspects and said karma will come for them.&lt;\/p&gt;&lt;p&gt;He added that there will be retribution for those who vandalise the resting place of the dead.&lt;\/p&gt;&lt;p&gt;\&quot;It can cause a stomach ache in small cases and death in more severe cases,\&quot; the 60-year-old said.&lt;\/p&gt;&lt;p&gt;The band&#039;s drummer and co-founder Yip Sai Wing also voiced his outrage on social media.&lt;\/p&gt;&lt;p&gt;In a Weibo post, Yip described what happened to Ka Kui&#039;s grave as \&quot;despicable\&quot; and called for the two vandals to be punished accordingly.&lt;\/p&gt;&lt;p&gt;\&quot;These two people have been arrested and must be punished by the law. Ka Kui&#039;s spirit in heaven will not forgive them!\&quot; the 60-year-old wrote.&lt;\/p&gt;&lt;p&gt;Ka Kui&#039;s grave has been defaced multiple times, with the last incident reported on July 9, 2019, when fans discovered the damage while paying their respects.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;field_youtube_smart&quot;:false,&quot;field_force_ads&quot;:[],&quot;field_article_author&quot;:{&quot;tid&quot;:16724,&quot;name&quot;:&quot;NST Entertainment&quot;,&quot;email&quot;:null,&quot;photo&quot;:null,&quot;internal_url&quot;:&quot;\/authors\/nst-entertainment&quot;},&quot;field_article_authors&quot;:[{&quot;tid&quot;:16724,&quot;name&quot;:&quot;NST Entertainment&quot;,&quot;email&quot;:null,&quot;photo&quot;:null,&quot;internal_url&quot;:&quot;\/authors\/nst-entertainment&quot;}],&quot;field_article_topic&quot;:{&quot;tid&quot;:22831,&quot;name&quot;:&quot;Groove&quot;},&quot;field_article_collection&quot;:[{&quot;tid&quot;:1043,&quot;name&quot;:&quot;Life &amp; Times&quot;}],&quot;field_tags&quot;:[{&quot;tid&quot;:287190,&quot;name&quot;:&quo
