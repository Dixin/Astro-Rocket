or:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/72bc348108de18ddcfc3cd8cb0ac2fe0/images/2024-07/20240716140435218455indexPhoto.jpg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/72bc348108de18ddcfc3cd8cb0ac2fe0/images/2024-07/20240716140435218455indexPhoto.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_218455"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_218455"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_218455"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_218455"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_218455"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>A teenager and a young man were blasted as shameful by a judge on Tuesday as they were sent to a rehabilitation center and a detention center respectively for desecrating the grave of Beyond’s lead singer Wong Ka-kui. </p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>The unidentified 15-year-old boy and Yip Tsz-to, a 23-year-old air conditioning technician, earlier pleaded guilty to a joint count of criminal damage for vandalizing the grave at Junk Bay Chinese Permanent Cemetery in Yau Tong on May 19. </p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>In sentencing, chief magistrate So Wai-tak said graves are for descendants to pay respect to their ancestors and memories and chided the defendants for their shameful and offensive behaviors in a bid to seek fame and recognition online. </p><p>In mitigation, the defense said the boy behaved while staying in a children’s home, indicating that he can be taught well. </p><p>The defense counsel added that the boy suffers from attention deficit hyperactivity disorder (ADHD), autism, and obsessive compulsive disorder. The boy wasn’t welcomed in school and started shooting online videos about two years earlier after meeting other influencers. </p><p>He mistakenly believed that he was welcomed by netizens and attempted to engage in more and more aggressive behaviors to please the internet, the counsel also said. </p><p>The lawyer continued that Yip didn’t assume a leading role in this case but magistrate So soon pointed out that Yip must shoulder the same criminal liability as the 15-year-old does since Yip didn’t withdraw from the plan or attempt to stop the boy from executing. </p><p>So also noted that Yip was previously arrested by police for obtaining property by deception and he committed this crime while on police bail. </p><p>So believes detention with a focus on discipline will better help the duo rehabilitate and sent the boy to a rehabilitation center and Yip to a detention center.</p><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cc81d2601e81ad50879c0d0e3a2dad7f/images/2024-07/20240716140435218455contentPhoto1.jpg"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/cc81d2601e81ad50879c0d0e3a2dad7f/images/2024-07/20240716140435218455contentPhoto1.jpg"/></div></div><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://
