<p>1st July 2026 – (Hong Kong) Paul Wong has issued an emotional tribute to his late bandmate Wong Ka‑kui, marking 33 years since the Beyond frontman’s untimely death.</p>



<p>Wong Ka‑kui, the legendary lead singer of the influential Hong Kong rock group, died in 1993 following an accident while recording a television programme in Japan. More than three decades on, his music and ideals continue to resonate with fans across generations.</p><div class="code-block code-block-36" style="margin: 8px 0; clear: both;">
  </div>
<div class="code-block code-block-21" style="margin: 8px 0; clear: both;">


</div>




<p>Late on 30th June, Wong shared a black‑and‑white photograph of Ka‑kui on social media, showing the singer in a denim jacket with a resolute expression. Accompanying the image was a heartfelt message reflecting on the passing of time and the enduring pain of loss.</p>



<p>In his post, Wong wrote that he had never forced himself to revisit memories of his friend, describing the recollections as “as painful as a knife”. Yet he acknowledged that their youth would forever remain bound to those moments. “From the day we said goodbye until now, 33 years have passed,” he wrote, adding that where Ka‑kui is now may no longer matter, because “you are truly one who lives on.” He signed off poignantly as “forever a fragment of myself”, a line that moved many readers.</p>



<p>The tribute prompted an outpouring of emotion online. Fans quoted lyrics from Beyond’s classic songs and expressed that the band’s legacy remains central to their lives. Some described Beyond not merely as a musical act but as a belief and a source of inspiration that has endured long after Ka‑kui’s passing.</p>



<p>The anniversary coincided with renewed attention on Wong himself. The 62‑year‑old guitarist and vocalist, who released a new album last year, recently performed in Shenzhen alongside Taiwanese singer Lo Ta‑yu. Concertgoers praised his continued energy on stage, hailing him as a rock veteran who has lost none of his passion.</p>



<p>Following the Shenzhen performance, fans gathered outside his hotel in the hope of catching a glimpse of their idol. Photographs later shared online showed Wong wearing sunglasses and a cap, dressed casually in a black T‑shirt and jeans, chatting with supporters and signing autographs.</p>



<p>However, some social media users remarked that he appeared noticeably older in the candid images, pointing to visible signs of ageing and expressing concern that the years have taken their toll. Others suggested that a demanding performance schedule and lack of rest may have left him looking fatigued.</p>



<p>Wong has long been in the public eye not only for his music but also for his personal life. He married actress Athena Chu in 2012 after a lengthy relationship, and the couple have a daughter. Despite early scepticism about their romance, they have remained together for more than two decades.</p>
