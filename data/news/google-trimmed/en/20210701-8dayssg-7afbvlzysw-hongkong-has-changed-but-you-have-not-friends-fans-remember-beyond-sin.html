<div class="text">
  

            <div class="text-long">Hongkong rock band Beyond is still one of Cantopop’s most loved music groups. Honestly, any karaoke sesh (remember those?) is not complete without you and your friends belting out the band’s rock classic ‘Boundless Oceans, Vast Skies' in broken Cantonese. <br><br>Beyond was formed in 1983 and was made up of lead vocalist Wong Ka Kui, his brother bassist Wong Ka Keung, guitarist Paul Wong and drummer Yip Sai Wing.<br><br>Sadly, at the height of the band's popularity, on June 30 1993, Ka Kui died after falling from a 3m-high stage during the filming of a variety show in Tokyo. He was 31.<br><br>The group continued to perform as a trio following Ka Kui’s tragic death but they eventually disbanded in 2005.<br><br>Beyond still holds a special place in the hearts of music lovers and Ka Kui lives on in the memories of many Hongkongers and remains an icon of youth culture.<br/></br></br></br></br></br></br></br></br></div>
