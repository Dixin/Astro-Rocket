<h1 id="title">Wax figure of HK rocker Wong Ka-kui evokes nostalgia</h1>

<dl id="guild">
<dt>By Zhang Rui</dt>

<dd><span><img src="http://images.china.cn/images1/en/2009home/t_15.gif" align="absmiddle" onclick="viewComment();"/><font id="pinglun">0</font> Comment(s)<img src="http://images.china.cn/images1/en/2009home/t_16.gif" align="absmiddle"/>Print<img src="http://images.china.cn/images1/en/2009home/t_17.gif" align="absmiddle"/> E-mail</span> China.org.cn, June 12, 2018</dd>

   <figcaption id="figures_1528772002160" class="imgComment_content" style="top: 533px; line-height: 20px; padding: 0px; font-size: 0.9em; margin: 5px auto 0px; color: gray; text-align: left; word-wrap: break-word; width: 100%;">
    Wong Ka-keung, singer, songwriter and bass player from the 1980s-90s Hong Kong rock band Beyond, poses with the wax figure of his late brother Wong Ka-kui at Madame Tussauds Beijing, June 8, 2018. [Photo / China.org.cn]
   </figcaption>
  </figure>
  <p style="margin-bottom: 15px;">A lifelike wax sculpture of iconic lead vocalist Wong Ka-kui from the Hong Kong rock band Beyond was inducted into Madame Tussauds Beijing on June 8. Wong passed away in an accident 25 years ago.&nbsp;<br/></p>
  <p style="margin-bottom: 15px;">Wong's younger brother and fellow bandmate, bass-player Wong Ka-keung attended the unveiling ceremony of the wax figure, which was made by Madame Tussauds artists according to data, footage and photos the brother had provided.</p>
  <p style="margin-bottom: 15px;">"I want to give him a hug," the teary-eyed Wong Ka-keung said upon seeing his brother's wax figure appear as the curtains opened, praising the delicate work the wax artists had done without the real person's figure to measure.</p>
  <p style="margin-bottom: 15px;">The rock band Beyond, formed in 1983, enjoyed great success in their heyday during the 1980s to early ‘90s, and is credited among the most influential bands for Chinese mainland music lovers and musicians.</p>
  <p style="margin-bottom: 15px;">But tragedy occurred in 1993 when lead singer and songwriter Wong fell from a three-meter platform while recording a popular Japanese game show in the Fuji Television studio. His head struck the ground in the fall and he died six days later from traumatic brain injuries at the age of 31.</p>
  <p style="margin-bottom: 15px;">But their music lives on, as classics including their rock anthems "Glorious Years," "Grand Land" and "Boundless Oceans, Vast Skies" are still very popular in China and around Asia today. For many Chinese people, their songs have become the soundtrack of a generation and have inspired millions of Chinese people and artists.&nbsp;</p>
  <p style="margin-bottom: 15px;">Wong's wax figure appears in his favorite red leather jacket. His brother revealed at the ceremony that he doesn't know why his brother loved the color red, but he felt the color was fitting for him now.&nbsp;</p>
  <p style="margin-bottom: 15px;">Wong Ka-keung also recalled many great memories between him and his brother, saying Wong Ka-kui was the one who inspired him to take up his own musical journey in their teenage years, though their parents were worried about their future when they played "noisy" music together at home.</p>
  <p style="margin-bottom: 15px;">He thanked Madame Tussauds Beijing for fulfilling his dream for his brother. "This is not just a remembrance of Ka-kui, but also a gift back to his mainland fans and a carrying on of Ka-kui's spirit," he said.&nbsp;</p>
  <p style="margin-bottom: 15px;">Wong's is the first figure of a musician to be inducted into a new music zone developed by Madame Tussauds Beijing, which will bring together sculptures of superstars and high-tech technologies to let fans enjoy a special experience of interacting closely with their favorite musical icons.&nbsp;</p>
  <p style="margin-bottom: 15px;">The first public exhibition of Wong's wax figure, however, did not take place at the Madame Tussauds Beijing venue. They loaned the sculpture to Wong's family for exhibition at an anniversary memorial concert, held in Beijing on June 10. There, Wong Ka-keung and other rock musicians performed for excited fans. The wax figure was returned to Madame Tussauds Beijing and placed on display there starting Monday.&nbsp;</p>
