<h1 id="title"> Rock music takes aim at China's smaller cities
</h1>

<dl id="guild">
<dt>
</dt>

<p align="center"><img align="center" alt="Music festivals have become a way for Chinese fans to access rock music. [China Daily]" border="0" height="400" hspace="0" id="22978752" md5="" sourcedescription="编辑提供的本地文件" sourcename="本地文件" src="http://images.china.cn/attachement/jpg/site1007/20130802/001aa0ba5c8513654d3f22.jpg" style="WIDTH: 600px; HEIGHT: 400px" title="Music festivals have become a way for Chinese fans to access rock music. [China Daily]" width="600"/></p>


<p align="left" style="TEXT-ALIGN: left"><font color="gray">Music festivals have become a way for Chinese fans to access rock music. [China Daily]</font></p>


<br/>
<br/>
 

<p style="MARGIN: 0px 3px 15px">As the music festival scene grows in China, organizers are looking to go beyond first-tier cities like Beijing and Shanghai because they aren't the only places people want to rock.</p>


<p style="MARGIN: 0px 3px 15px">"We have seen festivals go from purely on the coast to further into the interior," says Eric de Fontenay, owner of Music Dish. "I think there is really untapped demand in these other regions."</p>

<p style="MARGIN: 0px 3px 15px">Music Dish China, a media company with a history of sponsoring China's leading music festivals, announced recently that it will be a sponsor of the Play Rock Music Festival in Hefei, China. Hefei is the capital of China's eastern Anhui province, and Play Rock has become China's third-largest music festival in only its third year running.</p>

<p style="MARGIN: 0px 3px 15px">"One reason why I think (Play Rock) has been able to grow so fast is it faces a lot less competition," Fontenay says. "If you're a festival-goer in Beijing, you have so many festivals."</p>

<p style="MARGIN: 0px 3px 15px">Fontenay says when he was in Beijing in the spring, the Midi and Strawberry festivals - China's largest rock music festivals - were scheduled at exactly the same time in the same city, Beijing. Play Rock is the only large-scale music festival in Hefei.</p>

<p style="MARGIN: 0px 3px 15px">"You come to the point where there's so much competition that they're actually splitting the festival audience of the city," Fontenay says. "For Play Rock, there's not that problem."</p>

<p style="MARGIN: 0px 3px 15px">People are talking about second- and third-tier cities, as well as more interior and provincial regions, as the new horizon for growth in China's music festival industry.</p>

<p style="MARGIN: 0px 3px 15px">Rock Play will be held in Hefei's Three Ruins Park on Aug 23-25 with a lineup of 25 Chinese acts. In the past two festivals, a number of well-known musicians and bands have performed on the festival's two main stages, including Cui Jian, Tang Dynasty, Yip Sai Wing and MC Hotdog.</p>

<p style="MARGIN: 0px 3px 15px">This year, the festival's organizers will introduce a third stage - the Small Stone Stage - to provide student bands and new bands an opportunity to perform. During the festival, tryouts will be conducted and the winners will be able to perform on the big stage.</p>

<p style="MARGIN: 0px 3px 15px">"For me, the big difference when I go to these festivals in China is truly in the festival-goers," says Fontenay, who is based in New York. "I know a lot of people who have been to the Midi festival, but claim to not like rock."</p>

<p style="MARGIN: 0px 3px 15px">Instead, Fontenay says most Chinese go to music festivals purely for the festival experience.</p>

<p style="MARGIN: 0px 3px 15px">"But through the process, they are being introduced to other forms of music, even if it's done natively," he says.</p>

<p style="MARGIN: 0px 3px 15px">Most acts at these festivals are homegrown rock, punk and hard metal bands.</p>

<p style="MARGIN: 0px 3px 15px">Fontenay says rock music is not very present on Chinese television or radio, so accessing this kind of music mainly comes by searching the Internet or by attending festivals.</p>

<p style="MARGIN: 0px 3px 15px">"I think festivals have really led to the growth of independent music in China," Fontenay says. "Whereas radio was the big way for people to discover new music in the US in the old days, festivals in China are the big way to do it."</p>

<p style="MARGIN: 0px 3px 15px">He says he has also noticed a change in everyday youth culture.</p>

<p style="MARGIN: 0px 3px 15px">"You've got punks, you've got metal heads, you've got - oh! a diversity that I would suspect 15 years ago these people would have seemed really weird and really would have been marginalized," Fontenay says. "Today, you can walk down Gulou Road in Beijing and see (people wearing) spikes, and it's almost become acceptable."</p>

<p style="MARGIN: 0px 3px 15px">Fontenay says China's rock is still more of an underground phenomenon that he believes will change in 10-15 years.</p>

<p style="MARGIN: 0px 3px 15px">"Rock makes people individuals," he says. "You want to look different. That's the whole core of rock. At its core is a rebellion."</p>
