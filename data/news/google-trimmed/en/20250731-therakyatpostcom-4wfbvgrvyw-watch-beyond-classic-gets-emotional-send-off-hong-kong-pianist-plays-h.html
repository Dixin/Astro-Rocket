							</header>
							<p>The spontaneous performance by Anthony Sun followed his participation in the successful &#8220;re:spect Memorial Concert&#8221; series in Malaysia, which honoured the late Wong Ka Kui and Beyond&#8217;s musical legacy.</p>

<p><em>Subscribe to our FREE&nbsp;Newsletter,&nbsp;or&nbsp;Telegram&nbsp;and&nbsp;WhatsApp&nbsp;channels for the latest stories and updates.</em></p>



<hr class="wp-block-separator has-alpha-channel-opacity"/>



<p>A touching musical moment unfolded at Kuala Lumpur International Airport (KLIA) recently, when renowned Hong Kong pianist and musician Anthony Sun Wei Ming delivered an impromptu performance of Beyond&#8217;s classic &#8220;Hoi Fut Tin Hong&#8221; (海闊天空), which translates to &#8220;Under a Vast Sky&#8221; or &#8220;Boundless Oceans, Vast Skies,&#8221; before his departure.</p>





<p><span style="box-sizing: border-box; margin: 0px; padding: 0px;">Sun, who is the original keyboardist for another beloved track by Beyond, &#8220;Gau Jat Dik Zuk Zik&#8221; (舊日的足跡),  wh</span>ich translates to &#8220;Footprints of Yesterday&#8221;, was captured on video performing the iconic Beyond song at the airport terminal. </p>





<p>The performance drew crowds of onlookers who were moved by the soulful rendition of the legendary Hong Kong rock band&#8217;s most celebrated piece.</p>



<p>Social media users who shared the video footage described the musician as &#8220;a pianist whose soul is filled with musical notes, performing with his life&#8221; and expressed being &#8220;truly moved&#8221; by the performance.</p>



<p>The KLIA airport performance came following the successful conclusion of the &#8220;re:spect Memorial Concert&#8221; Malaysia leg, a tribute series honouring the late Wong Ka Kui and Beyond&#8217;s musical legacy. </p> <div class="vodus-banner" style="margin-bottom:1em;"> </div>



<iframe src="https://www.facebook.com/plugins/video.php?height=476&#038;href=https%3A%2F%2Fwww.facebook.com%2Flovebeyondmusic%2Fvideos%2F1030097972573978%2F&#038;show_text=true&#038;width=269&#038;t=0" width="269" height="591" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowFullScreen="true"/>



<h3 class="wp-block-heading">When Cantonese Rock Becomes Malaysia&#8217;s Shared Heritage</h3>



<p>The footage captured this special moment for music lovers everywhere, especially in multicultural Malaysia, where Beyond’s &#8220;Hoi Fut Tin Hong&#8221; is cherished by people of all races, including Malays, Indians and others.</p>



<p>The song, released in 1993, carries themes of hope and dreams that connect with everyone, regardless of their background or language. </p>



<p>Many non-Chinese Malaysians grew up singing along to Beyond&#8217;s music even without understanding the words, just feeling the emotion. </p>



<p>The mixed crowd at the airport demonstrates how great music unites people across cultural lines in Malaysia&#8217;s diverse society. </p>



<p>Sun&#8217;s performance became more than just music &#8211; it celebrated how Malaysia embraces cultural treasures from all communities as part of their shared heritage.<br/></p>
