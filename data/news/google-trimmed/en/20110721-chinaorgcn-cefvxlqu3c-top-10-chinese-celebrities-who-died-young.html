<h1 id="title">Top 10 Chinese celebrities who died young
</h1>

<dl id="guild">
<dt>By Zhang Junmian
</dt>

<dd><span><img src="http://images.china.cn/images1/en/2009home/t_15.gif" align="absmiddle" onclick="viewComment();"/><font id="pinglun">0</font> Comment(s)<img src="http://images.china.cn/images1/en/2009home/t_16.gif" align="absmiddle"/>Print<img src="http://images.china.cn/images1/en/2009home/t_17.gif" align="absmiddle"/> E-mail</span> China.org.cn, July 21, 2011

<div id="container_txt"><p><img id="16373405" title="" style="WIDTH: 44px; HEIGHT: 49px" src="http://images.china.cn/site1007/2011-07/21/0013729e78490f91ea9807.jpg" align="left" border="0"/>&nbsp;&nbsp; <strong>Wong Ka-Kui</strong> </p><p style="MARGIN: 0px 3px 15px">&nbsp;</p><p><br/></p><p style="MARGIN: 0px 3px 15px"><strong>Age of Death:</strong> 31</p><p style="MARGIN: 0px 3px 15px">Wong Ka-Kui (June 10, 1962-June 30, 1993) was a renowned composer, musician and singer of Chinese rock, and one of the founders of China&#39;s original music. He was also the leading vocalist, guitarist and founder of Hong Kong&#39;s rock band, Beyond. A Prodigy, Wong was the key figure of Beyond, and composed most of the songs sung by the band.</p><p style="MARGIN: 0px 3px 15px">Wong had immense influences on at least one generation in China, not only because of his music talent, but the passion on life and sense of social responsibilities conveyed through his songs. Songs such as <em>The Land, Loving You, Truly Love You, The Glorious Days </em>and <em>Under a Vast Sky</em> are the most beloved by listeners.</p><p style="MARGIN: 0px 3px 15px">When filming a game show in Japan on June 24, 1993, Wong fell head-first off a three-meter platform, and fell into a coma. Several days later, he died of internal bleeding caused by brain injuries.</p><p style="MARGIN: 0px 3px 15px"><strong>Archive:</strong></p><p style="MARGIN: 0px 3px 15px"><strong>Place of birth:</strong> Hong Kong</p><p style="MARGIN: 0px 3px 15px"><strong>Ancestry:</strong> Taishan, Guangdong</p><p style="MARGIN: 0px 3px 15px"><strong>Height:</strong> 173 cm</p><p style="MARGIN: 0px 3px 15px"><strong>Occupation:</strong> Singer, musician and actor</p><p style="MARGIN: 0px 3px 15px"><strong>Genre(s):</strong> Chinese Rock, Cantopop, Hard Rock, Pop-Rock</p><p style="MARGIN: 0px 3px 15px"><strong>Notable songs and albums:</strong> <em>Goodbye Ideals, Modern Stage, Waiting Forever, Secret Police, Yesterday&#39;s Footprints, The Real Testimony, The Fate Party, The Revolution Continues, Beyond Belief, The Ultimate Emptiness </em>and <em>Rock and Roll</em></p><p style="MARGIN: 0px 3px 15px"><strong>Years active:</strong> 1983-1993</p><div width="100%" id="autopage"><center><< a="">&nbsp;&nbsp;1&nbsp;&nbsp;2&nbsp;&nbsp;3&nbsp;&nbsp;4&nbsp;&nbsp;5&nbsp;&nbsp;6&nbsp;&nbsp;<span>7</span>&nbsp;&nbsp;8&nbsp;&nbsp;9&nbsp;&nbsp;10&nbsp;&nbsp;>&nbsp;&nbsp;</<></center> <br/><br/></div>
