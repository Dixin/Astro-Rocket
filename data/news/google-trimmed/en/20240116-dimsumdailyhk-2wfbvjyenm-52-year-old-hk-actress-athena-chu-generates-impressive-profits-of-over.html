<p>16th January 2024 – (Hong Kong)  52-year-old Hong Kong actress and singer Athena Chu has come under scrutiny for her consecutive property sales at Hong Lai Garden in Kowloon City. The total transaction value for the two units amounted to HK$16.46 million, resulting in a combined profit of HK$10.38 million. It has been revealed that one of the units was previously0 owned by Chu and jointly held with a person surnamed Yuen. This particular unit, located on the lower floor D, boasts a practical area of 735 square feet with a three-bedroom layout. Chu acquired the property in April 2002 for HK$2.88 million and held onto it for 21 years. In mid-December of last year, she sold the unit for HK$9.08 million, reflecting an average price per square foot of approximately HK$12,354. This transaction resulted in a substantial profit of HK$6.2 million, nearly doubling the property’s value.</p><div class="code-block code-block-21" style="margin: 8px 0; clear: both;">


</div>




<p>Market sources have also reported that Chu sold another unit at the same development, which was originally owned by a person surnamed Yuen and later transferred to Chu’s name in early 2020. This unit, located on the lower floor E, spans an area of 612 square feet and features a two-bedroom layout. Chu purchased the property in 2005 for HK$3.2 million and recently sold it for HK$7.38 million, translating to an average price per square foot of HK$12,059. The transaction resulted in a considerable profit of HK$4.18 million.</p><div class="code-block code-block-36" style="margin: 8px 0; clear: both;">
  </div>




<p>Athena Chu’s consecutive property sales have attracted attention due to the substantial profits she has garnered. The sale of her former residence alone yielded a profit of nearly 2.2 times the original purchase price after 21 years of ownership. Chu’s astute investment decisions and the notable appreciation in property values have contributed to her financial success in the real estate market.</p>
