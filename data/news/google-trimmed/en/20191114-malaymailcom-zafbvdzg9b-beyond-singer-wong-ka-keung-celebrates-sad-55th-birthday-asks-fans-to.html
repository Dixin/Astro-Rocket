you search for news on Google.</span>                </span>            </div>            <div class="article-info ">                                    <div class="article-byline">                        By  SYLVIA LOOI</div>                                                                    <div class="article-date">First Published: Thursday, 14 Nov 2019 1:17 PM MYT</div>                                                </div>                        <div id="iframePopup" class="popup">                <div class="popup-container">                    <button class="close-btn" type="button" onclick="closePopup()">×</button>                    <form action="https://subscribe.campaign-list.com/v1/public/campaigns/subscribe" method="POST">                        <h2 class="form-title">Subscribe to Newsletter</h2>                        <div class="name-row">                            <div class="form-group">                                <input type="text" name="first name" id="first-name" placeholder="First Name" required="">                            </input></div>                            <div class="form-group">                                <input type="text" name="last name" id="last-name" placeholder="Last Name" required="">                            </input></div>                        </div>                        <div class="form-group">                            <input type="email" name="email" id="email" placeholder="Email" required="">                        </input></div>                        <button type="submit" class="submit-btn">Subscribe</button>                        <input type="hidden" name="campaignURN" value="urn:newsletter:campaign:a1330b33-e59d-4655-aca3-80235e7570dc"/>                    </form>                </div>            </div>            <div class="main-container-article-body">                <div class="article-body">                                        <p>	KUALA LUMPUR, Nov 14 — Singer Wong Ka Keung of rock band Beyond says his 55th birthday this year is one of his worst celebrations as Hong Kong continues to battle protesters.</p><p>	In a Facebook posting on yesterday that was attached with the image of a black coloured cake, Wong urged fans not to wish him Happy Birthday but to pray for Hong Kong instead.</p><p>	“Say God bless Hong Kong instead,” he wrote in the post.</p><p>	Local Chinese language daily <em>China Press</em> reported that the last time Wong had updated his page prior was on July 31.</p><p>	At that time, the singer had written how heartbroken he was seeing Hong Kong’s current situation with an almost similar message in, ““God bless Hong Kong.”</p><p>	Fans in Hong Kong praised Wong and said he was very brave to express his feelings.</p>                </div>                                            </div>                        <div class="widget-tags">                <ul class="article-tags-list">                            <li>                           Showbiz                    </li>            </ul>            </div>                    </div>    </div></div>
