/media/menu_instagram.f588a66c.png"/><img alt="menu__icon" loading="lazy" width="160" height="160" decoding="async" data-nimg="1" class="menu__icon-img youtube" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/menu_youtube.454d42d0.png"/><img alt="menu__icon" loading="lazy" width="160" height="160" decoding="async" data-nimg="1" class="menu__icon-img flipping-version" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/menu_flipping_version.1237fa95.png"/></div></div></div></div><div class="general-wrapper  "><div class="ad-container billboard desktop  "/><div class="article-detail__all-articles-container"><div class="page-container-with-skyscraper"><div class="listing_body"><div class="article-detail__container-with-sidebar"><div class="gallery__container"><div class="article-detail__container"><div class="article-detail__top-section"><div class="article-detail__navigator"><div class="article-detail__navigator-normal">HONG KONG</div><div class="breadcrumb-arrow__container"><img alt="breadcrumb-arrow" loading="lazy" width="12" height="12" decoding="async" data-nimg="1" class="breadcrumb-arrow" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/breadcrumb_arrow_red.0f6d06e3.png"/></div><div class="article-detail__navigator-activate">NEWS</div></div><div class="article-detail__title h1"><h1>Bringing in even more refined Japanese retail shopping experience and products</h1></div><div class="article-detail__category-tools"><div class="list-item__top-section common article-detail " style="--default-color:#C90027"><div class="list-item__category common" style="border-color:#C90027;color:#C90027">NEWS</div><div class="list-item__date-time common">22-04-2022 00:00 HKT</div></div><div class="article-detail__toolsbar"><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/639eaded29e61963a8641d1a04ba735a/images/2022-04/n0001417indexPhoto.JPG"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/639eaded29e61963a8641d1a04ba735a/images/2022-04/n0001417indexPhoto.JPG" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_41003"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_41003"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_41003"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_41003"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_41003"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>The protracted pandemic has brought about paradigm shifts in how consumers shop online and offline. Unicorn Stores (HK) Limited is a member of Henderson Land Group that operates multiple premium Japanese lifestyle department store and supermarket brands, including APITA, UNY and GUU SAN. Mr. Paul Wong, Chief Executive Officer of Unicorn Stores welcomes these changes with open arms by offering high quality fresh products, grocery, household, lifestyle and innovative products and services to meet new demands.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>Hongkongers’ affection for Japanese culture and their products have been deeply ingrained through decades of favourable retail experiences as they recognize and appreciate Japan’s attention to detail and quality. Paul is grateful for local consumers’ trust, support and loyalty, and by following in the footsteps of their Japanese partners in curating Japanese quality choices, he hopes to bring along new ideas and products for Japanese lifestyle lovers and busy urbanites who intend on pursuing excellence in their purchase of daily necessities.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>The pandemic has undoubtedly brought about various changes to consumers’ living and day-to-day habits, says Paul. The retailer group hopes to connect people to admire and pursue the simplicity and refinement of Japanese culture. “Representing multiple quality brands, our customer-centric shopping space boasts the latest trending items, high-quality fresh foods and groceries,” he explains. “We invite Hongkongers, after a busy day of work, to relax and indulge in the quality products we’ve sourced directly from Japan and around the world.”</p><p>The pandemic has forced retailers to work hard to adjust to the market changes. Paul notes that many consumers who have been staying home to fight the virus, have also taken up an interest in home cooking, which has blessed Unicorn Stores with exciting opportunities to supply cookware and ingredients as consumers take up their new-found joy in the kitchen.</p><p>Online shopping has undeniably become increasingly popular, and the pandemic has provided added impetus as consumers still have to meet their family’s needs while staying indoors. The Company’s loyalty program – CU APP and online shop – APITA UNY eShop have done incredibly well to accommodate the modern consumer’s need for more personalised shopping experiences, which is in line with Japanese-style services, advocating thoughtfulness and attentiveness.</p><p>With a resoundingly positive response towards the CU APP and eshops, Paul reveals CU APP has amassed over 250,000 members and reached new customers who can further learn about their brand and services as a whole. CU APP will also remind members of upcoming promotions or member day so they can easily accumulate their membership points for more shopping privileges or rewards across different brands. APITA UNY eShop saves customers’ browsing time, increases efficiency and allows customers to shop at their own pace. </p><p>With that said, brick and mortar stores also possess unique and irreplaceable qualities which are unobtainable in online shops, as witnessed from the Well-Being Space in APITA ground floor which completed its renovations just a little over a year ago. The Well-Being Space store design mimics Japanese landscape and architecture, resulting in a trendy mix of geometric elements and natural materials, and shines a spotlight on intentional living with their lifestyle specialty goods. The Well-Being Space avoids a unilateral design and has integrated lighting and ensures practicality of spatial usage. “The brand is shifting towards sustainable green living, and customers can look forward to seeing more organic and eco-friendly products within our store,” Paul adds.</p><p>In order to extend the superb shopping experience, the renovation of the ground floor of APITA at Cityplaza has just commenced after serving customers for over 30 years. A fresh debut is scheduled for the third quarter of 2022. The new APITA will add elements such as Japanese dining concepts, artistic trends, innovation and technology and Japanese ACG, to provide more diversified product choices for customers.</p><p>Paul adds that with the upcoming plans for the supermarket’s basement section, customers can expect some very appealing dine-in experiences and pop-up cuisines within APITA and its supermarket. “We hope the new store design will blur the lines between the sections in our stores, and help customers discover new and pleasant experiences,” he says. </p><p>“UNY and APITA are committed to providing memorable shopping experiences, paired with our well-rounded customer services, to satisfy every customer’s overall needs and to courteously pair them with the products of their dreams,” Paul concludes. “We’re planning to expand our services to the New Territories which is a future hub of growth and branch out new products and experiences to nearby residents. It will certainly be an exciting development for all to look forward to!”</p><p> </p><p><strong>Unicorn Stores</strong></p><p>Website: https://apitauny.com.hk/</p><div class="image-gallery__container"><figure class="imgs-5"><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/f02559bae063976adf115db496294a1f/images/2022-04/n0001417contentPhoto1.JPG"><img class="galleryimg" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/f02559bae063976adf115db496294a1f/images/2022-04/n0001417contentPhoto1.JPG" srcSet="https://image.hkstandard.com.hk/f/1920p0/0x0/100/none/d4b61ec24dee46e2e43b7a7e5b1b8119/images/2022-04/n0001417contentPhoto1.JPG 1920w,https://image.hkstandard.com.hk/f/1440p0/0x0/100/none/18b185d1fdae09a46ba95b2e78158134/images/2022-04/n0001417contentPhoto1.JPG 1440w,https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/f02559bae063976adf115db496294a1f/images/2022-04/n0001417contentPhoto1.JPG 1024w,https://image.hkstandard.com.hk/f/640p0/0x0/100/none/1ae88f2d9d9bfe70077a4403ac28459c/images/2022-04/n0001417contentPhoto1.JPG 640w" alt=""/></div></div><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="Mr. Paul Wong, CEO of Unicorn Stores" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/73d58a53f2c273b7f4e28cc7efb26d4a/images/2022-04/n0001417contentPhoto
