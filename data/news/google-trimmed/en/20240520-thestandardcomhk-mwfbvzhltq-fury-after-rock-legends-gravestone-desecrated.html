//www.thestandard.com.hk/_next/static/media/fontsize_increase.f9ae48f6.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/fontsize_decrease.c19f90ee.png"/></div><div class="article-detail__toolbar"><img alt="logo" loading="lazy" width="112" height="112" decoding="async" data-nimg="1" class="article-detail__toolbar-icon" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/printer.a8900506.png"/></div></div></div></div><div class="article-detail__main-image"><div class="article-detail__gallery-content-key-image"><div class="gallery__key-image"><div class="img-block"><div class="img-div gallery__key-image-inner-image" data-fancybox="gallery" data-caption="" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/bb170106bb669501ce31dcfc14df333f/images/2024-05/50091986indexPhoto.jpg"><div class="general-img__container"><img src="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/bb170106bb669501ce31dcfc14df333f/images/2024-05/50091986indexPhoto.jpg" loading="lazy" sizes="(min-width: 40em) calc(.333 * (100vw - 40em)),100vw" alt="" class="general-img__image-rendering-optimize-contrast"/></div></div></div></div></div></div></div><div class="article-detail__main-section"><div class="article-detail__share-icons"><button class="article-detail__share-icon" id="share-whatsapp_62891"><img alt="logo" loading="lazy" width="111" height="111" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/whatsapp.2df4fc9c.png"/></button><button class="article-detail__share-icon" id="share-facebook_62891"><img alt="logo" loading="lazy" width="56" height="107" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/facebook.4effb9cb.png"/></button><button class="article-detail__share-icon" id="share-x_62891"><img alt="logo" loading="lazy" width="86" height="78" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/x.479884fe.png"/></button><button class="article-detail__share-icon" id="share-email_62891"><img alt="logo" loading="lazy" width="117" height="88" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/email.22f696fe.png"/></button><button class="article-detail__share-icon" id="share-link_62891"><img alt="logo" loading="lazy" width="102" height="90" decoding="async" data-nimg="1" class="article-detail__share-icon-image" style="color:transparent" src="https://www.thestandard.com.hk/_next/static/media/link.0fdd3fbe.png"/></button></div><div class="article-detail__main-content fz-normal"><div class="article-detail__text-section"><p>Two men have been arrested on suspicion of criminal damage after the gravestone of Wong Ka-kui, lead vocalist of legendary local rock band Beyond, was vandalized at Junk Bay Chinese Permanent Cemetery.</p><div class="ad-1"><div class="ad-container interscroller desktop  "><div class="interscroller__container"><div class="interscroller-ad">ADVERTISEMENT</div><div class="interscroller-wrapper"><div class="interscroller-bg-wrapper"><div class="interscroller-bg"><div class="interscroller-ad-wrapper"/></div></div></div><div class="interscroller-continue">SCROLL TO CONTINUE WITH CONTENT</div></div></div></div><p>A 15-year-old YouTuber and a 23-year-old air-conditioning mechanic, who is said to have filmed the teenager, were being held for questioning following the incident yesterday.</p><div class="ad-2"><div class="ad-container inarticlebanner desktop  "/></div><p>An online video shows a shaven head man approaching Wong&#x27;s tombstone and singing one of Beyond&#x27;s best known songs, Under a Vast Sky.</p><p>He is seen splashing soft drinks on the tombstone, kicking it, kissing and licking the portrait and guitar engravings, and biting petals off flowers that fans placed on the grave and then stomping on them.</p><p>He is also seen pouring soft drinks on himself while singing, writing and drawing random patterns with a black marker on Wong&#x27;s photo and guitar.</p><p>He later picks up an iron hammer, slams Wong&#x27;s photo and yells at the camera: &quot;Film me, remember me, the social disrupter, who everyone looks down on. Can&#x27;t you see it is me who is [doing the damage]?&quot;</p><p>Staff at the cemetery later discovered the vandalized gravestone and called police, who arrested the pair. Officers collected evidence at the scene, where a white tarp could be seen covering Wong&#x27;s gravestone.</p><p>A tourist, Su, who came from Sichuan to pray for Wong, could not hold back her tears as she saw the tarp over the gravestone.</p><p>&quot;I came all the way from Sichuan, but [this is what I see] when I arrived,&quot; she said, adding that she had been Wong&#x27;s fan for years and had always wanted to visit his grave.</p><p>&quot;I can&#x27;t believe his tombstone would be damaged on my first visit to Hong Kong. I am so sad. Why is there someone who&#x27;s this bad still on Earth?&quot;</p><p>A local fan, Au, said it was also his first time to visit the grave.</p><p>&quot;I am unhappy and I really wanted to cry after seeing my idol&#x27;s grave being damaged. I think these people should definitely be condemned,&quot; Au said.</p><p>Wong&#x27;s three former bandmates were furious. Bassist Wong Ka-keung, the vocalist&#x27;s younger brother, said: &quot;This is how low morality has sunk. What can you get from damaging others&#x27; graves? I don&#x27;t know how many bast**** like him still exist.&quot;</p><p>Vandals should be punished, guitarist Paul Wong Koon-chung said, adding: &quot;The weakest consequence would be a stomachache, and the heaviest would see them die.&quot;</p><p>Drummer Yip Sai-wing took to Weibo saying: &quot;What they did at Ka-kui&#x27;s grave was despicable! They will not even be spared in heaven.&quot;</p><p>Sources said the teen YouTuber named &quot;Bald Bob,&quot; is believed to be suffering from autism spectrum disorder and hyperactivity disorder, but this could not be verified.</p><p>He usually posts videos of himself committing anti-social acts, including licking a toilet seat, drinking public toilet water, or even drinking seawater.</p><p>A preliminary investigation suggested the alleged vandalism was committed for click-baiting and to catch people&#x27;s attention.</p><p>It was not the first alleged visit by the YouTuber to the grave site. Last August, a video showed the teen calling Wong &quot;a piece of garbage,&quot; and saying that one of the band&#x27;s popular songs was &quot;terrible.&quot;</p><p>A month later, he was seen kissing an image of singer Gigi Yim Ming-hay on the lips and private parts outside a fast food restaurant.</p><p>He was also previously arrested for causing public disorder in a Mong Kok retail shop.</p><p>In 1993, Wong fell off a narrow and slippery stage during a live television game show in Japan and landed head first to the ground, sustaining serious head injuries and fell into a coma. He was pronounced dead six days later at the Tokyo Women&#x27;s Medical University Hospital.</p><p>michael.shum@singtaonewscorp.com</p><div class="image-gallery__container"><figure class="imgs-5"><div class="img-block"><div class="img-div" data-fancybox="gallery" data-caption="Screengrabs show Wong Ka-kui&#x27;s gravestone being vandalized as a fan from the mainland weeps on her first visit to pray for her idol, who died in 1993.SING TAO" href="https://image.hkstandard.com.hk/f/1024p0/0x0/100/none/9f251003fe41a8eea2e8cafb2f9b48ab/images/2024-05/50091986contentPhoto1.jpg"><img clas
