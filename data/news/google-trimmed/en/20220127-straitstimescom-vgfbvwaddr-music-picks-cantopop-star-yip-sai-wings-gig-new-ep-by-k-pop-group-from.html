t-secondary-captions-baseline-regular" data-testid="typography-test-id">Sign up now: Get ST&#x27;s newsletters delivered to your inbox</p></div></div><div class="hero-media-wrapper" data-testid="article-hero-media-test-id"><div class="hero-media"><div class="flex flex-col items-start relative w-full aspect-landscape"><picture><source media="(max-width: 480px)" srcSet="https://static1.straitstimes.com.sg/s3fs-public/articles/2022/01/27/md_fish_27012022.jpg?VersionId=PNRNToIrZb_4iD3.CEtoZZUXPJCFpxK9&amp;w=480"/><source media="(min-width: 481px) and (max-width: 720px)" srcSet="https://static1.straitstimes.com.sg/s3fs-public/articles/2022/01/27/md_fish_27012022.jpg?VersionId=PNRNToIrZb_4iD3.CEtoZZUXPJCFpxK9&amp;w=720"/><source media="(min-width: 721px and max-width: 3999px)" srcSet="https://static1.straitstimes.com.sg/s3fs-public/articles/2022/01/27/md_fish_27012022.jpg?VersionId=PNRNToIrZb_4iD3.CEtoZZUXPJCFpxK9&amp;w=900"/><source media="(min-width: 4000px)" srcSet="https://static1.straitstimes.com.sg/s3fs-public/articles/2022/01/27/md_fish_27012022.jpg?VersionId=PNRNToIrZb_4iD3.CEtoZZUXPJCFpxK9"/><img src="https://static1.straitstimes.com.sg/s3fs-public/articles/2022/01/27/md_fish_27012022.jpg?VersionId=PNRNToIrZb_4iD3.CEtoZZUXPJCFpxK9" alt="" class="aspect-landscape flex items-start shrink-0 object-cover" data-testid="hero-media-content-test-id" loading="eager"/></picture></div></div><div class="hero-media-caption"><p class="text-secondary inline col-start-4 col-end-21 break-words font-secondary-captions-baseline-regular" data-testid="typography-test-id">Malaysian singer Fish Leong performing during a New Year concert in Taipei on Dec 31, 2021.</p><p class="text-tertiary inline col-start-4 col-end-21 break-words font-secondary-captions-baseline-regular" data-testid="typography-test-id"> PHOTO: FISH LEONG/FACEBOOK</p></div></div><div class="article-page-grid flex flex-wrap flex-row tablet:py-12 justify-between item-start tablet:items-center"><div class="flex flex-nowrap items-center gap-04" data-testid="masthead-author-byline-test-id"><div class="items-center content-center"><div class="gap-16 flex items-center justify-between select-none py-08"><p class="font-eyebrow-lg-bold link-default flex-1 break-words" data-testid="paragraph-test-id">Benson Ang</p><button data-testid="myst-article-byline-test-id" class="bg-none interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled button-small !p-00" aria-label="button for actions/icon-actions-add-outlined"><template id="B:3"/></button></div></div></div></div><div class="social-timestamp-wrapper"><div class="flex flex-col gap-04 py-16 items-start justify-center"><div class="timestamp-element" data-testid="timestamp-test-id"><p class="font-eyebrow-baseline-regular flex flex-nowrap text-tertiary" data-testid="paragraph-test-id">Published Jan 27, 2022, 01:00 PM</p></div></div><div class="flex gap-08 py-16 h-full items-start" data-testid="social-share-test-id"><button data-testid="social-telegram-button-test-id" class="button-active border-strong border interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled default py-08 px-12 h-full min-h-40 hidden desktop:block" aria-label="button for social/icon-social-telegram"><template id="B:4"/></button><button data-testid="social-facebook-button-test-id" class="button-active border-strong border interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled default py-08 px-12 h-full min-h-40 hidden desktop:block" aria-label="button for social/icon-social-facebook"><template id="B:5"/></button><button data-testid="social-share-unified-button-test-id" class="button-active border-strong border interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled default py-08 px-12 h-full min-h-40 block desktop:hidden" aria-label="button for actions/icon-actions-share-outlined"><template id="B:6"/></button><div class="block self-stretch relative min-h-40 print:hidden" data-testid="dropdown-test-id"><div role="button" tabindex="0" class="h-full" data-testid="dropdown-trigger-wrapper-test-id"><button data-testid="social-toggle-button-test-id" class="button-active border-strong border interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled default dropdown-trigger hidden desktop:block" aria-label="button for navigation/icon-nav-more-horizontal"><template id="B:7"/></button></div></div></div></div><div class="article-page-grid flex flex-col gap-16 tablet:gap-24 pt-08 pb-16"><div class="article-actions-scroll scrolled-right"><div class="flex flex-row items-start gap-08 overflow-x-auto tablet:overflow-hidden no-scrollbar"><div class="flex shrink-0 print:hidden" data-testid="google-preferred-source-link-test-id"><button data-testid="preferred-source-inner-button-test-id" class="button-active border-strong border interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled button-small preferred-source-button" aria-label="button for Set as preferred source"><template id="B:8"/><span class="font-secondary-label-md-semibold">Set as preferred source</span></button></div></div></div></div><div class="article-page-grid flex flex-col gap-16 pb-12 empty:hidden"/><div class="storyline-wrapper pt-16 default"><div class="archival-wrapper"><h2>Taipei New Year Concert</h2></div><div class="archival-wrapper">To usher in the new year, a star-studded show was held in the Xinyi district of Taiwan's capital, and streamed live on the Taipei City Government's YouTube channel.</div><div class="archival-wrapper">Among the highlights were performances by Malaysian singer Fish Leong, who sang her 2019 ballad Slow-to-cool-down, and Taiwanese indie pop group Wonfu, who got the audience pumping with the upbeat Hokkien song Hello Everybody.</div><div class="article-ads-wrapper"><div class="ad-wrapper min-h-249 article-ads"/></div><div class="archival-wrapper">Veteran entertainer Tiger Huang sang Let's Dance and As Time Goes On, while singer-songwriter Lala Hsu took it slow with the reflective Prototype. Other acts which took the stage included Taiwanese bands Accusefive and EggPlantEgg.</div><div class="archival-wrapper">Watch the show here:</div><div class="inline-embed-container print:hidden" data-testid="social-media-embed-test-id"><iframe class="responsive-iframe-base youtube aspect-video youtube-embed" title="youtube embed" scrolling="no" src="https://www.youtube.com/embed/SSEOi7bK4eE?enablejsapi=1" allowFullScreen="" allow="accelerometer;falseclipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share;" loading="eager" data-testid="responsiveIframe"/></div><div class="archival-wrapper"><h2>Yip Sai Wing You And Me Concert in Singapore</h2></div><div class="article-ads-wrapper"><div class="ad-wrapper min-h-249 article-ads"/></div><div class="archival-wrapper">Cantopop singer Yip Sai Wing is known as a founding member, drummer and singer-songwriter of the Hong Kong rock band Beyond.</div><div class="archival-wrapper">From 1986 to 1999, the 58-year-old had contracts with well-known record labels such as Rock Records. Since 2001, he has been operating as an independent singer-songwriter. Among his solo works are the songs Beautiful Time Machine, Leaves Turned Red and Mercy.</div><div class="archival-wrapper">He has also dabbled in acting, appearing in movies such as Happy Ghost IV (1990) and Bust Family (2004).</div><div class="article-ads-wrapper"><div class="ad-wrapper min-h-249 article-ads"/></div><div class="archival-wrapper"><strong>Where:</strong> Resorts World Ballroom, Resorts World Convention Centre, 8 Sentosa Gateway<br/>
<strong>When:</strong> Feb 4 to 6, 8pm<br/>
<strong>Admission:</strong> From $68 via bookmyshow's website</div><div class="archival-wrapper"><h2>Pop</h2>

3 stars</strong></div><div class="archival-wrapper">Since their debut in 2018, nine-member South Korean girl group fromis_9 have been known for their bright, colourful outfits and eye-catching dance moves. Their fourth EP, the five-song Midnight Guest, continues to showcase their fun and frothy side.</div><div class="archival-wrapper">Opening number Escape Room has a seductive R&amp;B bass line, while the soothing Love Is Around is great for a late-night listen. The second track DM is a straightforward love song, but what is striking is its music video's multi-layered storytelling, which uses flowers as a motif.</div><div class="archival-wrapper">But a more coherent theme throughout would have made the album stronger.</div></div><div class="article-page-grid w-full flex flex-col pb-32" data-testid="tags-test-id"><div data-testid="content-block-header" class="flex flex-col p-16 desktop:px-00 content-block-header w-full px-00"><div class="flex items-center"><h6 class="font-header-xxsalt-bold break-words h-22 desktop:h-24 pt-3" data-testid="heading-test-id">See more on</h6></div></div><div class="flex w-full flex-wrap gap-16"><p class="font-secondary-label-md-semibold" data-testid="topic-tag-content-test-id">Gigs Picks</p><p class="font-secondary-label-md-semibold" data-testid="topic-tag-content-test-id">Music</p><p class="font-secondary-label-md-semibold" data-testid="topic-tag-content-test-id">SG Go Where</p></div></div><div class="article-page-grid w-full gap-08 py-16 h-full items-start hidden desktop:flex" data-testid="social-share-test-id"><button data-testid="social-telegram-button-test-id" class="button-active border-strong border interactive-button text-primary disabled:layer-disabled hover:disabled:layer-disabled default py-08 px-12 h-full min-h-40 hidden desktop:block" aria-label="button for social/icon-social-telegram"><template id="B:9"/></button><button data-testid="social-facebook-button-test-id" class="button-active border-strong border interactive-butto
