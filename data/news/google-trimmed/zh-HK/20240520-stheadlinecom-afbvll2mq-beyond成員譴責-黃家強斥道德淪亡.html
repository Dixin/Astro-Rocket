                                    <p>　　黃家駒長眠之地遭瘋狂破壞，猶如被鞭屍，Beyond成員葉世榮和黃貫中均譴責破壞者，昨日首次來港致祭的內地女歌迷看到偶像墳墓被破壞感到無比傷痛，跪在墳前數小時哭訴：「善有善報、惡有惡報、不是不報、時候未到！」內地社交媒體「小紅書」亦有不少帖文轉載相關新聞，大批歌迷齊聲譴責破壞者。<br/>　　Beyond鼓手葉世榮得知事件發生後，在微博發文譴責：「今天發生在家駒墳墓的事情實在可惡，這2個人已經被逮捕，必須受到法律的制裁，家駒在天之靈也不會放過他們！」<br/>  女歌迷睹慘況  心碎哭斷腸<br/>　　另一成員黃貫中得知黃家駒墳墓所發生的事亦顯得相當憤怒，他接受傳媒訪問時第一句便追問：「拉咗未？」他又狠批肆事者的行為，「小則肚痛，大則橫死。」同是Beyond成員的黃家駒胞弟黃家強身處外地，昨獲悉後在Facebook發文：「道德淪亡到這個地步，千里迢迢來摧毁別人的墓園，你所做的一切會得到甚麼，傷害別人真的會是你的流量密碼嗎？」<br/>　　昨日有多名歌迷前往拜祭，目擊偶像墳墓被破壞後的情況，當中就讀小學時便喜歡家駒、來自四川的姓蘇女歌迷，沒料抵達發現偶像墳墓被毀，只好手持鮮花跪地致祭，大哭斥責破壞者：「來到這裏就看到這個樣子，太心痛了！我不知道為甚麼會有那麼惡的人！黃家駒那麼好的人！」她強調善有善報、惡有惡報，不報只是時候未到，之後不發一言，一直跪地，直至下午5時才起來，離開時說了一句「再見家駒」。<br/>　　家駒胞弟家強的助手劉先生昨到場了解時表示，家駒一直宣揚愛與和平，形容破壞者「行為好唔應該」，相信每位愛Beyond及家駒的朋友對事件感到憤怒，希望警方及相關部門嚴肅跟進。<br/>內地粉絲痛心  「家駒音樂影響人生」<br/>　　來自安徽的儲先生亦是第一次來港拜祭，他指就讀中學時已喜歡家駒，至今逾20年，認為其音樂影響了其人生，包括創業至今的種種挑戰：「是一種傳遞、一種永不放棄的精神、也可能是一種獅子山精神。」他抵達後得悉破壞事件後直言「很遺憾，很痛心，我不理解」。<br/>　　香港歌迷區先生表示，就讀小學五年級之際已喜歡家駒，昨首度到墳墓致祭，詎料看到如此一幕：「唔開心，有啲想喊！」本港不少網民和內地社交媒體「小紅書」亦紛紛轉載相關新聞，一眾歌迷齊聲譴責破壞者，也有多名內地歌迷稱會於日內來港拜祭家駒。</p><ad id="ad-1"/>
