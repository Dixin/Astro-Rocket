<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<p>由Beyond成員葉世榮發起的《家駒…愛心延續慈善演唱會2016》，將於已故主音黃家駒在6月10日54歲生忌當日，假灣仔會展舉行，昨日記招上，世榮與黃貫中（Paul）及主辦單位代表也有出席，現場更首播由世榮作曲的主題曲《延續》MV，令人懷緬家駒的軼事。</p>
<p>葉世榮為這個演唱會，已花了不少心力去籌備，他表示有感去年一位導演朋友給他看了家駒慈善音樂會的海報後，令他覺得每年都有人以家駒名義籌款，卻從來無人知道款項何去何從，細想下決定以身作則搞個認真及有影響力的紀念音樂會，將家駒的愛心延續落去。他透露原先計劃在紅館舉行，可惜檔期關係，最後改在會展。</p>
<p>接受訪問時，世榮表示第一個要多謝阿Paul：「當我有呢個諗法就第一時間搵佢，佢好支持，當然我都有搵家強（黃家強），佢都好支持，但佢真係無時間，不過唔緊要，隨緣啦。（欠佢一個覺得可惜？）當然啦，今次演出唔係Beyond重組，而係想做一件有意義的事。</p>
<p><b>獨欠家強感遺憾</b></p>
<p>問到家強是否因為與阿Paul不和才避席？他解釋：「大家都見到過去呢年我做嘅嘢話，家強嘅態度已經軟化，無奈佢有嘢做，唔緊要，今年成功嘅話，下年我會繼續搞，希望籌到嘅款項一年比一年多。」他希望能籌到過百萬善款，來年再舉行的話，也希望在紅館舉行，畢竟這是家駒及Beyond踏足過的地方，特別有意義。至於嘉賓方面，世榮透露暫定有林曉培、太極樂隊、周啟生、鄧紫棋等，亦會讓他們挑選歌曲。</p>
<p>撰文：Pauline </p>

<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<p>陶大宇前日在微博上載與吳啟華、張兆輝拍演唱會海報的照片，原來三位「師奶殺手」將於11月中合體假佛山開騷。大宇接受本報訪問，豪言必唱「飲歌」《倒轉地球》外，又透露三人不止唱歌咁簡單︰「我哋有遊戲、互動同小品劇，開開心心做場騷！」</p>
<p>三位90年代無綫當家小生，今年初重返無綫任《萬千星輝頒獎典禮2022》頒獎嘉賓，陶大宇、吳啟華及張兆輝的出現勾起觀眾集體回憶，重提他們的角色，包括《刑事偵緝檔案》張大勇、《倚天屠龍記》的張無忌及楊逍；不少網民期待他們合作拍劇，可惜至今未有聲氣。不過，近日他們合體拍攝海報，預告在11月中假佛山舉行演唱會。前日，大宇在微博上載他們拍攝演唱會海報的花絮，只見三人穿上黑西裝，打扮型到爆。內地網民紛紛留言表示準備搶飛，又指「好期待大宇哥的首場演唱會」、「期待倒轉地球」、「建議全國巡演」。</p>
<p><b>嘆幾十歲人拒騷肌</b></p>
<p>大宇接受本報訪問時，透露三人屆時有不少表演，「我哋又唔係完完全全淨係唱歌，當中有遊戲、互動同小品劇，開開心心做場騷。因為大家都認識咗幾十年，又拍咗咁多經典港劇，想搵個機會當係紀念！」問到三人有甚麼開心回憶？大宇稱︰「以前大家都唔成熟，但又要扮大個，做一啲有型嘅角色。（到時會否騷肌？）大家都幾十歲，而且又唔係真正歌星，唔會騷肌喇！」</p>
<p>談及他近年因翻唱劉德華金曲《倒轉地球》而成為網民寵兒，屆時可會再次演繹這首金曲？大宇笑說︰「一定走唔甩啦，到時我哋會唱四、五首歌，仲有啲合唱歌。」大宇早前在華仔的生日派對同台合唱《倒轉地球》，他開心說︰「我好榮幸參與，當時感覺真係好夢幻。」</p>
<p>採訪︰黃曉妍</p>
