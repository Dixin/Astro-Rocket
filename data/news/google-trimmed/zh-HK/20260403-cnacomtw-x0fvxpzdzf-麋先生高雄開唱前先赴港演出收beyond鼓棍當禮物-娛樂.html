                      </img></source></source></picture><figcaption class="picinfo">樂團麋先生日前赴香港朝聖樂團Beyond錄音室「二樓後座」參觀，並收到Beyond鼓手葉世榮送的鼓棍。（相信音樂提供）中央社記者王心妤傳真　115年4月3日</figcaption></figure></div><div class="paragraph"><p>（中央社記者王心妤台北3日電）麋先生將於5月在高雄搭起帳篷舉辦「大馬戲團」演唱會，他們日前飛往香港擔任五月天演唱會嘉賓時，抽空朝聖Beyond「二樓後座」錄音室，並收到Beyond鼓手葉世榮送的鼓棍。</p><p>根據唱片公司提供資料，「二樓後座」錄音室是Beyond於80年代末至90年代的重要創作基地，多首經典歌皆誕生於此。麋先生參觀後得知錄音室所在的大樓將於9日被拆除感到可惜。</p><div class="gmailNews"><div class="gmailNewsWrapper"><img width="78" height="64" src="https://imgcdn.cna.com.tw/www/website/img/google-news.png" alt="google news"><span>透過 Google News</span>追蹤中央社</img></div></div><p>主唱聖皓表示，「這次親身走到他們的錄音室工作室，是非常感動跟震撼。踏進去就像走進他們的故事裡面，真實感受到那些曾經在耳機裡面的音樂。」鼓手逸凡現場獲得Beyond鼓手葉世榮送的鼓棍，他透露4月到香港開唱時將會使用這份紀念品。參觀空檔，麋先生前往葉世榮推薦的餐廳，逸凡吃完笑說：「我覺得我可以solo40分鐘。」</p><p>麋先生「大馬戲團」演唱會將於5月1、2、3、9、10日在高雄輕軌夢時代站旁登場，門票將於11日開賣。（編輯：張銘坤）1150403</p><div class="articlekeywordGroup"><div class="keywordTag">#五月天</div><div class="keywordTag">#高雄</div><div class="keywordTag">#麋先生</div></div></div><div class="paragraph appDownload"><div class="apptitle">支持中央社</div><div class="preferredSourceMobile"/><div class="flexContent"><div class="flexBorder"><p>選擇與事實站在一起，您的每一份贊助，都是守護新聞自由的力量</p>小額贊助</div><div class="flexBorder"><p>下載中央社「一手新聞」APP，即時掌握最新消息</p></div></div><div class="toolBox"><svg width="13" height="22" fill="#F6F6F6"><use href="#svg-btn-fb"/></svg><svg width="23" height="23" fill="#F6F6F6"><use href="#svg-btn-line"/></svg><svg width="19" height="19" fill="#F6F6F6"><use href="#svg-btn-copy"/></svg></div><p class="copyrightNotice">本網站之文字、圖片及影音，非經授權，不得轉載、公開播送或公開傳輸及利用。</p></div><div class="paragraph articleADbox"/></div><div class="advertiseGroup"/><div class="advertiseMobile"/></div></div></article></div></div></div></div><footer class=""><div class="f-wrapper"><div class="f-social-group mb"><svg width="12" height="22"><use href="#svg-fb"/></svg></div><div class="f-col-group"><div class="f-col"><div class="f-title">國際版網站</div>Focus Taiwanフォーカス台湾Fokus Taiwan</div><div class=
