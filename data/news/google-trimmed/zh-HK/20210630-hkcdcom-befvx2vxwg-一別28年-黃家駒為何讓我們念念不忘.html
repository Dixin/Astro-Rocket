							<h2 class="conten_title">一別28年，黃家駒為何讓我們念念不忘？</h2>
							<div class="ti_con">
								<span class="ti_l">2021-06-30 10:00</span>
							</div>
							<div class="from_new">
								來源：香港商報網
							</div>
							<div class="content_main" style="position:relative;" id="content">								
									<p>　6月30日是他逝世的日子。黃家駒，離開我們整整28年了。</p>
<p>　在知乎上有這樣一個高贊的話題：黃家駒如果活著，現在是什麼地位？</p>
<p>　這麼多年過去了，他的音樂還在被傳唱。他的歌聲，在一代代人心中迴蕩。</p>
<p>　Beyond樂隊成員葉世榮零點準時在微博發文悼念好友：「懷念你家駒」。</p>
<p><img src="https://www.hkcd.com/userfiles/1625018315.jpg" alt="" width="600" height="172"/></p>
<p>　1993年6月24日，黃家駒在日本參與某綜藝節目期間意外受傷，留醫六天後於1993年6月30日逝世，終年31歲。</p>
<p>　黃家駒出生在香港的一個勞工家庭，他們一家七口住在九龍深水埗蘇屋邨徙置區內一個不到三十平方米的小單位。小時候的黃家駒大部分時間都在戶外活動，只是偶然能接觸到一些70年代的搖滾音樂，對他來說比較有印象的有Deep  Purple、Led Zeppelin等搖滾樂隊，此外英國搖滾樂歌手大衛 &middot; 鮑威對黃家駒產生了較大影響。</p>
<p>　黃家駒中學畢業後，做過辦公室助理、電視台布景員、推銷員等。17歲時，黃家駒在鄰居搬家的時候撿來了一把木結他，這把木結他是他的第一件樂器。一次他去參加地下樂隊，遭到主結他手的嘲諷，黃家駒回家後對弟弟黃家強說自己有了人生的第一個目標，就是彈奏得比這位樂手更出色；這件事後，他開始了勤練結他。</p>
<p><img src="https://www.hkcd.com/userfiles/1625018481.jpg" alt="" width="600" height="385"/></p>
<p>　20世紀80年代初期，黃家駒經人介紹認識了葉世榮，發覺彼此音樂興趣相近，於是黃家駒、葉世榮聯同兩位朋友鄧煒謙及李榮潮一起組成樂隊作音樂交流，這支樂隊也是Beyond的雛型。</p>
<p>　1983年Beyond正式組建，黃家駒擔任樂隊主唱。1984年黃家駒和Beyond其他成員除了參與一些樂隊的演出外，開始嘗試寫更多的音樂作品。</p>
<p>　1987年Beyond出了一張專輯《永遠等待》，專輯中由黃家駒創作的歌曲《昔日舞曲》登上了香港電台流行榜，並被電視台拍成MTV，這也是Beyond第一首作品被拍成MTV；此時黃家駒和Beyond其他成員仍未被大眾所接受，他們的裝扮也受到外界的批評。</p>
<p><img src="https://www.hkcd.com/userfiles/1625018496.jpg" alt="" width="600" height="357"/></p>
<p>　1988年Beyond發行了粵語專輯《現代舞台》，雖然銷量欠佳，但卻是Beyond批判社會現象的開始。在這張專輯共收錄了11首歌曲，黃家駒參與了其中8首歌曲的作曲；隨後Beyond出版了專輯，嘗試走向大眾化。</p>
<p>　《喜歡你》是黃家駒寫給已經分手的女友的一首歌曲。那時黃家駒醉心於音樂，沒有穩定的工作，經濟狀況堪憂，前途也是一片渺茫。在他沉迷籌辦樂隊相關的事宜時，女友對他表明了自己的態度，想讓他放棄音樂夢想，回歸生活。面對女友的要求，黃家駒考慮良久，雖嘗試找了一份保險推銷員的工作，但心中終還是放不下音樂，最後為了不再耽誤女友的青春，他主動提出了分手，結束了他們長達四年的戀情。這首感動無數人的《喜歡你》由此而來。</p>
<p>　《大地》這首歌在1988年獲得了十大勁歌金曲獎。這首歌主要反映了兩岸的關係，表達出Beyond對祖國土地的熱忱。從另一個角度講，歌詞中也用到了「這刻在望著父親笑容時，竟不知不覺的無言」，這首歌也含蓄的了像大地一樣寬厚的父愛，父愛與大愛相輔相成，膾炙人口。</p>
<p>　1989年《真的愛你》獲得當年十大勁歌金曲獎以及十大中文金曲獎。這是一首寫給母親的歌，「無法可修飾的一對手，帶出溫暖永遠在背後，縱使囉嗦始終關注，不懂珍惜太內疚」可以說也是我們生活中對母親感情的真實寫照了。據說Beyond剛成立的時候生活得很是艱難，黃家駒的家人雖然不支持他，但他的母親仍偷偷的攢了一筆錢給他開演唱會用，擔心他真的過得太辛苦。</p>
<p>　1990年Beyond發行了粵語專輯《命運派對》，專輯中有不少關懷第三世界的歌曲，《光輝歲月》便是黃家駒為致敬南非第一位黑人總統曼德拉所寫，這首歌後來獲得了十大勁歌金曲「最佳填詞獎」。1990年，Beyond遠赴肯雅，親眼目睹了非洲人民因為戰爭和災荒而遭受的苦難生活。回到中國香港以後，黃家駒在報紙上讀到了曼德拉被困獄中的事，產生了強烈的內心的共鳴，於是創作了《光輝歲月》。</p>
<p><img src="https://www.hkcd.com/userfiles/1625018840.jpg" width="600" height="667" alt=""/></p>
<p>　1990年Beyond發行了專輯《猶豫》，其中《Amani》的大背景便是那時剛剛結束不久的海灣戰爭。各類文章影像資料讓黃家駒目睹了戰爭的殘酷，這首歌是他呼籲資助非洲難民兒童，呼喚和平而作。</p>
<p>　「Amani」為和平之意；</p>
<p>　「Nakupenda Nakupenda We We」意為「我們愛你」；</p>
<p>　「Tune take we we」是「我們需要你」的意思。</p>
<p>　成為國際化的樂隊一直是Beyond的夢想，1992年Beyond將事業發展重心移至日本，不過由於語言不通，再加上日本對於音樂製作的嚴格要求，Beyond頗為消沉了一陣子，但他們仍然十分努力  。</p>
<p>　1993年5月底，Beyond從日本返回到了香港，這一年也正值Beyond成立十周年之際，黃家駒寫下了這首紀錄Beyond十年心路歷程的歌曲《海闊天空》，歌詞承載了黃家駒與樂隊赴日本發展的艱辛與對理想的堅持。只可惜這首標誌着Beyond真正走向成熟的作品卻成為黃家駒的絕唱，這殘酷的現實在某種程度上應和了《海闊天空》中悲愴的宿命感。</p>
<p>　1993年的一場意外事故，讓我們對黃家駒的了解戛然而止，他的音容笑貌就那樣永遠的停留在了31歲，我們記憶里的他永遠不會再老去了。</p>
