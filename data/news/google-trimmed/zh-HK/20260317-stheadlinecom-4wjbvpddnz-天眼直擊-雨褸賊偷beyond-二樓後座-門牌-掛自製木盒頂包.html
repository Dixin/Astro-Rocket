                            <div id="conimg_0" class="content-body " itemprop="articleBody">
                                    <p>殿堂級樂隊Beyond位於旺角洗衣街唐樓的「二樓後座」錄音室，面臨大廈重建清拆在即，但昨日（16日）卻發生盜竊案。一名身穿黑色雨褸的賊人乘凌晨夜深人靜，赤腳上樓偷走「二樓後座」的門牌，並偷龍轉鳳把自製的「山寨」門牌裝上，企圖瞞天過海。現場閉路電視拍下犯案過程，至昨日早上職員返回單位揭發事件，其後報警處理，並在網上公開事件追緝歹徒。</p><ad id="ad-1"/><gallery-1/><p>現場是洗衣街215號的「二樓後座」。「Re:spect Music Magazine 紙談音樂」在facebook 講述事件，指昨日（16日）早上職員回到「二樓後座」，發現地上有一個木盒，經仔細查看發現是一個盜版門牌；而賊人偷龍轉鳳，把自己製作的門牌裝上，但其「製作的尺寸並不合適，並且從上面掉落地上」。</p><ad id="ad-2"/><p>從閉路電視拍下的片段所見，案發於16日凌晨約零時15分，男賊人身穿黑色連帽雨衣、藍色長牛仔褲並赤腳，沿大廈樓梯走到「二樓後座」的大門，其間他刻意低頭避開閉路電視，並在大門外有所動作，拆走門牌並偷龍轉鳳，之後沿樓梯逃去。「Re:spect Music Magazine 紙談音樂」稱已到旺角警署報案，並把木盒和閉路電視片段交給警方跟進，盼警方能夠早日破案。</p><ad id="ad-3"/><gallery-2/><p>警方回覆《星島頭條》查詢表示，昨日（16日）接獲報案，指旺角洗衣街215號一間錄音室的門牌懷疑被人盜去，約值100元。警方經初步調查，將案件列作盜竊，交由旺角警區刑事調查隊第四隊跟進，暫未有人被捕。</p><ad id="ad-4"/><p>「二樓後座」是Beyond 創作及彩排的單位，源於成員葉世榮的家庭物業。隨着2024年市建局宣布啟動旺角洗衣街與花墟道重建計劃，「二樓後座」所屬大廈被納入清拆範圍之內，預計最快將於今年被清拆。</p><ad id="ad-5"/><gallery-3/>
