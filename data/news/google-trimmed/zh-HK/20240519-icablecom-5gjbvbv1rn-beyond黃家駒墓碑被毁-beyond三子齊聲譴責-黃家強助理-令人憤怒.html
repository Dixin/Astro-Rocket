      <h1 class="zh-h4 single-post-title">Beyond黃家駒墓碑被毁｜Beyond三子齊聲譴責　黃家強助理：令人憤怒</h1>

      <p>【有線新聞】樂隊Beyond主音黃家駒的墓碑，遭人淋汽水、塗鴉及破壞，兩名男子涉嫌刑事毀壞被捕，有專程拜祭的內地歌迷情緒激動。<br/>
網上片段見到，一名男子在將軍澳華人永遠墳場向黃家駒的墓碑淋汽水，用箱頭筆塗污墓碑，又踢走墓前的花束，之後更用槌破壞黃家駒遺照，墓碑事後被帆布覆蓋。警方以涉嫌刑事毀壞拘捕兩名15及23歲男子，案件交由觀塘警區刑事調查隊跟進。<br/>
有來自四川的歌迷帶同鮮花來拜祭目睹已被損毀的墓碑，情緒激動，四川歌迷蘇女士：「我專門由四川過來看他的。（那妳是第一趟來？）第一次來，第一次來看黃家駒就心心念念的，喜歡了他很多年，然後就來看他，結果就這樣了。」本地歌迷歐先生：「到場後見到蓋了白布，有管理員在這裏，才說應該是昨日還是哪個時候墳墓被人破壞。」<br/>
自稱是黃家駒朋友、他弟弟黃家強的助理劉先生到場了解，「見到這樣的事很憤怒，黃家駒一路以來帶給我們的訊息是和平與愛，很平和的，遭到這樣破壞的確很令人憤怒。」Beyond樂隊成員黃家強、黃貫中及葉世榮都在社交媒體發文譴責事件。<br/>
黃家駒1993年逝世，他的墓碑及碑上遺照曾多次被人塗鴉及破壞。</p>
