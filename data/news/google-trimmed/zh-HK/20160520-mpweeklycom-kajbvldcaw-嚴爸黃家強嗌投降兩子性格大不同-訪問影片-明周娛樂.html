                <h1 class="title">嚴爸黃家強嗌投降  兩子性格大不同</h1>
        訪問影片
        <div class="infoWrapper article">
            
            <div class="time"><label class="mb-0" id="iconTime"><svg id="svgId-iconTime" class="svgClass-iconTime" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 16 16" style="enable-background:new 0 0 16 16;" xml:space="preserve" preserveAspectRatio="xMinYMin meet"><g>	<line class="st0" x1="8" y1="8" x2="6" y2="6" fill="transparent"/>	<path class="st1" d="M8,2.7C5,2.7,2.7,5,2.7,8S5,13.3,8,13.3S13.3,11,13.3,8c0-1.8-0.9-3.4-2.2-4.3L8,8" fill="transparent"/></g></svg></label><span id="time_9680_1912" class="human-time" data-timestamp="1463695200">2016.05.20</span></div>

                <div class="shareWrapper general">
            <i class="fab fa-facebook-f"/>

            <i class="fab fa-google"/><span class="google-follow-text"><span>在Google</span><span>追蹤《明周》</span></span>

        <div class="inner">
                            <div class="embedded_video_wrapper"><iframe src="https://videop.mingpao.com/php/player1.php?file=http://video3.omghk.com/201605/ENT20160518_04_W_640x360.mp4&portal=mpweekly&adv=ad001&size=" class="embedded_video" allowfullscreen="" type="text/html" id="mpwplayer" frameborder="0" style="width:100%;height: 100%"/></div>                        <p>【明報專訊】Beyond陪着不少人成長，不知不覺間，Beyond各位成員都有了他們的下一代。從小就有哥哥家駒伴着成長的黃家強，更深明兄弟情很重要。前日他與日籍太太Makiko剛度過結婚10周年，並育有9歲大仔慶陽及4歲細仔曜陽。不過，港日婚姻對子女教育的觀念卻大不同；雖然太太教得兒子很有禮貌但卻過於溺愛，9歲大仔至今還要求與父母同牀，令家強無符。他自問是個要求嚴格的爸爸，但面對天生性格截然不同的一對兒子，有時候也要宣布投降！</p>
<p>因為工作忙碌，黃家強平日跟兒子相處時間不多，在孩子心目中只排第二；即使自命嚴格，但每次糾正兒子們的錯誤後，都會加倍地愛惜他們，以彌補之前的責罵，免得孩子們因此嬲了、怕了他。「試過有次他們做錯事，我罵完他們後，因工作忙沒時間陪他們玩，結果他們不理我，我很傷心！」</p>
<p>駁阿媽嘴 要鎮住兩個仔</p>
<p>大部分爸爸都會在家裏當「好人」，家強自言其實也不是經常罵孩子，只有在太太Makiko控制不到時，他才出口鎮着場面。他說：「兩個兒子完全不怕媽媽，不知道是母子間太親密，還是太太罵得多，他們不怕被媽媽鬧，還駁嘴！有時我聽見太太教他們做功課時已很惡，若太太用那種語氣跟我說話，我一定很害怕，但兩個仔完全不怕。他們會駁媽媽嘴，卻不敢駁我嘴，所以我的角色是一個能夠收復他們的人！」</p>
<p>9歲大仔怕事 愛纏媽媽睡</p>
<p>相差5年的慶陽、曜陽，性格完全不同；哥哥慶陽細膽怕事聽話，弟弟曜陽卻百厭硬頸難教，令家強十分頭痛。「哥哥細膽、怕事，但容易教，叫他做什麼都會做，即使他不喜歡吃某種食物，我告訴他為了均衡營養一定要吃，他就會吃。他現在9歲，仍然要纏住媽媽睡，每晚都問我們能否一起睡。如我說不可以，他就開始想喊……哥哥似我，我小時候都是什麼都驚、比較怕事，也會纏住媽媽睡，但只纏到5歲。他9歲還是這樣子，很麻煩！」</p>
<p>不過，家強大讚慶陽重感情，有次見他離家工作10日，於是對媽媽說長大後不要做爸爸的工作，原因是經常見不到家人不太好。「我想他是掛念我才這樣說，年紀小小就知道和家人相敘重要，令我很感動！那次回家，他跑過來擁抱我，弟弟就像發了癲一樣亂叫，哈哈！他後來見哥哥攬住我，也走過來攬我。」</p>
<p>4歲細仔百厭 硬頸唔怕鬧</p>
<p>剛4歲的曜陽跟哥哥完全相反，百厭、大膽、有主見、硬頸、不怕鬧，令家強完全無符，不知道怎樣教！「弟弟很百厭，吃飯時圍住餐枱氹氹轉、跑來跑去，還會爬上餐枱，喝他、罵他也不下來，最後只能拿出他媽媽的手機，打開機內一個能播放魔鬼叫聲的程式嚇他，他才肯坐定定吃飯。哥哥不會這樣，哥哥如吃飯時走開，叫他回來就會立即回來；弟弟卻不會理，鬧他，他不怕，還要露出一副得戚調皮樣，然後還逗你笑，我完全無辦法，不知道怎樣鬧下去，鬧也沒有用！」</p>
<p>家強指曜陽性格獨立、大膽，從小就能一個人睡，不像哥哥般要全晚纏住爸媽。最令家強困惑的，是老師說曜陽在學校裏很乖，慶陽也是個獨立、不害羞怕事的小孩子。「可能慶陽知道在學校裏沒撒嬌對象，又可能會被欺負吧！他在學校裏的社交幾成功，在老師安排下成立了一個摺紙會，很多同學排隊申請入會，他卻不願意，只肯招收幾個熟朋友做會員。」</p>
<p>讚太太教囝囝有禮但太縱容</p>
<p>太太Makiko是日本人，日本人最注重禮儀，在太太的嚴格教導下，家強覺得兩兒子均有禮貌，見人會打招呼、吃飯前會叫人、雙手拿好筷子和飯碗。他稱太太教孩子做功課時雖然惡，但平日卻很縱容，孩子要什麼就買什麼，買到全屋玩具。家強笑指若不是太太那麼縱容兒子，他們就不會夠膽頂嘴。「我想跟太太說，她再這樣縱下去，兩個兒子就會變成『小學雞』，所以我一定要在她背後鎮住兩個仔！」</p>
<p>記者：孫慧莊</p>
