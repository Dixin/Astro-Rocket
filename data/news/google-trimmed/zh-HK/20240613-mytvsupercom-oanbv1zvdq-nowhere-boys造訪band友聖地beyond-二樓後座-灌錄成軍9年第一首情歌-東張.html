                    <article class="content-main editor-content-view"><p>講到「二樓後座」，大家都會諗起殿堂級樂隊Beyond，呢個錄音室誕生咗Beyond一連串經典歌曲，亦係唔少Band友想朝聖嘅地方，但係呢個咁有紀念性嘅地方，將會受重建計劃影響面臨清拆。</p><p><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/mCrnabkYYwV7v-8WsmkwvSHhvkw=/0x0/public/article/content/202406/f6a25fbc-fe53-40f6-a177-ed6124c7c755.jpg" alt="" data-href="" data-desc="「二樓後座」係Band友想朝聖嘅地方，呢個錄音室誕生咗Beyond一連串經典歌曲。" style="" decoding="async" loading="lazy"/><br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/WMplRWueijoYa10jU0PmDgEMak4=/0x0/public/article/content/202406/e7c73341-476a-46cd-8d23-ff88ac2f1226.jpg" alt="" data-href="" data-desc="樂隊Nowhere Boys早前就襯「二樓後座」清拆前，造訪錄音室錄製佢哋成軍9年第一首情歌《兩秒》。" style="" decoding="async" loading="lazy"/></p><p><br/>樂隊Nowhere Boys早前就襯「二樓後座」清拆前，造訪錄音室錄製佢哋成軍9年第一首情歌《兩秒》，以音樂記錄底呢個咁珍貴嘅地方。首次到訪「二樓後座」嘅Van、Nate同Ken見到玻璃櫃擺滿Beyond嘅唱片同曾經用過嘅音樂器材時，經已好興奮，Ken話：「呢度係Beyond嘅發源地，佢哋一開始喺度Jam歌、排練，後來有足夠嘅金錢就喺呢度做歌。」Van講到「我見到有啲用到好殘嘅Pedal，Ken同我解釋係日本製好勁嘅Pedal，係家駒用過嘅，我見到直頭唔敢掂。」<br/><br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/pKoojBW4xFWJEW_sGlx7WyYdugY=/0x0/public/article/content/202406/7d345e33-0087-4a47-9686-006aabe567e4.jpg" alt="" data-href="" data-desc="「二樓後座」係Beyond一開始喺度Jam歌、排練，後來有足夠嘅金錢就喺呢度做歌。" style="" decoding="async" loading="lazy"/></p><p>對於「二樓後座」面臨清拆，Nowhere Boys大感可惜，Van透露希望喺呢條街清拆之前，可以喺度錄多幾首歌，決定咗嚟緊每首歌都會Book呢度錄，直到佢唔再喺度為止。希望可以用我哋嘅音樂、聲音去記錄低呢個地方。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/wxyYgdQ7Tc9vUq-CyN5TgLcr8Ns=/0x0/public/article/content/202406/1baa67ad-1ea3-46c5-a695-ec51543473e5.jpg" alt="" data-href="" data-desc="「二樓後座」玻璃櫃擺滿Beyond嘅唱片同曾經用過嘅音樂器材。" style="" decoding="async" loading="lazy"/></p></article>
