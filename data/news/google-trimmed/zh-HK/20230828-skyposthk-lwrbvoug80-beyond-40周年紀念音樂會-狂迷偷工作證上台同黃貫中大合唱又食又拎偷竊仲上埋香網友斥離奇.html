<h1>Beyond 40周年紀念音樂會｜狂迷偷工作證上台同黃貫中大合唱 又食又拎偷竊仲上埋香 網友斥離奇</h1>
</div>

<div class="row">

<div class="page-left col-xs-12 col-sm-12 col-md-8 col-lg-8">
<div class="author-box col-xs-12 col-sm-12 col-md-12 col-lg-12">
<div class="article-detail-share-icon">
</div>
<div class="publish-time text15 text-weight-300">發佈時間: 2023/08/28</div>

<div id="content-main" class="content-main margin-b15">
<div class="margin-b">
<div class="lazy">

<div class="content-section-region__article-details">

<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<p>Beyond樂隊今年成立40周年，在6月12日當日，《Re:spect Music Magazine》與Kinn&rsquo;s Music在中環堅道明愛中心合辦紀念音樂會，亦即1985年Beyond自資舉辦第一次音樂會的地方。</p><p><strong><em>同場加映：</em></strong></p><p><strong><em>全民造星V｜Lyman亨仔靠積蓄追夢望演戲 KC落力搵人投資搞VR跳舞騷</em></strong></p><p style="display:none;" articleId="3601958" showAd="true">{{hket:ul-video id="9019"}}{{/hket:ul-video}}</p><p>當晚除了多隊樂隊和歌手輪流獻唱Beyond歌曲之外，亦邀請到黃貫中（Paul）、Beyond前經理人Leslie Chan（陳健添）及前成員劉志遠出席，跟樂迷分享Beyond及家駒的往事。不過當中就發生了一件離奇事，有一名觀眾竟然偷取工作人員證件，冒充工作人員偷飯盒及iPad Pro不特止，甚至一同進行拜神儀式，至弔詭的是，他成功冒充樂隊成員在台上大合唱！</p><p style="display:none;" caption="">{{hket:inline-image name="9879.jpeg"}}{{/hket:inline-image}}</p><p>主辦單位「 紙談音樂 」昨日（27日）在社交平台po這宗「奇人奇事」，指當日音樂會順利進行後，卻發現一件不可思議的事。該帖文圖文並茂指有觀眾偷取工作人員證，冒充工作人員進入音樂會場和後台地方，犯下「八宗罪」。</p><p>1. 盜竊音樂會工作證，冒充工作人員。</p><p>2. 盜取我們為工作人員準備的飯盒和飲品。</p><p>3. 我們在演出前進行拜神儀式，他竟然夠膽一起上香。</p><p>4. 盜取我們後台的飲品、生果盒給他在現場的數名朋友。</p><p>5. 盜取多名演出人員工作證給其朋友。</p><p>6. 盜取樂隊成員放在後台的iPad Pro。</p><p>7. 盜取放在後台及演出嘉賓的Beyond Tee。</p><p>8. 更離譜的是在最後兩首歌曲演出時，他竟然冒充樂隊成員在台上一同大合唱，還企在正中間位置。</p><p>「紙談音樂」指事後花了兩天時間剪走該名觀眾鏡頭，主辦單位曾曾經功聯絡對方，要求賠償兩天剪輯工作額外費用及書寫道歉信，不過最後對方杳無音訊。主辦單位無奈向大眾公開事件，以及到警署報案。</p><div class="bulletpotint"><ul><li style="display:none;" caption="">{{hket:inline-image name="1.jpg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="6.jpeg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="7.jpeg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="987.jpeg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="967.jpeg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="797.jpeg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="98.jpeg"}}{{/hket:inline-image}}</li><li style="display:none;" caption="">{{hket:inline-image name="80.jpeg"}}{{/hket:inline-image}}</li></ul></div><p>不少網友都指事件非常離奇，笑言可以報《一線搜查》或《東張西望》，稱：「呢啲人可能報警都唔驚，應該要搵《東張》了解一下佢，睇佢拔足狂奔笑吓都好」、「條友識玩喎，有料到」、「太有表演慾啫」、「佢好投入，真係以為佢係工作人員」、「實在太不可思議啦」；有人好奇問：「佢有冇食埋宵夜先走？」主辦單位指：「最衰佢冇嚟慶功！」</p><p>&nbsp;</p><p>撰文：娛樂組</p><p>圖片：《Re:spect Music Magazine》Facebook</p><p>&nbsp;</p>
</div>
