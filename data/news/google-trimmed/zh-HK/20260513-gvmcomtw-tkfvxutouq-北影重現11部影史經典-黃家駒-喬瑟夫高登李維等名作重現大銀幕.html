mg" alt="2026台北電影節經典重現。台北電影節" fetchpriority="high" decoding="async" src="https://i.gvm.com.tw/reimg?u=https%3A%2F%2Fimgs.gvm.com.tw%2Fupload%2Fgallery%2F20260513%2F231183.jpg&amp;w=792"/> </div> <figcaption class="article-img_txt font-regular">	2026台北電影節經典重現。台北電影節</figcaption> </figure> <div class="article-head_iconbox">  <div class="object-fit"> </div>   <div class="object-fit"> </div>  <button class="article-head_icon js-copytext ga4_gc_event_click" title="複製文章連結" onclick="reverse_Copylink(this)" data-clipboard-text="https://www.gvm.com.tw/article/130064" data-event_type="copylink" data-event_place="article_1" data-event_label="article" data-event_content="130064" data-check_status=""><i class="be-icon be-icon-copylink" aria-hidden="true"/></button> <div class="save-article"> <button class="article-head_icon fav ga4_gc_event_click" title="文章收藏" id="fav_article_html_130064" data-event_type="favorite" data-event_place="article_1" data-event_label="article" data-event_content="130064" data-check_status="">    </button> <div class="tooltip">  <p>	喜歡這篇文章嗎 ? <span class="tooltip-close ga4_gc_event_click" data-event_type="favorite" data-event_place="article_1" data-event_label="article_favorite_login_alert_close" data-event_content="130064" data-check_status=""><i class="be-icon be-icon-close"/></span> </p> 登入 後立即收藏 ! </div> </div> <button class="article-head_icon js-zoom ga4_gc_event_click" title="字級調整" data-event_type="fontsize" data-event_place="article_1" data-event_label="article" data-event_content="130064" data-check_status=""><i class="be-icon be-icon-text-zoom" aria-hidden="true"/></button> <div class="audible_card"> <audio class="audible_audio custom-audio"/> <button class="audible_play ga4_gc_event_click" title="聽遠見" data-audible-path="https://audio.gvm.com.tw/audio/130/130064_0241a234b825453cc22114b20e1e0ef2.mp3" data-event_type="listen" data-event_place="article_1" data-event_label="聽遠見" data-event_content="130064" data-check_status=""><span class="audible_play_group audible_playing font-regular"><i class="be-icon be-icon-listen" aria-hidden="true"/>聽遠見</span><span class="audible_play_group audible_pause font-regular"><i class="be-icon be-icon-play-article" aria-hidden="true"/>播放中</span></button> <div class="audio-player vm-audible"> <audio class="audio-player_audio"/> <div class="audio-player_main"> <button class="audio-player_play" title="聽遠見播放"><i class="be-icon be-icon-play" aria-hidden="true"/><i class="be-icon be-icon-pause-article" aria-hidden="true"/></button> <div class="audio-player_progress"><span class="audio-player_time audio-player_current">00:00</span> <div class="progress-panel sz-small">  </div><span class="audio-player_time audio-player_length">00:00</span> </div> <button class="audio-player_mute" title="聽遠見靜音"><i class="be-icon be-icon-volume" aria-hidden="true"/><i class="be-icon be-icon-volume-mute" aria-hidden="true"/></button> <button class="audio-player_speed" title="聽遠見播放速度調整">x1.0</button> <button class="audio-player_close" title="聽遠見關閉"><i class="be-icon be-icon-close" aria-hidden="true"/></button> </div> </div> </div> </div> </div> <div class="article-content article-content_level-0 ">  <blockquote class="article-head_blockquote"><p><p>2026台北電影節，釋出「經典重現」單元共11部精湛大作，包含黃家駒、喬瑟夫高登李維等早期作品，令人期待。</p></p></blockquote><p>2026第28屆台北電影節，釋出「經典重現」單元共11部精湛大作，包括由張之亮執導、傳奇樂團Beyond主唱黃家駒出演的《籠民》4K修復版、台灣校園青春電影鼻祖《拒絕聯考的小子：導演版》2K修復、日本名導三宅唱最初鳴放作《無路用之人》和《Playback》。</p><p>以及喬瑟夫高登李維（Joseph Gordon-Levitt）年輕胴體大展驚人演技的酷兒爭議之作《神秘肌膚》（Mysterious Skin）4K修復版，都將獻映北影大銀幕。</p><div id="div-gpt-ad-1738661051687-0-130064" style="margin: 0px auto;text-align: center;"> </div><p>此外，今年重磅推出第二位焦點影人，被視作「阿拉伯影壇最具國際影響力」的導演尤瑟夫夏因（Youssef Chahine）），將透過《開羅車站》、《港都舊事》、《浮光掠影》等6部數位修復鉅作，帶領觀眾回望橫跨半世紀的影史崢嶸。</p><p>「M+修復」項目之一、第二波香港新浪潮導演張之亮執導的《籠民》最新4K修復版，取材自深水埗籠屋火災真實事件，聚焦一眾社會底層男子，蝸居鐵籠屋和老鼠為鄰、及時行樂，當迫遷危機逼近，該留守抵抗或向錢低頭？</p><p>電影用長鏡頭直搗市井生存狹縫，一舉囊括1993年香港電影金像獎最佳電影、導演、編劇及男配角4項大獎，也為傳奇搖滾樂團Beyond主唱黃家駒留下銀幕最後身影。</p><p>國家電影及視聽文化中心修復的《拒絕聯考的小子：導演版》，2K修復作為徐進良執導，故事改編自吳祥輝同名暢銷自傳小說，上映當年便掀起台灣校園電影風潮，也讓清新亮相的女主角彭雪芬一炮而紅。</p><div id="div-gpt-ad-1738661117324-0-130064" style="margin: 0px auto;text-align: center;"> </div><p>故事描述，大學聯考在即，建中班長因與女高中生相戀遭對方家長責難，又目睹學長因落榜崩潰，他開始質疑升學體制，以拒絕考試迎擊主流價值。本片獲作家三毛盛讚為「台灣版《麥田捕手》」，是戒嚴時期直指教育困境、探問青春出路的犀利之作。</p><p>為實現影迷心願，北影特別選映日本中生代名導三宅唱兩部早期傑作。三宅唱在首部長片《無路用之人》便展露善於捕捉光影流動的調度美學，以冷冽的札幌雪地為背景，精準呈現飄忽而孤獨的青春質地。</p><p>三位無意升學的高校生進入保全公司，試圖在職場的規則與節奏裡站穩腳跟，證明自己已是個「大人」，但層層遞進的考驗動搖最初的決心，逐漸身陷難以名狀的挫折之中。</p><p>三宅唱以第二部長片《Playback》入選盧卡諾影展主競賽，一舉躍進國際影壇視野。失意演員離婚後意外以中年軀體重返青春現場，昔日情感記憶、抉擇與後悔再次顯現，他該如何清醒回到未來？</p><p>本片取景311福島核災後的茨城縣，透過村上淳細膩演繹與鏡頭層疊光影，將這場「回放」安放於幻夢與現實之間，在災後地景的不安中透出重生意象。</p><p>新酷兒電影名家葛瑞格荒木（Gregg Araki）執導的《神秘肌膚》4K修復版，以雙線敘事切入兒童禁忌情慾，20年後仍震撼道德邊際。</p><p>加入棒球隊的兩位男孩初探慾望，殘酷痕跡烙印身體，回憶旋繞著騷動的青春，駭人真相逐漸清晰。青澀的喬瑟夫高登李維在片中化身漂泊男妓，詮釋角色軀體麻木與內心暗湧，驚艷卻也叫人心碎。</p><section class="newsletter "> <div class="container"> <div class="newsletter-title"> <i class="be-icon be-icon-email" aria-hidden="true"/> <p class="newsletter-p font-regular">訂閱遠見電子報，掌握國內外大事</p> </div> <div class="newsletter-form"> <input type="text" name="email_subscribe_130064" id="email_subscribe_130064" placeholder="請輸入電子郵件" onKeyPress="return epaper_submitenter(event,'email_subscribe_130064')"> <button class="btn sty-blue ga4_gc_event_click" onclick="epaper_check_edm('email_subscribe_130064');" data-event_type="edm" data-event_place="article_1_body" data-event_label="訂閱" data-event_content="130064" data-check_status="">訂閱</button> </input></div> <div class="newsletter-title">  </div> </div> </section><h2>精選尤瑟夫夏因6部數位修復作 重現宏闊的影像魅力</h2><p>尤瑟夫夏因創作近60年，累積超過40部作品，身兼導演、演員、製片，影像語言涵括義大利新寫實主義、音樂劇與心理象徵敘事，擅於以小人物的故事叩問階級衝突、政治壓迫與宗教問題。他於1997年獲得坎城影展50週年紀念獎，是阿拉伯影史最具國際影響力的導演，今年適逢其百年誕辰，北影將選映其撼動影壇的6部數位修復代表作，追緬這位埃及大師的創作軌跡。</p><p>《炙熱的太陽》（The Blazing Sun）敘述返鄉男子用技術振興農民經濟，卻招致地主疑忌陷害，讓父親蒙冤而死，他躲避階級陰謀操弄，毅然追查真相。本片以新寫實骨幹揉合通俗劇情，剖析階級權力結構，亦是《阿拉伯的勞倫斯》、《齊瓦哥醫生》主角奧瑪雪瑞夫出道之作。</p><input type="hidden" id="tracker[]" key="banners" value="12902"> <div class="article-head_marketing ga4_gc_event_click" data-event_type="ad" data-event_place="article_1_body" data-event_label="行銷文字" data-event_content="12902" data-check_status="">  在忙碌節奏中，如何用一杯咖啡的時間為大腦與日常烤出好滋味？ </div><p>堪稱阿拉伯影史里程碑的《開羅車站》（Cairo Station），描述一名在車站謀生的跛腳青年癡迷賣汽水的姑娘，求愛被拒後變得偏執狂暴，一步步走向毀滅結局。夏因將實景融合黑色電影風格，親上鏡頭演活男主角，刻畫性壓抑與階級拉扯下的震盪心理。</p><p>《王者薩拉丁》（Saladin）為夏因集政治寓意及影像美學野心的代表作，故事聚焦十字軍佔據耶路撒冷並屠殺穆斯林，薩拉丁領軍討伐成功，卻旋即被迫和英王查理對峙談判。本片以浩瀚史詩場面、精密調度軍隊征戰群戲，構築泛阿拉伯民族與反帝國主義視角歷史。</p><p>改編自埃及同名小說的《大地》（The Land）被視為反殖民秩序的階級寓言，以血與泥強烈視覺，將土地衍伸為個體和社會身份的具象表徵，呈現被地主及權貴鎮壓下的農民，在組織抗爭與壯烈犧牲間凝聚集體意識。</p><div id="div-gpt-ad-1738661148886-0-130064" style="margin: 0px auto;text-align: center;"> </div><p>夏因自傳性作品「亞歷山大四部曲」序章《港都舊事》（Alexandria... Why?），從志願成為好萊塢演員的少年眼中，見證民族衝突、他人愛慾及政治覺醒，在自我追尋中成長。夏因交錯剪輯虛構劇情和新聞片段，挑戰寫實疆界，顯影出不同世代文化下的亞歷山大港，並憑此作勇奪1979年柏林影展評審團特別獎。</p><p>第二部曲《浮光掠影》（An Egyptian Story）則述說手術台上生死一線的男子，意識開始播映人生跑馬燈，回溯幼年創傷、家庭關係到導演職涯。本作亦承續風格化形式，融匯夢境、回憶與紀錄影像，是自傳電影中集實驗性與心理意涵的大成之作。</p><p>2026第28屆台北電影節將於6月26日至7月11日在臺北市中山堂、光點華山電影館、誠品電影院舉行，影展精彩片單與活動將陸續公布。</p><div id="div-gpt-ad-1738661205930-0-130064" style="margin: 0px auto;text-align: center;"> </div> </input></div>  <span class="radar-promo-inner">  <span class="radar-promo-texts"> <span class="radar-promo-title"><strong>72%</strong> 領先者已開啟【職場雷達】</span> <span class="radar-promo-sub">立即開通！解鎖專屬服務</span> </span> </span> <span class="radar-promo-btn">立即開啟</span>   <div class="list relation-ajax-block" id="article_end_130064" data-article-id="130064" data-waterfall="1" data-loaded="false">  </div> <div class="container"> <div class="media-sec">   <p class="media-sec_p"><span style="font-weight:bolder;">加好友</span><span class="bg-show">掌握趨勢</span></p> <i class="be-icon be-icon-arrow-right" aria-hidden="true"/>    <p class="media-sec_p"><span style="font-weight:bolder;">關注FB</span><span class="bg-show">熱門議題</span></p> <i class="be-icon be-icon-arrow-right" aria-hidden="true"/>  </div> </div><div class="tag-group">電影 導演 影評 演員 </div> </div> <div class="list show-small"> <p class="list_p font-medium">熱門</p> <ul class="list-group"> <li class="list-group_li"> <p class="li
