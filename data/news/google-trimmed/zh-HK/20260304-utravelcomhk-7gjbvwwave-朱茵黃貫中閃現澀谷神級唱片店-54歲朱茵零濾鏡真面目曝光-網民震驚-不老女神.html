								<div class="detail-description-content" source="" page="1">
                                <div class="articleContent"><p>近期日圓匯率吸引，不少港人都準備飛東京旅行掃貨。近日有網民在澀谷地標 TOWER RECORDS 捕獲54歲「女神」朱茵與丈夫黃貫中恩愛行街。準備遊日的港人不妨把這間人氣唱片店加入行程，入內尋寶之餘隨時幸運「撞星」！</p><h2 data-path-to-node="3">日本人氣唱片店 隨時幸運撞明星</h2><p data-path-to-node="3">趁著日圓低水，大批港人爭相飛往東京旅行血拼，原來連星級夫婦朱茵和黃貫中（Paul）也是其中一份子！近日有網民在社交平台發文分享，表示在東京澀谷的著名地標 TOWER RECORDS 唱片店偶遇朱茵。這間樓高多層的唱片店一向是音樂迷與旅客的尋寶勝地，如今連「一代女神」也專程來掃黑膠唱片，絕對是港人規劃澀谷行程時必去的朝聖熱點。</p><p><picture><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121118_ff3d7a5e38d5d429d5af7926757ebc58711e1a9b.webp" type="image/webp"/><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121118_ff3d7a5e38d5d429d5af7926757ebc58711e1a9b.jpg"/><div class="photoSwipe_container"><figure class="addEnlarge" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121118_ff3d7a5e38d5d429d5af7926757ebc58711e1a9b.webp" type="image/webp"/><img src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121118_ff3d7a5e38d5d429d5af7926757ebc58711e1a9b.jpg" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121118_ff3d7a5e38d5d429d5af7926757ebc58711e1a9b.jpg" class="img-responsive" loading="lazy" onerror="imageErrorHandler(this)" alt="照片來源：小紅書@鼠人" title="照片來源：小紅書@鼠人"/></picture></figure></div></picture></p><div class="row gallery"><span class="col-12 text-center hint">點擊圖片放大</span><div class="photoSwipe_container col-4 all-show"><figure class="" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121355_a8bac3e9bb8aeb6d0f4c1a57cd92e1f6329b7096.webp" type="image/webp"/><img alt="照片來源： ve" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121419_5adba8a14fe701d321331300680d74a254f79ee3.jpg" loading="lazy" onerror="imageErrorHandler(this)" src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121419_5adba8a14fe701d321331300680d74a254f79ee3.jpg" title="照片來源：小紅書@乌托邦少年"/></picture></figure></div><div class="photoSwipe_container" hidden="1"><figure class="addEnlarge" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121420_6e80cc4dac5c337a201575a1913002e1047fdce2.webp" type="image/webp"/><img alt="照片來源：小紅書@乌托邦少年" class="img-responsive" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121420_6e80cc4dac5c337a201575a1913002e1047fdce2.jpg" loading="lazy" onerror="imageErrorHandler(this)" src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121420_6e80cc4dac5c337a201575a1913002e1047fdce2.jpg" title="照片來源：小紅書@乌托邦少年"/></picture></figure></div><div class="photoSwipe_container" hidden="1"><figure class="addEnlarge" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121422_712f8b24ec3adfad82dc1e99d53bb0cd20bd99fd.webp" type="image/webp"/><img alt="照片來源：小紅書@乌托邦少年" class="img-responsive" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121422_712f8b24ec3adfad82dc1e99d53bb0cd20bd99fd.jpg" loading="lazy" onerror="imageErrorHandler(this)" src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121422_712f8b24ec3adfad82dc1e99d53bb0cd20bd99fd.jpg" title="照片來源：小紅書@乌托邦少年"/></picture></figure></div></div><p><strong data-index-in-node="0" data-path-to-node="1,1,0">地址：</strong> 位於日本東京都澀谷區神南 1 丁目 22-14（1 Chome-22-14 Jinnan, Shibuya, Tokyo 150-0041）。</p><p><strong data-index-in-node="0" data-path-to-node="1,2,0">營業時間：</strong> 營業至晚上 10 時（22:00）。</p><p> </p><h3 data-path-to-node="4">54歲朱茵隨意打扮獲讚「不敗美人」</h3><p data-path-to-node="5">若大家準備去澀谷這間星級同款唱片店打卡，不妨多加留意身邊，隨時有大明星出沒。據網民分享的照片可見，現年54歲的朱茵當日剪了一頭清爽短髮，身穿簡單的白色T恤配休閒長褲。雖然打扮隨意，甚至被網民形容為「師奶Look」且沒有精心打扮，但她憑着淡妝及精緻五官，氣質依然出眾，被大讚是「歲月真的不敗美人」。面對粉絲的合照要求，在異國放假的朱茵亦顯得心情靚靚，非常親民。</p><p><picture><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121120_96465fb192a9b2b48e1fcc4f65bf0d23b31eac66.webp" type="image/webp"/><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121120_96465fb192a9b2b48e1fcc4f65bf0d23b31eac66.jpg"/><div class="photoSwipe_container"><figure class="addEnlarge" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121120_96465fb192a9b2b48e1fcc4f65bf0d23b31eac66.webp" type="image/webp"/><img src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121120_96465fb192a9b2b48e1fcc4f65bf0d23b31eac66.jpg" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121120_96465fb192a9b2b48e1fcc4f65bf0d23b31eac66.jpg" class="img-responsive" loading="lazy" onerror="imageErrorHandler(this)" alt="照片來源：小紅書@鼠人" title="照片來源：小紅書@鼠人"/></picture></figure></div></picture></p><p> </p><h3 data-path-to-node="6">黃貫中同行化身「愛妻號」幫手提貨</h3><p data-path-to-node="7">除了在店內尋找心水唱片，這裡也是見證兩人甜蜜互動的地點。帖文發佈後，有不少網民留意到丈夫黃貫中（Paul）亦有同行。該名幸運網民隨後上載了另一張照片，原來 Paul 一直在唱片店內陪伴愛妻行街。相中的 Paul 手執印有「JIL SANDER」字樣的白色大購物袋以及一個黃色購物籃，滿載而歸，甘願為老婆提大袋戰利品，展現出兩人結婚十多年依然恩愛如初的一面。</p><p><picture><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121117_bd4336796512e9de0eef1381e3e8287e8f791472.webp" type="image/webp"/><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121117_bd4336796512e9de0eef1381e3e8287e8f791472.jpg"/></picture></p></div><div class="articleContent"><div class="photoSwipe_container"><figure class="addEnlarge" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121117_bd4336796512e9de0eef1381e3e8287e8f791472.webp" type="image/webp"/><img src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121117_bd4336796512e9de0eef1381e3e8287e8f791472.jpg" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121117_bd4336796512e9de0eef1381e3e8287e8f791472.jpg" class="img-responsive" loading="lazy" onerror="imageErrorHandler(this)" alt="照片來源：小紅書@鼠人" title="照片來源：小紅書@鼠人"/></picture></figure></div><div class="row gallery"><span class="col-12 text-center hint">點擊圖片放大</span><div class="photoSwipe_container col-4 all-show"><figure class="" itemprop="associatedMedia" itemscope="" itemtype="https://schema.org/ImageObject"><picture data-size="600x400"><source srcset="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121538_5a45e10135de1cdb387deda986762dc8a4ef3938.webp" type="image/webp"/><img alt="照片來源：小紅書@ABS CREATIVE STUDIO" class="img-responsive" data-albumsrc="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w1280/2026/03/20260304121538_5a45e10135de1cdb387deda986762dc8a4ef3938.jpg" loading="lazy" onerror="imageErrorHandler(this)" src="https://resource02.ulifestyle.com.hk/ulcms/content/article/image/w600/2026/03/20260304121538_5a45e10135de1cdb387deda986762dc8a4ef3938.jpg" title="照片來源：小紅書@ABS CREATIVE STUDIO"/></picture></fig
