ion_cantonese/about" aria-label="顯示 關於我們 個子版面" class="c-button c-button--medium c-button--default submenu-caret" type="button"><span class="visually-hidden">顯示 關於我們 個子版面</span><span><svg class="c-icon" width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true" focusable="false"><path d="M256 416C247.812 416 239.62 412.875 233.38 406.625L41.38 214.625C28.88 202.125 28.88 181.875 41.38 169.375C53.88 156.875 74.13 156.875 86.63 169.375L256 338.8L425.4 169.4C437.9 156.9 458.15 156.9 470.65 169.4C483.15 181.9 483.15 202.15 470.65 214.65L278.65 406.65C272.4 412.9 264.2 416 256 416Z"/></svg></span></button></div><div class="b-header-nav-chain__subsection-container "><ul class="b-header-nav-chain__subsection-menu" id="header_sub_section_cantonese/about"><li class="subsection-item" data-testid="nav-chain-subsection-item">聯絡我們</li><li class="subsection-item" data-testid="nav-chain-subsection-item">最新廣播頻率</li><li class="subsection-item" data-testid="nav-chain-subsection-item">聲音資料</li><li class="subsection-item" data-testid="nav-chain-subsection-item">聽眾報料</li></ul></div></li><li class="section-menu--bottom-placeholder"/></ul></div></div></div></nav></header><section role="main" tabindex="-1" class="b-rfa-right-rail-article__main"><div class="c-grid b-rfa-right-rail-article__rail-container"><div class="c-stack b-rfa-right-rail-article__main-interior-item" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><div class="c-stack b-rfa-right-rail-article__main-interior-item-1" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><h1 class="b-headline">【香港法庭】兩男涉刑毀黃家駒墓碑　15歲學生還押男童院另一人准保釋候訊</h1></div><div class="c-stack b-rfa-right-rail-article__main-interior-item-info" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><div class="b-rfa-info-chain"><time as="time" class="c-date b-date" dateTime="2024-05-21T16:10:00Z">2024.05.21</time><div class="b-rfa-info-chain__share-button"/></div></div><div class="c-stack b-rfa-right-rail-article__main-interior-item-2" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" data-style-inline="false" data-style-wrap="nowrap"><article class="b-article-body"><p class="c-paragraph">香港樂隊Beyond已故主音黃家駒位於將軍澳華人永遠墳場的墳墓，周日（19 日）被人腳踢、淋汽水及以鐵錘損毀，一名15歲男學生及一名23歲男子，事後被警方拘捕。兩人同被控以一項刑事損壞罪，案件周二（21日）在觀塘裁判法院首次提堂，辯方指需時向被告提供法律意見，案件押後至6月25日再提訊，其中15歲男生申請保釋被拒，須還押屯門兒童及青少年院；另一被告就准以現金5000元保釋候訊，期間不可踏足案發地點。</p><p class="c-paragraph"><strong>案件押後至6月25日再訊</strong></p><p class="c-paragraph">兩人今早被押解至法院首次提堂，法庭亦因應案件作特別安排，公眾人士需排隊領籌才可進入法庭，今早就有多人排隊取籌進庭。</p><p class="c-paragraph">兩名被告依次為15歲男學生及報稱為冷氣技工的葉子滔（23歲）。控罪指兩人於2024年5月19日，在將軍澳華人永遠墳場15段6號台25號碑，無合法辯解而損壞黃家駒的墓碑（屬於黃家偉的財產），意圖損壞該財產或罔顧該財產是否會被損壞。</p><p class="c-paragraph">辯方今指需時向被告提供法律意見及閱讀文件，申請押後案件，並為被告申請保釋；控方就只對15歲男學生的保釋申請表示反對。署理主任裁判官劉綺雲聽罷雙方陳詞後，將案件押後至6月25日再訊，同時拒絕15歲男學生的保釋申請，下令男學生須入住屯門兒童及青少年院；至於23歲男子，則獲准以現金5000元、期間不得離港、須交出所有旅遊證件、居於報稱住址、每星期到警署報到兩次，另不得踏足案發地點及不得接觸控方證人等條件保釋。</p><p class="c-paragraph"><strong>黃家駒墓碑事後被白布圍封</strong></p><p class="c-paragraph">在案發周日早上11時許，將軍澳華人永遠墳場職員發現黃家駒的墳墓被人破壞，並當場截獲兩名涉案男子及報案。警方事後接報到場，經調查後以涉嫌刑事損壞罪拘捕涉案15歲男學生及23歲男子，最終落案起訴2人。而事後現場所見，墓碑上的黃家駒遺照被扑毀，墓碑頂結他浮雕遭黑色筆寫字塗污。</p><p class="c-paragraph">之後社交網站有一段疑為事件經過的影片流傳，顯示黃家駒墓碑被破壞的經過，當中有人在墓前高唱Beyond的歌曲《海闊天空》，然後以汽水潑淋墳墓，又以舌頭舔墓碑上的遺照及墓碑頂上的結他浮雕，隨後有人對鏡頭食拜祭鮮花。一名男子之後以黑色筆在墓碑上寫字及塗污結他浮雕，又用腳踢向墳墓，最後以一柄鐵錘多番扑砸黃家駒的遺照至損毀。</p><p class="c-paragraph">事件轟動全城，有Beyond成員及歌迷表示震怒，黃家駒墓碑事後被白布圍封，有歌迷就專程帶同鮮花及黃家駒生前喜好的可樂到場致祭及冒雨獻花。</p><p class="c-paragraph">案件編號：KTCC984/2024</p><p class="c-paragraph">粵語組報道 編輯：施芷珊 網編：池煥衡</p></article></div></div><aside class="c-stack b-rfa-right-rail-article__main-right-rail" data-style-direction="vertical" data-style-justification="start" data-style-alignment="unset" dat
