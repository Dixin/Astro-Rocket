                <h1>麋先生朝聖Beyond錄音室&#x3000;彈黃家駒古董吉他驚呆標價</h1>
                <div class="publish">
                    2026-04-04 16:53 / 作者 黃于珊 
                    <div class="header__share p-0">
                        
                        
                        
                        
                    </div>
                </div>
                <div class="news-box-text border">
                        <img src="https://image.taisounds.com/newsimages/img/2026/0404/afd1cc84f4e54dc88ca021e8bdfa9ba0.jpg" style="margin:0 auto;display:block;" alt="">
                        <div class="mbt-text">
                            <span class="text-truncate-2">
                                麋先生朝聖Beyond「二樓後座」錄音室。相信音樂提供
                            </span>
                        </div>
                    金曲樂團「麋先生」上周飛到香港擔任「五月天」演唱會嘉賓，除抽空到搖滾樂團Beyond「二樓後座」錄音室朝聖找靈感，更前往Beyond鼓手葉世榮推薦的一家老店，世榮透露黃家駒最愛吃「煎豬扒、羅宋湯及1個餐包」，而他自己則有時會吃牛排，麋先生品嚐Beyond同款美食，他們形容這趟既是「朝聖之旅」，也是「美食之旅」，鼓手逸凡飽餐後直說：「我覺得我可以solo 40分鐘！」<br/><br/>「二樓後座」錄音室是Beyond於80年代末至90年代的重要創作基地，多首經典作品皆在此誕生，麋先生得知錄音室所在的大廈將於4月9日後被拆除重建後感嘆：「這個代表著香港搖滾歷史的地方很珍貴，如今將從此消失，真的好可惜，幸好我們趕得上這最後一波參觀。」<br/><br/><div class="imgcss"><img src="https://image.taisounds.com/newsimages/img/2026/0404/20260404165236.jpg"/></div><div>喆安榮幸試彈黃家駒40年珍藏吉他。相信音樂提供</div><br/>主唱聖皓表示：「Beyond在我們心目中是一個非常經典的樂團，都有聽過他們的歌，這1次親身走到他們的錄音室工作室，是非常感動跟震撼，踏進去就像走進他們的故事裡面，真實感受到那些曾經在耳機裡面的音樂。」<br/><br/>吉他手喆安拿起黃家駒1987年的古董吉他試彈，直呼：「這把吉他是前輩等級，資歷比我們還深。」吉他上標價90幾萬港幣（約367萬元台幣）讓他們嚇一跳，最後才知道那個價錢貼是黃貫中搞笑寫上去的。<br/><br/>而逸凡獲得葉世榮送贈的鼓棍，他透露將會在4月香港演唱會時使用這份珍貴的紀念品，被問到會否效法葉世榮當年演唱會solo 20分鐘，他笑言：「如果大家真的這麼想看，我是絕對奉陪的。」
