                        <p>今年黃家駒逝世廿二周年，Beyond成員葉世榮向紅館查詢檔期，打算邀黃家強及黃貫中將Beyond合體，舉行慈善演唱會紀念家駒，對於歌迷來說絕對是喜事一則，但近年頻爆罵戰的黃家強及黃貫中已成陌路人，家強更直言生生世世不想與阿Paul見面，連同台分開唱也不肯，但支持世榮想法絕對不變！</p>
<p>原本葉世榮是一番好意，打算集齊Beyond三子做演唱會來紀念黃家駒逝世廿二周年，可惜黃家強跟黃貫中（Paul）的積怨太深，「合體」根本很難。</p>
<p>家強說：「早前首次收到世榮的提議時，我表示全力支持他，但詳細真的未討論。其實任何人願意為家駒出一分力我都會支持，像每年好多喜歡家駒的人都會搞很多紀念音樂會，絕對是一件好事，由一眾愛好音樂的年青人唱出Beyond的歌會令我很感動，我眼中沒有『消費死人』的字眼，這是一份心意，可以延續整個精神。」那麼可以跟阿Paul同台嗎？「我願意做，但不會與阿Paul做，他參與我亦不會做，更何況同台唱？如果世榮真的舉行紀念演唱會，我很樂意以嘉賓身份獨唱或與世榮合唱。其實今年與蘇永康、任賢齊及梁漢文組成的『男人幫』工作已排滿，假如真的做紀念演唱會需要很多時間，練歌都要半個月，所以今年都沒有時間去做。」</p>
<p>三子的宿命</p>
<p>兄弟決裂，已是事實，家強說這是三子的宿命，自己早早認命了，「人生很多起跌，家駒離開了廿多年，起初有六年時間我們以三人組合延續Beyond，但當中感到吃力，坦白說內部的壓力很大，反而之後自己作個人發展更開心，可以做出自己喜愛的音樂。其實我們三人已是一種宿命，互相要還的債都已經還清。如今我真的不想見到他，不想與他有任何輕微的接觸，生生世世都不想見。」問到為什麼會演變成這樣，家強說：「可能我是家駒的弟弟這個身份令他感到很不舒服，因為哥哥的成就實在將我們遮蓋得很嚴重，如果你認命就會活得較好，若然你不認命或不接受現實的話，只會活得更辛苦；而他可能覺得我不肯放下家駒的名字的話，會影響到他的事業，但這是我親哥哥，而且受萬人愛戴，作為弟弟的我，希望令更多人愛戴我哥哥，可能這種做法他就是不喜歡吧。或許他想我完全連黃家駒的名字都不要再提，這就是我感覺得到他不喜歡我的原因。」</p>
<p>黃家強去年於微博發出「死全家」毒誓千字文，說出他與Beyond前經理人陳健添（Leslie）及阿Paul的恩怨，文章中說當年Beyond拆夥，是阿Paul嫌棄葉世榮賺錢能力有限，及不滿酬勞分配不公是導火線，雖然事隔大半年，但原來家強的怒火仍未熄滅，「去年年底，他已超越了我的底線，我才發出微博回應事件，這篇文章已經將大家多年的友情歇斯底里地推翻了，多年來，我以為不去理會他，就會有停止的一刻，但原來是沒完沒了，自己亦忍受了兩年的時間才將事情寫出來。講真，說到忍受，其實十多年來皆如是，只是當時沒有拿出來讓公眾知道；當發現對方原來不單止不保護我，更將我說給他聽的事轉告別人之外，我又為何要保護他？暫時大家真的沒任何辦法去解決及改善關係。之前很多事情發生了但我不知道，不知道就不會有是非，所以很多重組或紀念騷仍可繼續，但當知道，令你無路可退了，才會發展到如今地步。」</p>
<p>越過底線</p>
<p>家強表示自己亦曾誠心原諒對方，可惜對方仍然繼續越其底線，「其實〇八年，為了他不要經常於外面罵我，我有親自打電話給他，希望大家都不要計較太多以前的事，為了家駒可以破冰，自己真心做出修補及忍讓，用行動來將事件淡化，但他在一三年又無緣無故於微博及媒體訪問中不停辱罵我，不停指我是『六月歌手』（家駒死忌是六月三十日），消費死人，花光了哥哥的錢，明白事理的人都會知道我不能動用哥哥的賠償金，最後就連我們之間一些不為人知的不開心經歷都照樣對人說，又說我拿了他的結他不還，我真的很傷心。」既然兄弟情不再，再見也不是朋友，家強情願不見。</p>
<p>對於家強不肯在家駒的紀念騷中同台合作，問阿Paul有何感想，他的助手說：「阿Paul忙於錄音，暫時不接受訪問。」●</p>
