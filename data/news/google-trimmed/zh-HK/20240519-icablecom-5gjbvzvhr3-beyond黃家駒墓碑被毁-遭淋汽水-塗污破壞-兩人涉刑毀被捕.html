<div id="post-228504" class="cscra-blog-post post-228504 post type-post status-publish format-standard has-post-thumbnail hentry category-37 category-44484 category-45004">
  <div class="cscra-unit-fix">
    
    <article class="post-detail-wrap" data-post-id="228504" data-post-type="post" data-post-url="https://www.i-cable.com/%e6%96%b0%e8%81%9e%e8%b3%87%e8%a8%8a/228504/beyond%E4%B8%BB%E9%9F%B3%E9%BB%83%E5%AE%B6%E9%A7%92%E5%A2%93%E7%A2%91%E9%81%AD%E6%B7%8B%E6%B1%BD%E6%B0%B4-%E5%A1%97%E6%B1%A1%E7%A0%B4%E5%A3%9E-%E5%85%A9%E4%BA%BA%E6%B6%89%E5%88%91" data-title="Beyond黃家駒墓碑被毁｜遭淋汽水、塗污破壞　兩人涉刑毀被捕" data-author="有線新聞" data-publish-date="2024年05月19日" data-hero-image="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/20000446/20240519BEYOND.jpg">
      
      <h1 class="zh-h4 single-post-title">Beyond黃家駒墓碑被毁｜遭淋汽水、塗污破壞　兩人涉刑毀被捕</h1>

      
      <div class="post-info">
        <div class="post-meta single-post-meta">
          <ul>
                          <li><i class="fa fa-user-o" aria-hidden="true"/>有線新聞</li>
                          <li><i class="fa fa-clock-o" aria-hidden="true"/>2024年05月19日</li>
                      </ul>
        </div>
      </div>

      
        <div class="post-image">
    </div>







      

      
      <div class="cable-in-article-ad-container">
        
      </div>

      <p>【有線新聞】樂隊Beyond已故主音黃家駒墓碑今晨（19日）遭人塗污破壞，並以鐵錘狂砸。警方經調查後，拘捕兩名涉案男子，分別15及23歲。</p>
<figure id="attachment_228509" aria-describedby="caption-attachment-228509" style="width: 474px" class="wp-caption aligncenter"><noscript><img class="wp-image-228509 size-full" src="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223502/1-2-9.jpg" alt="" width="474" height="794" srcset="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223502/1-2-9.jpg 474w, https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223502/1-2-9-179x300.jpg 179w" sizes="(max-width: 474px) 100vw, 474px" data-eio="l"/></noscript><figcaption id="caption-attachment-228509" class="wp-caption-text">男子手持鐵錘狂砸墓碑。網上影片截圖</figcaption></figure>
<figure id="attachment_228512" aria-describedby="caption-attachment-228512" style="width: 485px" class="wp-caption aligncenter"><noscript><img class="wp-image-228512 size-full" src="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223526/4-18.jpg" alt="" width="485" height="809" srcset="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223526/4-18.jpg 485w, https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223526/4-18-180x300.jpg 180w" sizes="(max-width: 485px) 100vw, 485px" data-eio="l"/></noscript><figcaption id="caption-attachment-228512" class="wp-caption-text">男子向黃家駒的墓碑淋潑可樂。網上影片截圖</figcaption></figure>
<p>涉事影片在各在社交平台流傳，引起不少網民及歌迷憤怒。根據網上流傳的影片可見，一名身穿白衣的光頭男子在將軍澳華人永遠墳場，不斷向黃家駒的墓碑淋潑可樂，隨後上前舔走，又以粗口辱罵黃家駒。他又自稱是「社會破壞者」，用筆在墓碑上寫字並塗污黃家駒的遺照，又踩踏墓前由歌迷送贈的花束。</p>
<figure id="attachment_228541" aria-describedby="caption-attachment-228541" style="width: 533px" class="wp-caption aligncenter"><noscript><img class="wp-image-228541 size-full" src="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/20002546/4542.jpg" alt="" width="533" height="754" srcset="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/20002546/4542.jpg 533w, https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/20002546/4542-212x300.jpg 212w" sizes="(max-width: 533px) 100vw, 533px" data-eio="l"/></noscript><figcaption id="caption-attachment-228541" class="wp-caption-text">男子親吻黃家駒的遺照。網上影片截圖</figcaption></figure>
<p>而另一段影片則可見，光頭男子手持鐵錘狂砸墓碑，又親吻黃家駒的遺照，並向自己身上淋汽水。期間他一度向鏡頭表示「認住我」。</p>
<figure id="attachment_228510" aria-describedby="caption-attachment-228510" style="width: 486px" class="wp-caption aligncenter"><noscript><img class="wp-image-228510 size-full" src="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223510/2-24.jpg" alt="" width="486" height="815" srcset="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223510/2-24.jpg 486w, https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223510/2-24-179x300.jpg 179w" sizes="(max-width: 486px) 100vw, 486px" data-eio="l"/></noscript><figcaption id="caption-attachment-228510" class="wp-caption-text">男子用筆在墓碑上寫字並塗污黃家駒的遺照。網上影片截圖</figcaption></figure>
<figure id="attachment_228511" aria-describedby="caption-attachment-228511" style="width: 475px" class="wp-caption aligncenter"><noscript><img class="wp-image-228511 size-full" src="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223518/3-23.jpg" alt="" width="475" height="816" srcset="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223518/3-23.jpg 475w, https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19223518/3-23-175x300.jpg 175w" sizes="(max-width: 475px) 100vw, 475px" data-eio="l"/></noscript><figcaption id="caption-attachment-228511" class="wp-caption-text">男子用筆在墓碑上寫字並塗污黃家駒的遺照。網上影片截圖</figcaption></figure>
<p>警方表示，今早11時31分接獲報案，經調查後拘捕兩名分別15及23歲男子，案件交由刑事調查隊跟進。</p>
<p>而黃家駒的墓碑事後已蓋上白布圍封。黃家駒墓地並非首次被破壞，在2009年、2018年及2019年，其墓碑曾被人塗污，寫下字句。</p>
<figure id="attachment_228518" aria-describedby="caption-attachment-228518" style="width: 509px" class="wp-caption aligncenter"><noscript><img class="wp-image-228518 size-full" src="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19225124/5-11.jpg" alt="" width="509" height="878" srcset="https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19225124/5-11.jpg 509w, https://icable-prod.s3.ap-southeast-1.amazonaws.com/wp-content/uploads/2024/05/19225124/5-11-174x300.jpg 174w" sizes="(max-width: 509px) 100vw, 509px" data-eio="l"/></noscript><figcaption id="caption-attachment-228518" class="wp-caption-text">男子向自己身上淋汽水。網上影片截圖</figcaption></figure>
