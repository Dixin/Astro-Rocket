			<div class="entry-content">
				<div id="wtr-content" data-bg="#FFFFFF" data-fg="#05a6fb" data-width="9" data-mute="0" data-fgopacity="1.00" data-mutedopacity="0.5" data-placement="top" data-placement-offset="0" data-content-offset="0" data-placement-touch="top" data-placement-offset-touch="0" data-transparent="" data-shadow="1" data-touch="" data-non-touch="1" data-comments="0" data-commentsbg="#05a6fb" data-location="page" data-mutedfg="#05a6fb" data-endfg="#f44813" data-rtl=""><p>墨新聞｜記者梁偉華／台北報導</p>
<p><img decoding="async" src="https://more-news.tw/wp-content/uploads/2026/05/%E5%BC%B5%E4%B9%8B%E4%BA%AE%E5%9F%B7%E5%B0%8E%E7%9A%84%E3%80%8A%E7%B1%A0%E6%B0%91%E3%80%8B%EF%BC%88Cageman%EF%BC%89%E6%9C%80%E6%96%B04K%E4%BF%AE%E5%BE%A9%E7%89%88%EF%BC%8C%E7%82%BA%E5%82%B3%E5%A5%87%E6%90%96%E6%BB%BE%E6%A8%82%E5%9C%98Beyond%E4%B8%BB%E5%94%B1%E9%BB%83%E5%AE%B6%E9%A7%92%E7%95%99%E4%B8%8B%E9%8A%80%E5%B9%95%E6%9C%80%E5%BE%8C%E8%BA%AB%E5%BD%B1%E3%80%82.jpg" alt=""/></p>

<p>2026第28屆台北電影節今（8）日釋出「經典重現」單元共11部精湛大作，包括由張之亮執導、傳奇樂團Beyond主唱黃家駒出演的《籠民》4K修復版、台灣校園青春電影鼻祖《拒絕聯考的小子：導演版》2K修復、日本名導三宅唱最初鳴放作《無路用之人》和《Playback》，以及喬瑟夫・高登－李維年輕胴體大展驚人演技的酷兒爭議之作《神秘肌膚》4K修復版，都將獻映北影大銀幕。此外，今年重磅推出第二位焦點影人，被視作「阿拉伯影壇最具國際影響力」的導演尤瑟夫．夏因，將透過《開羅車站》、《港都舊事》、《浮光掠影》等6部數位修復鉅作，帶領觀眾回望橫跨半世紀的影史崢嶸。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610547" src="https://more-news.tw/wp-content/uploads/2026/05/%E5%A0%AA%E7%A8%B1%E9%98%BF%E6%8B%89%E4%BC%AF%E5%BD%B1%E5%8F%B2%E9%87%8C%E7%A8%8B%E7%A2%91%E7%9A%84%E3%80%8A%E9%96%8B%E7%BE%85%E8%BB%8A%E7%AB%99%E3%80%8B%EF%BC%88Cairo-Station%EF%BC%89%EF%BC%8C%E5%A4%8F%E5%9B%A0%E8%A6%AA%E4%B8%8A%E9%8F%A1%E9%A0%AD%E6%BC%94%E6%B4%BB%E7%94%B7%E4%B8%BB%E8%A7%92%EF%BC%8C%E5%88%BB%E7%95%AB%E6%80%A7%E5%A3%93%E6%8A%91%E8%88%87%E9%9A%8E%E7%B4%9A%E6%8B%89%E6%89%AF%E4%B8%8B%E7%9A%84%E9%9C%87%E7%9B%AA%E5%BF%83%E7%90%86%E3%80%82.jpg" alt="" width="8000" height="4500">堪稱阿拉伯影史里程碑的《開羅車站》（Cairo Station），夏因親上鏡頭演活男主角，刻畫性壓抑與階級拉扯下的震盪心理。    照片提供：台北電影節</img></p>
<p>「M+修復」項目之一、第二波香港新浪潮導演張之亮執導的《籠民》（Cageman）最新4K修復版，取材自深水埗籠屋火災真實事件，聚焦一眾社會底層男子，蝸居鐵籠屋和老鼠為鄰、及時行樂，當迫遷危機逼近，該留守抵抗或向錢低頭？長鏡頭直搗市井生存狹縫，一舉囊括1993年香港電影金像獎最佳電影、導演、編劇及男配角四項大獎，也為傳奇搖滾樂團Beyond主唱黃家駒留下銀幕最後身影。</p><div id="marke-3148872293" class="marke- marke-entity-placement"><ins class="adsbygoogle" style="display:block;" data-ad-client="ca-pub-3348417142036558" data-ad-slot="9354296989" data-ad-format="auto"/>

</div>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610532" src="https://more-news.tw/wp-content/uploads/2026/05/%E3%80%8A%E6%8B%92%E7%B5%95%E8%81%AF%E8%80%83%E7%9A%84%E5%B0%8F%E5%AD%90%EF%BC%9A%E5%B0%8E%E6%BC%94%E7%89%88%E3%80%8B%EF%BC%88The-Fellow-Who-Rejected-College_-Directors-Cut%EF%BC%892K%E4%BF%AE%E5%BE%A9%E4%BD%9C%E7%82%BA%E5%BE%90%E9%80%B2%E8%89%AF%E5%9F%B7%E5%B0%8E%EF%BC%8C%E8%AE%93%E6%B8%85%E6%96%B0%E4%BA%AE%E7%9B%B8%E7%9A%84%E5%A5%B3%E4%B8%BB%E8%A7%92%E5%BD%AD%E9%9B%AA%E8%8A%AC%E4%B8%80%E7%82%AE%E8%80%8C%E7%B4%85%E3%80%82.jpg" alt="" width="1920" height="1080">《拒絕聯考的小子：導演版》（The Fellow Who Rejected College_ Director’s Cut）2K修復、徐進良執導，讓清新亮相的女主角彭雪芬(左)一炮而紅。   照片提供：台北電影節</img></p>
<p>國家電影及視聽文化中心修復的《拒絕聯考的小子：導演版》（The Fellow Who Rejected College: Director’s Cut）2K修復作為徐進良執導，故事改編自吳祥輝同名暢銷自傳小說，上映當年便掀起台灣校園電影風潮，也讓清新亮相的女主角彭雪芬一炮而紅。大學聯考在即，建中班長因與女高中生相戀遭對方家長責難，又目睹學長因落榜崩潰，他開始質疑升學體制，以拒絕考試迎擊主流價值。本片獲作家三毛盛讚為「台灣版《麥田捕手》」，是戒嚴時期直指教育困境、探問青春出路的犀利之作。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610542" src="https://more-news.tw/wp-content/uploads/2026/05/%E4%B8%89%E5%AE%85%E5%94%B1%EF%BC%88MIYAKE-Sho%EF%BC%89%E7%AC%AC%E4%BA%8C%E9%83%A8%E9%95%B7%E7%89%87%E3%80%8APlayback%E3%80%8B%EF%BC%88Playback%EF%BC%89%E5%85%A5%E9%81%B8%E7%9B%A7%E5%8D%A1%E8%AB%BE%E5%BD%B1%E5%B1%95%E4%B8%BB%E7%AB%B6%E8%B3%BD%EF%BC%8C%E4%B8%80%E8%88%89%E8%BA%8D%E9%80%B2%E5%9C%8B%E9%9A%9B%E5%BD%B1%E5%A3%87%E8%A6%96%E9%87%8E%E3%80%82.jpg" alt="" width="1920" height="1080">三宅唱（MIYAKE Sho）首部長片《無路用之人》（Good for Nothing）便展露善於捕捉光影流動的調度美學，精準呈現飄忽而孤獨的青春質地。 照片提供：台北電影節</img></p><div id="marke-3152807554" class="marke- marke-entity-placement"><ins class="adsbygoogle" style="display:block;" data-ad-client="ca-pub-3348417142036558" data-ad-slot="9354296989" data-ad-format="auto"/>

</div>
<p>為實現影迷心願，北影特別選映日本中生代名導三宅唱（MIYAKE Sho）兩部早期傑作。三宅唱在首部長片《無路用之人》（Good for Nothing）便展露善於捕捉光影流動的調度美學，以冷冽的札幌雪地為背景，精準呈現飄忽而孤獨的青春質地。三位無意升學的高校生進入保全公司，試圖在職場的規則與節奏裡站穩腳跟，證明自己已是個「大人」，但層層遞進的考驗動搖最初的決心，逐漸身陷難以名狀的挫折之中。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610541" src="https://more-news.tw/wp-content/uploads/2026/05/%E4%B8%89%E5%AE%85%E5%94%B1%EF%BC%88MIYAKE-Sho%EF%BC%89%E9%A6%96%E9%83%A8%E9%95%B7%E7%89%87%E3%80%8A%E7%84%A1%E8%B7%AF%E7%94%A8%E4%B9%8B%E4%BA%BA%E3%80%8B%EF%BC%88Good-for-Nothing%EF%BC%89%E4%BE%BF%E5%B1%95%E9%9C%B2%E5%96%84%E6%96%BC%E6%8D%95%E6%8D%89%E5%85%89%E5%BD%B1%E6%B5%81%E5%8B%95%E7%9A%84%E8%AA%BF%E5%BA%A6%E7%BE%8E%E5%AD%B8%EF%BC%8C%E7%B2%BE%E6%BA%96%E5%91%88%E7%8F%BE%E9%A3%84%E5%BF%BD%E8%80%8C%E5%AD%A4%E7%8D%A8%E7%9A%84%E9%9D%92%E6%98%A5%E8%B3%AA%E5%9C%B0%E3%80%82.jpg" alt="" width="1920" height="1080">三宅唱（MIYAKE Sho）首部長片《無路用之人》（Good for Nothing）便展露善於捕捉光影流動的調度美學，精準呈現飄忽而孤獨的青春質地。照片提供：台北電影節</img></p>
<p>三宅唱以第二部長片《Playback》（Playback）入選盧卡諾影展主競賽，一舉躍進國際影壇視野。失意演員離婚後意外以中年軀體重返青春現場，昔日情感記憶、抉擇與後悔再次顯現，他該如何清醒回到未來？本片取景311福島核災後的茨城縣，透過村上淳細膩演繹與鏡頭層疊光影，將這場「回放」安放於幻夢與現實之間，在災後地景的不安中透出重生意象。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610545" src="https://more-news.tw/wp-content/uploads/2026/05/%E8%91%9B%E7%91%9E%E6%A0%BC%E3%83%BB%E8%8D%92%E6%9C%A8%EF%BC%88Gregg-ARAKI%EF%BC%89%E5%9F%B7%E5%B0%8E%E7%9A%84%E3%80%8A%E7%A5%9E%E7%A7%98%E8%82%8C%E8%86%9A%E3%80%8B%EF%BC%88Mysterious-Skin%EF%BC%894K%E4%BF%AE%E5%BE%A9%E7%89%88%EF%BC%8C%E9%9D%92%E6%BE%80%E7%9A%84%E5%96%AC%E7%91%9F%E5%A4%AB%E3%83%BB%E9%AB%98%E7%99%BB%EF%BC%8D%E6%9D%8E%E7%B6%AD%E8%A9%AE%E9%87%8B%E8%A7%92%E8%89%B2%E8%BB%80%E9%AB%94%E9%BA%BB%E6%9C%A8%E8%88%87%E5%85%A7%E5%BF%83%E6%9A%97%E6%B9%A7%E3%80%82.jpg" alt="" width="1920" height="1080"> 葛瑞格・荒木（Gregg ARAKI）執導的《神秘肌膚》（Mysterious Skin）4K修復版，青澀的喬瑟夫・高登－李維詮釋角色軀體麻木與內心暗湧。  照片提供：台北電影節</img></p>
<p>新酷兒電影名家葛瑞格・荒木（Gregg ARAKI）執導的《神秘肌膚》（Mysterious Skin）4K修復版，以雙線敘事切入兒童禁忌情慾，20年後仍震撼道德邊際。加入棒球隊的兩位男孩初探慾望，殘酷痕跡烙印身體，回憶旋繞著騷動的青春，駭人真相逐漸清晰。青澀的喬瑟夫・高登－李維在片中化身漂泊男妓，詮釋角色軀體麻木與內心暗湧，驚艷卻也叫人心碎。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610537" src="https://more-news.tw/wp-content/uploads/2026/05/%E3%80%8A%E6%B5%AE%E5%85%89%E6%8E%A0%E5%BD%B1%E3%80%8B%EF%BC%88An-Egyptian-Story%EF%BC%89%E4%BB%A5%E9%A2%A8%E6%A0%BC%E5%8C%96%E5%BD%A2%E5%BC%8F%E8%9E%8D%E5%8C%AF%E5%A4%A2%E5%A2%83%E3%80%81%E5%9B%9E%E6%86%B6%E8%88%87%E7%B4%80%E9%8C%84%E5%BD%B1%E5%83%8F%EF%BC%8C%E6%98%AF%E8%87%AA%E5%82%B3%E9%9B%BB%E5%BD%B1%E4%B8%AD%E9%9B%86%E5%AF%A6%E9%A9%97%E6%80%A7%E8%88%87%E5%BF%83%E7%90%86%E6%84%8F%E6%B6%B5%E7%9A%84%E5%A4%A7%E6%88%90%E4%B9%8B%E4%BD%9C%E3%80%82.jpg" alt="" width="1920" height="1080">《浮光掠影》（An Egyptian Story）以風格化形式融匯夢境、回憶與紀錄影像，是自傳電影中集實驗性與心理意涵的大成之作。 照片提供：台北電影節</img></p>
<p>尤瑟夫．夏因（Youssef CHAHINE）創作近60年，累積超過40部作品，身兼導演、演員、製片，影像語言涵括義大利新寫實主義、音樂劇與心理象徵敘事，擅於以小人物的故事叩問階級衝突、政治壓迫與宗教問題。夏因於1997年獲得坎城影展50週年紀念獎，是阿拉伯影史最具國際影響力的導演，今年適逢其百年誕辰，北影將選映其撼動影壇的6部數位修復代表作，追緬這位埃及大師的創作軌跡。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610535" src="https://more-news.tw/wp-content/uploads/2026/05/%E3%80%8A%E7%82%99%E7%86%B1%E7%9A%84%E5%A4%AA%E9%99%BD%E3%80%8B%EF%BC%88The-Blazing-Sun%EF%BC%89%E4%BB%A5%E6%96%B0%E5%AF%AB%E5%AF%A6%E9%AA%A8%E5%B9%B9%E6%8F%89%E5%90%88%E9%80%9A%E4%BF%97%E5%8A%87%E6%83%85%EF%BC%8C%E5%89%96%E6%9E%90%E9%9A%8E%E7%B4%9A%E6%AC%8A%E5%8A%9B%E7%B5%90%E6%A7%8B%E3%80%82.jpg" alt="" width="1920" height="1080">《炙熱的太陽》（The Blazing Sun）以新寫實骨幹揉合通俗劇情，剖析階級權力結構。  照片提供：台北電影節</img></p>
<p>《炙熱的太陽》（The Blazing Sun）敘述返鄉男子用技術振興農民經濟，卻招致地主疑忌陷害，讓父親蒙冤而死，他躲避階級陰謀操弄，毅然追查真相。本片以新寫實骨幹揉合通俗劇情，剖析階級權力結構，亦是《阿拉伯的勞倫斯》、《齊瓦哥醫生》主角奧瑪・雪瑞夫出道之作。</p>
<p>堪稱阿拉伯影史里程碑的《開羅車站》（Cairo Station），描述一名在車站謀生的跛腳青年癡迷賣汽水的姑娘，求愛被拒後變得偏執狂暴，一步步走向毀滅結局。夏因將實景融合黑色電影風格，親上鏡頭演活男主角，刻畫性壓抑與階級拉扯下的震盪心理。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610531" src="https://more-news.tw/wp-content/uploads/2026/05/%E3%80%8A%E7%8E%8B%E8%80%85%E8%96%A9%E6%8B%89%E4%B8%81%E3%80%8B%EF%BC%88Saladin%EF%BC%89%E7%82%BA%E5%A4%8F%E5%9B%A0%E9%9B%86%E6%94%BF%E6%B2%BB%E5%AF%93%E6%84%8F%E5%8F%8A%E5%BD%B1%E5%83%8F%E7%BE%8E%E5%AD%B8%E9%87%8E%E5%BF%83%E7%9A%84%E4%BB%A3%E8%A1%A8%E4%BD%9C%EF%BC%8C%E6%A7%8B%E7%AF%89%E6%B3%9B%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B0%91%E6%97%8F%E8%88%87%E5%8F%8D%E5%B8%9D%E5%9C%8B%E4%B8%BB%E7%BE%A9%E8%A6%96%E8%A7%92%E6%AD%B7%E5%8F%B2%E3%80%82.jpg" alt="" width="1920" height="1080">《王者薩拉丁》（Saladin）為夏因集政治寓意及影像美學野心的代表作，構築泛阿拉伯民族與反帝國主義視角歷史。照片提供：台北電影節</img></p>
<p>《王者薩拉丁》（Saladin）為夏因集政治寓意及影像美學野心的代表作，故事聚焦十字軍佔據耶路撒冷並屠殺穆斯林，薩拉丁領軍討伐成功，卻旋即被迫和英王查理對峙談判。本片以浩瀚史詩場面、精密調度軍隊征戰群戲，構築泛阿拉伯民族與反帝國主義視角歷史。</p>
<p>改編自埃及同名小說的《大地》（The Land）被視為反殖民秩序的階級寓言，以血與泥強烈視覺，將土地衍伸為個體和社會身份的具象表徵，呈現被地主及權貴鎮壓下的農民，在組織抗爭與壯烈犧牲間凝聚集體意識。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610539" src="https://more-news.tw/wp-content/uploads/2026/05/%E3%80%8A%E6%B8%AF%E9%83%BD%E8%88%8A%E4%BA%8B%E3%80%8B%EF%BC%88Alexandria.-Why_%EF%BC%89%E4%BA%A4%E9%8C%AF%E5%89%AA%E8%BC%AF%E8%99%9B%E6%A7%8B%E5%8A%87%E6%83%85%E5%92%8C%E6%96%B0%E8%81%9E%E7%89%87%E6%AE%B5%EF%BC%8C%E6%8C%91%E6%88%B0%E5%AF%AB%E5%AF%A6%E7%96%86%E7%95%8C%EF%BC%8C%E5%8B%87%E5%A5%AA1979%E5%B9%B4%E6%9F%8F%E6%9E%97%E5%BD%B1%E5%B1%95%E8%A9%95%E5%AF%A9%E5%9C%98%E7%89%B9%E5%88%A5%E7%8D%8E%E3%80%82.jpg" alt="" width="1920" height="1080">《港都舊事》（Alexandria… Why_）交錯剪輯虛構劇情和新聞片段，挑戰寫實疆界，勇奪1979年柏林影展評審團特別獎。照片提供：台北電影節</img></p>
<p>夏因自傳性作品「亞歷山大四部曲」序章《港都舊事》（Alexandria… Why?），從志願成為好萊塢演員的少年眼中，見證民族衝突、他人愛慾及政治覺醒，在自我追尋中成長。夏因交錯剪輯虛構劇情和新聞片段，挑戰寫實疆界，顯影出不同世代文化下的亞歷山大港，並憑此作勇奪1979年柏林影展評審團特別獎。第二部曲《浮光掠影》（An Egyptian Story）則述說手術台上生死一線的男子，意識開始播映人生跑馬燈，回溯幼年創傷、家庭關係到導演職涯。本作亦承續風格化形式，融匯夢境、回憶與紀錄影像，是自傳電影中集實驗性與心理意涵的大成之作。</p>
<p><img loading="lazy" decoding="async" class="alignnone size-full wp-image-610546" src="https://more-news.tw/wp-content/uploads/2026/05/%E6%94%B9%E7%B7%A8%E8%87%AA%E5%9F%83%E5%8F%8A%E5%90%8C%E5%90%8D%E5%B0%8F%E8%AA%AA%E7%9A%84%E3%80%8A%E5%A4%A7%E5%9C%B0%E3%80%8B%EF%BC%88The-Land%EF%BC%89%E8%A2%AB%E8%A6%96%E7%82%BA%E5%8F%8D%E6%AE%96%E6%B0%91%E7%A7%A9%E5%BA%8F%E7%9A%84%E9%9A%8E%E7%B4%9A%E5%AF%93%E8%A8%80%EF%BC%8C%E5%B0%87%E5%9C%9F%E5%9C%B0%E8%A1%8D%E4%BC%B8%E7%82%BA%E5%80%8B%E9%AB%94%E5%92%8C%E7%A4%BE%E6%9C%83%E8%BA%AB%E4%BB%BD%E7%9A%84%E5%85%B7%E8%B1%A1%E8%A1%A8%E5%BE%B5%E3%80%82.jpg" alt="" width="1920" height="1080">改編自埃及同名小說的《大地》（The Land）被視為反殖民秩序的階級寓言，將土地衍伸為個體和社會身份的具象表徵。  照片提供：台北電影節</img></p>
<p>2026第28屆台北電影節將於6月26日至7月11日在臺北市中山堂、光點華山電影館、誠品電影院舉行，影展精彩片單與活動將陸續公布，「台北電影獎」及會外賽入圍名單將於5月15日公布，「國際新導演競賽」入圍名單將於5月12日公布，更多資訊請見官方網站：https://www.taipeiff.taipei/tw/。</p><div id="marke-57521501" class="marke- marke-entity-placement"><ins class="adsbygoogle" style="display:block;" data-ad-client="ca-pub-3348417142036558" data-ad-slot="9354296989" data-ad-format="auto"/>

</div>
<p>此篇文章最開始出處為: 北影重現11部經典 Beyond 黃家駒 喬瑟夫 高登 李維演出作品及三宅唱早期傑作重磅回歸 </p>
