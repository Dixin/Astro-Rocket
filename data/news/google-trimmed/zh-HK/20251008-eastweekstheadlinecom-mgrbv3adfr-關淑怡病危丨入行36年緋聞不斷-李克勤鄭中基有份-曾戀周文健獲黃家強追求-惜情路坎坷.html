                                    <p>59歲關淑怡（Shirley）日前被《東周刊》獨家披露傳因急病送入深切治療部搶救，情況危殆。關淑怡自1986年參加第五屆新秀歌唱大賽入行，一曲《難得有情人》令她嶄露頭角。出道36年來，除了音樂事業起伏外，感情生活亦備受關注。</p><p><strong>延伸內容：獨家再爆關淑怡最新病情 接受幾小時大手術搶救 全身插滿喉管住ICU</strong></p><p><strong>延伸內容：獨家爆關淑怡傳病危急送ICU 家人連日醫院守候 23歲兒子愁眉深鎖</strong></p><h2>關淑怡緋聞男友多籮籮</h2><p>關淑怡的緋聞男友多籮籮，包括同期寶麗金唱片公司的李克勤和鄭中基；前者因合唱而傳譜出姊弟戀，後者因曾一齊外遊。另外還有唱片公司高層朱浩棠及Beyond成員黃家強，黃家強曾自爆對Shirley有好感，早年曾追求過她，惜最後未能成為戀人。</p><h2>公開承認戀人只有周文健</h2><p>關淑怡曾公開承認的戀人就只有周文健，兩人拍拖4年，可惜男方因事業發展而不肯公開戀情。2002年，關淑怡未婚誕下兒子關浚賢，生父身份成謎。直到2014年，她才在社交平台透露兒子生父是不丹寧波車，並公開指責對方對兒子不聞不問。</p><h2>成為單親媽媽仍緋聞不斷</h2><p>關淑怡即使成為單親母親，她的感情生活依然精彩，曾與年輕22歲的北京主持人李佳念手拖手現身，還有外籍舞蹈員Milton Lopes對她的熱烈追求兼公開示愛。2016年，有指她因感情問題，在愉景灣海灘發生離奇墜海事件，引起各界關注。至2020年，關淑怡宣布退出樂壇，如今傳出病危消息，令樂迷倍感憂心。</p><gallery-1/><hr><h3><strong>《東周網》訪談系列節目《星桄伴我心》9月重磅嘉賓：<br>即睇：羅毓儀淚眼訴說4段情 冧數林俊其出「七連招」追求 甜蜜剖白：我想出年結婚！<br>即睇：鄭子誠感動細訴與劉倩怡「手指公」情緣 爆因黃夏蕙變奸 因陳百強變成偷渡客 </br></br></strong></h3><img src="https://ew-image.hkhl.hk/f/1024p0/0x0/100/none/3610a71cfa3d31a75fee8b503d0428ab/2025-10/175990975135346.jpg"><h3><strong>立即追蹤《東周刊》全新WhatsApp頻道，緊貼全城熱話、突發猛料、獨家消息！</strong></h3>                                    <div id="ad-LREC-m">
