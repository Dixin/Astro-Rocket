<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<P>歌唱比賽《中年好聲音2》昨日舉行第三輪海選面試，評判之一的肥媽（Maria Cordero）早前與黃家強就黃家駒遺作一事而隔空罵戰，成為最後勝利者的肥媽表示不會生氣︰「嬲人會有皺紋㗎！」</P>
<P>肥媽早前透露樂隊Beyond已故成員黃家駒寫歌給她，家駒胞弟黃家強亦有告訴她。及後，家強一度強調無講過，暗寸肥媽不尊重人，但肥媽轉貼08年家強指家駒作歌給她的報道以證清白。事後家強不開名道歉，肥媽昨日亦指事件告一段落︰「咁我真係無講大話。（家強無直接道歉？）唔使啦，都衰晒咯，最唔好係佢話自己無講過。」</P>
<P>肥媽自言不認識Beyond前經理人陳健添，「佢（陳健添）叫我唱就唱，又無收錢嘅。但最衰（家強）話無講過呀嘛，個個以為我講大話，不過咁多年可能佢又善忘。依家成件事清楚晒啦。（嬲家強？）有乜好嬲，嬲人有皺紋㗎。」</P>
<P><B>杜德智劉威煌參賽</B></P>
<P>至於昨日有不少熟悉的面孔參加海選，包括杜德偉胞兄杜德智、《超級巨聲》隊長劉威煌及姚安娜等。杜德智表示弟弟提醒他穿得貼地一點，「佢叫唔好着到登台咁，呢套衫佢睇過話OK。」劉威煌雖然有比賽經驗，但昨日表現緊張，自責唱得「核突」，「以前我開live唱歌習慣睇歌詞，可能倚賴咗，又咁多年無比賽，首歌又唔算滾瓜爛熟，瀨嘢。」他自言無信心入圍。</P>
<P>採訪︰Pauline</P>
