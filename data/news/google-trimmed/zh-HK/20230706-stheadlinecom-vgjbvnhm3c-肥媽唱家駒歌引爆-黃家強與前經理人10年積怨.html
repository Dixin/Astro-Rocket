                            <div id="conimg_0" class="content-body " itemprop="articleBody">
                                    <p>今年是Beyond成立四十周年，適逢上月是其靈魂人物黃家駒的生忌和死忌月，但竟引起不快事件。事緣，肥媽（Maria Cordero）透露，家駒生前寫了一首未發佈的歌曲給她，但卻牽動家駒胞弟黃家強的神經，開火直斥她是「謊言」；而肥媽也迅速反駁：「我肥媽唔需要抽水！」<br/>隨着事件發酵，向來火氣十足的家強，即被翻舊帳，當中與Beyond前經理人陳健添（Leslie）的積怨，自一三年爆發後，便不停隔空罵戰；期間，家強更一度以家人的性命發毒誓；可是，十年來的是非還是沒完沒了。</p><ad id="ad-1"/><article class="align-center"><div class="js-media-library-item-preview">
      
            <div class="field field--name-thumbnail field--type-image field--label-hidden field--item">  <img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/38bfee739af757d89eb0839375142072/2023-07/1036_BFL_10.jpg" width="100%" alt="肥媽感激家駒為她作下這首〈感激這對手〉，她大讚甚有對方的風格，她錄音時亦rock味十足。" typeof="foaf:Image" class="img-responsive"/></div>
      
    </div>
        <div class="img_caption">
      肥媽感激家駒為她作下這首〈感激這對手〉，她大讚甚有對方的風格，她錄音時亦rock味十足。
    </div>
  </article><h1>怒斥肥媽</h1><p>六月三十日是Beyond的靈魂人物黃家駒，逝世三十周年，故無綫日前製作特備節目《永遠光輝黃家駒》。在節目中，肥媽（Maria Cordero）透露，黃家強曾找過她，表示哥哥家駒生前寫過一首從未發佈過的歌〈感激這對手〉給她。事後，近三年沒有更新社交網的黃家強，忽然發文怒斥肥媽全是「謊言」。<br/>反應迅速的肥媽，馬上出示家駒生前留下，並寫上「肥媽」的錄音帶demo照作證，同時又表示錄製〈感激這對手〉這首歌時，源於年初的時候收到Beyond前經理人陳健添（Leslie）的邀請。她強調︰「我肥媽唔需要抽水！」<br/>最終，搞清事件的家強，再在社交平台出帖向肥媽「耍冧」︰「前輩，無論誰給你誤導了，我不想深究，能夠得到家駒的作品而你又喜歡的話，好好唱好它，已經是對家駒的一份尊重，無需要牽連其他人來感動自己。」他同時轉移視線，「希望大家能夠找到整件事的重點！誰把兩個無辜的人變成他的宣傳工具。」 據知，去年十一月，「肥媽」demo已在網上流傳，抖音亦見有人販售同一條demo tape；而demo tape由一個名為HarmoniXX的網站販售。該網站稱今次與Kinn's Music創辦人、即Beyond前經理人Leslie合作。似乎，家強的矛頭疑似是 Leslie。<br/>家強和Leslie的恩怨情仇，隨着「肥媽事件」鬧大，兩男的不和亦被翻舊帳。早於一三年， Leslie已發千字文狂轟家強，當中爆料指家強當年險被家駒逐出樂隊，幸獲黃貫中（Paul）及葉世榮相勸才有得留低。此外，他又稱另一舊成員劉志遠也因家強而離隊。其後，他推出新書《真的Beyond》及《追憶黃家駒》寫真集時，被記者問到他與家強因何不妥？Leslie指與Beyond相處六年多，對他們一視同仁，惟獨曾兩次拒讓家強唱主音，導致此事而已。<br/>不過，家強反插 Leslie出書是「消費」死人，二人在社交平台上唇槍舌劍。另外，由於Paul跟家強當時又有矛盾，Leslie又踩多一腳落去，搞到家強腹背受敵。</p><ad id="ad-2"/><gallery-1/>
