								<div id="articleContent" class="article-content-edtor">                    
                        		香港女星朱茵今（25）日迎來54歲了！外型清純甜美的朱茵在1992年憑電影《逃學威龍2》出道， 代表作有《射鵰英雄傳》、《鹿鼎記》、《西遊記大結局之仙履奇緣》等。朱茵與周星馳在《逃學威龍2》片場相識，據傳兩人曾愛得火熱，但戀情僅維持約3年便分手。2012年朱茵與搖滾樂團Beyond吉他手黃貫中結婚，如今兩人感情依舊穩定甜蜜。朱茵曾在節目中透露，當她提到前男友時，黃貫中會神情冷淡，讓朱茵明白老公對她的過去戀情相當在意，後來她也因此把前男友有關的東西丟掉、燒掉，專注珍惜眼前這段踏實的愛。<br><br>

 <figure class="image">
  <img alt="▲周星馳（左）、朱茵在拍攝《逃學威龍2》後傳出緋聞。（圖／翻攝微博）" score="0.01" sizes="(max-width: 300px) 300w, (max-width: 500px) 500w, (max-width: 800px) 800w" src="https://media.nownews.com/nn_media/thumbnail/2021/04/1617433885614-bad67304e2ff46aca7d12f5e76d5b1be-440x600.jpeg?unShow=false&amp;waterMark=false" srcset="https://media.nownews.com/nn_media/thumbnail/2021/04/1617433885614-bad67304e2ff46aca7d12f5e76d5b1be-440x600.jpeg?unShow=false&amp;waterMark=false 500w,https://media.nownews.com/nn_media/thumbnail/2021/04/1617433885614-bad67304e2ff46aca7d12f5e76d5b1be-300x409.jpeg?unShow=false&amp;waterMark=false 300w" title="▲周星馳（左）、朱茵在拍攝《逃學威龍2》後傳出緋聞。（圖／翻攝微博）" width="440" height="600">
  <figcaption>
   ▲朱茵（左）與周星馳（右）因《逃學威龍2》結緣，據悉，這段無法公開的地下情讓她身心俱疲。（圖／翻攝微博）
  </figcaption>
 </img></figure>
</div><strong>朱茵《逃學威龍2》結緣周星馳　傳戀情3年就告終</strong>
<br>
<br>
朱茵與周星馳的情感故事，始終是影壇耐人尋味的一段傳說。朱茵和周星馳拍《逃學威龍2》時認識，雖然從未公開承認交往，但戲裡戲外的默契早已引人揣測，據悉，這段戀情大概只維持了3年就分手了。外界更曾盛傳，兩人之所以分開，是因為有第三者介入；而這段戀情最讓朱茵感到心累的關鍵，就是兩人不能見光的地下情，無法光明正大地牽手，似乎讓她逐漸明白，愛若不能被看見，再深刻也會變得壓抑。
<br>
<br>
然而，命運似乎早為朱茵安排好新的篇章，黃貫中跟她原本只是鄰居，卻因為朱茵替他找到走失的愛犬，兩人因此結識。不過，當時的黃貫中仍有女朋友，但他態度得體、不越界，反而讓朱茵對他產生好感，後來，單身的兩人再次重逢，感情也迅速升溫。與過去的曖昧不同，黃貫中從一開始就大方認愛，讓朱茵能夠坦蕩的談戀愛。而且當時即使工作再忙，黃貫中下班後都會親自到朱茵家樓下，當面跟她說一句下班了，這份堅定與貼心，讓朱茵確信，這才是她要的關係。
<br>
<br>
<strong>朱茵2012年嫁黃貫中　提前任遭老公冷回</strong>
<br>
<br>
朱茵在2012年與黃貫中結婚，兩人多年來感情穩定又甜蜜。不過，朱茵曾在綜藝節目《請吃飯的姐姐》中聊到一段趣事，透露自己有次在老公面前提到前男友，本想隨口一說，沒想到黃貫中神情一冷，請她不要說了。朱茵當下心頭一震，才明白這話題對黃貫中來說像根刺，輕輕碰一下就會疼，從那刻起她就懂了，老公雖然不講，但心裡其實有在意。
<br>
<br>
朱茵表示，他們夫妻倆其實都不愛談彼此的過去，黃貫中曾經對她坦白過情史，但她早就記不得內容；當她想聊前男友時，老公也反應冷淡，兩人都屬於不想知道那些舊回憶的人。後來，為了讓黃貫中安心，朱茵乾脆把有關前任的東西全清掉、燒掉、撕毀，不留一絲痕跡，因為對她來說，真正該珍惜的，是眼前這段踏實的愛。
<br>
<br>
<strong>不只朱茵！他們今天也生日</strong>
<br>
<br>
10月25日的壽星不只有朱茵！還有台灣主持人利菁、美國歌手凱蒂·佩芮、中國歌手蘇詩丁、日本演員板垣瑞生、日本女團AKB48成員渡邊志穗，粉絲一同祝福他們生日快樂吧！
<br>
