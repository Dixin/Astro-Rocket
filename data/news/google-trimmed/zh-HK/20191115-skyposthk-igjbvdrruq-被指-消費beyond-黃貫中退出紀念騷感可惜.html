<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<P>黃貫中（Paul）與葉世榮原定於明年1月，在紅館舉行三場《2020年黃貫中．葉世榮37 Beyond作品巡迴演唱會》，卻惹來歌迷留言斥二人消費Beyond。阿Paul日前已宣布退出演唱會，並將落力做好下月在澳門舉行的搖滾騷。</P>
<P>黃貫中、葉世榮合作舉行的Beyond紀念演唱會，本來打正旗號慶祝成軍37周年，宣傳計劃亦已展開。不過，上周卻出現變數，Paul所屬的經理人公司發聲明，指各方就演唱會相關事宜的溝通未達成一致，加上未簽署任何相關合約，黃貫中決定退出演唱會及其一切相關活動。</P>
<P>阿Paul昨日開腔回應，他表示︰「感到十分無奈及可惜！」不過，他的心情似乎未受影響，他將率領香港六大搖滾樂隊，包括（何超儀）Josie & The Uni Boys、Soler、ToNick、Cassette、秋紅及逆流，於12月7日假澳門新濠影匯綜藝館，舉行《Let's Mixture Rock Party融洽搖滾派對》。</P>
<P><B>與6大樂隊jam歌</B></P>
<P>大夥兒日前在Band房練歌，阿Paul表現相當專業，與樂隊及工作人員有講有笑。阿Paul自從2016年舉行個人音樂會後，已有三年沒有開個唱，今次專誠邀請六大搖滾樂隊一齊「大混戰」，阿Paul將會逐一跟他們Jam歌，並會一齊大滙演Beyond經典金曲《海闊天空》，以震撼的歌聲向Beyond致敬。</P>
<P>撰文︰Pauline</P>
<P>編輯：陳禮恒</P>
