                <h1>羅大佑10月合體黃貫中、崔健&#x3000;神仙組合杭州開唱</h1>
                <div class="publish">
                    2025-09-10 14:50 / 作者 黃于珊 
                    <div class="header__share p-0">
                        
                        
                        
                        
                    </div>
                </div>
                <div class="news-box-text border">
                        <img src="https://image.taisounds.com/newsimages/img/2025/0910/a40cff3ac45e4efd9a8ec95b6d154ee2.jpg" style="margin:0 auto;display:block;" alt="">
                        <div class="mbt-text">
                            <span class="text-truncate-2">
                                黃貫中（左起）、羅大佑、崔健將在「三響演唱會」同台。杭州煜禾演藝經紀有限公司提供
                            </span>
                        </div>
                    羅大佑、黃貫中、崔健10月11日將首度合體在杭州奧體中心體育場（大蓮花）舉辦「三響演唱會」，3位重量級主角同台不僅是一場跨越台北、香港、北京3地的文化交流，更被樂迷形容是「一生至少要看1次」的音樂盛事。<br/><br/>台灣音樂教父羅大佑經典歌曲〈童年〉、〈光陰的故事〉陪伴台灣人走過青春歲月，他以敏銳的社會觀察與動人的旋律道盡台灣社會轉型期的集體心聲，成為最具代表性的文化聲音之一。<br/><br/>黃貫中與「Beyond」的搖滾從〈海闊天空〉、〈光輝歲月〉唱出香港人的集體情感，作為主奏吉他手的他堅持樂團一貫的搖滾血脈與創作堅持，在粵語流行曲主導的香港樂壇闖出一條硬核之路。<br/><br/>而崔健的〈一無所有〉成為中國搖滾的開端，他的音樂巧妙融合民謠、搖滾與中國傳統元素，〈花房姑娘〉、〈假行僧〉、〈新長征路上的搖滾〉等作品至今仍被視為華語搖滾樂的劃時代經典。<br/><br/>3人的作品是各自土地與時代的印記，勢必掀起萬人合唱，台灣樂迷紛紛激動表示「這組合太夢幻」、「這真的是華語音樂的巔峰對話」、「一定要飛去朝聖」，未演先轟動。
