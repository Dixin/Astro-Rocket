                                <div class="article-body" itemprop="articleBody">
                                                <p>第28屆台北電影節8日釋出「經典重現」單元共11部精湛大作，包括由張之亮執導、傳奇樂團Beyond主唱黃家駒出演的《籠民》4K修復版、台灣校園青春電影鼻祖《拒絕聯考的小子：導演版》2K修復、日本名導三宅唱《無路用之人》和《Playback》，以及喬瑟夫高登李維的酷兒爭議之作《神秘肌膚》4K修復版，都將獻映北影大銀幕。</p>
    


                                                    
                                                    <div class="ad text-wrap-around with-placeholder" data-id="pc-middle-billboard">
                                                        <div class="banner-336x280 placeholder">

                                                            

                                                        </div>
                                                    </div>
                                                    
                                                <p>今年也推出第二位焦點影人，被視作「阿拉伯影壇最具國際影響力」的導演尤瑟夫夏因，將透過《開羅車站》、《港都舊事》、《浮光掠影》等6部數位修復鉅作，帶領觀眾回望橫跨半世紀的影史崢嶸。</p>
    


                                                <p>此外，今年台灣影壇掀起最強「經典朝聖」，橫掃奧斯卡金像獎9項大獎、締造台灣影史首部破億神話的《末代皇帝》，也將於本月22日以全新4K數位修復規格在大銀幕上映，讓影迷朝聖跨越40年的時空盛宴。</p>
    


                                                <p>《末代皇帝》由金獎大導柏納多貝托魯奇執導，集結尊龍、陳沖、鄔君梅、奧斯卡終身成就獎得主彼得奧圖，還找來已故音樂大師坂本龍一擔任配樂，更是影史唯一獲准進入紫禁城實景拍攝的劇情片；片中規模宏大的場面動用了1.9萬名臨演，並邀溥儀胞弟溥傑擔任顧問，力求真實還原歷史細節。</p>
