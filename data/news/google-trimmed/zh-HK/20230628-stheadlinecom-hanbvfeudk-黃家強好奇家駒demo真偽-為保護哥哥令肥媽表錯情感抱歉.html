                                    <p>黃家強與肥媽因為黃家駒的遺作，連日來在社交平台多番對質，事件昨日又有新進展，肥媽在fb出招反擊，貼出黃家強在2008年5月出席樹仁大學「別了家駒十五載 - 舊日的足跡座談會」的訪問截圖，內容的確提及到家駒作曲予肥媽，到了今日凌晨，黃家強第三度發文回應肥媽，再為事件解畫。</p><ad id="ad-1"/><h3><strong>【相關閱讀】</strong>：黃家強再反擊肥媽錄音帶照片 親解盒上「有名」原因句句有骨：只有真理</h3><h2>【點擊睇黃家強再反擊肥媽】：</h2><gallery-1/><p>黃家強在文中提到當年的展覽，他說：「為了紀念家駒，我找家駒遺物時發現手稿，覺得很珍貴，希望可以給予樂迷分享，但歌名是肥媽，為免怕被問及手稿為甚麼會寫上肥媽的名字，真正原因我之前已經說過，所以很隨意地亦可能是最好的藉口，為她寫吧來掩飾我們尷尬的創作方法，因為手稿亦不完整，能否真的成為作品我沒有考究，因為家駒手稿在我手上，我不放出去應該是沒可能成事的 (但竟然出現了家駒原聲的Demo tape，真的讓我百思不得其解，真的很想聽聽家駒是怎樣演繹這首Demo，希望可以公開給大衆，以正真偽），重點在展覽，我根本沒有在意這不會成真的事情，早早把它拋諸腦後，就這樣不了了之地過去了十五年。」</p><ad id="ad-2"/><h3>無辜的人變成他的宣傳工具</h3><p>黃家強續說：「但講者無心聽者有意，竟然被有心人看中商機，處心積慮部署到今天，硬生生把我拉進他們的發財大計，營造一次廿幾年前的邂逅，望前輩可以完成我哥哥的遺作的心願，這等美化大計的深情對話，來突顯歌曲的感人之處，這些宣傳伎倆令我不勝煩擾。我重申再講多次，我沒有反對他們用這首歌的權利，只是希望他們不要把我牽連在內。」最後黃家強向肥媽說：「前輩，我為了保護哥哥而讓妳表錯情感到抱歉！如果妳話我十五年前我自己向媒體講，可能我們就不用換RAM了。希望大家能夠找到整件事的重點！誰把兩個無辜的人變成他的宣傳工具。」</p><ad id="ad-3"/><p>事緣肥媽在《永遠光輝 黃家駒》上，聲稱黃家強來電，表示黃家駒生前寫過一首歌送給自己，而肥媽這番對話，竟然惹來黃家強的不滿，公開炮轟肥媽「講大話」，其後肥媽fb貼出當年錄音帶的照片反擊，黃家強又撰長文反擊肥媽，他直言：「版權不是我的，我憑甚麼送給她！」黃家強又分享一個本來不應與外人知的創作小秘密，事實上如果被公開了，是頗尷尬的事情：「話雖是受他們影響而得到靈感，但歌曲還是原創的，而且作品完成之後，會有真正的題材，所以我們會刪除這些創作紀錄，只會講述現有題材和曲風。好可惜亦好無奈，有些名字demo已經被擁有者在沒有理會我們感受之下在較早之前出版過了。」</p><ad id="ad-4"/><p>結果肥媽又出招反擊，昨日貼出黃家強在2008年5月出席樹仁大學「別了家駒十五載 - 舊日的足跡座談會」的訪問截圖並說：「家強說，你知道家駒寫了一首歌給你嗎？雖然我是老人家，但別考我記性， 或者你貴人善忘吧。當日我聽到的都只是簡單一句，我從沒有跟任何人說，因為我不知道最後會否由我主唱。」肥媽稱直到今年年初，收到經理人Leslie 致電，問她是否知道這件事：「我說：『知道。』當佢再問我，可唔可以唱返這首歌，我就無條件去完成這首歌。而當中我沒有收過任何酬勞，版權誰屬我亦不知道，收益如何我都不知道，我肥媽唔需要抽水，都不需要藉此做任何宣傳，我唱這首歌只有一個原因，我欣賞家駒， 亦欣賞家駒的音樂。明明只是簡單紀念家駒的事，我亦不明白為甚麼最後會變得複雜。」</p><ad id="ad-5"/><p> </p><ad id="ad-6"/><p><strong>【相關閱讀】</strong>：</p><ad id="ad-7"/><p>肥媽自爆metoo遭國際巨星打屁股即反擊 歌手身份曝光令人嘩然</p><ad id="ad-8"/><p>肥媽李鼎丨肥媽「嘥氣」爆紅全因已故名導林嶺東提攜 大爆當年被屈過檔亞視收入大減</p><ad id="ad-9"/><p>張學潤離世丨黃夏蕙發結婚紀念通告借勢插肥媽：不要再拿死人做宣傳</p><ad id="ad-10"/><p>張學潤逝世丨肥媽為抖音爆Nel Nel情傷財困片道歉 認情緒太激動相關影片亦應要求刪除</p><ad id="ad-11"/><p> </p><ad id="ad-12"/><p> </p><ad id="ad-13"/><p>《星島申訴王》100集誕生之我最喜愛影片票選，由6月16日至6月30日，玩遊戲贏取總值超過10萬豐富禮品！</p><ad id="ad-14"/><p>立刻點擊投票👉🏻https://tinyurl.com/38dfzwtv</p><ad id="ad-15"/><p>《星島頭條》APP經已推出最新版本，請立即更新，瀏覽更精彩內容：https://bit.ly/3yLrgYZ</p><ad id="ad-16"/>
