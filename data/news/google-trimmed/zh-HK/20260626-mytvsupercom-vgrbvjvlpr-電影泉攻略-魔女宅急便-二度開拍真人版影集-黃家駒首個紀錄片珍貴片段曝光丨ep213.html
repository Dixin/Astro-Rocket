                    <article class="content-main editor-content-view"><p>今個星期繼續由 王鎮泉Jeoffrey 為觀眾送上電影資訊，恐怖大師溫子仁最近搞作多多，首先就係佢先後招攬咗最近兩套刀仔鋸大樹嘅大熱電影《嚇房》同《Obsession》嘅導演Kane Parsons同Curry Barker，兩位都係網上非常高人氣嘅YouTuber，年紀輕輕只有27歲，但係已經做出好好嘅成績。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/gvKWNYwAbbehk1-WPzbZPbZ2ExY=/0x0/public/article/content/202606/3b7e4ee6-c4ab-4304-92a9-a5968518933f.jpg" alt="" data-desc="溫子仁之前已經講咗會為重啟嘅《鐵甲威龍》影集擔任監製" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>另外溫子仁之前已經講咗會為重啟嘅《鐵甲威龍》影集擔任監製，最近仲有消息指，佢會為第一季執導其中幾集，預計下年一月會喺溫哥華展開半年拍攝，今次會圍繞一個全新嘅機械戰警。<br/><br/>本周電影新片速遞<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/UHBSv3-lHDsj4-4TQyCfT6hcebk=/0x0/public/article/content/202606/9e82c1ad-9e51-47b5-ac37-e148aa8c0942.jpg" alt="" data-desc="《反斗奇兵5》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>《反斗奇兵5》：一班玩具朋友面對「莉莉平板」（Lily Pad）如臨大敵，嚇到騰騰震，誓要同現今小朋友最沉迷嘅各式電子科技產品決一死戰，大家最熟悉嘅玩具朋友胡迪、巴斯光年、翠絲，將聯同新舊玩具對抗史上最強敵人。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/UqoAMcSRCTSJIcwztURuLnMweg4=/0x0/public/article/content/202606/58d72c25-5d80-4f62-99ef-3f012e645f61.jpg" alt="" data-desc="《超女》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>《超女》：當一名手段殘暴嘅突發強敵逼近家園，超女被迫踏上一場橫跨星際嘅史詩旅程。喺呢段充滿未知同險阻嘅征途中，佢將會喺復仇嘅怒火同正義嘅初衷之間尋求平衡，誓要守護所愛之人。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/ZyroDxFx8afpLxCgpUiVo-l4JyU=/0x0/public/article/content/202606/4812b9e2-2034-4fbf-92a4-0fdbecbe3dc8.jpg" alt="" data-desc="《被偷走的勁歌》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>《被偷走的勁歌》：過氣婚禮歌手力奇（保羅活德飾），喺某次演出意外結識星途停滯不前嘅男團成員丹尼（尼鍾尼斯飾）。兩位失意才子惺惺相惜，一拍即合，但當兩人分道揚鑣後，丹尼就偷偷將力奇未完成嘅歌曲改成大熱金曲，更藉此一躍成為超級巨星。事業、夢想、家庭、信任⋯一首被偷走嘅勁歌，如何改變段段人生？<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/zaiBcOsjry7omBDL4TpXZQMMgLI=/0x0/public/article/content/202606/f94fa92d-b807-400c-838c-038d6bcc43a0.jpg" alt="" data-desc="《真的相識過》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>《真的相識過》：由葉世榮和Beyond前經理人陳健添（Leslie） 共同監製，黃家駒首個紀錄片《真的相識過》，詳盡探討黃家駒成名前後，喺音樂路上嘅奮鬥同轉型，以至踏上事業巔峰，展現Beyond嘅珍貴現場演出片段同從未曝光嘅影像紀錄。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/qf_OfY5n6sukZsyWvGhiEV2yz2E=/0x0/public/article/content/202606/f911ab81-169e-4086-afb0-095ea120444e.jpg" alt="" data-desc="《魔女宅急便》宣佈將會第二次開拍真人版影集。" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>另外，近年有好多經典動畫再次推出電影版，好似最近有指《飛天小女警》同 《霹靂貓》，都會登上大銀幕，粉絲當然最開心。而動畫大師宮崎駿嘅名作《魔女宅急便》，亦都宣佈會第二次開拍真人版影集，不過之前係日本演員，今次就係由英國嘅演員演出，必定有另一番味道。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/_Pr2EVXG0n7QkaikA1S5eRzY038=/0x0/public/article/content/202606/a850ed4a-095a-4452-afd3-5a2849b54cfd.jpg" alt="" data-desc="有傳《飛天小女警》會再推電影版。" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><br/>本周香港嘅票房龍虎榜，截至6月24號中午：第1位《給阿嬤的情書》、第2位《揭密日》、第3位《一個部門的誕生》。<br/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/fX0z9lw5cbmzOxKLXoWmTu1L9bM=/0x0/public/article/content/202606/17068eda-204b-48d8-9573-f9716ae69ed9.jpg" alt="" data-desc="第1位《給阿嬤的情書》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/lUoQCCoAuw5wSf_fTKi_MH5yC0I=/0x0/public/article/content/202606/92b62a7c-a052-4285-8968-a918a7363ec0.jpg" alt="" data-desc="第2位《揭密日》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/><img src="https://www.mytvsuper.com/tc/scoopplus/thumbor/ymAFIIwLgoTCsWpYBAloMTAZk-0=/0x0/public/article/content/202606/a1ab8e66-5a65-4a58-9e79-aaffc044fcc7.jpg" alt="" data-desc="第3位《一個部門的誕生》" data-href="" data-open="in-app" style="" decoding="async" loading="lazy"/></p></article>
