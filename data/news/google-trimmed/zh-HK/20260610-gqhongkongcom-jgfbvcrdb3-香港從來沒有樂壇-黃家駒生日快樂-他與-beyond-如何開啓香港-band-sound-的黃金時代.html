                            <h1>
                                香港從來沒有樂壇？黃家駒生日快樂，他與 Beyond 如何開啓香港 Band Sound 的黃金時代？                            </h1>
                            <div class="excerptBox">
                                能夠讓全球華人齊聲高唱、甚至僅憑一段結他前奏就能引發全城共鳴的樂隊，大概就只有黃家駒帶領的 Beyond 了。隨著日曆再次翻到六月十日，這位永遠年輕的搖滾教父也迎來了他的六十四歲冥壽，全球樂迷那份壓抑已久的思念又再湧上心頭。但在我們戴上耳機、重返那段充滿《海闊天空》與《光輝歲月》的熱血日子之前， GQ Hong Kong 帶你回顧這場由一把破結他引發的本地搖滾革命，訴說那些關於香港 Band Sound 承先啟後的荒謬起源與偉大傳承。
                            </div>
                            <div class="authorBox">
                                <span class="authorName">
                                    By
                                    Teddy Chu                                </span>
                            </div>

                        </div>
                    </div>
                </section></div>
            </div>        </div></div></section>

        <section class="siteSec single-pageSec">
            <div class="container">
                <div class="row">
                    <div class=" col-md-8 offset-md-1 ">
                                                <div class="siteContentInner">
    




<p class="has-medium-font-size"><strong>搖滾教父與不講理的熱血開局</strong></p>



<figure class="wp-block-image size-large"><img decoding="async" width="696" height="1024" src="https://gqhongkong.com/wp-content/uploads/2026/06/KomaWong1_x1-1-696x1024.jpg" alt="" class="wp-image-58592" srcset="https://gqhongkong.com/wp-content/uploads/2026/06/KomaWong1_x1-1-696x1024.jpg 696w, https://gqhongkong.com/wp-content/uploads/2026/06/KomaWong1_x1-1-204x300.jpg 204w, https://gqhongkong.com/wp-content/uploads/2026/06/KomaWong1_x1-1-768x1131.jpg 768w, https://gqhongkong.com/wp-content/uploads/2026/06/KomaWong1_x1-1.jpg 1019w" sizes="(max-width: 696px) 100vw, 696px"/></figure>



<p>回顧八十年代，當年的香港樂壇是日本翻唱歌與偶像天下的黃金歲月，電視台與電台充斥著旋律甜美的流行曲，所有的鎂光燈都聚焦在那些被唱片公司精心雕琢的巨星身上。年輕人夾 Band 往往被社會大眾視作不務正業、沒有出息的邊緣象徵，長輩們口中總是掛著一句「飛仔才去彈結他」。現在的年輕音樂人搞創作，可能都會配備最頂級的效果器與昂貴的蘋果電腦，但你能想像嗎？這位日後承先啟後了整個香港搖滾發展的傳奇人物，他的音樂起點竟然是從鄰居不要的舊結他開始的。</p>



<figure class="wp-block-embed is-type-video is-provider-youtube wp-block-embed-youtube wp-embed-aspect-4-3 wp-has-aspect-ratio"><div class="wp-block-embed__wrapper">
<iframe title="Beyond - 再見理想 (Official Music Video)" width="500" height="375" src="https://www.youtube.com/embed/32aCnqXGdSI?feature=oembed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""/>
</div></figure>



<div class="d-none d-md-block mid-content-ad mid-content-ad--desktop text-center someIsWorking"><div id="gqhon-897295072" data-gqhon-trackid="6288" data-gqhon-trackbid="1" class="gqhon-target">


<div id="div-gpt-ad-1762237428910-0">
  
</div></div></div><div class="d-block d-md-none mid-content-ad mid-content-ad--mobile text-center someIsWorking "><div id="gqhon-3635571103" data-gqhon-trackid="6285" data-gqhon-trackbid="1" class="gqhon-target">


<div id="div-gpt-ad-1762237315075-0">
  
</div></div></div>



<p>十七歲那年他在在街邊撿了鄰居搬家不要的一把破舊木結他，自此無可救藥地愛上了音樂。即使面對家人因擔心前途而產生的強烈反對，他也堅持一直玩音樂。Beyond 首隻卡式帶《再見理想》更是完全自資出版的，在 1985 &#8211; 86 年期間，他們需要硬著頭皮向銀行借錢，連深夜街頭的宣傳海報也是自己親自拿著漿糊去張貼，才成功於明愛中心自資舉辦《永遠等待演唱會》。這種從底層野蠻生長的強韌生命力，正是香港 Band Sound 最原始、最純粹的寫照。</p>



<p class="has-medium-font-size"><strong>搖滾的特洛伊木馬 </strong></p>



<figure class="wp-block-image size-large"><img loading="lazy" decoding="async" width="1024" height="1024" src="https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1-1024x1024.jpeg" alt="" class="wp-image-58594" srcset="https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1-1024x1024.jpeg 1024w, https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1-300x300.jpeg 300w, https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1-150x150.jpeg 150w, https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1-768x768.jpeg 768w, https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1-1536x1536.jpeg 1536w, https://gqhongkong.com/wp-content/uploads/2026/06/qK175nxNhdR3qKCDgKm3GTmTc347RBI6bs3JW27NyVs-1.jpeg 1920w" sizes="auto, (max-width: 1024px) 100vw, 1024px"/></figure>



<p>Beyond 成功打破了地下搖滾與主流流行樂之間的無形高牆，由最初玩的是藝術性較強、實驗意味濃厚的搖滾樂，到之後透過旋律極度入耳、傳唱度極高的流行曲作品成功將 Band Sound 文化帶入了流行文化。Beyond 巧妙地將搖滾的靈魂、對社會的關懷隱藏在流行曲的軀殼中，讓大眾接受了樂隊這種「自己創作、自己演奏」的表演形式。</p>







<p>因為有了 Beyond 的空前成功，無數的香港年輕人開始覺得拿起結他是一件極度有型的事，Band 房開始在各個工廠大廈中如雨後春筍般湧現。他成功地承先啟後了香港 Band Sound 的發展。</p>











<h3 class="wp-block-heading"><strong>衝出娛樂圈的狹隘：唱給曼德拉與世界的搖滾詩人</strong></h3>



<figure class="wp-block-image size-large"><img loading="lazy" decoding="async" width="684" height="1024" src="http://gqhongkong.com/wp-content/uploads/2026/06/kaku3-684x1024.png" alt="" class="wp-image-58596" srcset="https://gqhongkong.com/wp-content/uploads/2026/06/kaku3-684x1024.png 684w, https://gqhongkong.com/wp-content/uploads/2026/06/kaku3-201x300.png 201w, https://gqhongkong.com/wp-content/uploads/2026/06/kaku3-768x1149.png 768w, https://gqhongkong.com/wp-content/uploads/2026/06/kaku3-1027x1536.png 1027w" sizes="auto, (max-width: 684px) 100vw, 684px"/></figure>



<p>家駒那句經典金句：「香港從來沒有樂壇，只有娛樂圈。」至今依然令人無法反駁。他身為音樂創作人，置身其中卻能綜觀形勢，果斷敢言地揭露了這個產業只在乎包裝、緋聞而忽略音樂本質的殘酷真相。這份清醒，讓他在同時代的歌手中顯得與眾不同，也彰顯了真正搖滾精神中的批判性。</p>



<figure class="wp-block-embed is-type-video is-provider-youtube wp-block-embed-youtube wp-embed-aspect-4-3 wp-has-aspect-ratio"><div class="wp-block-embed__wrapper">
<iframe loading="lazy" title="Beyond - AMANI (Official Music Video)" width="500" height="375" src="https://www.youtube.com/embed/JhgRVEzNJ1s?feature=oembed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""/>
</div></figure>



<p>受盡歐美深度流行曲影響，並將英國之寶 David Bowie 視為音樂偶像，Beyond 成功打入主流後，亦帶來一眾探討歷史、反思戰爭、呼籲世界和平的作品。家駒創作的《長城》、《大地》、《Amani》等作品在全球華人社會上廣為流行。其中最令人震撼的，必定是以當時仍在囚的已故南非黑人民權領袖曼德拉為題材的《光輝歲月》。</p>



<figure class="wp-block-embed is-type-video is-provider-youtube wp-block-embed-youtube wp-embed-aspect-4-3 wp-has-aspect-ratio"><div class="wp-block-embed__wrapper">
<iframe loading="lazy" title="Beyond - 光輝歲月 (Official Music Video)" width="500" height="375" src="https://www.youtube.com/embed/PrGsAMbgUh4?feature=oembed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""/>
</div></figure>



<p>這首歌展現了他非一般的國際視野，他將對平等與自由的渴望，化作了激昂的結他 Riff 與沙啞的嘶吼。他用作品向世界證明了，香港的 Band Sound 絕對有能力創作出具有世界級內涵與人文關懷的音樂。</p>



<p class="has-medium-font-size"><strong>海闊天空的不死精神</strong></p>



<p>因為對當時樂壇的失望，促使家駒帶領 Beyond 開拓亞洲其他市場，開始長居日本尋求更大的音樂自由度。他滿心以為在那個音樂產業高度發達的國度，能夠遠離香港娛樂圈的八卦與遊戲，純粹地做一個獨立音樂人。然而事與願違，他依然需要參與最不喜歡的綜藝遊戲節目來維持樂隊的曝光率。</p>



<figure class="wp-block-embed is-type-video is-provider-youtube wp-block-embed-youtube wp-embed-aspect-4-3 wp-has-aspect-ratio"><div class="wp-block-embed__wrapper">
<iframe loading="lazy" title="Beyond -《海闊天空》 Official MV" width="500" height="375" src="https://www.youtube.com/embed/V4GUy2EHMMs?feature=oembed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""/>
</div></figure>



<p>家駒的遺作《海闊天空》，字字句句反映著他在這條追夢路上的無奈心酸，但他還是表明了最堅定的態度：遇過冷眼與嘲笑，但從沒有放棄過心中的理想。這首歌完美總結了他短暫卻極其輝煌的一生。時至今日，這首歌與《光輝歲月》等作品，不僅成為了民間夾 Band 必練的國歌，更成為了這座城市在面臨低谷與挑戰時，無數人經常高唱的靈魂之歌。他用音樂跨越了生死的界線，化作了推動社會前進的力量。</p>



<figure class="wp-block-image size-full"><img loading="lazy" decoding="async" width="800" height="800" src="https://gqhongkong.com/wp-content/uploads/2026/06/image4-1.png" alt="" class="wp-image-58598" srcset="https://gqhongkong.com/wp-content/uploads/2026/06/image4-1.png 800w, https://gqhongkong.com/wp-content/uploads/2026/06/image4-1-300x300.png 300w, https://gqhongkong.com/wp-content/uploads/2026/06/image4-1-150x150.png 150w, https://gqhongkong.com/wp-content/uploads/2026/06/image4-1-768x768.png 768w" sizes="auto, (max-width: 800px) 100vw, 800px"/></figure>



<p>家駒曾唱過「縱有創傷不退避」，但也唱過「幾多天真的理想，幾多找到是頹喪」。帶著頹喪，他堅持走完了追逐理想的道路。追逐理想的人，永遠年輕。</p>
