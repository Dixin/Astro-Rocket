    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">今年是香港殿堂級樂隊Beyond靈魂人物黃家駒逝世33周年，對無數樂迷而言，他的音樂與精神從未離開。在這個特別的紀念年份，一部籌備超過廿載、首部關於黃家駒的紀錄片《真的相識過》（Because of You Ka Kui）將於6月11日正式在香港上映，為樂迷帶來一次深入靈魂的追憶。</p>

    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">這部紀錄片不僅僅是回顧家駒從默默奮鬥到登上事業巔峰的傳奇音樂旅程。電影團隊耗時超過二十年，足跡遍及香港、北京、台北、東京、多倫多及倫敦六個城市進行拍攝，旨在呈現音樂以外，家駒鮮為人知的另一面——那個親切、真實的「黃伯」形象。影片將透過大量從未曝光的珍貴音樂、影像及私密故事，讓觀眾看到巨星光環下，一個有血有肉、充滿熱誠與夢想的黃家駒。</p>

                            <h3 class="bpcategory-special-color read-more-post" style="font-size: 28px; margin:0 0 15px 0;">申訴專員公署首屆暑期實習計劃結業  陳積志勉勵實習生續推動正面申訴文化</h3>

                        <div class="article-body">
                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">香港申訴專員公署首屆暑期實習計劃圓滿結束，經過約兩個月的實習旅程，五位實習生經已順利畢業。公署特別為此舉行結業禮，申訴專員陳積志、三位助理專員以及實習生導師一同出席，見證他們在公署各部門的學習成果與體會。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">回顧這個暑假，五位實習生均表示獲益良多。透過參與公署的日常工作及各類活動，包括主持與「共創明『Teen』計劃」合作的工作坊、參與公署專家顧問的交流活動、親身了解主動調查的相關過程，以及進行外展視察等，他們不僅加深了對公署職能及公共事務的認識，對公共行政的熱誠亦大大增加。對一眾實習生而言，這段日子既難忘又珍貴，眾人皆顯得依依不捨。</p>
  
  
  
  
  
  
  

                            
                                
  
  
    
    <p style="font-weight: 400;" class="font-size-scaler-control" data-font="16">結業禮上，申訴專員陳積志逐一向五位實習生頒發實習證書，肯定他們在實習期間的投入及良好表現，並勉勵他們繼續秉持服務社會的熱誠，積極關心公共事務，擔任公署大使，一同推動正面的申訴文化，為香港的良政善治貢獻力量。</p>
