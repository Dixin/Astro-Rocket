<h1>黃家駒遺作《感激這對手》丨黃家強揭BEYOND尷尬事拒認送歌 駁肥媽：無需要牽連他人感動自己</h1>
</div>
</div>

<ul class="article-tag sectionName">
<li>娛樂</li>
</ul>


</div>

</div>
</div>

</section>

<section class="ad-zone-mobile">
<div class="container">

</div>
</section>

<div class="container some-other-area persist-area">
<div class="row">

<div class="page-left col-xs-12 col-sm-12 col-md-8 col-lg-8">
<div class="author-box col-xs-12 col-sm-12 col-md-12 col-lg-12">
<div class="article-detail-share-icon">
</div>
<div class="publish-time text15 text-weight-300">發佈時間: 2023/06/27</div>

</div>



<div id="content-main" class="content-main margin-b15">
<div class="margin-b">
<div class="lazy">

<div class="content-section-region__article-details">

<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<p>肥媽Maria Cordero在早前無綫推出特備節目《永遠光輝黃家駒》中，公開表示Beyond成員黃家駒的遺作之中，有一首歌是他親自寫歌給自己，感觸地稱入錄音室前都感壓力，心中默唸希望黃家駒「協助」錄音成功。節目播出後，家駒的胞弟黃家強斥「關於我的都是謊言，我哥哥雖然走了，我還活生生的，怎麼可以這樣不尊重人。」不過肥媽事後辯稱是傳媒誤導，她在節目中是稱廿多年與家強在同場活動上，家強親口告知這首歌的存在。</p>
<p><strong><em>同場加映：</em></strong></p>
<p><strong><em>陳慧琳爆兒子最愛看周星馳電影 自薦飾演《少林女足》退休教練</em></strong></p>
<p style="display:none;" articleId="3556586" showAd="true">{{hket:ul-video id="8545"}}{{/hket:ul-video}}</p>
<p><em><strong>肥媽稱錄製黃家駒為其創作歌曲 黃家強出Po斥謊言：不尊重人</strong>【<u>下一頁</u>】</em></p>
<p style="display:none;" caption="（網上截圖）">{{hket:inline-image name="KAKUE2.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="（東星娛樂）">{{hket:inline-image name="800_0ee7e96ed0090500cb0cded60c0e5a00saasftp20200221.jpg"}}{{/hket:inline-image}}</p>
<p>肥媽事後在Facebook撰文反駁黃家強，揚言是傳媒誤導所致。「對於今天有關於網上的指控，我想藉此回應一下。其實可以錄制《感激這對手》這首歌，源於年初的時候收到家駒經理人Leslie的通知，並話收到手上的錄音帶，是家駒生前留下並寫上肥媽兩字，希望我可以完成這首歌。而早於二十多年前，我和家強出席一個event時，他曾經跟我提過家駒作了一首歌送給我的。至於最近我在TVB中的訪問中是提到 有一天家強跟我說，但不知最後經某網媒報章轉述我的講話時，就變成最近收到家強的來電 。作為專業的傳媒人，希望該網媒報章編輯重新和認真留意節目內容，並修正和發佈正確的訊息。整件事就是這麼簡單，作為朋友，我只是想完成家駒的心願，完成他未完成的作品，希望大家都將焦點放回在家駒的作品上，謝謝。」還以為事件會告一段落，沒想到黃家強在Facebook撰長文再次反駁肥媽的言論，否認親口講過這首歌是哥哥寫給肥媽，亦揭開Beyond寫作的尷尬事，以「常理」去解釋整件事。</p>
<p style="display:none;" caption="（《永遠光輝黃家駒》截圖）">{{hket:inline-image name="16_600.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="（《永遠光輝黃家駒》截圖）">{{hket:inline-image name="17_600.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="（肥媽FB）">{{hket:inline-image name="fat.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="（肥媽FB）">{{hket:inline-image name="347247761_860195912131052_3301164231565850935_n.jpg"}}{{/hket:inline-image}}</p>
<p><em><strong>家駒56歲冥壽 家強攬蠟像悼亡兄</strong>【<u>下一頁</u>】</em></p>
<p>黃家強FB留言如下：</p>
<blockquote>
<p>與其羅生門不如用常理吧。</p>
<p>首先我想大家了解一下我們寫歌的過程，怎樣形成demo，當中有很多方法，在這裡我不細說其他方法，因為與這事件無關，只想講述為什麼會以其他音樂人或樂隊的名字作題材。</p>
<p>八十年代中，Beyond只是一隊熱愛音樂而且還在默默耕耘的樂隊，為了能夠在商業市場生存，我們會參考一些流行音樂做藍本，當時日本音樂在香港大行其道，例如：安全地帶、Southern All Star...他們的歌被多少香港歌手翻唱，大家都很清楚，而在香港也有我們欣賞與尊敬的前輩：擁有獨特黑人騷靈和R&amp;B唱腔的前輩肥媽Maria Cordero和唱Blues不作他選的前輩夏紹聲Danny Summer。</p>
<p>以上我所提及的四個單位的名字在我印象中都曾經出現過在家駒的demo上（我也有demo叫U2，回想起來耳根都發熱），為甚麼會用他們的名字作demo title？原因很簡單，因為受了他們的音樂風格影響而創作出來的作品，而當時還未有確切的題材，最直接了當的方法記錄下來便是這樣，只要看到暫定的歌名，便可以在選歌時大概會知道這些歌的風格。</p>
<p>這些不應與外人知的創作小秘密，對我們來說，如果被公開了是頗尷尬的事情，話雖是受他們影響而得到靈感，但歌曲還是原創的，而且作品完成之後，會有真正的題材，所以我們會刪除這些創作紀錄，只會講述現有題材和曲風。好可惜亦好無奈，有些名字demo已經被擁有者在沒有理會我們感受之下在較早之前出版過了。</p>
<p>心水清的樂迷應該知道誰擁有我們1991年之前的歌曲版權，他怎樣處理我無權過問。</p>
<p>廿幾年前，在event上我告訴前輩肥媽，這是我哥哥為她寫的遺作，希望送給她？我不想拿記憶體來說事，因為我的RAM還很健康，我用常理來解答，一種公開了會令我們感到尷尬的創作手法，我會告訴她會讓她知道嗎？再者版權和錄音帶都不在我手，我為什麼要編一個為她寫歌的故事來送歌給她，我為什麼要這樣做，有需要嗎？版權不是我的，我憑什麼送給她！家駒還有demo叫安全地帶和Southern All Star，難道這些歌也是為這兩隊典堂級樂隊而寫的嗎？他們會唱嗎？因為以上種種原因，我是不會亦不能送這首歌給她的。</p>
<p>前輩，無論誰給妳誤導了我不想深究，能夠得到家駒的作品而妳又喜歡的話，好好唱好它已經是對家駒的一份尊重，無需要牽連其他人來感動自己。</p>
<p>沒有是非只有真理！</p>
</blockquote>
<div class="bulletpotint"><ul>
<li style="display:none;" caption="">{{hket:inline-image name="z.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（東星娛樂）">{{hket:inline-image name="800_9d11da76973ace8a45f8244e1137542dsaasftp20200221.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（東星娛樂）">{{hket:inline-image name="800_58966d1f9d9cf3728fb770dc26d54668.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（東星娛樂）">{{hket:inline-image name="800_337e1b8085f3226eaa97db7fc349727f.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（黃家強FB）">{{hket:inline-image name="KAKEUNG.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（網上截圖）">{{hket:inline-image name="KAKUE4.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（網上截圖）">{{hket:inline-image name="KAKUE3.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="（網上截圖）">{{hket:inline-image name="KAKUE.jpg"}}{{/hket:inline-image}}</li>
</ul></div>
<p>事後，肥媽FB再撰文反駁黃家強，堅持對方貴人善忘忘記說過的說話。「二十多年前，在Event上，家強說，你知道家駒寫了一首歌給你嗎？雖然我是老人家，但別考我記性，或者你貴人善忘吧。當日我聽到的都只是簡單一句，我從沒有跟任何人說，因為我不知道最後會否由我主唱。直接年初，經理人Leslie 致電給我，問我知唔唔知這件事，我說：『知道。』當佢再問，我可唔可以唱返（番）這首歌，我就無條件去完成這首歌。而當中我沒有收過任何酬勞，版權誰屬我亦不知道，收益如何我都不知道，我肥媽唔需要抽水，都不需要藉此做任何宣傳，我唱這首歌只有一個原因，我欣賞家駒， 亦欣賞家駒的音樂。明明只是簡單紀念家駒的事，我亦不明白為什（甚）麼最後會變得複雜。」</p>
<p style="text-align: center;">U Lifestyle App自家節目登錄《U TV》專區！<br/>
