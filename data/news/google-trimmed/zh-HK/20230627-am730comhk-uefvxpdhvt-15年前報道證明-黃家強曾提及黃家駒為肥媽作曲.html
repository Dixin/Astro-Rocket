                                        <p class="picsolo-descr">肥媽上戴15年前家強受訪的報道，指他曾表示黃家駒曾為她創作歌曲。</p>                                    </figure>

                                                                                                <div><p><span><span>Beyond<span>樂隊主音黃家駒曾否為肥媽創作歌曲，近日演變成羅生門事件，肥媽在</span>TVB<span>節目《永遠光輝</span> <span>黃家駒》中自爆獲對方作曲《感激這對手》，然而家駒胞弟黃家強卻直斥她說謊，之後肥媽上載一張錄音帶照片作證明，但家強解釋是兄長的創作手法。</span></span></span></p></div>

                                                                                                <div><h2><span><span><span>家駒有首歌是作給肥媽的</span></span></span></h2>

<p><span><span><span>直至今日</span>(27<span>日</span>)<span>傍晚，肥媽在</span>Facebook<span>專頁其中一個帖子的回應欄中，上載一則</span>2008<span>年</span>5<span>月</span>10<span>日的娛樂新聞報道截圖，其中是黃家強與雷宇揚的訪問，家強在訪問中提到「有首歌作俾肥媽，睇吓會唔會俾番佢唱，但未知家駒完成未。」及後，有網民亦分享其他傳媒在</span>15<span>年前的相關報道，均證明家強在訪問中曾提過「家駒有首歌是作給肥媽的」。翻查資料，當時家強正出席一個紀念家駒的座談會，席間他接受訪問時透露，家駒其中一首未發表的作品，是給肥媽的。」</span></span></span></p></div>
