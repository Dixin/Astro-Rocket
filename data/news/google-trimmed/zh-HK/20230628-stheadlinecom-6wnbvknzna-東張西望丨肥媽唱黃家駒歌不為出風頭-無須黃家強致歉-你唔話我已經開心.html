                                    <p>近日肥媽於TVB日前播出的特備節目《永遠光輝 黃家駒》中，聲稱在十多年前黃家強向她表示黃家駒生前寫過一首歌送給自己，豈料惹怒黃家強並炮轟肥媽「講大話」！肥媽昨日（27日）分享黃家強在2008年的受訪新聞，內容的確提及到家駒作曲予肥媽，黃家強今日（28日）在未有指名道姓的情況下致歉：「前輩，我為了保護哥哥而讓妳表錯情感到抱歉！」肥媽今日接受《東張西望》訪問，再就事件回應。</p><ad id="ad-1"/><p> </p><ad id="ad-2"/><p><strong>【相關閱讀】：</strong>黃家強好奇家駒Demo真偽 為保護哥哥令肥媽表錯情感抱歉</p><ad id="ad-3"/><h2>【點擊睇肥媽回應黃家強道歉】：</h2><gallery-1/><p><br/>肥媽因表示黃家駒生前寫過一首歌送給自己而遭批評借逝者出風頭，肥媽稱自己是時下當紅節目《中年好聲音》的評審，即將要開拍第二季，認為自己無須借此事增加知名度，而且她亦不為金錢。肥媽指十多年前從黃家強口中得知黃家駒其中一首遺作是寫給她，她感到無比高興：「有幾多人……家駒心目中有你呀？係咪先？開心到不得了，但咁多年嚟仔女我都冇講過。」</p><ad id="ad-4"/><p><br/><strong>聽到Demo即感動流淚</strong></p><ad id="ad-5"/><p><br/>直至今年年初Beyond經理人致電給她再重提此事，稱黃家駒生前的確作了首歌給她，又邀她唱出此歌，肥媽認得到此歌令她感到威風。肥媽認為此歌非常澎湃及有氣勢，她認為的確是寫給她的，聽到Demo時更感動得流淚。對於黃家強指，Demo上寫上肥媽的名字，只是當時哥哥創作習慣以某歌手的聲音來設想，並非一定是寫給那位歌手，肥媽表示：「我唔知你嘅諗法，我都係一個識音樂嘅人，我做音樂嗰時，你都仲係好細，啱唔啱呀？係！寫『肥媽』兩個字留個印象，又冇理由手稿又寫肥媽，Demo又寫肥媽。」</p><ad id="ad-6"/><p> </p><ad id="ad-7"/><img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/6ff4971e7eddab3d4725ddbf2eb17b85/2023-06/VideoScreenshot--YouTube--5_33_.jpg" alt="肥媽於《東張西望》中回應，指黃家強無須道歉。" title="肥媽於《東張西望》中回應，指黃家強無須道歉。"/><div class="img_caption">肥媽於《東張西望》中回應，指黃家強無須道歉。</div><p><br/><strong>大讚Beyond有禮貌</strong></p><ad id="ad-8"/><p><br/>對於黃家強對事件有極大反應，舊新聞亦證實黃家強的確曾稱哥哥為肥媽寫歌，肥媽認為事件已過去多年，可能黃家強貴人善忘，「但我呢啲老人家，呢啲對我咁影響……我點會唔記得。」對於外界認為她與Beyond不同時代出道，認為雙方沒有太多交集，肥媽表示：「以前個個都上TVB，嗰時我哋上嘅音樂節目，都係嗰班人。」又指大家都是活躍於80年代的歌手，不時會撞見，而且大讚Beyond對前輩非常有禮貌。</p><ad id="ad-9"/><p><br/>就是次爭議，黃家強今晨再發文道歉，不過全文沒有提及肥媽的名字，只稱此事是有人看中商機，他被拉進發財大計，認為一切都是宣傳，更把兩位無辜的人當成宣傳工具。至於肥媽唱出哥哥的遺作，他僅表示：「前輩，我為了保護哥哥而讓妳表錯情感到抱歉！如果妳話我十五年前我自己向媒體講，可能我們就不用換RAM了。希望大家能夠找到整件事的重點！誰把兩個無辜的人變成他的宣傳工具。」肥媽則於《東張西望》中回應，指黃家強無須道歉：「我唱到你大佬嘅歌已經好開心，唔使致歉，你唔話我佔便宜我就已經好開心。」</p><ad id="ad-10"/><p> </p><ad id="ad-11"/><p><strong>【其他文章】</strong>：</p><ad id="ad-12"/><p>肥媽不堪被黃家強怒插講大話 貼黃家駒錄音帶反擊：無收錢都要俾人屈</p><ad id="ad-13"/><p>黃家駒逝世30年疑遭消費？肥媽稱獲邀演繹遺作 黃家強怒斥：都是謊言！</p><ad id="ad-14"/><p>黃家強再反擊肥媽錄音帶照片 親解盒上「有名」原因句句有骨：只有真理</p><ad id="ad-15"/><p>《星島申訴王》100集誕生之我最喜愛影片票選，由6月16日至6月30日，玩遊戲贏取總值超過10萬豐富禮品！</p><ad id="ad-16"/><p>立刻點擊投票👉🏻https://tinyurl.com/38dfzwtv</p><ad id="ad-17"/><p>《星島頭條》APP經已推出最新版本，請立即更新，瀏覽更精彩內容：https://bit.ly/3yLrgYZ</p><ad id="ad-18"/>
