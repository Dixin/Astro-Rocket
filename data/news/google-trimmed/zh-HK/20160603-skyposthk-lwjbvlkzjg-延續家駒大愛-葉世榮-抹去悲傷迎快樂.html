<div id="content-main" class="content-main margin-b15">

<div class="lazy">

<div class="content-section-region__article-details">

<p class="article-details-img-container" style="text-align:center">

<picture class="photoswipe-img" onmouseover="" style="cursor: pointer;">

<img alt="延續家駒大愛 葉世榮：抹去悲傷迎快樂" data-src="https://resource01-proxy.ulifestyle.com.hk/res/v3/image/content/1600000/1604808/JLR_01_a_20160603_L.jpg" class="lazyload img-responsive" src="https://resource01-proxy.ulifestyle.com.hk/res/v3/image/content/1600000/1604808/JLR_01_a_20160603_L.jpg">
</img>
</picture>

<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<P>「要延續家駒的愛」，葉世榮在訪問中說了不下十次，說得鏗鏘有力。近年主力在內地發展的世榮，去年以發起人身份，一手一腳籌備紀念Beyond已故靈魂人物黃家駒的慈善演唱會，可惜昔日戰友黃貫中（阿Paul）和黃家強年前鬧翻，三子再次同台變得遙不可及，但世榮仍盼奇迹出現，「我在家駒墓前跟他說，這個騷一定會很成功！」</P>
<P>家駒已離開逾22年，餘下三子亦於早年分道揚鑣，各自追尋音樂夢想。發展重心早已北移的世榮，談到每年看到不少「山寨版」的紀念家駒活動，內心都感到戚戚然，令他萌起舉辦籌款紀念騷的念頭，「《家駒延續愛心慈善演唱會2016》定於家駒6月10日生忌當天舉行，現時已超過20位歌手及樂隊參與。自從家駒離開後，每年在不同地方都有大大小小的紀念活動，但我發覺當中有很多不足的地方，雖然是籌款騷，但從沒聽過將善款捐給哪個機構。」</P>
<P><B>盼Paul家強放下成見</B></P>
<P>世榮續說：「慈善騷除了紀念家駒外，我們的主題應該是延續他的愛心才叫完美，所以倒不如我以身作則做個榜樣，搞一個歷來籌款最多、最大型、最成功的紀念家駒慈善活動，而主題最重要是延續他的愛心。」</P>
<P>這次籌備紀念活動過程中，最令大家關注的，是已解散的Beyond三子會否再在舞台上重聚，「一早答應演出的阿Paul已參與錄製演唱會主題曲《延續》，家強則以工作為由拒絕出席，但我會盡最後努力游說他，希望他的行程可以改變，很希望可以給予歌迷一個驚喜。」</P>
<P>三子於03和05年曾走在一起做世界巡迴演唱會，世榮憶述：「當年我在後面打鼓，中間位置永遠是空的（因沒有了家駒），（我內心）真的很辛苦！」雖然延續家駒大愛精神的路並不平坦，但世榮抱着一個希望，「很希望阿Paul和家強各自放低成見，我們可以一起做慈善騷，然後每場都『帶』家駒出來，將傷心化解成為善心，即是，延續家駒的愛，會抹去我們的悲傷，變成快樂。」他又表示，經常夢見跟家駒一起夾Band及研究音樂，夢境非常真實。</P>
