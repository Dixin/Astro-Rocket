			<section class="article-content__editor">
				<p>金曲樂團麋先生上星期也飛到香港擔任五月天演唱會嘉賓，更抽空專程前往香港殿堂級搖滾樂團Beyond「二樓後座」錄音室朝聖，為演出找更多靈感。吉他手喆安拿起黃家駒的古董吉他試彈，吉他上價錢是90多萬港幣，嚇了他們一跳，最後才知道，那是黃貫中搞笑寫上去的。</p><p>  </p><p>  「二樓後座」錄音室是Beyond於80年代末至90年代的重要創作基地，樂團多首經典作品皆在此誕生，對香港樂迷乃至亞洲搖滾樂壇都具有深遠意義。麋先生得知錄音室所在的大廈將於4月9日後被拆除重建，永遠消失在世上，眾人均表示非常可惜，感嘆：「這個代表著香港搖滾歷史的地方很珍貴，如今將從此消失，真的好可惜，幸好我們趕得上這最後一波參觀！」</p>

<div class="inline-ads">
<div class="udn-ads udn-ads-300x250 udn-ads--mobile" id="ads-inline" style="min-height: 250px;">
  
</div>







</div><div class="inline-ads inline-ads--desktop">

<p>  </p><p>  </p><p>  </p><p>  第一次踏足Beyond的二樓後座，主唱聖皓表示：「Beyond在我們心目中是一個非常經典的樂團，都有聽過他們的歌，這一次親身走到他們的錄音室工作室，是非常感動跟震撼。踏進去就像走進他們的故事裡面，真實感受到那些曾經在耳機裡面的音樂。」</p><p>  </p><p>  鼓手逸凡更在錄音室獲得了一份極具意義的禮物，Beyond鼓手葉世榮送贈的鼓棍，逸凡透露將會在4月到香港開演唱會時使用這份珍貴的紀念品。鼓手逸凡被問到會否效法Beyond鼓手葉世榮當年演唱會solo 20分鐘，他笑言：「如果大家真的這麼想看，我是絕對奉陪的。」 </p><p>  </p><p>  朝聖錄音室後，麋先生更前往Beyond當年最常光顧的餐廳，Beyond世榮電話中推薦了附近一家老店，並透露黃家駒最愛吃「煎豬扒、羅宋湯及一個餐包」，而世榮自己則有時會吃牛排。麋先生隨即按圖索驥前往該餐廳，品嚐Beyond同款美食，他們形容這趟既是「朝聖之旅」，也是「美食之旅」。</p><p>  </p><p>  逸凡吃了美食後，更直說：「我覺得我可以solo 40分鐘！」其他團員隨即起鬨要大家拭目以待，也為即將到來的「馬戲團運動 CircUs」世界巡迴演唱會香港站埋下伏筆，預告已為香港站準備了「限定內容」，絕對不會讓香港樂迷失望。</p><p>  </p><p>  <figure class="article-content__content-image photo_center" style="--width: 1280px; --height: 794px;">
