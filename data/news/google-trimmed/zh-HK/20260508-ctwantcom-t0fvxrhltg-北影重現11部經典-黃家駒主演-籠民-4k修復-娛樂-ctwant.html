          A-
        </button></div> <article data-v-e5af677a=""><div style="font-size:18px;" data-v-e5af677a=""><p>台北電影節今（8）日釋出「經典重現」單元共11部精湛大作，包括由張之亮執導、傳奇樂團Beyond主唱黃家駒出演的《籠民》4K修復版、台灣校園青春電影鼻祖《拒絕聯考的小子：導演版》2K修復、日本名導三宅唱最初鳴放作《無路用之人》和《Playback》，以及喬瑟夫・高登－李維年輕胴體大展驚人演技的酷兒爭議之作《神秘肌膚》4K修復版，都將獻映北影大銀幕。</p><p>此外，今年重磅推出第二位焦點影人，被視作「阿拉伯影壇最具國際影響力」的導演尤瑟夫．夏因，將透過《開羅車站》、《港都舊事》、《浮光掠影》等6部數位修復鉅作，帶領觀眾回望橫跨半世紀的影史崢嶸。</p><figure class="image"><img src="https://static.ctwant.com/images/content/38/480238/d433c54a9733ac163e0670742b6b97a2.jpg" alt="《拒絕聯考的小子：導演版》（The Fellow Who Rejected College_ Director’s Cut）2K修復作為徐進良執導，讓清新亮相的女主角彭雪芬一炮而紅。（圖／台北電影節）" width="810" height="456"><figcaption>《拒絕聯考的小子：導演版》（The Fellow Who Rejected College_ Director’s Cut）2K修復作為徐進良執導，讓清新亮相的女主角彭雪芬一炮而紅。（圖／台北電影節）</figcaption></img></figure><div class="l-ad__article mb-1 mt-1"/><p>2026第28屆台北電影節將於6月26日至7月11日在臺北市中山堂、光點華山電影館、誠品電影院舉行，影展精彩片單與活動將陸續公布，「台北電影獎」及會外賽入圍名單將於5月15日公布，「國際新導演競賽」入圍名單將於5月12日公布。</p></div> <div id="article-tag-bottom" class="l-tags__wrapper bottom" data-v-e5af677a="">
