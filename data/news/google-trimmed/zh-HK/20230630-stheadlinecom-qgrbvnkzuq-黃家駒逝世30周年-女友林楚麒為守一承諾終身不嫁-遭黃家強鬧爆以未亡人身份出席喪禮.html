                                    <p>黃家駒逝世30周年／女友｜今天（30日）是樂隊Beyond靈魂人物黃家駒逝世30年，在1993年，Beyond於日本參與綜藝節目錄影時，黃家駒從三米高台跌下，因頭部嚴重受創而逝世，終年只有31歲。黃家駒的猝逝，確實令一眾樂迷悲痛莫名，而他的搖滾之心，亦一直長存在大家心中。回顧黃家駒的一生，最遺撼的事，相信是來不及與隊友一樣，組織幸福的家庭！</p><ad id="ad-1"/><h2><strong>【</strong>黃家駒逝世30周年／女友｜<strong>點擊睇林楚麒與黃家駒照片】</strong>：</h2><gallery-1/><h2>黃家駒逝世30周年／女友｜與林楚麒拍拖3年分手</h2><p>黃家駒的戀愛史，最為所熟悉的，當然與歌手林楚麒的一段情，而她亦是黃家駒唯一公開承認的女友。黃家強曾經在訪問上講過，除了林楚麒外，哥哥亦有兩個女友，後來更有指《喜歡你》這首歌，是黃家駒送給初戀女友，當年因為林楚麒的介入才分手，其後兩人拍拖3年，亦告分手收場，不過在黃家駒離世後，曾傳出林楚麒想以「未亡人」身份出席喪3禮，但遭其家人拒絕，黃家強亦試過在微博公開力數對方：「他上載了一篇四千多字的文章，鬧爆黃貫中和Leslie外，更爆指黃家駒非常討厭前女友林楚麒。</p><ad id="ad-2"/><p>黃家強說：「當年家駒和林小姐之所以分手，家駒告訴我是被她欺騙了，非常討厭這個女人，很決絕地與她分手，騙了甚麼是家駒的私隱我不想說。當時和家駒拍拖已有大半年的女朋友是簡小姐，所以林小姐要做未亡人這是不可能成立的，分手前的種種承諾，哪有人分手後還會守信的，荒謬吧！如果不是林小姐利用家駒的未亡人身份來宣傳，我是不會說她的，只希望她不要再提家駒了，我不想家駒的歌迷被她欺騙，這是非常正常的事。」</p><ad id="ad-3"/><p> </p><ad id="ad-4"/><h2>黃家駒逝世30周年／女友｜林楚麒開微博分享往事</h2><p>但其後林楚麒亦聲稱花了10多年時間才接受黃家駒的離開，更曾表示：「在我心中已和家駒成為夫妻。」林楚麒在2012年開通了微博，分享跟家駒的陳年往事，在重要的日子上，她亦貼圖為黃家駒送上祝福，幾乎所有帖文都是與黃家駒有關，試過爆舊愛私密：「他是不喜歡女生紋身的，記得有一次我把一朵玫瑰印水紙印在身上他都不喜歡。」「家駒的名句：唔准喊！他的理念是：『如果想喊就忍住，然後將喊嗰份衝動，化為一道力量用喺其他需要力量嘅事，咁先有意義呀！』」「他其實是喜歡混血兒，性格爽朗，敢愛敢恨的那種。其實他不喜歡純純的女生的。」「他的鞋碼確是特別，是女生的碼，所以他以前也試過穿他姐姐的鞋子，因為他的腳特別小。」</p><ad id="ad-5"/><p> </p><ad id="ad-6"/><h2>黃家駒逝世30周年／女友｜單身多年只為了一個承諾</h2><p>林楚麒亦不時與網民互動，當時透露自己在無綫擔任外援配音員，有網民追問是否跟黃家駒已訂婚？她承認並說：「沒甚麼需要羨慕，我只是一個悲劇故事的女主角而已！」林楚麒還否認當年曾背叛家駒， 多年來一直單身的原因，是為了守一個承諾。對於被黃家強公開質疑，她亦說：‧「有很多人因家強公開說的話和一封公開信而來質疑丶質問我丶誤會我。</p><ad id="ad-7"/><p>其實早在去年他們的前經理人已替我把真實的情況說得一清二楚，而他說這些話之前我跟他們的前經理人是完全沒聯絡二十年了，所以在完全沒聯絡的情況下他說的話只是憑良心直説。要不是他這些言論出現，也不會讓我們有機會在網上遇上。」她更強調不是借家駒是想炒作宣傳我自己：「其實全屬誤會。請想想，我已經不當幕前，有需要拿別人來宣傳自己嗎？偶爾跟大家說我們的往事，也衹是因為大家的苦苦哀求我才開始說的。更好笑的是也有些人覺得我是為了博眼球，想別人關注我的微博。說實話，別人關不關注我也沒得益，我有甚麼需要去博呢？」 ​​​</p><ad id="ad-8"/><h3><br/><strong>【延伸閱讀】</strong>：</h3><p>黃家強好奇家駒Demo真偽 為保護哥哥令肥媽表錯情感抱歉</p><ad id="ad-9"/><p>肥媽不堪被黃家強怒插講大話 貼黃家駒錄音帶反擊：無收錢都要俾人屈</p><ad id="ad-10"/><p>黃家駒逝世30年疑遭消費？肥媽稱獲邀演繹遺作 黃家強怒斥：都是謊言！</p><ad id="ad-11"/><p>黃家強再反擊肥媽錄音帶照片 親解盒上「有名」原因句句有骨：只有真理</p><ad id="ad-12"/><p> </p><ad id="ad-13"/><p>------------------------
