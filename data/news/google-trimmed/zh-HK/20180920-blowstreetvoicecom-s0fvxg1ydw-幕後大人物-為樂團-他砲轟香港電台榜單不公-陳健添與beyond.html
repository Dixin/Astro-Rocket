	<div class="entry-content">
		<div class="container">
			<div class="row">
				<div class="col-md-9 col-lg-10 col-xl-8">
					<div class="banner-block mb-30p text-center d-lg-none">
						
						<div id="div-gpt-ad-1560939428720-0">
							
						</div>
					</div>
					<div class="text-read">
						<div class="smart_content_wrapper"><p><strong>撰文／孫大猴</strong></p>
<blockquote><p>陳健添，Leslie Chan，2018 年 CMA 中國唱工委音樂獎邀請他擔任評審，title 為：樂壇傳奇伯樂、現任搖滾優先廠牌老板。</p>
<p>那些年，音樂圈普遍認為他是一位神奇的「星探」，有以下音樂人的歷程與他有或多或少的聯繫——Beyond、王菲、黑豹、鄭鈞、許巍、田震、小柯、張亞東⋯⋯</p>
<p>2018 年，陳健添從澳洲再次返回北京，捲土重來，創辦「搖滾優先 Rockfirst」廠牌。</p></blockquote>
<p>A&amp;R，音樂工業裏最難解釋的一個重要工種，至今甚至都很難有一個傳神的中文譯法。</p>
<p>它的英文是 Artist &amp; Repertoire ，擔負藝人和市場間的紐帶作用，也在很大意義上決定著音樂人的命運。</p>
<p>過往的歲月裏，陳健添在音樂產業裏的 title 有經紀人，有唱片公司老闆。但他對 Beyond 的影響，更多是 A&amp;R 。</p>
<h3>轉折一：得把好聽的那句多 Repeat 幾遍</h3>
<p>進入 1980 年代，香港開始盛行「夾 band」（粵語：組樂隊）。</p>
<p>此時的香港青年陳健添已開始涉足音樂行業，在旅居香港的德國人 Klaus Heymann 成立的「Pacific Music &#8211; Hong Kong Records」擔任宣傳企劃。</p>
<p>一個偶然機會讓陳健添當上了小島樂隊的經紀人。小島樂隊是那股夾 band 潮流中脫穎而出的本土樂隊，承襲校園民謠的傳統，用電聲樂隊詮釋，勢頭不錯。</p>
<p>1985 年 12 月的某天，「小島 &amp; Friends」演唱會在九龍紅磡區的高山劇場舉行，場地可容納三千多人。怕賣不滿票，於是請到了浮世繪、Beyond 以及吉他手包以正擔任嘉賓。</p>
<p>當時的 Beyond 算是香港樂壇非常 heavy 的樂隊，皮衣、皮褲、長髮的造型，吉他的失真比較大，音樂也是比較注重技術的藝術搖滾。</p>
<p>對於 Beyond 來做嘉賓，陳健添有點猶豫：「你們是校園一點的，他們太 heavy 了吧！」不過考慮到 Beyond 的票房號召力，陳健添才同意。陳健添一直以來對 Beyond 的興趣都不大，藝術搖滾沒有市場，在香港以紙醉金迷的慢情歌稱王的市場裏，幾乎沒有殺出重圍的可能性。</p>
<p>Beyond 演出的時候陳健添早早從後台到了觀眾席。一到觀眾席，好幾百位歌迷已經湧到了前排，陳健添對 Beyond 一下肅然起敬：「來這麽紅！」</p>
<p>台上的 Beyond 依舊是長髮、皮衣，用手中的 Fender 吉他製造出強力的節奏，台下觀眾跟著節奏激動地左搖右晃。剛聽了一小會兒，陳健添似乎聽到腦中有個聲音告訴他：「這幾個人將來會很紅。」想到這，他來不及等演出結束，急急忙忙走出人群，三步並兩步趕到後台，等著 Beyond 演完和他們簽約。可那時他連誰是 Beyond 成員都認不出來，在後台看見皮衣長髮的就問：「你是不是 Beyond 的？」幾經周轉，終於和葉世榮（鼓手）互相留了呼機（Call 機），約定茶餐廳商談，兩三次，就把 Beyond 簽在自己的經紀公司 Kinn&#8217;s 下。</p>
<figure id="attachment_41654" aria-describedby="caption-attachment-41654" style="width: 696px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-full wp-image-41654 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716.jpg" alt="Beyond 1985 年自資的演唱會冊子" width="696" height="964" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716.jpg 696w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716-217x300.jpg 217w" data-lazy-sizes="auto, (max-width: 696px) 100vw, 696px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-full wp-image-41654" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716.jpg" alt="Beyond 1985 年自資的演唱會冊子" width="696" height="964" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716.jpg 696w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9716-217x300.jpg 217w" sizes="auto, (max-width: 696px) 100vw, 696px"/></noscript></img><figcaption id="caption-attachment-41654" class="wp-caption-text">Beyond 1985 年自資的演唱會冊子</figcaption></figure>
<p>陳健添當時看中的正是 Beyond 身上與眾不同的搖滾氣質：關注社會生活，能反映香港市民的想法和反抗精神。當時的香港市場上流行的，全都是譚詠麟的〈雨夜的浪漫〉、蘇芮〈誰可相依〉這一類慢板哀傷情歌。雖然是夾 band 高潮期，但是 Beyond 比起同時代的樂隊也要搖滾一些。陳健添想要的，正是這種衝開一切的搖滾味道，藉以打開香港搖滾市場。但是 Beyond 需要做得商業一點，在簽約時，他也和樂隊表達了這樣的想法。</p>
<p>陳健添簽下 Beyond 時，Beyond 處在完全地下的狀態，沒有任何發行的作品。他接手後第一張唱片就是 Beyond 自費錄制的第一張專輯《再見理想》，並在 1986 年 3 月發行。如何把搖滾歌曲市場化，這是陳健添面臨的第一個難題。於是他想到的第一個辦法就是「重新混音，改變歌曲結構」。</p>
<p>EP 中歌曲〈永遠等待〉，最吸引人的副歌部分「啊啊啊，永遠等待」被擱在了作品的最後，只出現了一次，這對於商業推廣是十分不利的，必須要把最吸引人的部分突出，才能讓更多人記住。這樣不改變歌曲曲風和詞曲的改編，是陳健添第一步做出的嘗試。</p>
<figure id="attachment_41652" aria-describedby="caption-attachment-41652" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41652 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-849x1024.jpg" alt="藝穗會是舉辦 Beyond《再見理想》宣傳演唱會的地方，場地能夠容納二百人左右，Beyond 連做兩場" width="648" height="782" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-849x1024.jpg 849w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-249x300.jpg 249w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-768x926.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714.jpg 1395w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-849x1024.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41652" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-849x1024.jpg" alt="藝穗會是舉辦 Beyond《再見理想》宣傳演唱會的地方，場地能夠容納二百人左右，Beyond 連做兩場" width="648" height="782" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-849x1024.jpg 849w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-249x300.jpg 249w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714-768x926.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9714.jpg 1395w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41652" class="wp-caption-text">藝穗會是舉辦 Beyond《再見理想》宣傳演唱會的地方，場地能夠容納二百人左右，Beyond 連做兩場</figcaption></figure>
<p>陳健添對已經錄製好的專輯《再見理想》中歌曲〈永遠等待〉進行重新混音，最洗腦的副歌在一開始就出現，且在歌曲中反覆出現。用「永遠等待」命名這張新 EP，其中收錄新歌〈Water Boy〉、〈昔日舞曲〉、〈灰色的心〉、〈金屬狂人〉四首新歌。而選擇「永遠等待」作為 EP 題目，也符合一個初出茅廬的搖滾樂隊熱血，又有些悲愴的一往無前的味道，能給聽眾留下一個正向、積極的態度。</p>
<p>對於各大電台、電視台等主流媒體來說，播放 Beyond 這樣「另類」的音樂幾乎不可能，於是陳健添選擇了另一條推廣的路數：迪廳（迪士可舞廳）。</p>
<p>當時香港有五、六家大迪廳，每晚每家都有一千人左右，周末會更多。而所有顧客都是年輕人，他們正是最容易接受新事物的人，也是 Beyond 的潛在歌迷。於是，就靠這種方式，〈永遠等待〉的 remix 版成了香港當年迪廳的大熱單曲，只要前奏「啊啊啊」一出來，迪廳裏群情激昂，歡呼一片。借著〈永遠等待〉的聲勢，EP 中的旋律更優美的〈昔日舞曲〉也成為 Beyond 的第一首上榜歌曲。</p>
<p>由於 Beyond 的音樂比同年代的更有衝勁，所以陳健添也會刻意給 Beyond 做更多的演出，讓觀眾們通過現場的魅力去了解 Beyond。1986 年 Beyond 與小島樂隊遠赴台北參加「1985 亞太音樂季」；1987 年 Beyond 與小島樂隊在新界區舉辦小型巡迴。</p>
<figure id="attachment_41653" aria-describedby="caption-attachment-41653" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41653 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-1024x700.jpg" alt="後排為小島樂隊成員。左起：岑德偉（貝斯）、何日君（鼓手）、孫偉明（鍵盤）、鄧惠恩（主唱）、黎允文（吉他）" width="648" height="443" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-1024x700.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-300x205.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-768x525.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715.jpg 1593w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-1024x700.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41653" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-1024x700.jpg" alt="後排為小島樂隊成員。左起：岑德偉（貝斯）、何日君（鼓手）、孫偉明（鍵盤）、鄧惠恩（主唱）、黎允文（吉他）" width="648" height="443" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-1024x700.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-300x205.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715-768x525.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9715.jpg 1593w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41653" class="wp-caption-text">後排為小島樂隊成員。左起：岑德偉（貝斯）、何日君（鼓手）、孫偉明（鍵盤）、鄧惠恩（主唱）、黎允文（吉他）</figcaption></figure>
<p>作為簽約 Kinn&#8217;s 的第一步動作，Beyond 的《永遠等待》還算是做出了令人滿意的成績。《永遠等待》賣了九千張，當年香港金唱片的標準是兩萬五千張，在沒有大規模正式宣傳的情況下，新樂隊的一張 EP 到達這個高度已屬不易。</p>
<h3>轉折二：公理何在？和香港電台公開叫板</h3>
<p>1987 年 7 月，樂隊錄製發行《亞拉伯跳舞女郎》。為了尋求在更大市場的突破，本來以搖滾形象示人的他們，換上了一身阿拉伯服裝。專輯企劃由黃家駒的作品〈Arabian Dancing Girl〉為契機，製作了一張以阿拉伯風情為主的概念專輯。黃家駒對這身打扮並沒有強烈反對，只是問陳健添：「這麽穿會不會被原來的歌迷罵啊？」</p>
<p>陳健添這時開始改變 Beyond 的整體形象。作為新人，需要靠有些吸引眼球的著裝和企劃擴大知名度，所以他執意讓 Beyond 穿上阿拉伯服裝。同樣，他對這張專輯也充滿了希望，旋律比起《再見理想》以及之前的作品，已經足夠流暢和商業。不過足夠流行和抓眼球的外表下，卻是一張非常前衛的概念專輯：幾個人用異域的 Phrygian 音階、以獨特的切分塑造了一張電聲的阿拉伯風格專輯。幾個人花重金做了阿拉伯長袍，又找了贊助去新加坡清真寺拍攝了封面照。</p>
<p>在《亞拉伯跳舞女郎》發布之前，陳健添特意發布了一張發行量很少、專門針對 DJ 的 EP《新天地》。除了全新歌曲〈新天地〉，還包括〈昔日舞曲〉、〈東方寶藏〉的各自兩個混音版本。靠著這樣的舉動，〈東方寶藏〉也獲得了不錯的成績，同時幫助了《亞拉伯跳舞女郎》的銷量和電台播放次數。</p>
<figure id="attachment_41648" aria-describedby="caption-attachment-41648" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41648 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-1024x705.jpg" alt="1987年，發行《亞拉伯跳舞女郎》後，Beyond 開辦專場演出的海報" width="648" height="446" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-1024x705.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-300x207.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-768x529.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710.jpg 1623w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-1024x705.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41648" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-1024x705.jpg" alt="1987年，發行《亞拉伯跳舞女郎》後，Beyond 開辦專場演出的海報" width="648" height="446" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-1024x705.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-300x207.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710-768x529.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9710.jpg 1623w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41648" class="wp-caption-text">1987年，發行《亞拉伯跳舞女郎》後，Beyond 開辦專場演出的海報</figcaption></figure>
<p>果然，這張唱片賣到了兩萬張。雖然和金唱片還有五千張的差距，但同時期的太極樂隊也就是賣到三萬張、達明一派由於《石頭記》可以賣到十萬張，Beyond 作為一個新樂隊，成績也算不錯。</p>
<p>不過，兩張老歌 EP 過後，下一張專輯《現代舞台》仍是兩萬張左右的銷量。這期間，黃家駒對樂隊狀況灰心，不像之前錄音時，不管有沒有自己的部分，他都會去發表意見、提供點子。到了錄製《現代舞台》時，沒有黃家駒的部分他基本上都待在家，來了也是癱坐在沙發上一言不發。這時候，在《再見理想》唱片發行之後加入的吉他手劉志遠，對專輯的創作、編曲做出了很大的貢獻，雖然年紀是五個人中最小的，但是他對吉他、貝斯、鍵盤都精通。可惜劉志遠後來與梁翹柏重組浮世繪，因而退出 Beyond 。</p>
<p>與此同時，陳健添也在考慮 Beyond 商業化的問題。他本人也喜歡搖滾樂，但是行業中的經驗讓他知道，純搖滾只能自己玩。香港當時並沒有欣賞搖滾樂的土壤，「搖滾」只能作為元素和噱頭。但是《亞拉伯跳舞女郎》、《搖滾舞台》都是 Beyond 從創作開始進行商業化考量的專輯，和《再見理想》時期可以說已經判若兩隊，但是 1980 年代末期，香港社會仍視搖滾為異類。陳健添在日後曾遇到當時 Beyond 的鐵桿歌迷，歌迷說到當時喜歡 Beyond，在學校裏都會被視作異類。就像搖滾樂最初在美國受到的歧視和阻礙，貓王的扭胯動作被視作「淫穢下流」，有的電視台為了收視率請到貓王，卻要求攝影師不許拍下半身；披頭士人畜無害的髮型都會被人稱作「拖把頭」、「假髮套」；黃貫中甚至在電梯裏親耳聽到人們叫他們「長毛飛」。</p>
<figure id="attachment_41649" aria-describedby="caption-attachment-41649" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41649 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-1024x690.jpg" alt="1987年，陳健添生日，Beyond 和朋友在旺角排練房「二樓後座」喝酒慶祝" width="648" height="437" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-1024x690.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-300x202.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-768x517.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-250x168.jpg 250w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-420x284.jpg 420w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711.jpg 1272w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-1024x690.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41649" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-1024x690.jpg" alt="1987年，陳健添生日，Beyond 和朋友在旺角排練房「二樓後座」喝酒慶祝" width="648" height="437" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-1024x690.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-300x202.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-768x517.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-250x168.jpg 250w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711-420x284.jpg 420w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9711.jpg 1272w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41649" class="wp-caption-text">1987年，陳健添生日，Beyond 和朋友在旺角排練房「二樓後座」喝酒慶祝</figcaption></figure>
<p>陳健添決定要用一些非常規的手段來擴大 Beyond 的知名度。</p>
<p>由於歌曲相對商業化，陳健添這時也開始了對電台的攻勢。當時社會的出口不多，電台是普通市民聽歌的重要渠道。香港電台會有自己的排行榜：中文歌曲龍虎榜。各家唱片公司都會把自己唱片發到電台播放，唱片公司和電台的關係也成為了影響榜單成績高低、在電台播放次數的重要因素。</p>
<p>在 1988 年 3 月，發布第二張專輯《現代舞台》後幾天，陳健添炮轟香港電台，抗議中文歌曲龍虎榜榜單不公平。新專輯錄製完成，陳健添設計了周密的計劃：打榜、單曲、演出，一環扣一環。樂隊在這張專輯中嘗試了比較溫和的形象，音樂也更加溫和商業化，大家都認為這張專輯 Beyond 大有可為。可重新編曲收錄在專輯中的〈舊日的足跡〉打榜成績不過第七名。這也罷了，同為新人的吳國敬、黃凱芹由於來自大唱片公司，一上榜就是第七、第八名。這讓陳健添決定放手一搏，籌資召開記者發布會，揭露這一不公的現象。記者會上，陳健添把事情的始末清晰地向各大媒體揭露出來，並用數據、事實把這個音樂行業都知道的內幕公之於眾。</p>
<p>果然，3 月 19 日是陳健添有史以來買報紙最多的一天：11 份報紙，並有許多家報社進行了持續報道。這也是 Beyond 出道以來見報最多的一次，成功讓更多市民知道了 Beyond 這支樂隊。</p>
<figure id="attachment_41651" aria-describedby="caption-attachment-41651" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41651 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-707x1024.jpg" alt="陳健添保留的曾在街上張貼的抗議海報" width="648" height="939" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-707x1024.jpg 707w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-207x300.jpg 207w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-768x1112.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713.jpg 1030w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-707x1024.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41651" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-707x1024.jpg" alt="陳健添保留的曾在街上張貼的抗議海報" width="648" height="939" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-707x1024.jpg 707w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-207x300.jpg 207w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713-768x1112.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9713.jpg 1030w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41651" class="wp-caption-text">陳健添保留的曾在街上張貼的抗議海報</figcaption></figure>
<p>除了炮轟香港中文電台以外，同年二月，香港電台「十大中文金曲」評選最佳新人獎銅獎中，Beyond 輸給了 Sony 公司的新樂隊 Blue Jeans ，這更讓陳健添從公司層面替 Beyond 考慮。作為獨立唱片公司 Kinn&#8217;s ，在靠人際、金錢的娛樂圈能做的有限，如果能簽約大公司，能爭取到對 Beyond 更加有利的條件。陳健添在幾家主流唱片公司中選擇良久，挑中了新藝寶。新藝寶曾簽約太極樂隊，但樂隊發行一張專輯之後立刻被華納挖走。陳健添看準新藝寶想要依靠 Beyond 擊敗太極樂隊，於是 Kinn&#8217;s 和新藝寶簽訂合約，Beyond 投至新藝寶旗下，發行全新唱片《秘密警察》。</p>
<h3>轉折三：差點被丟棄的〈大地〉讓 Beyond 專輯賣到了十萬張</h3>
<p>1988 年 7 月的一個下午，時任 Beyond 樂隊經紀人的陳健添正在自己位於香港旺角的 Kinn&#8217;s 工作室，為 Beyond 進行第三張專輯《秘密警察》的選歌工作。一陣腳步聲傳來，Beyond 樂隊的主唱黃家駒匆匆忙忙、面帶喜色走進他的辦公室：「我找到那盒 demo 了！就是〈黃河〉！」一邊說著一邊從包裏掏出一盒沒有外殼的卡帶。</p>
<p>陳健添早在 1986 年 Beyond 的排練室「二樓後座」就聽到過這首歌，那時候 Beyond 還在策劃簽約後的首張 EP《永遠等待》。二樓後座在老舊的香港小木樓的樓上，總是熙熙攘攘的，Beyond 幾個人被朋友們簇擁著。黃家駒給陳健添拿出了一盤卡帶：「聽聽這首怎麽樣？」陳健添一下就被開頭很中式的吉他 intro 和歌曲旋律吸引了：「這首一定會成為一首 hit！不過現在別發，現在 Beyond 還沒什麽名氣，這麽好的歌會被埋沒。等到我們發行了兩張專輯以後，有了一定名氣，這時候一個搖滾樂隊唱這麽傳統的音樂，肯定會是一個事件。」</p>
<p>1987 年，Beyond 發行第一張專輯《亞拉伯跳舞女郎》成績還不錯，銷售了兩萬張。但是到了 1988 年，第二張唱片《現代舞台》的成績仍舊是兩萬張，同時期的太極樂隊、Raidas 都能賣到十萬張以上。雖然陳健添做了不少工作，演出也演了不少，但是 Beyond 的知名度總是提不上來。雖然事情眾多繁雜，但是到了籌備第三張專輯歌曲的時候，陳健添仍記得這首原名為〈黃河〉的歌曲，可這時黃家駒不記得這首歌了，盒帶也找不到了。Beyond 排練室離陳健添的公司不遠，這天下午黃家駒突然找到這盤卡帶，於是激動地沒打電話就跑了過來。</p>
<p>正如陳健添所說，這首黃家駒作曲、劉卓輝填詞、黃貫中演唱的歌改名〈大地〉，收錄在第三張專輯《秘密警察》中。〈大地〉成為了 1988 年的年度「十大勁歌金曲」，同時這張專輯改變了前兩張專輯銷量不上不下的窘境，橫掃樂壇，銷售達到十萬張，成為雙白金唱片。Beyond 也一躍成為可以和達明一派、太極等平起平坐的香港代表樂隊。</p>
<p>第一首打榜曲〈沖開一切〉成績不錯，甜美的〈喜歡你〉讓 Beyond 收獲了更多原來對他們不感興趣的歌迷。而真正打開局面，令 Beyond 開始走向巔峰，和香港當時幾大樂團 Raidas、太極比肩的，還是這首曾命名為〈黃河〉的〈大地〉。</p>
<figure id="attachment_41650" aria-describedby="caption-attachment-41650" style="width: 626px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-full wp-image-41650 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712.jpg" alt="1988 年 10 月 15、16 日，Beyond 在北京首都體育館進行了兩場演唱會。演出座無虛席，同時北京音樂圈人士幾乎全部到達，崔健甚至帶了自己的吉他和音箱，想要和他們切磋一下" width="626" height="804" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712.jpg 626w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712-234x300.jpg 234w" data-lazy-sizes="auto, (max-width: 626px) 100vw, 626px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-full wp-image-41650" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712.jpg" alt="1988 年 10 月 15、16 日，Beyond 在北京首都體育館進行了兩場演唱會。演出座無虛席，同時北京音樂圈人士幾乎全部到達，崔健甚至帶了自己的吉他和音箱，想要和他們切磋一下" width="626" height="804" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712.jpg 626w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9712-234x300.jpg 234w" sizes="auto, (max-width: 626px) 100vw, 626px"/></noscript></img><figcaption id="caption-attachment-41650" class="wp-caption-text">1988 年 10 月 15、16 日，Beyond 在北京首都體育館進行了兩場演唱會。演出座無虛席，同時北京音樂圈人士幾乎全部到達，崔健甚至帶了自己的吉他和音箱，想要和他們切磋一下</figcaption></figure>
<p>劉卓輝的填詞，使這首有這傳統味道的歌曲意義更加深刻，描述了離家的人對故土的眷戀，使得 Beyond 的歌曲裏多了些深沈的意味。黃家駒和劉卓輝的合作，通常是由黃家駒說出自己想說的意思，而辭藻的甄選則由劉卓輝完成。陳健添力主讓黃貫中演唱〈大地〉，同樣也使 Beyond 更加多元。</p>
<figure id="attachment_41645" aria-describedby="caption-attachment-41645" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41645 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-1000x1024.jpg" alt="《秘密警察》這套服裝是不符合陳健添想法的，不過最終的宣傳效果還不錯" width="648" height="664" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-1000x1024.jpg 1000w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-293x300.jpg 293w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-768x787.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707.jpg 1653w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-1000x1024.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41645" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-1000x1024.jpg" alt="《秘密警察》這套服裝是不符合陳健添想法的，不過最終的宣傳效果還不錯" width="648" height="664" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-1000x1024.jpg 1000w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-293x300.jpg 293w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707-768x787.jpg 768w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9707.jpg 1653w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41645" class="wp-caption-text">《秘密警察》這套服裝是不符合陳健添想法的，不過最終的宣傳效果還不錯</figcaption></figure>
<p>在這之後，Beyond 相繼在 1989 年 7 月發布《Beyond IV》、1989 年 12 月發布《真的見證》、1990 年 8 月發布《命運派對》三張專輯，延續 Beyond 以前的風格，每張專輯配以一至二張 EP 為鞏固聲勢。舊作品挑選有潛力的，也拿出來重新演繹和宣傳，走得順風順水。《Beyond IV》賣了十多萬張，達到了雙白金唱片（白金唱片銷量為五萬張），〈真的愛你〉獲得年度「十大勁歌金曲」及「十大中文金曲」兩大獎項，〈真的見證〉收錄了 Beyond 給其他藝人寫的歌曲。而《命運派對》銷售達到十五萬，達到了三白金唱片。其中的歌曲〈俾面派對〉更是諷刺了香港演藝圈，「俾面」是粵語，意思是「賞臉」。</p>
<p>一天工作後，Beyond 樂隊接到了一位當時年近百歲的影星生日派對的邀請，幾個人跟派對主人根本不認識，大家莫名其妙之餘，甚至覺得好笑，他們沒去，便寫出了這首辛辣的〈俾面派對〉。</p>
<p>Beyond 的創作大多來自生活，〈光輝歲月〉也是如此。1962 年，南非領袖曼德拉由於領導罷工南非種族隔離政府下獄，直到 1990 年才被釋放。黃家駒一天在電視裏看到曼德拉的新聞，想到自己出生時曼德拉已經入獄，到了今天才被釋放，自己和這樣的一位偉人共同處在這樣的世界，就寫下了這樣的一首歌。〈光輝歲月〉和〈俾面派對〉分別奪得當年的「十大勁歌金曲」和「十大中文金曲」，黃家駒也奪得當年十大勁歌金曲的「最佳填詞獎」。</p>
<h3>轉折四：來到非洲，寫一首斯瓦希里語的熱門歌曲</h3>
<p>1990 年 8 月，Beyond 已經發布了《命運派對》，雙白金銷量。當時香港地區的宣明會發起了去幾內亞探望孤兒的慈善活動，資金不夠，所以就由陳健添和黃家駒一起去。由於這個活動，1991 年，該機構希望邀請 Beyond 全樂隊參與肯亞的慈善活動。</p>
<p>當時的 Beyond 已經出演了不少電影，雖然銷量比不上最當紅的流行歌星，但是演出、錄製、電影、電視節目的邀約已經源源不絕。在忙碌的工作之中，抽大塊時間出去做這樣名利都無的活動，在日新月異的香港娛樂圈幾乎是等於浪費。</p>
<p>但是陳健添這時給 Beyond 的定位，早不是初出茅廬的搖滾少年，而是更需要關注社會、公益問題的樂隊形象。陳健添同樣希望能夠通過此行完成一部非洲寫真集，回香港紅館做專場演唱會，也要成立一個第三世界的基金會。於是他說服 Beyond 成員，1991 年 1 月 31 日，Beyond 樂隊一行 11 人到達肯亞。</p>
<figure id="attachment_41646" aria-describedby="caption-attachment-41646" style="width: 648px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-large wp-image-41646 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-1024x772.jpg" alt="Beyond 在肯亞探訪了很多村莊，並給他們帶來音樂（圖片來源：Beyond 肯亞之行）" width="648" height="489" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-1024x772.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-300x226.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-768x579.jpg 768w" data-lazy-sizes="auto, (max-width: 648px) 100vw, 648px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-1024x772.jpg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-large wp-image-41646" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-1024x772.jpg" alt="Beyond 在肯亞探訪了很多村莊，並給他們帶來音樂（圖片來源：Beyond 肯亞之行）" width="648" height="489" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-1024x772.jpg 1024w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-300x226.jpg 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9708-768x579.jpg 768w" sizes="auto, (max-width: 648px) 100vw, 648px"/></noscript></img><figcaption id="caption-attachment-41646" class="wp-caption-text">Beyond 在肯亞探訪了很多村莊，並給他們帶來音樂（圖片來源：Beyond 肯亞之行）</figcaption></figure>
<p>通常五、六點，大家就回到了酒店，跟身邊新認識的肯亞朋友聊著天。只有黃家駒拿著吉他一直在撥弄，他問了翻譯「愛、和平、我愛你、友誼」用當地語言怎麽說，不一會兒，就用斯瓦西里語寫出了〈AMANI〉的副歌。1980 年代末，1990 年代初，世界呼喚和平、拯救貧困。〈AMANI〉也成為這個時期本類歌曲的一首代表作。</p>
<h3>轉折五：到中國、台灣、日本市場發展</h3>
<p>Beyond 當時已經贏得了商業上很大的成功，陳健添跟黃家駒說：「咱們過去做的流行歌我都有點聽噁心了，咱們現在不管它們了，想做什麽做什麽。咱們每個人都寫歌，做張雙專輯！」陳健添希望這張雙專輯和非洲之行結合起來，演唱會、非洲的寫真、公益的形象，一定能引起新的 Beyond 熱度。黃家駒對這個點子也格外感興趣，除去《再見理想》沒有受到商業影響之外，Beyond 的每一步都被商業、賣點所拘束著，這回終於能夠放手一搏了。</p>
<p>當時香港從來沒有人做過雙唱片，計劃實現的話，Beyond 將是第一人。不過當時 Beyond 和新藝寶的合約到期，這將是最後一張唱片。黃家駒擔心公司不用心推廣，而放棄了雙專輯計劃，把之前寫的一些電影、電視劇的插曲、主題曲收錄進來，發布了專輯《猶豫》，其中〈不再猶豫〉、〈AMANI〉成為大熱單曲。</p>
<p>在這樣的熱度之下，陳健添開始為 Beyond 思考繼續的出路。剛出道的時候覺得能賣到金唱片、白金唱片就已經足以欣慰，可到了能夠賣到十萬張的時候，又會思考在台灣、日韓、新馬泰的銷路。Beyond 這時候就到了這麽一個十字路口，到底怎麽走？</p>
<p>對於當時的香港樂隊，最先爭取的市場自然是香港無疑，其次是台灣，再往後才是大陸、日韓、新馬泰。這也是經濟發展形勢使然。在香港，人口超過 500 萬，最火的歌星如譚詠麟、張國榮，一張唱片能夠賣到 20 萬到 30 萬張，而音樂人一張平均能拿到 10 元左右；台灣人口達到 1000 萬，最火的歌星能賣到 100 萬張；可大陸一張的預付也就是 10 萬元，對唱片公司來說可有可無。</p>
<p>此時陳健添和 Beyond 四人達成協定：五人共享 Beyond 版權，作為同一整體出現。陳健添不滿新藝寶在台灣對 Beyond 的推廣和宣傳，此時日本公司 Amuse 向 Beyond 樂隊發出了天價邀約。</p>
<p>本來 Amuse 公司老闆對 Beyond 一直不看好，但是在紅磡湊巧看了 Beyond 演出之後，有如中邪一樣 180 度轉變態度，並向 Beyond 開出了天價邀約。一個演唱粵語為主的樂隊，去日本前程如何，陳健添也不能確定。他和四位成員商量，最終決定：遠赴日本發展，由 Amuse 代理，香港事務由華納代理，台灣則由滾石代理。</p>
<p>香港的演藝圈節奏快，湧現的新人輩出，而 1991 年底到 1992 年，Beyond 在這半年間卻沒有動作。1992 年 8 月發布的《繼續革命》在香港只賣到四萬張，而且陳健添和日本公司的合作發生了很大的問題。不同於和香港唱片公司的合作，陳健添能夠輸出自己的想法，和樂隊商談、制定計劃。可 Amuse 給陳健添的權限很低，甚至挑撥 Beyond 成員與陳健添的關系。</p>
<p>在日本公司的包裝之下，音樂也由梁邦彥進行制作，作品變得越來越規整、精緻，但陳健添在其中已經聽不到最初 Beyond 的憤怒。1993 年 5 月發布的作品《樂與怒》，在香港只賣到了兩萬張，似乎十年的努力，全都成了白費。</p>
<figure id="attachment_41647" aria-describedby="caption-attachment-41647" style="width: 507px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-full wp-image-41647 jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709.png" alt="遭遇滑鐵盧的《樂與怒》因為黃家駒的意外事故而變成大熱專輯" width="507" height="506" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709.png 507w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709-150x150.png 150w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709-300x300.png 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709-400x400.png 400w" data-lazy-sizes="auto, (max-width: 507px) 100vw, 507px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709.png?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="size-full wp-image-41647" src="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709.png" alt="遭遇滑鐵盧的《樂與怒》因為黃家駒的意外事故而變成大熱專輯" width="507" height="506" srcset="https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709.png 507w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709-150x150.png 150w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709-300x300.png 300w, https://blow.streetvoice.com/wp-content/uploads/2018/09/img_9709-400x400.png 400w" sizes="auto, (max-width: 507px) 100vw, 507px"/></noscript></img><figcaption id="caption-attachment-41647" class="wp-caption-text">遭遇滑鐵盧的《樂與怒》因為黃家駒的意外事故而變成大熱專輯</figcaption></figure>
<p>伴隨著 1993 年 6 月 24 日，黃家駒在日本綜藝節目中發生的事故，未能做成的雙專輯最終成了空談。至今香港樂壇還沒有人發行過雙專輯。而直到最後，Beyond 也一直在更大的成功和名望的吸引下，對自己的音樂做出越來越大的讓步。</p>
<p>八年間，陳健添和 Beyond 一起走過了風風雨雨，身為經紀人的他同樣扮演著 A&amp;R 的角色：他親自見證過 Beyond 從小劇場演到紅磡，看他們的唱片從幾千張賣到十多萬張。其中幾次方向的轉變，有宣傳技巧上的：〈永遠等待〉的 remix、迪廳的推廣、炮轟香港中文電台以獲取關注；也有形象上的：《亞拉伯跳舞女郎》的形象變化、單曲〈大地〉推出的時機、後期形象向公益方向的轉變；更有發展方向上的：搖滾元素和流行元素的結合、對香港、台灣、大陸以及海外市場的不同策略⋯⋯。</p>
<p>「雙專輯」也成了陳健添的一塊心病。傳統唱片行業中，A&amp;R 通常也是編曲師、詞曲作者，或者是製作人，這樣才能保持對音樂的敏感和前瞻性。陳健添對音樂的鑒賞力和品味也影響了黃家駒。每次在演出上台前，Beyond 的成員都會背起吉他，不插電 twang twang 彈一通。有一次黃家駒彈起一套和弦走向，陳健添立刻看向了黃家駒，黃家駒笑了：「厲害哦！」因為陳健添是 The Beatles 的忠實樂迷，自己彈吉他時候也扒過很多 The Beatles 的和弦，於是他一下就聽出來這是〈Let It Be〉。陳健添也會推薦 The Beatles 的歌給黃家駒聽，不久後黃家駒用這套和弦寫出了〈真的愛你〉。</p>
<p>陳健添仍然記得《樂與怒》銷量斷崖式下滑的時刻。〈海闊天空〉拿給當地的 DJ，DJ 都會說「這首歌不行，換歌吧。」但是在黃家駒出事故之後，《樂與怒》直接賣到了 Beyond 從未企及的三十萬張，「這是用生命換來的三十萬。」陳健添說。</p>
<p>當我們回頭看一個音樂人獲得的成功時，我們總能條理清晰、清清楚楚分析出他每一步舉動的得與失，並似乎能夠做出更符合當時情況的舉動。但其實處在局面裏，每一步都在被各種因素所左右，也就是我們所說的「蝴蝶效應」。不能否認，A&amp;R 也是經紀人重要的職責。處在事件中心，在周遭情報有局限、短時間內做出合適的反應，這在藝人的發展道路上總會起到很大的作用。</p>
<p>Beyond 歌曲〈大地〉發行時機的正確選擇，正是經紀人判斷的最好體現。而重新制作〈永遠等待〉、歌曲選擇在迪廳宣傳、Beyond 公眾形象的塑造，這都是陳健添作為經紀人的重要作用。簽約 Amuse、遠赴日本發展，則是幾人一同討論的結果，是非功過，也早已無從評說。</p>
<h3>後記：回北京</h3>
<p>已經定居澳大利亞多年的陳健添，在 2017 年年底回到北京，開始經營「搖滾優先 Rockfirst」廠牌。辦公室位於朝陽門北邊的一座大樓裏，雖然還沒有來得及佈置，但抽屜裏似乎已經把他從業多年的「寶貝」都帶了過來。採訪之中講到 Beyond ，陳健添特意送給記者一套 Beyond 歌詞卡，還說：「要是賣的話能值不少錢呢！」講到黑豹，就立刻拿出來他珍藏多年、尚未開封的樂隊第一張專輯香港版卡帶。</p>
<p>就像陳健添自己所說，有的藝人，他第一次見到，腦子裏就有一個聲音在說：「這個人會很紅。」在王菲以王靖雯的藝名發行了兩張專輯、銷量不上不下都是兩萬張的時候，王菲想退出娛樂圈，出國讀書。陳健添對她說：「王菲，你別擔心，你別看現在這些當紅女歌星，林憶蓮啊、葉倩文啊，他們以後都不如你紅。」王菲當時將信將疑。</p>
<p>曾經在跑馬地附近有個商業活動，陳健添看見當時還沒有火起來的郭富城，他的第六感也這樣告訴他，可他剛想去找郭富城，郭富城已經走了。甚至陳健添在地鐵海報上看到鄭伊健，也覺得：「他一定會很紅。」</p>
<p>1992 年，陳健添來到北京成立「紅星生產社」，鄭鈞、許巍、田震、小柯等等音樂人都陸續在紅星生產社旗下發行了唱片。紅星生產社在石景山租下一塊園區，在園區裏規劃了錄音棚、唱片廠、辦公樓，員工宿舍⋯⋯幾乎是唱片的一條龍服務。紅星生產社同樣開設了郵購部，為音樂人生產紅星卡。郵購部門最初只需要一個郵遞員兩天騎著自行車來一趟，到最後，郵遞員開著貨車一天一趟，車廂裏郵購商品裝得滿滿當當。</p>
<p>聊到當下，他還把他的廠牌搖滾優先旗下音樂人段同願、馬來西亞樂隊異種 Alienoid 的歌曲拿出來給記者分享。他仍希望能夠用自己敏銳的直覺，重塑這個市場。他曾經低價賣出手裏的音樂版權，如果今天這些版權仍在他手裏，一年光版權收益就有幾百萬。不過陳健添也看得很開，如果他一年有這麽多錢，他可能已經是一個花天酒地的人了。面對錢的誘惑，大家都不一定能抵擋。回想當年，早已移民澳大利亞的他就是回到香港，才有 Beyond 和這之後以一系列事情。就是因為在北京認識妻子，才會開辦紅星生產社，因為沒成為富豪，才會回北京繼續奮鬥。最後他說：「我生來就是做藝人的。」</p>
<p><strong>本文圖片來源：陳健添執筆的《真的 Beyond 歷史 – The History Vol.1，Vol.2》</strong></p>

							<h4 class="height-two">2017 年 StreetVoice 街聲做了哪些事？</h4>
							<p class="height-three mb-0">2017 年的音樂圈，雖沒有獨立樂團如草東沒有派對那樣誇張爆紅，也沒有什麼夭折或回歸的大型音樂活動。但在這平實的日常中，依然有許多難忘的小事件不斷在發生，有很多新人、新團閃耀才華，在 StreetVoice 站上獲得關注。 迎來前一年各種重閱讀全文 "2017 年 StreetVoice 街聲做了哪些事？"</p>

							<h4 class="height-two">以生命力飽滿的樂句，營造洗滌心靈的美好風景 － 專訪 Cicada</h4>
							<p class="height-three mb-0">〈浮游在海上的島嶼／潛沈於水下的人們〉是 Cicada 創作生涯所寫下的第一首土地歌曲，事隔多時，為了能更深刻捕捉這片土地的日常變化，他們真的從島上一跳躍入了海中，從學習潛水開始，親身感受這一大片湛藍海域底下蘊藏的豐富生命力，同時也將這份感閱讀全文 "以生命力飽滿的樂句，營造洗滌心靈的美好風景 － 專訪 Cicada"</p>

							<p class="text-red line-height-sm mb-5p">

							<h4 class="height-two">【吹專訪】從逃家小孩到金曲獎得主，職業樂手CFU嘉富：「我其實沒那麼愛音樂，但我喜歡創造好玩的東西。」</h4>
							<p class="height-three mb-0">採訪、撰稿／王子瑄 也許你沒聽過 CFU嘉富（鄭嘉富）這名字，但你大概看過他的表演。他是國內眾多音樂人的御用職業打擊樂手，合作對象一字排開包含宇宙人、9m88、林以樂、動力火車、魏如萱、YELLOW黃宣、陶晶瑩、鄭宜農等，從 live ho閱讀全文 "【吹專訪】從逃家小孩到金曲獎得主，職業樂手CFU嘉富：「我其實沒那麼愛音樂，但我喜歡創造好玩的東西。」"</p>
