                                    <p>殿堂級樂隊Beyond的主音結他手黃貫中（Paul），近年將事業重心轉往內地，近日他與「音樂教父」羅大佑攜手，於深圳舉行《天若有情1990-2026深圳時光演唱會》。現年62歲的黃貫中在台上施展渾身解數，獻唱了《海闊天空》、《不再猶豫》及《我是憤怒》等多首Beyond膾炙人口的搖滾金曲，讓台下樂迷聽得熱血沸騰，再次感受昔日搖滾巨星的魅力。</p><ad id="ad-1"/><h2>黃貫中生圖被指斷崖衰老</h2><p>演出結束後，大批忠實歌迷意猶未盡，特意前往黃貫中下榻的酒店門外守候，希望能與偶像近距離接觸。黃貫中貫徹其親民作風，大方為守候多時的歌迷簽名留念。然而，在粉絲近距離拍攝的「生圖」底下，黃貫中的最新狀態卻引起了網絡熱議。</p><ad id="ad-2"/><p>相關閱讀：黃家駒逝世33年丨黃貫中痛憶青春定格像刀割那麼痛 唯一舊愛林楚麒終極現身</p><ad id="ad-3"/><div id="ad-1x1b" style="display:block;" data-container=".1x1-container" class="1x1b-content-container">

0/K11__3____.jpg 640w" onerror="this.src='handle_img_onerror(this, https://www.sthlstatic.com/sthl/assets/images/news-img-placeholder.png)}'" sizes="100vw" alt="網民留言大讚跟在身後的黃貫中：「好爸爸好老公，每次都是默默的在背後跟着」。"/></div></div><div data-fancybox="gallery_0" href="https://image.hkhl.hk/f/1024p0/0x0/100/none/17837297a4cb66b2315690cce5cd1c53/2024-10/_1_Kaka__.jpg" data-caption="早前有網民在九龍塘同樣見到他們三人逛商場都指：「隔壁應該是女兒吧，果然基因好，很漂亮」。" class="img-block popupbox" data-number="27"><div class="img-div"><img class="galleryimg" src="https://image.hkhl.hk/f/1024p0/0x0/100/none/17837297a4cb66b2315690cce5cd1c53/2024-10/_1_Kaka__.jpg" srcset="https://image.hkhl.hk/f/1920p0/0x0/100/none/0f73c3fd1979af07f832c7ba4c7dab0f/2024-10/_1_Kaka__.jpg 1920w,https://image.hkhl.hk/f/1440p0/0x0/100/none/963b2f288f4338b648fe54554437652c/2024-10/_1_Kaka__.jpg 1440w,https://image.hkhl.hk/f/1024p0/0x0/100/none/17837297a4cb66b2315690cce5cd1c53/2024-10/_1_Kaka__.jpg 1024w,https://image.hkhl.hk/f/640p0/0x0/100/none/caef649598e50130fb9289599a62a507/2024-10/_1_Kaka__.jpg 640w" onerror="this.src='handle_img_onerror(this, https://www.sthlstatic.com/sthl/assets/images/news-img-placeholder.png)}'" sizes="100vw" alt="早前有網民在九龍塘同樣見到他們三人逛商場都指：「隔壁應該是女兒吧，果然基因好，很漂亮」。"/></div></div></figure></gallery-1><h2>黃貫中面上疑現老人斑</h2><p>從網上流傳的照片可見，黃貫中當時頭戴棒球帽，並架上一副太陽眼鏡，遮蓋了近大半張臉，但依舊難掩其憔悴疲態。相中的他身形明顯比過往消瘦，臉頰凹陷，即使有墨鏡遮擋，其極深的法令紋依然清晰可見，更有網民指出他的臉上似乎驚現老人斑，整體老態龍鍾的模樣與昔日光彩照人的搖滾巨星形象判若兩人。不過，當黃貫中站上舞台，化上妝容後，狀態明顯回勇，在台上彈結他演唱時重現搖滾風采。但從特寫鏡頭中，仍可清楚看到他臉上歲月留下的痕跡，皺紋相當顯眼。</p><ad id="ad-4"/><h2>網民嘆黃貫中已變黃伯</h2><p>照片曝光後，大批網民對黃貫中的巨大轉變感到驚訝，紛紛留言感嘆歲月不饒人，「有點心酸，阿Paul是真的老了，希望時間走得慢一些吧」、「沒想到他老得這麼快」、「真成黃伯了」、「趁能看的時候多看」、。更有網民直言，指他現時的樣貌竟與現年82歲的資深歌手葉振棠有幾分相似，讓人感嘆一代搖滾巨星也難敵歲月的洗禮。</p><ad id="ad-5"/><p>相關閱讀：朱茵老公黃貫中被指斷崖式衰老 再唱《光輝歲月》「有氣沒力」 意外撞樣政協港星</p><ad id="ad-6"/><gallery-2 class="gallery-2" id="gallery-2"><figure class="imgs-5"><div data-fancybox="gallery_0" href="https://image.hkhl.hk/f/1024p0/0x0/lr/sthl/fa861da7c9e18282c84640adecdf73e1/2024-03/_DSC0508_0.JPG" data-caption="黃貫中早前假圓方舉行個人藝術展覽「童城迷路」。
