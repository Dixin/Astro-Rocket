                                    <p>傳奇樂隊Beyond隨着靈魂人物黃家駒意外離世，各成員都單飛發展，不過各人的不和往事卻在黃家駒離世後才被公開。Beyond本來有5名成員，前結他手劉志遠（遠仔）是隊中最年輕的成員，但1988年宣布離隊，自此轉做幕後音樂人，直至後來Beyond經理人Leslie（陳健添）才爆出，當日劉志遠離隊是因為與黃家強不和。劉志遠離開幕前多年，近日罕有在幕前露面，在前亞視小生張啟樂的YouTube影片中現身，年近60歲的他仍然Fit爆！</p><ad id="ad-1"/><h2>劉志遠操出肌肉</h2><p>劉志遠移居台灣10年，已退居幕後多年的他成為巨星御用編曲人，他早年最常合作的歌手分別有林憶蓮、陳奕迅、蕭亞軒、何超儀、許志安、張惠妹、楊千嬅等，近年或因移居台灣的關係，參與的作品數量大減，過着半退休生活。近日他與張啟樂在台灣跑步罕有出鏡，他半裸上身，可隱約見到肌肉，操得非常Fit。張啟樂分享，他是到台灣定居後，透過一位台灣音樂人朋友介紹而認識到劉志遠，二人成為運動的好伙伴。</p><ad id="ad-2"/><p>相關閱讀：Beyond 40周年音樂會狂迷荒唐舉動被公開 冒充工作人員拜神大合唱兼偷竊</p><ad id="ad-3"/><gallery-1/><h2>劉志遠離開Beyond</h2><p>Beyond早年已屢傳有成員不和，但有指因各成員都非常尊重黃家駒，因此沒有徹底反面，唯一在黃家駒健在時退團的是劉志遠。劉志遠未成年時已是樂隊「浮世繪」成員，自學結他被封「結他神童」，後來樂隊「浮世繪」解散，Beyond向他招手，成為Beyond的結他手，同時也有參與製作，間中也會客串其他崗位，例如做琴鍵手。1988年，劉志遠決意離開Beyond，當時黃家駒公布消息，表示尊重劉志遠的意願，劉志遠一度重組樂隊「浮世繪」，再度解散後，轉型成為幕後音樂人。</p><ad id="ad-4"/><p>相關閱讀：葉世榮佛山登台驚遇爭執場面 無視攝影師台上大打出手 一招應對掀討論</p><ad id="ad-5"/><h2>劉志遠與黃家強意見不合</h2><p>其實當年已有傳劉志遠與成員意見不合而離隊，直至2008年劉志遠曾透露離隊是因為黃家強，但沒有透露太多詳情。2013年，Beyond成員黃貫中、黃家強再掀罵戰，前經理人Leslie發表公開信就提及到黃家強很任性，但早年都獲得黃貫中與葉世榮遷就。他更在公開信中透露，1986年黃家駒曾要求弟弟黃家強退出，但因黃貫中與葉世榮出聲挽留而繼續合作，並公開劉志遠1988年退出的真相：「遠仔（劉志遠）離開Beyond是因為你（黃家強）。」</p><ad id="ad-6"/><p>相關閱讀：BEYOND黃家強徒弟44歲離奇猝逝 幾天前才開直播 生前受重抑鬱困擾死因令人惋惜</p><ad id="ad-7"/><gallery-2/><h2>劉志遠是嘉利大火生還者</h2><p>梁思浩曾在節目《直播靈接觸》表示，與劉志遠曾是鄰居，指劉志遠是1996年嘉利大廈五級大火的生還者。梁思浩指當時劉志遠在嘉利大廈內的錄音室工作，因聽不到外面的聲音，而遲遲未有離開錄音室，此時，劉志遠遇上靈異事件，他聽到一把小朋友聲音叫他逃生，最終成功活命。梁思浩表示：「淨係知佢當日返嚟成個人好似失魂落魄，好似定唔到神咁，太驚，我諗人遇到大災難係會好驚。」</p><ad id="ad-8"/><p>相關閱讀：黃家駒逝世31年丨黃貫中貼合照念故友：日子並沒有把事情沖淡 葉世榮四字盡訴心中情</p><ad id="ad-9"/>
