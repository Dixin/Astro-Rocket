        </div></div></div> <button title="分享" class="m-sharebar-mobile-btn share-tag"><img src="https://static.ctwant.com/images/dist/share.svg" alt="分享標示圖" class="m-sharebar-mobile-btn__img m-sharebar-mobile-btn__img--active"> <img src="https://static.ctwant.com/images/dist/xx-gray.svg" alt="關閉分享標示圖" class="m-sharebar-mobile-btn__img"/></img></button> </div> <div class="m-fontsize" data-v-e5af677a=""><button title="放大內文字級" aria-label="放大內文字級" class="e-btn m-fontsize__item" data-v-e5af677a="">

        </button> <button title="縮小內文字級" aria-label="縮小內文字級" class="e-btn m-fontsize__item" data-v-e5af677a="">
          A-
        </button></div> <article data-v-e5af677a=""><div style="font-size:18px;" data-v-e5af677a=""><p>金曲樂團麋先生將在高雄從無到有、劃地建造，打造「全帳篷」式馬戲團演唱會王國，於5月一連五場開唱。上星期也飛到香港擔任五月天演唱會嘉賓，更抽空專程前往香港殿堂級搖滾樂團Beyond「二樓後座」錄音室朝聖，為演出找更多靈感。</p><p>「二樓後座」錄音室是Beyond於80年代末至90年代的重要創作基地，樂團多首經典作品皆在此誕生，對香港樂迷乃至亞洲搖滾樂壇都具有深遠意義。參觀期間，麋先生得知錄音室所在的大廈將於4月9日後被拆除重建，永遠消失在世上，眾人均表示非常可惜，感嘆：「這個代表著香港搖滾歷史的地方很珍貴，如今將從此消失，真的好可惜。幸好我們趕得上這最後一波參觀！」</p><div class="l-ad__article mb-1 mt-1"/><p>第一次踏足Beyond的二樓後座，主唱聖皓表示：「Beyond在我們心目中是一個非常經典的樂團，都有聽過他們的歌，這一次親身走到他們的錄音室工作室，是非常感動跟震撼。踏進去就像走進他們的故事裡面，真實感受到那些曾經在耳機裡面的音樂。」</p><figure class="image"><img src="https://static.ctwant.com/images/content/83/475883/d9d7769766512a8ff324d091ae8e35b5.jpeg" alt="麋先生喆安試彈黃家駒的吉他。（圖／相信音樂提供）" width="810" height="502"><figcaption>麋先生喆安試彈黃家駒的吉他。（圖／相信音樂提供）</figcaption></img></figure><p>吉他手喆安於二樓後座，拿起Beyond黃家駒的古董吉他試彈，得知是近40年歷史的1987年吉他，眾人高呼「這把吉他是前輩等級，資歷比我們還深」 ，吉他上還貼有價錢是90幾萬港幣（約367萬新台幣）也嚇了他們一跳，最後才知道，那個價錢貼是Beyond黃貫中搞笑寫上去的。</p><div class="l-ad__article single mb-1 mt-1"/><p>鼓手逸凡更在錄音室獲得了一份極具意義的禮物，Beyond鼓手葉世榮送贈的鼓棍，逸凡透露將會在四月到香港開演唱會時使用這份珍貴的紀念品。逸凡被問到會否效法Beyond鼓手葉世榮當年演唱會solo 20分鐘，他笑言：「如果大家真的這麼想看，我是絕對奉陪的。」</p></div> <div id="article-tag-bottom" class="l-tags__wrapper bottom" data-v-e5af677a="">
