								<div id="articleContent" class="article-content-edtor">                    
                        		民視八點檔《豆腐媽媽》日前拍攝墜樓戲時發生嚴重工安意外，替身演員蘇德揚從高台跳下不慎被軟墊彈飛，頭撞水泥地，導致顱內出血、顏面多處複雜性骨折。蘇德揚的事件引發各界對劇組是否給演員足夠安全安全保障提出質疑，不只影劇圈，綜藝界也發生過多起工安意外，最知名的莫過於香港樂團Beyond主唱黃家駒，32年前於日本錄製節目時從高處墜落，昏迷6天離世，年僅31歲。<br><br>
				        		<div class="ad-blk1">
                                   	<div class="hr-separator">我是廣告 請繼續往下閱讀</div>
                                   	<div class="adcolumn">
                                   		
                                       	
                                     	</div>
                                   	
                                </div>
				            	<strong>黃家駒錄影從高處跌落　後腦著地昏迷6天去世</strong>
<br>
<br>
1993年是香港傳奇樂團Beyond成軍10週年，6月24日凌晨，4位成員在日本東京富士電視台錄製遊戲節目《小內小南的想做什麼就做什麼》，主唱黃家駒在狹窄又濕滑的台上奔跑，一時失足不慎跌倒，導致布景被撞擊而掉落，黃家駒從2.7米（270公分）高的舞台墜下，後腦著地當場昏迷。
<br>
<br>
頭部重創的黃家駒，搶救6天後於6月30日下午4時15分，病逝東京女子醫科大學醫院，終年31歲，院方後來公布黃家駒死因為急性腦膜下血腫、頭蓋骨骨折、腦挫傷及急性腦腫脹。
<br>
<br>

  </figcaption>

</div><strong>電視台道歉配合調查　涉事節目遭永久停播</strong>
<br>
<br>
針對黃家駒的意外猝逝，富士電視台當時對外發表聲明，向黃家駒本人、家屬及歌迷致歉，強調會全力配合後續醫療與調查，並承諾檢討所有節目製作流程與安全管理，而悲劇發生後，《小內小南的想做什麼就做什麼》也永久停播，相關片段不再重播；同時檢討同類型高風險遊戲設計，避免再度出現危及來賓安全的橋段。
<br>
<br>
<strong>事發電視台修訂錄影安全規範　日綜更重視來賓安全</strong>
<br>
<br>
富士電視台於黃家駒意外發生後啟動內部調查，檢視舞台結構、護欄高度、道具固定、工作人員指揮與安全控管等環節，並修訂錄影安全規範，要求日後更嚴格的風險評估與防護措施，至於香港和華語娛樂圈輿論則強烈質疑節目安全與責任歸屬，此事件促使日本綜藝界更重視參與來賓的安全，也成為日後限制高危險性遊戲設計的重要分水嶺。
<br>
