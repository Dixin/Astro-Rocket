							<h2 class="conten_title">黃家駒60歲冥誕 Beyond成員黃貫中葉世榮發文懷念老友</h2>
							<div class="ti_con">
								<span class="ti_l">2022-06-10</span>
								
							</div>
							<div class="from_new">
								来源：香港商報網							</div>
							<div class="content_main">								
									<p>　6月10日，是Beyond樂隊主唱黃家駒60歲冥誕，黃貫中、葉世榮都紛紛發文懷念老友。</p><p><img src="http://www.hkcd.com.hk/userfiles/1654831321532279.png" alt="微信截圖_20220610112112.png"/></p><p>　Beyond成員葉世榮今日零時在社交平台上發文：「家駒生日快樂。」</p><p>&nbsp;&nbsp; 據悉，葉世榮自2010年開通微博賬號後，幾乎每年都會在黃家駒冥誕當天在社交平台上送祝福。</p><p><img src="http://www.hkcd.com.hk/userfiles/1654831327967399.png" alt="微信截圖_20220610112046.png"/></p><p>　除了葉世榮，黃貫中今日亦深情發文：「兄弟，又到今日了，時間流逝快得像丟失了一樣，但在我心中的你卻沒有『昨天』過，還好嗎？祝你生日快樂！ 」</p><p><img src="http://www.hkcd.com.hk/userfiles/1654831334298484.jpg" alt="001T6OhOgy1h32tt3ipzkj60di0hc3zw02.jpg"/></p><p>　1993年6月24日，黃家駒在日本參與某綜藝節目期間意外受傷，於6月30日逝世，終年31歲。</p>							
							</div>
