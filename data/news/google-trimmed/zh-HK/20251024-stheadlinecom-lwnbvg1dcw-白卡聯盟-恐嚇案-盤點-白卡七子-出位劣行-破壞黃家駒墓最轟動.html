                                    <p>網紅團體「白卡聯盟」疑發刀片信威嚇三名不和的YouTuber，7人落網。消息稱，被捕「白卡」七子包括葉子健、黃群壹、光頭Bob（梁俊言）、曾維誠、張裕泰、曾嘉楠及王樂然，過去七子做出不少出位劣行「吸晴」，以「光頭Bob」破壞已故歌星黃家駒墳墓轟動一時。</p><ad id="ad-1"/><h2>白卡聯盟成員光頭Bob曾用鐵鎚毀家駒墳墓</h2><p>梁俊言又稱「光頭Bob」，現年17歲，是「白卡聯盟」近年冒起得最快成員，曾自稱患有自閉症及過度活躍症，不止一次惡搞先人的墳頭，曾自稱「很喜歡搞事亦不怕事」、「社會破壞者」，往往為引人注意及增加自己網片的流量，不惜做出種種令人不齒的破壞行為。2023年9月11日，光頭Bob在葵芳新都會廣場大家樂門口，對着炎明熹的紙牌破口大罵，聲稱要「侵犯、猥褻」炎明熹。</p><ad id="ad-2"/><p><strong>相關新聞：三名YouTuber疑得罪「白卡聯盟」收刀片恐嚇信 警拘7人</strong></p><ad id="ad-3"/><p>去年5月19日，梁俊言聯同葉子滔在將軍澳華人永遠墳場，用可樂淋黃家駒的墳墓，又用鐵鎚破壞家駒墳墓。兩人當場被捕，光頭Bob被判入更生中心。</p><ad id="ad-4"/><p><strong>相關新聞：兩青少年認刑毀黃家駒墳墓 官斥行為可恥分別判入更生中心及勞教中心</strong></p><ad id="ad-5"/><gallery-1/><h2>白卡聯盟成員葉子健曾被劉馬車毆打</h2><p>現年30歲的葉子健，就讀香港大學文學系，2023年轉型為白卡網紅，2023年2月3日，葉子健聯合白卡聯盟成員於阿布泰國生活百貨叫囂辱罵林景楠被捕，獲判守行為24個月。2025年7月4日晚上7時左右，葉子健在火鍋店拍攝宣傳片期間被劉馬車（劉駿軒）揮拳打傷，造成葉鼻部瘀傷及店內電視機損毀。</p><ad id="ad-6"/><p><strong>相關新聞：「劉馬車」劉駿軒再涉打人 襲擊網紅葉子健 大鬧尖沙咀餐廳後逃去｜天眼直擊</strong></p><ad id="ad-7"/><gallery-2/><h2>Seemi現役白卡聯盟成員中粉絲數最高</h2><p>英文「Seemi」的黃群壹（18歲），又稱思米、一仔和香港許光漢，白卡聯盟現役成員中粉絲數最高一位，多次在港鐵拍片，曾大喊：「大家唔好嘈，邊個喺度嘈，唔好意思原來係我」爆紅。去年7月26日，他在灣仔會展動漫節被「劉馬車」襲擊受傷。</p><ad id="ad-8"/><p><strong>相關新聞：動漫節｜劉馬車會場內毆16歲網紅被捕 疑不滿對方借$4000唔還</strong></p><ad id="ad-9"/><img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/68a63400193443471d815ae328e09343/2025-10/01_0_22.jpg" alt="黃群壹在灣仔會展動漫節被「劉馬車」襲擊受傷。" title="黃群壹在灣仔會展動漫節被「劉馬車」襲擊受傷。"/><div class="img_caption">黃群壹在灣仔會展動漫節被「劉馬車」襲擊受傷。</div><h2>白卡聯盟成員勇狗以水槍襲警罪成</h2><p>曾維誠（28歲），職業為夜間的士司機，2024年進軍YouTube界，表情動作極為瘋狂，人稱「勇狗」，2023年曾維誠和兩男子在九龍城潑水節，以水槍向電視台記者及警員射水。他們被裁定普通襲擊及襲警等6罪成被判囚，他與另一人曾提出上訴。</p><ad id="ad-10"/><p><strong>相關新聞：涉潑水節向警員及無綫記者射水 「勇狗」等3人被控襲警等罪8月審</strong></p><ad id="ad-11"/><img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/512c4b135644bd4ff0d0ce9f6cd84e67/2025-10/02_1_12.jpg" alt="「勇狗」曾維誠。資料圖片" title="「勇狗」曾維誠。資料圖片"/><div class="img_caption">「勇狗」曾維誠。資料圖片</div><h2>「車寶山」屢在港鐵站半裸跳舞</h2><p>現年36的張裕泰，又稱「車寶山」，青衣長大，受劉馬車的影片影響加入YouTube界，他的金句是：「認住我，青衣車寶山」，多次在港鐵站赤裸上身跳舞。</p><ad id="ad-12"/><img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/d86c8aa12efd47682ae26a02e0b40339/2025-10/03_2_1.jpg" alt="青衣車寶山。網圖" title="青衣車寶山。網圖"/><div class="img_caption">青衣車寶山。網圖</div><h2>「白卡特工」曾嘉楠年僅13歲</h2><p>英文名Stanley的曾嘉楠，年僅13歲，又稱「白卡特工」，竹園邨長大，認為學校太過無聊，開啓拍片生涯，去年底加入白卡聯盟，最出位一次是在垃圾車裡面發表愛國宣言。</p><ad id="ad-13"/><img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/ffc485b93adf9fb1320d8d7c3ba20b2a/2025-10/01_0_1.PNG" alt="曾嘉楠年僅13歲，又稱「白卡特工」。網圖" title="曾嘉楠年僅13歲，又稱「白卡特工」。網圖"/><div class="img_caption">曾嘉楠年僅13歲，又稱「白卡特工」。網圖</div><h2>白卡聯盟成員Larry玩弄行乞老婦</h2><p>此外，王樂然又稱「Larry」，現年22歲，相對低調，曾拍攝一條短片，玩弄行乞的老婦，被網民鬧爆。</p><ad id="ad-14"/><img src="https://image.hkhl.hk/f/1024p0/0x0/100/none/28450e625d082b3677a42c141d042100/2025-10/02_7.PNG" alt="王樂然曾拍攝玩弄行乞的老婦短片。網圖" title="王樂然曾拍攝玩弄行乞的老婦短片。網圖"/><div class="img_caption">王樂然曾拍攝玩弄行乞的老婦短片。網圖</div>
