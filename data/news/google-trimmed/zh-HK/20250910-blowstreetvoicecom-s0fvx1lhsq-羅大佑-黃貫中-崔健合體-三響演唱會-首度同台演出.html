					<div class="text-read">
						<div class="smart_content_wrapper"><p>台灣音樂教父羅大佑、香港搖滾巨匠黃貫中（Beyond 成員）、中國搖滾啟蒙者崔健，三位殿堂級人物首度合體，10 月 11 日將在杭州奧體中心體育場（大蓮花）舉辦《三響演唱會》。</p>
<p>這場名為《三響演唱會》的音樂盛宴，不僅 3 位重量級主角同台，更是一場跨越台北、香港、北京三地的文化交流；各自分別代表不同的社會背景與創作脈絡，卻同樣以音樂回應時代、用歌詞書寫歷史。</p>
<p><img loading="lazy" decoding="async" class="aligncenter wp-image-83063 size-full jetpack-lazy-image" src="https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-scaled.jpeg" alt="" width="2560" height="1795" data-lazy-srcset="https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-scaled.jpeg 2560w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-300x210.jpeg 300w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-1024x718.jpeg 1024w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-768x538.jpeg 768w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-1536x1077.jpeg 1536w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-2048x1436.jpeg 2048w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-1568x1099.jpeg 1568w" data-lazy-sizes="auto, (max-width: 2560px) 100vw, 2560px" data-lazy-src="https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-scaled.jpeg?is-pending-load=1" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><noscript><img loading="lazy" decoding="async" class="aligncenter wp-image-83063 size-full" src="https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-scaled.jpeg" alt="" width="2560" height="1795" srcset="https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-scaled.jpeg 2560w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-300x210.jpeg 300w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-1024x718.jpeg 1024w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-768x538.jpeg 768w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-1536x1077.jpeg 1536w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-2048x1436.jpeg 2048w, https://blow.streetvoice.com/wp-content/uploads/2025/09/左起黃貫中、羅大佑、崔健合體「三響演唱會」。（圖：杭州煜禾演藝經紀有限公司）-1568x1099.jpeg 1568w" sizes="auto, (max-width: 2560px) 100vw, 2560px"/></noscript></img></p>
<p>羅大佑經典歌曲〈童年〉、〈光陰的故事〉陪伴台灣人走過青春歲月；1980 年代以《之乎者也》專輯驚艷樂壇，用獨特的詩性創作與人文關懷，為華語流行音樂開創全新境界，更是深植台灣民眾生活的共同記憶。他以敏銳的社會觀察與動人的旋律，道盡台灣社會轉型期的集體心聲，成為最具代表性的文化聲音之一。</p>
<p>黃貫中與 Beyond 的搖滾樂，從〈海闊天空〉、〈光輝歲月〉唱出香港人的集體情感；作為傳奇樂團 Beyond 的吉他手，黃貫中堅持樂團一貫的搖滾血脈與創作堅持，在粵語流行曲主導的香港樂壇闖出一條硬核之路。</p>
<p>而崔健的《一無所有》成為中國搖滾的開端，迴盪著一整個世代的吶喊。揭開中國大陸搖滾樂的嶄新頁章。他的音樂巧妙融合民謠、搖滾與中國傳統元素，例如〈花房姑娘〉、〈假行僧〉、〈新長征路上的搖滾〉等作品，至今仍被視為華語搖滾樂的劃時代經典。</p>
