3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg><button class="classic-article__share-btn" aria-label="Copy link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></button></div></div><div class="classic-article__content"><p>日前因TVB播出特備節目《永遠光輝 黃家駒》，當中肥媽（Maria Cordero）在節目中透露黃家強曾找她，表示哥哥家駒生前寫過一首歌給自己，因而惹來黃家強不滿，更公開炮轟肥媽「全是謊話」；隨之肥媽再帖文澄清，並上載一張錄音帶盒的相片，更指是當年家駒錄製好的歌曲名：「希望我可以完成這首歌」，當大家以為事件完結之際；怎料今早（27日）黃家強再就肥媽的澄清post，於FB發長文回應，直言：「沒有是非只有真理」，暗指家駒沒有為她寫歌。</p><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/475506-475506-Sv3UmriT6S3FGLCqz5HbERj01FZDWMyMuVVedblVXnU-1024x575.jpeg" alt="肥媽 黃家強 黃家駒" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>（圖片來源：TVB《肥媽李鼎》截圖）</em>事件發酵數天，肥媽與黃家強展開了隔空罵戰，日前黃家駒炮轟肥媽「全是謊話」後，今早就肥媽反駁再回應，更平心靜氣說出道理，在FB帖文的開端寫上：「與其羅生門不如用常理吧。」為大家講解Demo的由來，逐點擊破肥媽的「家駒為她寫歌」的說法。</p><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/455606-455606-IMG_2825-605x1024.jpg" alt="肥媽 黃家強 黃家駒" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>早前肥媽於FB發帖文並貼出錄音帶盒的相片澄清。（圖片來源：FB截圖@肥媽 Maria Cordero）</em></p><div class="in-post-ad-mount"><div class="classic-article__inpost-ad" style="margin: 1.5rem auto;"><div style="font-size: 10px; color: rgb(153, 153, 153); text-transform: uppercase; margin-bottom: 4px;">advertisement</div></div></div><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/595706-595706-IMG_2827-753x1024.jpg" alt="肥媽 黃家強 黃家駒" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>黃家強（圖片來源：FB@黃家強）</em><br>黃家強表示，其實這些事不應對外公開，對於大前輩肥媽的此舉，十分不解！「這些不應與外人知的創作小秘密，對我們來說，如果被公開了是頗尷尬的事情，話雖是受他們影響而得到靈感，但歌曲還是原創的，而且作品完成之後，會有真正的題材，所以我們會刪除這些創作紀錄，只會講述現有題材和曲風。好可惜亦好無奈，有些名字demo已經被擁有者在沒有理會我們感受之下在較早之前出版過了。心水清的樂迷應該知道誰擁有我們1991年之前的歌曲版權，他怎樣處理我無權過問。」因此，對於大前輩肥媽的此舉，十分不解！</br></p><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/525806-525806-IMG_2814-2-653x1024.jpg" alt="黃家強" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>黃家強今早（27日）撰長文反駁肥媽。（圖片來源：FB截圖@黃家強）</em><br>身為弟弟的黃家強，亦就肥媽指當年家駒為她寫歌一事再回應：「廿幾年前，在event上我告訴前輩肥媽，這是我哥哥為她寫的遺作，希望送給她？我不想拿記憶體來說事，因為我的RAM還很健康，我用常理來解答，一種公開了會令我們感到尷尬的創作手法，我會告訴她會讓她知道嗎？再者版權和錄音帶都不在我手，我為什麼要編一個為她寫歌的故事來送歌給她，我為什麼要這樣做，有需要嗎？版權不是我的，我憑什麼送給她！家駒還有demo叫安全地帶和Southern All Star，難道這些歌也是為這兩隊典堂級樂隊而寫的嗎？他們會唱嗎？因為以上種種原因，我是不會亦不能送這首歌給她的。」因此而推翻了黃家強代家駒送歌的說法。</br></p><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/335906-335906-oOhqoVKA6S8x5VnkAZNvU37svh_Uu4Sgit_qIorf6iI-690x1024.jpeg" alt="Beyond 黃家強" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>Beyond舊照。（圖片來源：FB@黃家強）</em><br>黃家強再續說：「前輩，無論誰給妳誤導了我不想深究，能夠得到家駒的作品而妳又喜歡的話，好好唱好它已經是對家駒的一份尊重，無需要牽連其他人來感動自己。」他除了暗指家駒沒有為肥媽寫歌一事，更指不應軒然大波，拖任何人落水，最後寫上：「沒有是非只有真理！」心水清的你，相信對此事心中有數了吧！</br></p><div class="inpost-articles-wrap" style="background-color:#766487"><div class="inpost"><div class="inpost-title"><div class="inpost-cat entertainment">entertainment</div><div class="inpost-block">【 #sheCeleb 】Constance 陳康堤矚目出道 渴望音樂分享大世界！憑歌顯個性？自爆私下另一面！</div></div></div><div class="inpost"><div class="inpost-title"><div class="inpost-cat entertainment">entertainment</div><div class="inpost-block">《暴君的廚師》李彩玟爆紅獲30部劇本邀約！你可能不知道的李彩玟10件事︰顏值撞樣宋江、被稱為港版193！健碩身材靠2種運動練出粗壯手臂！</div></div></div></div><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/130307-130307-IMG_2819-2-544x1024.jpg" alt="黃家強" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>網民留言力撐黃家強發聲。（圖片來源：FB截圖@黃家強）</em><br/></p><h2>網民一面倒撐家強！</h2><p><br>縱然Beyond成員黃家駒逝世多年，但仍有不少粉絲對家駒和家強的擁護。家強的回應一出，粉絲們極為關注，更一致表示支持家強發聲的舉動。還留言：「謝謝家強為正義和事實發聲」，也有人駁斥有人不懷好意：「美其名為紀念家駒，實情自己先係最終得益者」。</br></p><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/171107-171107-IMG_2818-2.jpg" alt="黃家強" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>（圖片來源：FB截圖@黃家強）</em></p><figure style="margin: 1.5rem 0px; cursor: zoom-in;"><img src="https://cfcdn.she.com/media/she.com/2023/06/541107-541107-IMG_2817-2-1024x347.jpg" alt="黃家強" style="max-width:100%;height:auto;" loading="lazy"/></figure><p><em>（圖片來源：FB截圖@黃家強）</em></p></div><div class="classic-article__tags">#抽水#肥媽#黃家駒#黃家強</div><div class="in-read-mount"><div class="classic-article__inpost-ad" style="margin: 0px;"/></div></img></article><aside class="classic-article-sidebar"><div class="classic-article-sidebar__trending"><div class="classic-article-sidebar__title">TRENDING #</
