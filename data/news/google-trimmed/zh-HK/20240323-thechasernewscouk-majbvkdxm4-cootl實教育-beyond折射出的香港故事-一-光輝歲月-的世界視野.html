<h2 class="entry-title mb-2" itemprop="headline">COOTL實教育｜Beyond折射出的香港故事（一）：《光輝歲月》的世界視野</h2>
<div class="entry-meta">
<p><span class="author vcard" itemprop="author" itemscope="" itemtype="https://schema.org/Person"><span itemprop="name">文字：張三</span></span></p>
<div><span class="cat-links mt-2">專欄</span></div>
</div></meta></header>
<div class="entry-content clearfix" itemprop="mainEntityOfPage">
	<div class="video-container mb-4">
	<iframe width="560" height="315" src="https://www.youtube.com/embed/W4P9fdLKB2I" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen=""/>
	</div>
<meta itemprop="description" content="你有想過，一位諾貝爾和平獎得主、世人都認識的偉人，曾為一首香港歌曲而流淚？ 1990年南非反種族隔離運動領袖曼 ... COOTL實教育｜Beyond折射出的香港故事（一）：《光輝歲月》的世界視野"/>
<p data-pm-slice="1 1 []">你有想過，一位諾貝爾和平獎得主、世人都認識的偉人，曾為一首香港歌曲而流淚？</p>
<p>1990年南非反種族隔離運動領袖曼德拉，被囚27年後終獲釋放。遠在香港的Beyond樂隊主音歌手黃家駒，受到曼德拉的抗爭奮鬥故事的觸動，為他譜曲及填詞，向其致敬，這首歌就是《光輝歲月》。</p>
<p>《光輝歲月》推出後大受歡迎，固然因為旋律優美，而且歌詞既精準訴說了曼德拉的故事，更展現了寬宏的視野並且擁抱理想，當中不少歌詞成為了經典。</p>
<p>精準訴說曼德拉故事的內容，例如：</p>
<p>黑色肌膚給他的意義</p>
<p>是一生奉獻 膚色鬥爭中</p>
<p>今天只有殘留的軀殼</p>
<p>迎接光輝歲月</p>
<p>風雨中抱緊自由</p>
<p>一生經過彷徨的掙扎</p>
<p>自信可改變未來</p>
<p>問誰又能做到</p>
<p>寬宏視野擁抱理想的內容則有：</p>
<p>可否不分膚色的界限</p>
<p>願這土地裡</p>
<p>不分你我高低</p>
<p>繽紛色彩閃出的美麗</p>
<p>是因它沒有</p>
<p>分開每種色彩</p>
<p>中國內地媒體報道，九十年代中曼德拉成為總統後，在1998年中國與南非建交後透過中國外交官員得知《光輝歲月》一曲，他在聽到歌詞後，感觸落淚。</p>
<p>要知道黃家駒寫《光輝歲月》之時，曼德拉只是剛剛出獄，南非仍然奉行種族隔離政策，根本難以想像幾年後曼德拉能結束苛政，當上南非總統，並獲得諾貝爾和平獎。然而遠在千里之外的香港人，早在1990年已能擁有如此宏遠的視野，寫下幾十年後仍然不老的普世價值歌詞，正因為香港是一個與世界緊密接軌的國際城市。</p>
<p>1990年一個駐港國際志願機構，邀請黃家駒所屬的Beyond樂隊到非洲肯亞進行扶貧活動，希望藉著受年輕人歡迎的樂隊，引發社會關注非洲現況，推動在港的籌募工作。這次非洲之旅，令黃家駒有機會具體了解更多非洲的社會及民生狀況，包括曼德拉的抗爭故事，再加上黃家駒個人濃厚的人文關懷精神，因而啟發其譜出一首超越了年代的名曲。</p>
<p>雖有人戲說家駒是「上帝給香港的音樂天使」，但更重要還是香港提供了一些重要的條件，讓生活其中的人能充份發揮，然後發光發熱。</p>
<p>這些條件，原來已巧妙地隱含在《光輝歲月》的歌詞之中：</p>
<p>自由：風雨中抱緊自由</p>
<p>平等：願這土地裡 不分你我高低</p>
<p>共融：繽紛色彩閃出的美麗 是因它沒有 分開每種色彩</p>
<p>亦正因為香港的開放與自由，全球不同的組織媒體宗教倡議等等，都可以在香港自由活動，讓香港人能從香港放眼世界思想激盪。家駒，Beyond的經典歌曲，不過是當中的表表者。</p>
<p>不自大俯瞰，不自卑仰望，平視眾生萬物，自信而謙卑，才能成就不朽的價值。</p>
