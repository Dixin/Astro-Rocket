<div class="header-sticky persist-header">
<div class="header-sticky-inner">
<h1>肥媽稱錄製黃家駒為其創作歌曲 黃家強出Po斥謊言：不尊重人</h1>
</div>
</div>

<ul class="article-tag sectionName">
<li>娛樂</li>
</ul>


</div>

</div>
</div>

</section>

<section class="ad-zone-mobile">

</div>
</section>

<div class="container some-other-area persist-area">
<div class="row">

<div class="page-left col-xs-12 col-sm-12 col-md-8 col-lg-8">
<div class="author-box col-xs-12 col-sm-12 col-md-12 col-lg-12">
<div class="article-detail-share-icon">
</div>
<div class="publish-time text15 text-weight-300">發佈時間: 2023/06/26</div>

</div>



<div id="content-main" class="content-main margin-b15">
<div class="margin-b">
<div class="lazy">

<div class="content-section-region__article-details">

<div class="col-xs-12 article-details-content-container" style="overflow-wrap: break-word">
<p>香港搖滾樂隊Beyond主音黃家駒，於1993年在日本進行電視台節目錄影期間，從高台跌下身亡，死訊令歌迷悲痛不已。不經不覺，黃家駒已離開了30年。早前，無綫推出特備節目《永遠光輝黃家駒》，播出不少當年Beyond上節目的珍貴片段。而肥媽（Maria Cordero）亦在節目中出現，表示黃家駒曾親自寫歌給自己，感觸地謂入錄音室前都感壓力，心中默唸希望黃家駒協助錄音成功。但今日（26日）黃家駒的胞弟黃家強，就在Facebook出帖文反駁，指肥媽在節目內的部分言論是謊言，似乎另有內情。今次，肥媽為自己解畫。</p>
<p><strong>同場加映：隱門丨阮浩棕曾離巢再做新人發展順遂 遺憾再聽不到嫲嫲梁舜燕讚賞</strong></p>
<p style="display:none;" articleId="3555859" showAd="true">{{hket:ul-video id="8534"}}{{/hket:ul-video}}</p>
<p style="display:none;" caption="之前一起拍節目。（網上截圖）">{{hket:inline-image name="6.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="再次肉緊。（網上截圖）">{{hket:inline-image name="16.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="為拍片爆張學潤自殺原因，事後向家人道歉及刪片。（網上截圖）">{{hket:inline-image name="yhhh_600.jpg"}}{{/hket:inline-image}}</p>
<p>節目中，肥媽表示早於十多年前已聽說這件事，指有日黃家強跟自己說，黃家駒生前其實寫過一首歌給她，她還表示若真的可以錄成歌曲便好了。肥媽表示自己工作忙碌，都未及好好聽歌便要進錄音室錄音，當時她心中對黃家駒說：「喂，你幫幫我」，又感性表示覺得黃家駒從旁協助，才能順利錄製未曾面世的《感激這對手》。她還紅著眼感觸地說：「我冇諗過佢會寫呢隻歌畀我，好觸動到我嘅心，真係好榮幸。」</p>
<p style="display:none;" caption="黃家駒的離世對香港樂壇是一大損失。（網上截圖）">{{hket:inline-image name="14.jpg"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="Beyond永遠都不再齊人，令歌迷感惋惜。（網上截圖）">{{hket:inline-image name="21.jpg"}}{{/hket:inline-image}}</p>
<p><em>肥媽斥國泰涉歧視內地人空姐 勞氣鬧冇品德：你是老幾呀？【下一頁】</em></p>
<p><em>羅霖代家人澄清丨肥媽誤指Nel Nel陷財困惹家人不滿 撰文道歉：冇人會比我更了解佢【下一頁】</em></p>
<p>節目推出後，歌迷都感到疑惑，今早（26日），已有一段長時間沒有在社交帳號更新狀況的黃家強，罕有在Facebook出新帖文，轉載了關於肥媽出演特備節目的有關報道，他寫道：「關於我的都是謊言，我哥哥雖然走了，我還活生生的，怎麼可以這樣不尊重人，無論是什（甚）麼途徑得到這首歌，誠實說出原因未必不『感動』人。」隨後，黃家強更在帖文再留回應：「係（喺）呢個風雨飄搖嘅時代，我希望做人可以無愧於心。」</p>
<p style="display:none;" caption="發文反駁。（黃家強FB）">{{hket:inline-image name="111.png"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="發文反駁。（黃家強FB）">{{hket:inline-image name="000.png"}}{{/hket:inline-image}}</p>
<p style="display:none;" caption="出帖文表示不滿。（黃家強FB）">{{hket:inline-image name="16403270_1337110463018413_9084513451076797203_o.jpg"}}{{/hket:inline-image}}</p>
<p>之後肥媽接受傳媒訪問，表示廿多年前在一個活動上與黃家強碰頭，對方表示曾見過一個母帶寫著肥媽的名字，她表示若不是黃家強講過，經理人是不會聯絡她去錄歌，自己亦不會唱。她為自己辯護指，就算唱了這歌，自己都不會有得著。她亦越講越生氣，堅稱自己沒有「老作」。肥媽甚至在自己的Facebook再作出澄清，表示今年初，收到黃家駒的經理人Leslie的通知，並話收到手上的錄音帶，是黃家駒生前留下，對方希望她可以完成這首歌。</p>
<p>她還寫道：「至於最近我在TVB中的訪問中是提到，有一天家強跟我說，但不知最後經某網媒報章轉述我的講話時，就變成最近收到家強的來電 。作為專業的傳媒人，希望該網媒報章編輯重新和認真留意節目內容，並修正和發布正確的訊息。整件事就是這麼簡單，作為朋友，我只是想完成家駒的心願，完成他未完成的作品，希望大家都將焦點放回在家駒的作品上。」</p>
<p style="display:none;" caption="">{{hket:inline-image name="000000.png"}}{{/hket:inline-image}}</p>
<p>一直以來，Beyond其他成員都不忘黃家駒，本月初是黃家駒生忌，黃貫中和葉世榮都在微博遙送祝褔。而當黃家強出帖文稱肥媽言論是謊言後，網民都看不過眼，留言，「系（係）家駒嘅作品 Beyond 也應該係家強、 貫中、世榮來延續 （肥媽，你唔好亂來）、「呢個世界上我諗得你最有資格代表家駒出聲了，撐你家強」、「之前抽Nel Nel（張學潤）水，抽到要同人地（哋）家人道歉就知」、「大癲&hellip;肥媽又抽水抽著火水」、「只有你可以有資格作出評論，終於等到你發聲」、「好賤格&hellip;我都以為係真&hellip;仲話家強你親自打電話比（畀）佢話家駒寫咗首歌比（畀）佢」。</p>
<p style="display:none;" caption="肥媽貼出照片，卡式帶盒上寫有她名字。（肥媽FB）">{{hket:inline-image name="40555DED-6CC4-4044-B25F-DFB1901192C1.jpeg"}}{{/hket:inline-image}}</p>
<div class="bulletpotint"><ul>
<li style="display:none;" caption="">{{hket:inline-image name="photostory02.jpeg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="出帖文表示不滿。（黃家強FB）">{{hket:inline-image name="16403270_1337110463018413_9084513451076797203_o.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="黃家強曾獨立推出歌曲。（黃家強FB）">{{hket:inline-image name="161924353_276772347140402_7739659332269936848_n.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="">{{hket:inline-image name="1.png"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="他的作品到現在仍然大受歡迎。（網上截圖）">{{hket:inline-image name="8.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="家駒離開後，Beyond都發生不少爭執。（網上截圖）">{{hket:inline-image name="9.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="節目有很多珍貴片段。（網上截圖）">{{hket:inline-image name="11.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="當日，他在非洲探訪得到不少靈感。（網上截圖）">{{hket:inline-image name="12.jpg"}}{{/hket:inline-image}}</li>
<li style="display:none;" caption="他在日本工作而未能回家。（網上截圖）">{{hket:inline-image name="13.jpg"}}{{/hket:inline-image}}</li>
</ul></div>
<p style="display:none;" caption="她表示收到歌感榮幸。（網上截圖）">{{hket:inline-image name="17.jpg"}}{{/hket:inline-image}}</p>
<div class="bulletpotint"><ul>
<li style="display:none;" caption="講到錄音都好似有家駒幫手。（網上截圖）">{{hket:inline-image name="20.jpg"}}{{/hket:inline-image}}</li>
</ul></div>
<p>事實上，近來肥媽在多件事上都被指有抽水之嫌。上月張學潤自殺離世，肥媽聲淚俱下拍片爆料指老友受經濟和感情困擾，隨後羅霖透露張學潤家人不滿有人拍片蹭熱度，網民鬧爆肥媽「抽水」，她立即刪片兼向張學潤家人道歉。之後台灣發生#Me Too事件，肥媽接受訪問時，又自爆曾被抽水：「當年我喺酒廊唱歌，Bobby Brown同佢爸爸嚟睇騷，當時Bobby Brown已經好有名氣，我行過佢打我屁股，我咪擰轉身兜巴摑佢一巴！」網民對此半信半疑，有人就覺得她再次借意「抽水」。</p>
