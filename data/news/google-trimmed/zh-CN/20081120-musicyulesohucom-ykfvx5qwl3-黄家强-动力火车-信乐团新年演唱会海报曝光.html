			<h1>黄家强、动力火车、信乐团新年演唱会海报曝光</h1>
			
			<div class="article_info">
				<div class="date">
					<span class="c">2008年11月20日18:18</span>
					[我来说两句<font class="red"/>]
					[字号：大 中 小] 
				</div>
			  	
				<div class="source">
                                          <div class="left pic">
					<img src="http://news.sohu.com/upload/yinyue.gif" border="0"/></div>
					<div class="left text">

来源：搜狐音乐
</div>
				</div>
				
<div class="ad_h_25">
<SOHUADCODE/></div>
                                    
			</div>
			
			<div id="sohu_content" class="article">
			<IMG alt="" src="http://photocdn.sohu.com/20081120/Img260759246.jpg" align="middle"/>
<BR>
<P>　　　一场汇集了BEYOND黄家强、动力火车、信乐团的大型演唱会“超越巅峰——新年演唱会”即将于12月31日在工人体育馆隆重上演，这也是至今为止一向都以拥有超强“爆发力”而著称华语歌坛的三支乐队首次同台举办演唱会。</P>
<P>　　据悉，作为华语乐坛公认的实力派唱将，BEYOND黄家强、动力火车、信乐团拥有大量并极具震撼力的作品，此次“超越巅峰”演唱会上，他们将分别演唱各自的成名曲，其中BEYOND黄家强的《真的爱你》、《海阔天空》、《光辉岁月》以及动力火车的《忠孝东路走九遍》、《当》和信乐团的《死了都要爱》、《不死心还在》等影响整个华语歌坛的经典作品都将再次响起，向现场观众的耳膜发起最猛烈的“进攻”。
	
<iframe width="350" height="59" marginwidth="0" marginheight="0" hspace="0" vspace="0" frameborder="0" scrolling="no" bordercolor="#000000" src="http://images.sohu.com/cs/button/zhongshi/2007/jufu.html"/>

	</P>
<P><STRONG>　　经典回放，BEYOND黄家强再现乐坛“英雄本色”</STRONG></P>
<P>　　据介绍，自从黄家驹离开之后，BEYOND的成员延续家驹的理想“继续革命”。虽然目前黄家强、叶世荣、黄贯中都选择了单飞，也都在各自的领域取得了很好的成绩，但在他们各自的表演中仍会时不时地出现“BEYOND”的影子，“BEYOND”留在他们身上的烙印似乎已经无法彻底摆脱，只要他们任何一个人出现，观众都会高呼“BEYOND”的名字，这也让他们更加怀念“BEYOND”的那段“光辉岁月”。</P>
<P>　　此次“超越巅峰”演唱会对有备而来的黄家强来说，内地歌迷对“BEYOND”的留恋热情仍然未减，虽然此次“BEYOND黄家强”并不是完整的BEYOND，但依然会演唱大量BEYOND时期作品。</P>
<P>　　其中《真的爱你》《海阔天空》《光辉岁月》《大地》《不再犹豫》《AMANI》《再见理想》等影响一代人的经典作品将再次响起，这些歌名在当年起的作用绝对不仅仅是透着新鲜，而是震撼！</P>
<P>　　2008年12月31日，“超越巅峰——新年演唱会”上黄家强再现BEYOND的“英雄本色”，让京城的观众再次重温那些与BEYOND携手走过的“光辉岁月”。</P>
<P><STRONG>　　动力火车依然“动力十足”，加大马力“超越巅峰”</STRONG></P>
<P>　　上个世纪九十年代末，动力火车是最“卖座”的华语乐队，也是影响最为深远的华语乐队，他们用好听并易于流传的旋律，传达了大气的，有流行性的歌曲。他们将band的形式与悦耳旋律有机的集合在一起，使得他们在演唱的同时又不失却摇滚的精神，因此，许多年轻人都被他们的音乐所征服。</P>
<P>　　而今，十年过去了，他们至今为止仍然令人百听不厌的歌曲让大家拥有太多的回忆，无论是“怀旧”、“新作”都无法改变一个事实，那就是他们在歌迷心中的那个“动力”，这个“动力”代表的是一种精神，一种情绪。</P>
<P>　　虽说音乐可以按照时代的喜好“脱胎换骨”，但在歌迷心中这些改变都是徒劳多余的，他们要的就是“动力”十足的“火车”，越大“马力”越好。</P>
<P>　　此次“超越巅峰”演唱会上，动力火车将开足“马力”，一展厚实且极具穿透力的歌喉，“无情的情书”、“当”、“忠孝东路走九遍”、“明天的明天的明天”等一首首耳熟能详的歌曲，让观众立刻就能找到那种久违了的感动。</P>
<P><STRONG>　　信乐团施展“魔力”，考验观众耳膜承受力</STRONG></P>
<P>　　曾经在大陆成功举办过演唱会的信乐团着实让内地的“摇滚分子”们过了一把瘾，现场舞台上的嘶吼呐喊声和台下的欢呼雀跃声此起彼伏连成一片，倒也相得益彰，好一番热闹景象。</P>
<P>　　不管是欢呼也好，雀跃也罢，反正信乐团所到之处都会让大街小巷的摇滚迷们都群情激昂，也让原本已经有点“冷”了的摇滚骤然升温，“热”了不少。</P>
<P>　　作为华语乐坛近年来的新生力量，信乐团一直都被热情的歌迷所包围，在R&amp;B肆虐歌坛的时下，他们的曲风格外引人瞩目，从白领到普通市民都成为其热衷的歌迷，具有引领时代潮流的经典作品在现代歌坛更显示出其独有的“份量”，流行在街头巷尾的每一首歌曲都代表着当代乐坛最前卫的风向标。</P>
<P>　　此次“超越巅峰”演唱会上，信乐团将“死了都要爱”、“One Night in 
北京”、“不死心还在”、“假如还有明天”等一首首考验现场观众耳膜承受力的歌曲呈现给大家，不仅让我们一起为他们喝彩、鼓掌，同时也让现场每一位观众都能一起见证这个“超越巅峰”的激情时刻，并成为穿越时空的永恒旋律，铸造华语歌坛经典的未来。</P>
<P><STRONG>　　工体搭建超炫舞台，“新年演唱会”再造视听新震撼</STRONG></P>
<P>　　据主办单位介绍，为展现华语歌坛的辉煌，此次“超越巅峰——新年演唱会”将花费巨额资金在工体馆内将搭设超炫的舞台，各个环节也都做了精心而细致地准备。</P>
<P>　　为确保演出现场的演出效果，在舞台制作、灯光音响等方面均采用世界顶尖级技术与设备。主办方特意调集了一流的负责音响、灯光、舞美各方面的工作人员以便使整体都能达到最佳效果。</P>
<P>　　仅舞台效果方面，不仅采用了许多现代高科技手段以营造出震撼无比的场景，乐队风格各异的服装配以时尚前卫的造型，更将会把每个段落的演出魅力突显得淋漓尽致。</P>
<P>　　另外，演唱会将从观众欣赏角度出发，更注重每个歌迷的视觉效果，伴随着穿插其中的耀眼的激光、绚丽的烟火把现场气氛烘托得如梦幻一般多姿多彩，令观众在轻松欢愉的气氛中分享“超越巅峰——新年演唱会”一首首经典作品。</P>
<P>　　届时，世界等级的灯光舞美设备及最先进的线性环绕立体声效器材，极具视觉享受，配合他们超强的唱功，以及超炫的舞台效果和极度热情的观众，一定会把演唱会的气氛推向一个又一个高潮。</P>
