		<h2>与年轻乐手共唱《光辉岁月》 黄家强不重组乐队</h2>
		<h3>
			<span class="l">2009年08月24日15:14</span>
			<span class="r">[我来说两句<em id="commentCount"/>]&nbsp;[字号：大 中 小] </span>
		</h3>
		
		<div class="source clear">			
				
			<div class="mediasource">
			<span>
			<img src="http://photocdn.sohu.com/20061227/Img247299703.gif"/>
			<em>来源：<strong id="media_span">解放网-新闻晨报</strong>

			</em>
			</span>
			</div>
			

			<div class="adsoure"><SOHUADCODE>
</SOHUADCODE></div>
		</div>

		<div class="content clear" id="contentText">
			
			<IMG alt="黄家强与年轻乐手唱《光辉岁月》" src="http://photocdn.sohu.com/20090824/Img266190269.jpg" align="middle"/>
黄家强与年轻乐手唱《光辉岁月》<BR>
<P>　　□晨报首席记者 曾玉</P>
<P>　　前晚，“百事群音”——“中国蓝”乐队欢唱六十年第八期演唱汇在浙江卫视上演。舞台上，黄家强与三位最佳乐手组成“梦幻乐队”登场，共同演绎了Beyond乐队的经典曲目《光辉岁月》。而上周比赛中引发强烈争议的“分裂门”也终于有了结果。</P>
<P>　　作为Beyond乐队“后家驹时代”的主唱，前晚来到现场的黄家强再次拿起麦克风，高唱Beyond乐队的经典曲目《光辉岁月》。但此时站在他身旁的并不是黄贯中与叶世荣，而是活动的三位“最佳乐手”——甜蜜旅行乐队鼓手张乐、加减乐队贝司手斯宇涛和蛋壳乐队吉他手兰海鹏。<div id="box">
<iframe width="350" height="250" marginwidth="0" marginheight="0" hspace="0" frameborder="0" scrolling="no" bordercolor="#000000" src="http://images.sohu.com/chat_online/market/marketpip.html"/></div>
	
<iframe width="350" height="59" marginwidth="0" marginheight="0" hspace="0" vspace="0" frameborder="0" scrolling="no" bordercolor="#000000" src="http://images.sohu.com/bill/s2009/jinzhuxu/zhongshi/jufu.html"/>

	站在舞台上的黄家强表示，刚刚与黄贯中结束了连续三天的香港演唱会，兴奋的心情还未平复，此时再与一群充满活力、充满才华的年轻乐手合作组队，更让他感受到内地摇滚乐的新生力量。</P>
<P>　　在《光辉岁月》的合唱部分，黄家强用双手将身后的年轻乐手推向台前，让他们成为全场的主角，这一举动展示了黄家强对新人的扶植与支持。不过要论力推新人，黄家强最力推的选手却是来自天津的聚点翻转乐队，他们的原创歌曲《GPM》还被推上了当周冠军歌曲的王座。</P>
<P>　　聚点翻转的演出让评委席上的黄家强毫不吝啬自己的溢美之词：“聚点翻转一点也不像新乐队，他们在舞台上非常有自信、有魅力，丝毫看不到紧张，完全是成熟乐队的作风。”同时他也肯定了主唱叶星眩的唱功：“叶星眩唱功十分了得，声音控制得很好，一看就是专业出身。”黄家强还给聚点翻转乐队音乐风格提出建议：“能够将流行、摇滚和自己的音乐风格完美融合，这并不容易做到，但我建议乐队可以再加多一些曲风，可以融入对全世界的关怀，你们还这么年轻，有很大进步空间，前途无可限量。”</P>
<P>　　本期节目中，上期“分裂门”主角TOU乐队再次亮相，主唱谷子、键盘手刘武波成功等到了贝司手洪彦杰和吉他手凯力的回归，至于鼓手，则换成了来自东莞的新人小万。在谈及乐队分歧时，黄家强表示组建乐队最重要的就是默契，“默契是友情，是一个眼神。每个成员之间都是朋友，做不成朋友，就做不成乐队”。黄家强表示10年来他遇到许多困难，甚至与乐队成员有过分歧，但最终都是依靠乐队伙伴间的尊重互谅和平解决，“尊重很重要，有分歧的话，可以尝试哪种想法最好，然后大家投票决定最终选什么，这会是个比较和平相处的方法”。</P>
<P>　　对于记者询问是否会组建新的乐队，黄家强表示除非再与黄贯中和叶世荣“一起玩”，否则没有可能，“应该不会重组乐队，我在个人的音乐方面还有很多想尝试。成长到现在也有很多自己的想法，如果再和别人合作可能会发生问题。我觉得跟其他乐手交流很好，但组乐队不是那么容易的事情，如果真的还想玩乐队，我依然会找他们两个跟我一起玩”。</P>
<P>　　</P>
