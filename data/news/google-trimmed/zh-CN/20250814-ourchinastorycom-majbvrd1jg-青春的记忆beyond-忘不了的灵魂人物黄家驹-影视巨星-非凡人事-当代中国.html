							<article id="article_detail" class="M">
							<p class="ArticleDate">刊登日期 : 2023-06-08</p><div class="ArticleCredit"><div>撰文︰黄皓颐</div></div>														<div class="ArticleLead"><p>　　每年6月，都会想起黄家驹。他的生忌在6月10日，死忌是6月30日，今年更刚好是30周年。</p>
<p>　　黄家驹是香港摇滚乐的代表人物，当年他领军的Beyond乐队，他创作的数百首歌曲，不少都是百听不厌。黄家驹和Beyond的音乐，不单影响本地乐坛，也是那一代人的青春回忆，令人念念不忘。</p>
</div>
<h2>黄家驹自小爱上摇滚音乐 1981年自组乐队燃烧音乐之火</h2>
<p><iframe src="https://www.youtube.com/embed/lAskx_ONj9o" class="youtubeiframe" width="1280" height="720" frameborder="0" allowfullscreen="allowfullscreen"/></p>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong1_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黄家驹" alt="黄家驹" loading="lazy">
<figcaption>少年时期的黄家驹，已经热爱摇滚音乐。（网上图片）</figcaption>
</img></figure>
<p>　　黄家驹一生热爱音乐，纵使初期波折重重，他也未有动摇。</p>
<p>　　黄家驹自小与家人住在深水埗苏屋村，早期在一些派对活动和朋友影响下，接触并爱上1970年代的欧美摇滚音乐，例如大卫宝儿、Deep Purple（深紫乐队）等。虽然父母并不喜欢儿子接触这类音乐，但黄家驹仍坚持喜好。</p>
<p>　　中学毕业后，他曾任职任职办公室助理、五金、水电工程、电视台布景员等工作，但内心仍燃烧着音乐的火焰。1981年，他认识了叶世荣，加上两位朋友邓炜谦和李荣潮，组成乐队，这也是Beyond的雏型。</p>
<h2>为何乐队叫Beyond？ 黄家驹一身任四职全能音乐人</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong2_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="Beyond" alt="Beyond" loading="lazy">
<figcaption>Beyond乐队曾经多次出现成员变动，直至1984年黄家驹的弟弟家强加入担任低音结他手，及1985年黄贯中成为主音结他手后，就成为日后我们熟悉的Beyond乐队了。（图片来源：视觉中国）</figcaption>
</img></figure>
<p>　　Beyond的名字是何时出现？1983年，黄家驹等组成的乐队，想参加《结他杂志》举行的比赛，报名需要有乐队名字，最终当时的主音结他手邓炜谦建议乐队改名Beyond，意思是超越自己。</p>
<p>　　其后，Beyond经过多次成员变动，在1984年黄家驹的弟弟家强加入担任低音结他手，1985年黄贯中成为主音结他手，到了这阶段，便组成了我们熟悉的Beyond乐队。</p>
<p>　　在Beyond中，黄家驹一直是乐队的灵魂人物，他既担任作曲、填词，也负责主唱和弹奏结他，一人分饰四角，堪称全能的音乐人。</p>
<p>　　受到西方摇滚音乐的影响，黄家驹初期的创作是以英文歌为主，曲风也是摇滚风格。直至1986年，Beyond终于由地下音乐走进流行乐坛。</p>
<p>　　<strong>延伸阅读：</strong>陈百强逝世30年｜香港第一位偶像 “情歌王子”开创广东歌浪漫时代</p>
<h2>黄家驹开创粤语摇滚曲风 Beyond在80年代尾踏足乐坛颁奖礼舞台</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong3_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黄家驹" alt="黄家驹" loading="lazy">
<figcaption>Beyond的作品中，大部分都是由黄家驹一手包办作曲、作词的，你最喜欢哪首作品？（网上图片）</figcaption>
</img></figure>
<p>　　1987年，黄家驹创作了歌曲《永远等待》，作为以粤语尝试摇滚曲风的试金石，也是Beyond发表的第一首中文歌曲。虽然早期Beyond带点反叛的形象，未能获得大众的广泛接纳，但也算可以拾级而上，逐步迈向成功之路。</p>
<p>　　自1988年起，Beyond的作品开始踏上各大流行歌曲颁奖礼的舞台，《大地》、《真的爱你》、《光辉岁月》、《俾面派对》、《Amani》及《海阔天空》等。歌曲旋律悦耳、歌词坦率直接，有诉说理想、情感，也有反映社会议题、反战思维，予人写实，又充满社会时代感的感觉。</p>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong4_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黄家驹，Beyond乐队" alt="黄家驹，Beyond乐队" loading="lazy">
<figcaption>黄家驹和Beyond乐队曾在1990年跟随香港电台到巴布亚新几内亚，探访当地的贫穷家庭，令Beyond四子感受良多。（网上图片）</figcaption>
</img></figure>
<h2>Beyond影响力延伸至内地东南亚 黄家驹遇意外英年早逝令人惋惜</h2>
<figure class="image"><img src="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x1.jpg" srcset="https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x1.jpg 1200w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x2.jpg 2400w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x3.jpg 3600w, https://www.ourchinastory.com/images/content/moviestar/2023/06/KomaWong5_x4.jpg 4800w" sizes="(max-width: 1199px) 100vw,(min-width: 1200px) 1200px" class="img img-responsive img-thumbnail" title="黄家驹" alt="黄家驹" loading="lazy">
<figcaption>黄家驹离世30年，他留下很多经典作品，至今仍有不少歌手翻唱。（网上图片）</figcaption>
</img></figure>
<p>　　Beyond不单渐渐受到大众接纳和喜爱，其事业亦闯进高峰，也开拓了香港乐坛一个摇滚音乐的时代。乐队的影响力更不单限于香港，也伸延至东南亚、内地、台湾及日本等亚洲地方和国家。</p>
<p>　　正当Beyond的发展一片向好之际，在1993年6月24日，黄家驹在东京一个电视台拍摄游戏节目途中，遇意外跌倒受重创，之后昏迷不醒，直至当年的6月30日与世长辞，终年31岁。</p>
<p>　　今年，是黄家驹逝世30年，但我们仍记得他留下给我们的好歌，《喜欢你》、《真的爱你》、《光辉岁月》、《海阔天空》……每次音乐奏起，对黄家驹的思念、回忆都一一涌现，未有因年月而淡忘。</p>
<p>　　<strong>延伸阅读：</strong>莫文蔚爱挑战 她是金曲歌后 也是《食神》火鸡姐</p>							</article>

							<div class="Headline">
							<p><strong>　　古代开学礼，古代学子会向老师送上“束脩六礼”，那是什么呢？
</strong></p><p><p>　　“束脩”是指古代弟子拜师时所献的学费或礼物。《论语》中记载孔子的话说：“自行束脩以上，吾未尝无诲焉。”</p><p>　　“束脩六礼”就是拜师时向先生赠送的六种象征性物品，分别是：芹菜，寓意为勤奋好学；莲子，莲子心苦，寓意苦心教育；红豆，寓意红运高照；红枣，寓意早早高中；桂圆，寓意功德圆满；干瘦肉条，表达弟子心...</p></p>							</div>

</p>
