function getCookie(name) {

  var search;

  search = name + "="
  offset = document.cookie.indexOf(search) 
  if (offset != -1) {
    offset += search.length ;
    end = document.cookie.indexOf(";", offset) ;
    if (end == -1)
      end = document.cookie.length;
    return document.cookie.substring(offset, end);
  }
  else
    return "";
}

<p>　　新浪娱乐讯 前<span class="keyword">Beyond</span>(听歌)乐队成员<span class="keyword"><span class="keyword">黄家强</span>(听歌)</span>即将于内地发行个人首张国语专辑《她，他》。8月2日13时，黄家强独家做客新浪，与网友分享了首次在内地发行国语唱片的感受，并详细介绍了他的这张最新专辑。以下为本次聊天实录：</p>
<p><font face="楷体_GB2312">　　主持人：欢迎各位新浪网友，我是主持人。现在做客嘉宾聊天室的就是黄家强，欢迎你。</font></p>
<p>　　黄家强：Hi，你好，大家好。</p>
<p><font face="楷体_GB2312">　　主持人：刚才我还和家强简单在这儿聊，聊得还挺开心的。我突然想家强这次来内地做宣传一定有一个非常强烈的感觉，这里的朋友真的跟你特别默契，一点都不会有陌生的感觉。</font></p>
<p>　　黄家强：没有，真的没有，北京的朋友给我很多回忆。因为我2003年、2005年来这里开演唱会的时候，我觉得他们给我的感觉是很激动，还有很感动我。我唱歌的时候，看到他们会流泪，自己也想流泪的感觉。那么多年了，我们从来很少去北京开演唱会，但是到了北京开演唱会，那种感觉是永远都不会忘记的。</p>
<p><font face="楷体_GB2312">　　主持人：所以我也要跟家强说2003年的时候我就在现场，而且是场地票，我们所有的人都站在板凳上面，一边哭一边去唱歌。那个和声我相信家强应该是有感觉的。</font></p>
<p>　　黄家强：对，真的对我来讲很感动，我从来没有想过我有那么多歌迷在内地，在北京。给我的感受是，有你们的支持，我觉得我做音乐就不会有怕的感觉，我会觉得可以继续做更好的音乐。这个鼓励是很重要的。我真的要谢谢你们对我的支持。</p>
<p><font face="楷体_GB2312">　　主持人：对于家强来说，也许BEYOND的时代对你来说是之前的一个音乐的部分，现在开始将会有一个全新的属于自己的音乐世界了？</font></p>
<p>　　黄家强：对呀。因为我觉得我们分开之后，我们发现我们对音乐的看法都很不同。我们合作了差不多20年，但是我们分开之后，我们觉得自己也有很多梦。对我来讲，我觉得能够做到自己喜欢的音乐，还是蛮重要的。跟别人一起我很开心，我学到很多东西。但是分开，把我们三个人的音乐可以分开来做，也是另外一种方式去做我们的音乐。好像我现在的专辑，刚刚发过两张粤语专辑，这次是发一张全新的国语专辑，我的转变也蛮大。我以前也喜欢爵士、朋克，现在也有这样类型的音乐，我有很多音乐元素的音乐在里边，有很多民谣、电吉的，还有中国风的，这些音乐是我以前比较少做的，但是可能我的生活在改变，我的音乐在改变。我觉得这个方向对我来讲，做音乐人最好玩的地方是在于，我不需要想那么多，我不要想我自己的定位怎么样，不要想我自己的音乐类型是怎么样，我就喜欢做音乐，我做出来的音乐喜欢大家喜欢，我只是很简单做音乐，很直接。</p>
<p>&nbsp;&nbsp;&nbsp; <strong>新专辑延续BEYOND精神</strong></p>
<p><font face="楷体_GB2312">　　主持人：这张重新的国语专辑的名字叫《她，他》。</font></p>
<p>　　黄家强：女她和男他都一样，一女一男。因为里面有一首歌是《她，他》。内容是讲人与人之间很复杂，不是你跟我那么简单，是几个她跟几个他，还有几个她跟几个他，很多人，他们对感情，大家对互相感觉的一些互动很复杂。人和人之间很复杂，也可以配合我自己的唱片，我觉得我自己专辑里面的歌曲也是蛮复杂的，类型太多，我自己看着都有些头痛，因为我要排，这首跟这首顺不顺，很难排，每首歌都不同，没有联系的感觉，但是我就觉得很复杂的感觉就用很复杂的内容歌曲，用这个名字做我唱片的名字，叫《她，他》。</p>
<p><font face="楷体_GB2312">　　主持人：但是我相信已经听过这张全新国语专辑的几首歌的朋友都会有这样的感觉，这张专辑会有家强非常强烈的自我表达的一种愿望，包括自己生活的一种影子，这好像是不同于你以前的创作。</font></p>
<p>　　黄家强：我觉得我的精神还是延续下来的，我觉得我一直在延续BEYOND的精神，我觉得BEYOND的精神我永远都不会放弃，一定会延续下去。我会探访小孩子，会探访孤儿院，会探访一些贫穷国家的小孩子。对我来讲有一个使命感，我要多做一点对社会有贡献的人。我们音乐人希望可以用我们的音乐去影响到一些年轻一代的人对社会的关心，这是我需要做的。</p>
<p>　　还有是家庭影响我也很深。最近我的生活好像变化很大，我在这两年结婚了，很快就有了小孩子，好像促成班一样。这段时间给我的感觉，家庭对我很重要，我会为了家庭，把我自己的时间会规律很多。还有小孩子给我的灵感是做人父母不是那么容易的。以前没有想到这个问题，爸爸、妈妈太宠坏你，你不会太客气，没有就大不了，去玩或者工作很晚不回家，可能一个月都不回家吃一顿饭。但是我现在看到小孩子的时候，我担心他会不会像我一样常常不回家，给我的感受很深，就是想写一些年轻人对自己小孩子的关怀，担心他们长大会不会学坏，会不会不孝顺父母。自己会担心这个问题。</p>
<p><font face="楷体_GB2312">　　主持人：责任也重了很多。</font></p>
<p>　　黄家强：有一首歌叫《哪吒离家》。</p>
<p><font face="楷体_GB2312">　　主持人：有一首广东歌叫《哪吒回家》。</font></p>
<p>　　黄家强：对，写给我的父母的。写给父母是“回家”，写给孩子是“离家”。这对我自己来讲是生活上的感受。里面有很多东西是社会性的，因为我刚刚说了，我说家庭给我的感受很大，我觉得我很重视这个家庭，我很疼我的家人，我的太太还有我的孩子。但是我在某些时候看到很多新闻，说家庭的暴力，对我来讲很惊讶，一个家庭你爱的人，跟你组合成一个家庭的人，有暴力的事情在家里面发生，我觉得是不可能的。所以，我有首歌是写这个类型的事，写社会性的问题。</p>
<p>　　但是我作为一个男人，我找了秋霞姐帮我写这个歌曲，我希望能够用女生的角度去讲这个内容。我觉得她写到了一些我想要的东西在里边。</p>
<p><strong>&nbsp;&nbsp;&nbsp; 从丈夫到父亲的转变</strong></p>
<p><font face="楷体_GB2312">　　主持人：感觉家强一下子变成父亲一样，好像发现一些现实问题已经切实出现在你面前，或者你已经想办法要防范他们，你歌曲更多就有了很注重现实的社会责任感。</font></p>
<p>　　黄家强：因为我在生活，生活在影响我。可能我是一个单身的男人，可能就没有那么太大的感受，去感受家庭暴力，如果我是小孩子，可能去探访没有感受那么深。都是相连的，那个相连不是我以前没有，我以前也探访，但是我以前探访贫穷第三世界地方贫穷的人，还有去探访孤儿院，可能直接影响了我对自己孩子的一些忧虑，还有未来。我觉得小孩子是我们的未来，如果对我们的未来没有保障，将来会变成怎么样的世界，我想不到了。我尽量告诉大家小孩子是我们的未来，小孩子是我们要保护的。写这首歌本来我自己觉得很感动，我希望可以感动多一点朋友。</p>
<p><font face="楷体_GB2312">　　主持人：我记得家强的儿子是三月份出生的，现在算起来应该有不到五个月。你已经会做一些爸爸的工作了吗？</font></p>
<p>　　黄家强：会呀，我有做换尿片，还有喂奶，这两个工作比较轻松。晚上抱小孩子睡觉比较辛苦，我很佩服我太太，你喂他睡着了，要放下去就哭，他马上就知道你放下来了，就醒了，你要重新来过。但是有时很想让他快一点睡觉，很久没有睡着你就觉得很累，所以你一定要很有耐心做这个事情。</p>
<p><font face="楷体_GB2312">　　主持人：是不是爸爸在摇晃他的时候嘴里也哼着歌？</font></p>
<p>　　黄家强：他还没睡着的时候，他想睡但是睡不着的时候会哭，那时你唱比较好。但是他唱的时候就静下来了。</p>
<p><font face="楷体_GB2312">　　主持人：唱你自己的歌吗？</font></p>
<p>　　黄家强：唱《哪吒离家》，他蛮舒服的，如果你慢慢唱这首歌给他听，他会觉得很舒服，会很快睡着。他需要一点声音给他听到，但是他睡着的时候就不会发声了，他会醒的。</p>
<p><font face="楷体_GB2312">　　主持人：我们在网上也有一些网友就想知道家强的儿子确定起名字了吗？</font></p>
<p>　　黄家强：已经起了。</p>
<p><font face="楷体_GB2312">　　主持人：叫什么？</font></p>
<p>　　黄家强：黄庆阳。庆祝的庆，阳光的阳。</p>
<p><font face="楷体_GB2312">　　主持人：这有特别的意思？</font></p>
<p>　　黄家强：是我太太改的。他觉得庆阳是很高兴、很有活力。她喜欢老字，很多比较老的字，现代人不会用这样类型的字，她觉得很古典，觉得很有味道，喜欢这个字，我觉得是蛮高高兴兴，很阳光的感觉。</p>
<p><font face="楷体_GB2312">　　主持人：会让你的孩子未来多大的时候接触音乐，会让他走上和爸爸一样的音乐道路吗？</font></p>
<p>　　黄家强：随意吧，因为我不想逼他做这个事情。音乐我一定会教他，一定会让他学音乐，学音乐很重要。一个人有艺术的品位是很重要的，如果他没有艺术的品位，会很俗气。俗气的人不能有好的品质。所以，艺术要学。但是学完音乐，学完艺术之后，要不要进这个行业，要不要做创作人、音乐人，就随他自己做。如果他喜欢做，当然就让他做。如果他要做一个偶像歌手，我就不赞成。</p>
<p>&nbsp;&nbsp;&nbsp; <strong>创作就是要表达自己</strong></p>
<p><font face="楷体_GB2312">　　主持人：你心里是不是觉得偶像歌手还是始终有点……</font></p>
<p>　　黄家强：我觉得有实力才重要。因为作为一个唱歌的人，做音乐的人一定要自己创作，要自己创作才可以做音乐，不要人家做音乐给你，你再唱歌，这样会把我的脸都丢掉了，一定不能当偶像歌手，一定要做创作人，创作未必逼他做，但是偶像歌手不能做。</p>
<p><font face="楷体_GB2312">　　主持人：自己创作出来的音乐可能最先能感动的就是创作者本身？</font></p>
<p>　　黄家强：创作就是要表达自己。我现在唱的歌都是表达我自己。每一个人为什么我喜欢你，因为你写的歌跟我共鸣。为什么你写的歌跟我共鸣？就是因为你的感受我也可以感受到。但是如果偶像歌手唱的歌都是人家的灵感、人家的感受、人家的创作，不是他自己的，他是空白的。我觉得我自己创作，令人家感受我自己的内容、我的生活，都是跟你有共鸣，这才是有沟通、有交流，其他的我不知道他们怎么样交流，他们交流的就是外形吧，我不知道。</p>
<p><font face="楷体_GB2312">　　主持人：但是我们习惯看到很多香港的乐坛确实是创作和演唱者分开的，有这样一个比较普遍的现象。</font></p>
<p>　　黄家强：香港很普遍，唱歌就是唱歌。</p>
<p><font face="楷体_GB2312">　　主持人：分工非常明确。</font></p>
<p>　　黄家强：大家根本就不懂得创作。香港的创作歌手也有，但是不多。但是内地比较多，北京很多，北京很多都是自己创作的歌手，他们也不重视外形好看还是不好看，歌好听就有人买。为什么我出国语专辑的原因，就是因为我觉得我不是卖外形的，我是卖我的音乐，所以我喜欢做音乐，在内地我可以空间很大，我不管什么类型的音乐，我一定会找到共鸣。因为人多，共鸣的人一定会有。</p>
<p>　　还有我觉得内地的歌迷对音乐的认识，他们对有内涵的东西、有文化的东西比较欣赏。作为音乐人来讲，会觉得很安慰，有人尊重我们做音乐，不是做一些音乐出来他们都不知道我们做什么，这有点无奈。</p>
<p><font face="楷体_GB2312">　　主持人：我最近上网去搜关于加强近期的一些消息，我发现是两类。一类是关于家强的生活方面，比如跟太太出席什么活动，比如跟太太晚上去夜店HIGH（笑）。</font></p>
<p>　　黄家强：不是HIGH，喝喝酒罢了。</p>
<p><font face="楷体_GB2312">　　主持人：还有一类是家强批评香港一些不太景气的现状，这两类的消息。</font></p>
<p>　　黄家强：真的香港乐坛我是有点失望的，但是失望并不代表我放弃这个乐坛，还是可以改进的。我最近也帮一个乐队发唱片，因为乐队是音乐的重点，因为如果没有乐队，哪会有乐坛、歌手。香港的唱片公司还有很多媒体，会觉得歌手就是乐坛的全部，我觉得乐队才是乐坛重要的一部分，我很支持一个乐队，我希望他们很有影响，我希望我自己跟那个乐队可以影响到很多人对乐队的看法，欣赏多一点不同类型的音乐。可不可以把乐坛改过来我不知道，但是我一定不会放弃，一定会继续做下去。</p>
<p><font face="楷体_GB2312">　　主持人：家强，内地的朋友对香港乐坛的了解里，我们只知道BEYOND乐队，可能对其它的乐队，都觉得他们可能很地下，或者不够商业，或者是没有作品能够让我们很清楚地听到。</font></p>
<p>　　黄家强：我等一下会讲给你听听（笑），你一定会觉得很好听。他们现在已经改变很多了，基本上也有很多很地下的乐队。他们比较自我一点，他们觉得香港乐坛太没希望了。我刚刚说了，我是很失望，但是我不会放弃。他们也失望，他们也不会放弃，但是他们不理会，好，不跟你玩，我自己跟自己玩，就变得距离越来越远，香港乐坛粤语的K歌，另类的乐队就会变成很地下，可能永远听不到音乐是哪一种。这个状况非常不健康，我希望有热情还有兴趣做乐手的乐队，可以使乐坛平衡，不是很另类，但是也不是歌手类型的歌，我希望可以做到这种类型的乐队出来。</p>
<p><font face="楷体_GB2312">　　主持人：当然也有人说BEYOND是一个难以去超越的神话，因为我个人对BEYOND的感觉就是，我觉得他们所有呈现出的音乐作品是有一种很大的爱的氛围在里边，它可能不同于我以前对于一些摇滚乐队的认识，他们可能比较愤世嫉俗，音乐比较偏激，但是BEYOND不会，BEYOND是比较包容，可能每个人在里边都可以找到。</font></p>
<p>　　黄家强：我也觉得BEYOND是很开放的，音乐听很多，我们听很多音乐，我们对音乐的看法是流行也要流行好听的，流行有流行的好处，摇滚有摇滚的好处，爵士有爵士的好处，每一种音乐一定有它的好处，但是最重要是你要发自内心做音乐，还要方向，有自己的目的，有自己的想法，要告诉大家你要讲的是什么。好像我们BEYOND很关心世界、社会，很关心朋友，很多事情我们都会讲，这是我们乐队对自己的要求，这个乐队要有使命感，这个使命到现在还存在在我的血液里，使命感很重要，我的歌不能言之无物，我要讲出来，要让大家有感受、有共鸣，可能有一些信息告诉大家需要一起努力的。这是我做音乐的一个方向。</p>
<p><font face="楷体_GB2312">　　主持人：当时我真的觉得挺难的，在香港的当时，一个歌坛很商业的现状下，BEYOND以自己的音乐力量作为一个乐队的歌曲，能够作为主流，变成一种主流的音乐。</font></p>
<p>　　黄家强：可能我们永不放弃吧。</p>
<p><font face="楷体_GB2312">　　主持人：当时也遇到很多问题。</font></p>
<p>　　黄家强：当然了，当然了，我们刚出来的时候是很困难的。他们觉得你们BEYOND乐队的人都不是好人，他们把我们定位在野孩子，可能是坏人一样。可是我们就是喜欢音乐，怎么能觉得我们拿着乐器的人就是学坏的孩子？我们要把它改过来是蛮辛苦的，慢慢慢慢一步一步，把我们在他们心目中的形象改过来很难很难，让他们知道我们也有爱的一面，我们也有送给母亲的歌，像《真的爱你》，还有我们送给第三世界贫穷国家人的歌。这些类型，世界和平的歌我们也很很多。慢慢这一段时间我们花了很久时间去改变外面人的看法。路是不好走，到现在我觉得我们的路也不好走，因为我们创作人也有自己的风格，不希望太过随波逐流，去跟着流行音乐去做，去做K歌类型的音乐。我不是不能够做，只是想不想做。希望可以用不同的角度去做，这是很开放的，不用想那么多，发自内心做音乐就好了。</p>
<p><font face="楷体_GB2312">　　主持人：我相信在内地有非常多的朋友都是当年听BEYOND的歌曲慢慢爱上了音乐，爱上了乐队，爱上了更多更多的一些东西。所以，他们现在其实是一个非常坚实的喜欢音乐的一帮朋友。</font></p>
<p>　　黄家强：北京的朋友真的是很热爱音乐，他们也很懂音乐，这是我很开心的。</p>
<p><strong>&nbsp;&nbsp;&nbsp; 希望能跟<span class="keyword">许巍</span>(听歌)合作</strong></p>
<p><font face="楷体_GB2312">　　主持人：我记得家强曾经说过自己也有很欣赏的内地的音乐人，你本来很期望在这张专辑的时候跟他们一起去合作，比如像<span class="keyword">窦唯</span>(听歌)。</font></p>
<p>　　黄家强：许巍。</p>
<p><font face="楷体_GB2312">　　主持人：现在合作的计划怎么样？</font></p>
<p>　　黄家强：窦唯我认识他，但是很久没联系，我都不知道怎么样联系他。许巍我不认识，但是我喜欢他的歌，买他的唱片听，听很熟了，很喜欢。人家问我很想跟哪些人合作，这两个人就是我想跟他们合作的人，我觉得他们很有个性。他们在音乐上也启发我很多，难得的音乐人。</p>
<p><font face="楷体_GB2312">　　主持人：听说家强还曾经说自己蛮希望到北京定居的（笑）？</font></p>
<p>　　黄家强：应该不可以吧。</p>
<p><font face="楷体_GB2312">　　主持人：因为现在已经有家庭。</font></p>
<p>　　黄家强：已经有家庭在香港。还有，我会常常来北京，可能到我年纪大一些，因为我觉得北京的气侯蛮适合……</p>
<p><font face="楷体_GB2312">　　主持人：会不会不习惯？</font></p>
<p>　　黄家强：不知道。</p>
<p><font face="楷体_GB2312">　　主持人：吃的呢？</font></p>
<p>　　黄家强：吃的习惯，喜欢吃辣的，喜欢火锅。</p>
<p><font face="楷体_GB2312">　　主持人：气候？天气呢？</font></p>
<p>　　黄家强：这里也不是很热，香港很热。北京会下雪吗？</p>
<p><font face="楷体_GB2312">　　主持人：可以。</font></p>
<p>　　黄家强：我喜欢四季很明显的国家，因为冬天很冷，会下雪，夏天很热，会有雨，我希望看到很明显的四季，会给我很大的感受，有很多灵感。不同的季节会给你不同的感情，秋天好像令人愁，其实不愁，有点落寞，很舒服。冬天需要有人给你温暖。每一个季节都会给你很多不同的感受，如果每一天很热，泰国每天都像度假一样，情绪波动不大。</p>
<p><font face="楷体_GB2312">　　主持人：除了北京之外，其实内地也有很多朋友希望能走到他们的家乡，在这次新的专辑跟大家见面宣传的活动当中。像青岛的朋友，还有像安徽的，还有很多其它地方。因为祖国这么大，很多地方的朋友都希望你去。</font></p>
<p>　　黄家强：我希望每一个地方都能去到，因为每一个地方都有不同的感觉，我听说青岛是很漂亮的。</p>
<p><font face="楷体_GB2312">　　主持人：对呀，很漂亮的城市。</font></p>
<p>　　黄家强：对呀，一个漂亮的城市，我从来没有去过，真的很想去青岛。如果青岛的朋友欢迎我，我一定过去。还有安徽，也没有去过，希望可以有机会跟他们碰个面。</p>
<p><font face="楷体_GB2312">　　主持人：大家非常关心家强这段时间整个宣传工作的一个行程安排。</font></p>
<p>　　黄家强：应该会尽量安排我去每一个地方吧。我这次来到北京，我很快要去上海，好像山东也去，现在排得密密麻麻的。所以，我尽量去每一个地方看看你们。</p>
<p><font face="楷体_GB2312">　　主持人：但是也别忘了，家强还是刚刚荣升爸爸，还是得给他一个时间回去陪陪儿子。</font></p>
<p>　　黄家强：这个月时间比较少，没有时间陪了。所以，我买了一个电脑，在网上看他。</p>
<p><font face="楷体_GB2312">　　主持人：可以在网上视频看看。</font></p>
<p>　　黄家强：对。</p>
<p><font face="楷体_GB2312">　　主持人：可惜他还不会跟你交流，他太小了。</font></p>
<p>　　黄家强：太小了，只会笑。应该还好了，我觉得他还是蛮乐观的一个小孩子，不常哭。</p>
<p><font face="楷体_GB2312">　　主持人：我刚才问了家强，这张专辑什么时候跟朋友见面。</font></p>
<p>　　黄家强：8月底。</p>
<p><font face="楷体_GB2312">　　主持人：但是已经有很多朋友陆陆续续听了很多歌曲了，比如最新打榜的就是《梦红楼》，这首歌的创作也让我们听觉上一震。</font></p><span id="_function_code_page">
<p align="right">　[1]　[2]　[下一页]</p></span>
