<p>香港殿堂级摇滚乐团Beyond的马来西亚铁粉“狂躁荙”携手多支本地乐队，将于10月25日及26日在雪兰莪蒲种The Stage by ALCO举办《传承Beyond乐队展览音乐会》，以摇滚乐与展览形式致敬已故主唱黄家驹的不朽精神，重温Beyond乐队的辉煌年代。</p>



<p>在正式登场前，主办方将于10月18日与19日在吉隆坡鬼仔巷率先举行免费街头表演（Busking）宣传活动，为乐迷暖场预热。</p>

<h2 class="wp-block-heading"><strong>《传承Beyond乐队展览音乐会》月底登场</strong></h2>



<p>《传承Beyond乐队展览音乐会》将于10月25日与26日隆重举行，活动分为白天展览与夜间音乐会两大部分，为期两天的摇滚盛宴，汇聚回忆、音乐与情感。</p>



<ul class="wp-block-list">
<li><strong>展览时间：</strong> 下午1时至6时</li>



<li><strong>音乐会时间：</strong> 晚上8时开始</li>
