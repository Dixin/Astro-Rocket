		<h2>黄家驹墓碑遭人恶意破坏 黄家强欲报警(图)</h2>
		<h3>
			<span class="l">2009年06月05日07:52</span>
			<span class="r">[我来说两句<em id="commentCount"/>]&nbsp;[字号：大 中 小] </span>
		</h3>
		
		<div class="source clear">			
				
			<div class="mediasource">
			<span>
			<img src="http://news.sohu.com/upload/yule.gif"/>
			<em>来源：<strong id="media_span">搜狐娱乐</strong>

			</em>
			</span>
			</div>
			

			<div class="adsoure"><SOHUADCODE>

		<div class="content clear" id="contentText">
			
			<IMG alt="" src="http://photocdn.sohu.com/20090605/Img264345091.jpg" align="middle"/>
黄家驹墓碑遭人恶意破坏 
<BR>
<IMG alt="" src="http://photocdn.sohu.com/20090605/Img264345092.jpg" align="middle"/>
昨日有粉丝指出碑上被破坏的地方，包括遗照上的裂痕<BR>
<IMG alt="" src="http://photocdn.sohu.com/20090605/Img264345093.jpg" align="middle"/>
吉他周围黑边<BR>
<IMG alt="" src="http://photocdn.sohu.com/20090605/Img264345146.jpg" align="middle"/>
黄家强欲向警方寻求协助<BR>
<P>　　太阳报6月4日讯 
乐队Beyond的灵魂人物黄家驹虽已离世十六年，但仍让歌迷怀念，记者昨日收到自称Beyond歌迷怒指发现黄家驹墓碑遭破坏，不但石吉他遭“围黑边”，连碑上的金色字体也被填黑，但身为胞弟的黄家强竟置之不理！黄家强则解释昨日已亲到黄家驹墓前了解，并认为有人恶意破坏搞事，会向警方寻求协助。</P>
<P>　　收到有关投诉后，记者昨日到将军澳华人永远坟场的黄家驹墓地亲自视察，并有惊人发现！除黄家驹遗照有一道长裂痕外，墓碑上的石吉他更遭黑色笔“围边”，碑上原本金色的字体则部分被填黑。由于本月十日是家驹的四十七岁生忌，现场有两位正拜祭黄家驹的男歌迷透露黄家强与太太刚来过，并试图用天拿水清洗污渍却无功而回。</P>
<P>　　<STRONG>不是粉丝所为</STRONG></P>
<P>　　投诉信中更指新年前已透过电邮通知黄家强有关黄家驹墓碑损毁一事，但一直未见维修，近日更被人恶意破坏，该人更斥责黄家强为三十万表都追究到底，亲兄黄家驹的墓碑遭破坏不知黄家强又会否追究。</P>
<P>　　对于被投诉一事，昨日黄家强在电话中表现生气：“第一，真的粉丝又怎么会打去报馆投诉？我有自己的讨论区，好多时候粉丝留言给我都有去看和回应，但就没有收过粉丝投诉。第二，我最近忙着筹备与阿Paul（黄贯中）排演唱会，怎么不一说我忙着搞演唱会而不理哥哥的碑，反而只是说我的表呢，我觉得好巧合！十六年来这个碑都没有事，为什么刚好就在月前发生这只表件事，现在就出事呢？”</P>
<P>　　<STRONG>搞事者有报应</STRONG></P>
<P>　　黄家强承认十多日前已知黄家驹墓碑“出事”，两日前他亲自到墓前查看，发现遗照上的小裂痕变大，墓碑又被涂污，他认为有人刻意破坏哥哥墓碑：“搞先人墓的人一定有报应，怎么不长脑！我不知道是谁做的，但他有麻烦的，我和所有Beyond 
fans都会咒他。”黄家强又称这几天会找人清理墓碑及打算向警方求助，但由于不知谁是行凶者，实在防不胜防。</P>
<P>　　另一Beyond成员叶世荣得知黄家驹墓碑“被搞”后反应激烈：“这么疯狂？连墓碑都搞！会有报应的，等天收！”而世荣也认为墓碑被刻意破坏，需报警处理，并会趁黄家驹生忌去拜祭及顺道了解损毁情况。此外，将军澳华人永远坟场办事处的杨先生称之前未接获有墓碑损毁的投诉，但他会派员了解，若涉恶意破坏会交由警方处理；而另一成员黄贯中则在截稿前未联络得上。</P>
<P>　<STRONG>　陈百强新马师曾齐做邻居</STRONG></P>
<P>　　由于将军澳华人永远坟场背山面海，风水不错，除黄家驹外，圈中也有不少已故的知名人士下葬于此，包括歌手陈百强、慈善名伶邓永祥（新马师曾）及叶世荣的“亡妻”许韵珊等。黄家驹和陈百强的忠实歌迷，均于两人的忌辰及清明重阳的扫墓节日，带备鲜花和祭品前往拜祭偶像，故两人坟前经常布满花海，可见歌迷对他们的思念年月不变。</P>
<P>　　<STRONG>艺人硬受狂迷突袭</STRONG></P>
<P>　　近年，不少圈中艺人或歌手均受到狂迷以不同方式施袭，令他们出席活动时诚惶诚恐，并需加强保安防范。</P>
<P>　<STRONG>　汤盈盈遭大力掌掴</STRONG></P>
<P>　　汤盈盈2008年1月拍摄《师奶股神》外景时，突然被一名金毛汉施以掌掴，汤盈盈脸颊实时又红又热，更出现头晕及耳鸣情况，幸盈盈的男助手成功擒获行凶者，并交由警方处理及调查。</P>
<P>　<STRONG>　薛凯琪被掷水瓶</STRONG></P>
<P>　　薛凯琪（Fiona）08年2月在旺角朗豪坊出席募捐活动时，突被一名男子近距离向她怒掷水瓶，Fiona右前额被击中受伤，险伤及眼睛，涉案男子当场被捕。</P>&nbsp;<SOHU_AD_LAST>&nbsp; <div id="box">
