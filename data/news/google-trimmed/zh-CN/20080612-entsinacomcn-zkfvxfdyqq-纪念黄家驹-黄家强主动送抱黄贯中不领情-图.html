			<div class="from_info">http://www.sina.com.cn 2008年06月12日07:36&nbsp; <font color="#A20010"><span class="linkRed02">新浪娱乐</span></font></div>
		</div>

<center><img src="http://i0.sinaimg.cn/ent/y/h/2008-06-12/U2520P28T3D2057154F326DT20080612073626.jpg" border="1" alt="纪念黄家驹黄家强主动送抱黄贯中不领情(图)"><br><img src="http://i0.sinaimg.cn/home/c.gif" height="5" width="1" style="border:0"><br>黄家强（左）主动挨着黄家强及送抱，但黄家强似乎毫无反应 <br><br/></br></br></img></br></img></center>
<div class="topic_text">
<p>　　新浪娱乐讯 “冤家”<span class="keyword">黄家强</span>(听歌)及<span class="keyword">黄贯中</span>(听歌)(Paul)为悼念好兄弟<span class="keyword">黄家驹</span>生忌，前晚罕有地同台演出合唱《再见理想》，纵使主人家家强多次主动对黄贯中示好，但惨遭拒绝！有个性的黄贯中表现冷淡，连眼角也不望对方，相信兄弟情永不复再。</p>
<p>　　前晚《别了家驹十五载海阔天空音乐会》在湾仔会展举行，吸引五千多歌迷捧场，期间有男歌迷明目张胆用DV机盗录，亦有女歌迷感动落泪。自从黄家强与黄贯中三年前闹翻后，一直没有同台的机会，适逢前晚是黄家驹生忌，黄家强特别举行音乐会悼念哥哥，并邀得其余两子黄贯中及<span class="keyword">叶世荣</span>(听歌)出席，成为全晚焦点。</p>
<p>　　黄贯中是最后一位嘉宾出场，并献唱《长城》，掀起全晚高潮。他唱完罢后，家强即上台，更打算以“一抱泯恩仇”肉麻揽实黄贯中，可惜黄贯中只笑了一笑，全程没有眼神接触及交流，纵使家强主动撩他，但黄贯中扮看不见。当三子合唱《海阔天空》前，黄家强有感而发地说：“不想一个人唱，想请上Paul和世荣一齐唱，好不好？”此时，黄贯中及叶世荣走上舞台，但黄贯中全程只顾望前，黄家强又说：“好开心我们三个可以唱给家驹听，相信他在天之灵好满意，没有白费心机。”此时，黄贯中按捺不住说：“快点把吉它给我啦！”完秀时，黄家强和黄贯中依旧各据一方，期间有人拉拢二人倾偈。 </p>
<p>　<strong>　扮打人避谈不和</strong></p>
<p>　　而叶世荣全程夹在两位兄弟中间，拍大合照时，黄贯中刻意避开家强，让at17站在中间，家强却主动伸手拉他一起，可惜黄贯中仍毫无反应。黄家强坦言十五年来经历了很多考验，问到是否与黄贯中闹不和？黄贯中即作状打人，并说：“没有什么好玩过音乐，音乐可以代替说话和问题，一来一往不及Beyond玩一首歌。”家强补充说：“误会何必理会，多几分色彩有什么所谓。”</p>
<p>　　另外，黄家强及黄贯中接受有线主持的访问，被问到终于破冰拥抱，黄贯中说：“通常报纸喜欢写台上拥抱。”在旁的家强即插嘴：“所以我就抱给他看！”苗菲/文 </p>
