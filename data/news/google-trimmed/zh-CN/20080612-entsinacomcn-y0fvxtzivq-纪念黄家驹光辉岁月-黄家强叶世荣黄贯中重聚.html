			<h1>纪念黄家驹光辉岁月 黄家强叶世荣黄贯中重聚</h1>
			<div class="from_info">http://www.sina.com.cn 2008年06月12日16:11&nbsp; <font color="#A20010"><span class="linkRed02">南方日报</span></font></div>
		</div>
		
		
		
		<div class="artibody" id="artibody">


<center><img src="http://i1.sinaimg.cn/ent/y/2008-06-12/U2507P28T3D2057991F326DT20080612161118.jpg" border="1" alt="纪念黄家驹光辉岁月黄家强叶世荣黄贯中重聚"><br><img src="http://i0.sinaimg.cn/home/c.gif" height="5" width="1" style="border:0"><br>黄贯中、叶世荣和黄家强在演出现场。 <br><br/></br></br></img></br></img></center>
<div class="topic_text">
<p>　　本报讯　采用<span class="keyword">Beyond</span>(听歌)旧作《海阔天空》曲调并由<span class="keyword">刘德华</span>(<img alt="纪念黄家驹光辉岁月黄家强叶世荣黄贯中重聚" class="video" src="http://i1.sinaimg.cn/dy/pc/2007-05-29/27/U48P1T27D2815F1264DT20070529161951.gif"/> 听歌)重新填词的《承诺》,自从在香港“一方有难,八方支持”赈灾义演中亮相以来,备受关注。这首歌曲不仅表达了大灾面前中国人心手相连、共渡难关的勇气和决心,也唤起歌迷对逝去15年的Beyond灵魂人物<span class="keyword">黄家驹</span>的怀念。</p>
<p>　　6月10日黄家驹46岁冥寿之际,<span class="keyword">黄家强</span>(听歌)、<span class="keyword">叶世荣</span>(听歌)、<span class="keyword">黄贯中</span>(听歌)这3位Beyond之子为了家驹“破镜重圆”,在香港会展中心举行《别了家驹15载海阔天空音乐会》,这也是3人继2005年乐队解散后的首次重聚。</p>
<p>　<strong>　Beyond缘份还没有尽</strong></p>
<p>　　音乐会上播放了黄家驹生前演出、排练和生活的片段,故人音容笑貌重现,令歌迷和亲友都不胜唏嘘。而针对三人多年不合的传言,叶世荣表示,“相<span class="keyword">信</span>(听歌)Beyond的缘份还没有尽”,不过他也强调这次聚首并非重组的信号,因为三人目前都有不同的发展方向。</p>
<p>　　除了昔日乐队成员外,<span class="keyword">黄耀明</span>(听歌)、<span class="keyword">周国贤</span>(听歌)、<span class="keyword">张继聪</span>(听歌)、邓健明、<span class="keyword">林一峰</span>(听歌)等香港艺人当晚也到场,与歌迷一起缅怀黄家驹这位意外辞世的香港乐坛传奇人物。当Beyond三子再度唱响《海阔天空》时,歌迷群情激动,纷纷站到椅子上,用手比出和平的手势,场面一度火爆到失控,任凭台上三人如何劝说,仍然难抑歌迷汹涌热情。</p>
<p>　<strong>　黄家驹5首遗作发行</strong></p>
<p>　　由黄家驹胞弟黄家强发起的黄家驹逝世15周年系列纪念活动,也随着黄家驹5首遗作的发行达到高潮。据悉,这5首歌曲《他的吉他》、《We　are　the　people》、《无人的演奏》、《结局》、《奥林匹克》是黄家强从哥哥的遗作中整理出来的,原本只完成了旋律小样部分,由家强完成编曲填词并制作成唱片。其中《他的吉他》已开始在香港电台播出。对于这首歌曲,黄家强表示,黄家驹的音乐理想就是从一把吉他开始,他也一直用哥哥留下的吉他写歌创作,感觉他的生命通过吉他和音乐得以延续。</p>
<p>　　此外,按照Beyond当年拍《海阔天空》MV时的造型订制的40个限量版黄家驹纪念公仔,目前结束了网上拍卖活动,起拍价为2500港元,最终拍卖价超过1万港元。据悉,这次拍卖获得的所有收益,都将捐献给“<span class="keyword">苗圃</span>(<img alt="纪念黄家驹光辉岁月黄家强叶世荣黄贯中重聚" class="video" src="http://i1.sinaimg.cn/dy/pc/2007-05-29/27/U48P1T27D2815F1264DT20070529161951.gif"/> 听歌 blog)行动”,以帮助中国内地兴建学校,并资助内地失学儿童重返校园。</p>
<p>　　黄家强日前还在香港牛棚艺术村举办了为期两个月的“别了家驹十五载旧日的足迹纪念展览”,展出黄家驹的手稿、吉他、衣服和首饰,让公众免费入场集体回忆。香港各大院校及艺术协会还举行了一系列“黄家驹旧日足迹”研讨会,分享家驹的生平事迹,探讨他的音乐理念。　　郭珊 </p>
