		<h1>黄家强怒骂林楚麒博宣传 借黄家驹出位误导歌迷</h1>
		
		
		<div class="sourceTime" collection="Y">
			<div class="l">
			
				<img src="http://i0.itc.cn/20100107/69f_205b12de_e6eb_410e_8ee9_04b108d27320_0.gif" height="15px"/>
				来源：<span id="media_span">搜狐音乐</span>
				
			
			</div>
			<div class="r">2010年05月20日09:10</div>
		</div>
		
		
		
		
		<div class="function clear">
			<div class="l"><SOHUADCODE>

		<div class="text clear" id="contentText" collection="Y">
			
			
			<IMG alt="" src="http://photocdn.sohu.com/20100520/Img272228536.jpg" align="middle"/>
黄家强庆爆不忿有人利用亡兄做宣传。<BR>
<IMG alt="" src="http://photocdn.sohu.com/20100520/Img272228537.jpg" align="middle"/>
林楚麒对<FONT color="#000000">黄家驹</FONT>痴心情长，至今仍念念不忘。（数据图片）<BR>
<IMG alt="" src="http://photocdn.sohu.com/20100520/Img272228538.jpg" align="middle"/>
黄家驹离世17载，他的歌声仍长存乐迷心目中。（数据图片）<BR>
<IMG alt="" src="http://photocdn.sohu.com/20100520/Img272228539.jpg" align="middle"/>
经常有粉丝到黄家驹的坟前拜祭。<BR>
<P>　　已故乐坛班霸Beyond灵魂人物黄家驹死后17年，最近他的旧爱林楚麒复出乐坛，有报道指她声称为黄家驹“梳起不嫁”，即惹博上位之嫌，结果惹火黄家驹弟弟<SPAN class="articleLink">黄家强</SPAN>，怒火中烧狂骂林楚麒：“分手十世不要扮未亡人！”</P>
<P>　　黄家驹于1993年在日本宣传时从3米高台堕下，昏迷一星期后伤重死亡，当年林楚麒头戴白花自封未亡人哭崩丧礼，事隔17年，下月10日是黄家驹48岁冥寿前夕，林楚麒宣布复出乐坛，签过气歌手莫镇贤为经理人，连环接受传媒访问为月尾演出的音乐剧宣传，有指她至今不忘黄家驹，愿意为他梳起不嫁，显出一副痴心情长样子。</P>
<P><STRONG>　　不要误导歌迷</STRONG></P>
<P>　　然而，林楚麒的一番痴情剖白，却严重地惹火了黄家强，昨日黄家强接受访问，记者提到是否知道林楚麒复出？他不屑说：“看了一些新闻，叫她不要乱讲话，叫她小心一点。（你会采取行动？）我都讲了她就死。（你们没有聊天？）叫她不要说谎。”</P>
<P>　　对于有指林楚麒声称为黄家驹梳起不嫁，黄家强连珠炮发地怒骂：“分手十辈子啦，不要在这里扮未亡人，她知道是什么一回事。（他们没有拍过拖吗？）朋友啊，拍拖是有，但分手很久了，他（黄家驹）之后还有两个女朋友，不该是她（林楚麒），please！”</P>
<P>　　虽然死者已矣，但黄家强不忿有人利用亡兄做宣传，他咬牙切齿地说：“当然不好（利用宣传），他们分手一年多了，哥哥之后还有两个女朋友，她（林楚麒）自己都知道的，还要扮我哥哥是她的最后一个，哪里是啊，叫她不要误导歌迷，当年她对我哥哥不住才分手。（有第三者？）不讲原因，我好恨她，我格格恨她所以我恨她，她知道是什么一回事，叫她不要再讲，够了！”</P>
<P><STRONG>　　拿订婚戒出来</STRONG></P>
<P>　　对于有传黄家驹和林楚麒于1989年曾在Beyond其余三位队友面前订婚，黄家强郑重否认：“现在我哥哥不在这里，所以我代哥哥讲，叫她不要说自己跟哥哥订过婚，拿出订婚戒指出来啊，她只是哥哥其中一个女友。”至于林楚麒电话飞留言<SPAN class="articleLink">信</SPAN>箱，至截稿前未回复。</P>
<P>　　此外，黄家强将于下月联同<SPAN class="articleLink">张学友</SPAN>、关淑怡举行“他来自非洲慈善演唱会”，为非洲孤儿院筹建宿舍，届时家强将与非洲小朋友合唱《远方的朋友》。</P>
<P><STRONG>　　不离不弃仍单身</STRONG></P>
<P>　　黄家驹虽然已离世17年，但被指是黄家驹女友的林楚麒，仍经常将黄家驹名字挂在口边。</P>
<P>　　1993年</P>
<P>　　黄家驹于1993年6月30日离世，林楚麒当年头戴白花、身穿孝服，俨如未亡人的身份现身灵堂，兼为黄家驹守夜，犹如黄家驹亲人，而当时她被指在灵堂表现失常。</P>
<P>　　2008年</P>
<P>　　黄家驹逝世15周年，林楚麒受访时表示，她与黄家驹在1989年已经订婚，又表示黄家驹在玩具店淋雨向她示爱。</P>
<P>　　2010年</P>
<P>　　林楚麒表示花了十年时间才接受黄家驹离世，又表示自己仍是单身。</P>
<P><STRONG>　　黄贯中：乐队多女友</STRONG></P>
<P>　　Beyond成员之一的黄贯中昨天电话中对黄家强不满林楚麒借家驹宣传而大动肝火一事表示：“自从家驹过身之后，我没有跟Gina（林楚麒）联络过。其实一个女孩子是否嫁，与我无关。（黄家驹与她分手后，是否还有其它女朋友？）我们不讲私事，讲真的每个乐队的人都好多女友，不会逐个讲出来，我只是知道林楚麒曾经是黄家驹的女友！”</P>
<P><STRONG>　　叶世荣：不清楚她“梳起”</STRONG></P>
<P>　　至于另一成员叶世荣则表示：“其实看回报道，林楚麒都没有说过自己是未亡人，只不过是传媒讲！（林楚麒说自己梳起不嫁？）我就没有看到她的其它访问，所以不太清楚，黄家强对她有意见可能有他的原因，看一下林楚麒讲过什么！”</P>
<P><STRONG>　　莫镇贤讽刺黄家强清醒一点</STRONG></P>
<P>　　身为林楚麒（Gina）经理人的莫镇贤，昨日在电话中对于黄家强怒骂林楚麒借黄家驹之名宣传，莫镇贤句句有骨讽刺黄家强，他说：“大家都在这行这么久，希望他清醒一点，每次都是记者问到，林楚麒才讲一点，那支笔在别人那的，别人怎么写我们都控制不了，不如他叫记者收笔不要写就好啦，他要这么小孩子这么生气就气饱他自己吧！”莫镇贤继续一轮嘴反击：“林楚麒养尊处优十多年，现在复出，他不支持都不要贬低别人，我身为Gina的经理人，我好肯定的告诉大家知道，林楚麒从来都没有说过自己是未亡人，哪有人会自称自己是未亡人呀！”</P>
<P><STRONG>　　卢巧音：借人过桥</STRONG></P>
<P>　　至于Beyond忠实粉丝卢巧音则说：“我对这位小姐不是很熟，所以没有什么意见！（觉得她借黄家驹宣传？）如果他要做宣传就自己去做，不要借别人过桥！”</P>
<P><STRONG>　　胡言乱语博宣传</STRONG></P>
<P>　　黄家强骂爆林楚麒，叫她勿拿亡兄黄家驹做宣传。不少艺人曾借其它艺人新闻博见报，惹起连串是非。</P>
<P><STRONG>　　王秀琳</STRONG></P>
<P>　　王秀琳被踢爆与<SPAN class="articleLink">郭富城</SPAN>游车河后即“升级”，每次出席活动均将郭富城挂在口边，令见报率激增，但负面新闻也随之而来，郭富城更指她“想太多”。</P>
<P><STRONG>　　范植伟</STRONG></P>
<P>　　范植伟因公开跟前女友王心凌的合照，兼大爆对方的“初夜论”，而被指博宣传，更遭全城狂骂，人气急跌，更有网友要求范植伟退出娱乐圈。</P>
<P><STRONG>　　岑洁仪</STRONG></P>
<P>　　音乐才子陶喆早前来港开唱，与他曾闹绯闻的岑洁仪不避嫌高调踩场，成为焦点；日前她升级做老板娘，更表明不会找陶喆帮手。</P>
<P>　　</P>
