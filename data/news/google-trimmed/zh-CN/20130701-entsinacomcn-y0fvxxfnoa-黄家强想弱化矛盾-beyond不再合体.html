<p>　　晨报记者 徐 宁</p>

<p>　　1993年6月30日，31岁的Beyond主音兼灵魂黄家驹从日本舞台堕下身亡，结束短暂的光辉岁月。昨日是他20周年的忌日，前Beyond乐队成员黄家强[微博]创作了新歌《好好》送给亡兄，还发起“今天我好好”纪念活动，广邀Beyond及黄家驹好友拍悼念照。Beyond的另外两名成员黄贯中[微博]和叶世荣[微博]也纷纷表达思念。黄贯中在微博上称，“二十年了，很多人还没有知道我们失去了多么重要的他。他不是李小龙，是黄家驹，兄弟走好！”叶世荣则以一句“家驹祝福你”怀念故友。而就在歌迷缅怀这位摇滚巨星前夕，黄贯中和黄家强却在微博中掀起骂战，一时间，两人的关系跌入冰点。Beyond三子最后一次同台是8年前，如今三人再同台的希望甚为渺茫。比起无奈，黄家强感到更多的是遗憾。</p>

<p><strong>　　谈矛盾：只想大事化小</strong></p>

<p>　　就在黄家驹20周年忌日到来之前，黄贯中、黄家强两人在网络上的一番骂战，引发了Beyond歌迷的一致唏嘘。</p>

<p>　　事情缘起一张照片，5月下旬，有媒体记者在微博上传了一张和黄家强的合照，黄贯中随后转发并指出该记者是一直黑他的“毒人”，并称黄家强和该记者是一伙的。黄家强随后留言表示，当兄弟就不应该这么说，说什么和“毒人”一伙，让人听着真伤心。由此，骂战开始。两天之后，黄家强在香港杂志上发表了一封写给哥哥黄家驹的信，文中一句“遗憾没有守护好Beyond”以及“只是自己一厢情愿Beyond能够继续，不必再强求”，引起了黄贯中和前Beyond经纪人的强烈反弹，前Beyond经纪人发表题为《Beyond30周年的意义》的长微博，力挺黄贯中，暗指黄家强拿着黄家驹的名字来宣传，“Beyond的解散、Beyond没有30周年演唱会，是谁的责任？歌迷不懂，但我懂。”随后，黄贯中也在网上称：“家强……我有什么得罪你……扪心自问，你再抹黑我，你的音乐也不会进步的。”黄贯中言辞犀利地指出，“明眼人都记得五年前那‘个唱’，我和世荣在后台只获派唱两首，多心痛，我和世荣怒了，那不是纪念家驹吗？其实只要你换少三四套华衣，我们就可多唱几首。”</p>

<p>　　而日前，黄家强谈到这场骂战时表示，如今他只希望自己和平一点，除了他，Beyond乐迷也一样会伤心，“我不想乐迷见到我们这样对骂，不想把Beyond这个名打下来。这些新闻会让乐迷好难受，保住Beyond这个名大家也开心，无谓毁了大家的梦。”</p>

<p><strong>　　谈合体：没家驹不可能</strong></p>

<p>　　结束前日北京的歌友会后，当天下午黄家强便匆匆乘机赶回香港，因为昨日是黄家驹去世20周年忌日，“每年的这一天，我都会一个人在家纪念家驹，不会见任何人。虽然伤痛仍在，但活着便要精彩，这是Beyond精神，不再要有眼泪，家驹从不喜欢哭哭啼啼，希望大家跟我一样。无论是昨天、今天、明天，无论是十年、二十年、三十年，只要是我有生之年，黄家驹这个名字，永远都不会让人遗忘。”</p>

<p>　　黄家强希望能与乐迷来集体怀念哥哥，当作完成自己一件未了心事：“我不管别人怎么看，不想每年做的事情一样，可能下一次会用其他遗作去做一些事情。”</p>

<p>　　至于有传闻说，黄家驹遗愿要办音乐学校，黄家强说，“办校一事不是家驹的遗愿，是我个人心愿。20年前我说过，假如自己有能力，很想办一间这样的学校以家驹命名，好让哥哥的名字可以留名后世，但暂时我自问无能力做到。”他坦言从来没忘记这个心愿，希望终有一天可以达成。</p>

<p>　　对于同台，黄家强表示没有了黄家驹不可能了，“最初Beyond分开个人发展的头两年，我真的以为大家去去就回，于是我就等了两年，可是大家分开发展后，似乎各有各天空，两年后我知道一个人的力量无法改变天意，Beyond已经跟家驹一同离去，也不再执着。我现在最希望大家可以找到各自的快乐人生及事业。”对于大家能否继续做朋友，他说“我可以”。</p>

<p>&nbsp;</p>
