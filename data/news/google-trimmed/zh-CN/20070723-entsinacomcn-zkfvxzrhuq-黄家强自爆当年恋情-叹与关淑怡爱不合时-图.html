<p>　　新浪娱乐讯 <span class="keyword">黄家强</span>(听歌)前晚请到叶世荣和<span class="keyword">关淑怡</span>(听歌)，一同彩排在本月26日举行的《RoadShow Live黄家强音乐会》，他透露会和关淑怡合唱《情人》，还自爆：“如果当年不是阴差阳错，我想我们已经是一对，但现在已经各有所属！”但关淑怡却一脸尴尬说：“说什么呢？”</p>

<p>　　问家强会不会考虑三人合唱，他说：“也好啊！但要安排好时间！两男一女合唱会很激烈，如果我做填词，我会写我争赢，但未必是写感情！”家强很期待与世荣合作歌曲，而世荣亦说：“无论多忙都会去做！” (鱼鱼/文)
</p>
