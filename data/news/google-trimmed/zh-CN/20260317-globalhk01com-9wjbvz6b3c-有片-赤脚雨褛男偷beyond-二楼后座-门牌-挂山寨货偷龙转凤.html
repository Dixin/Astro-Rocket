-button-desktop"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" data-svg-type="icon" class="size-6"><path d="M6 10C4.9 10 4 10.9 4 12C4 13.1 4.9 14 6 14C7.1 14 8 13.1 8 12C8 10.9 7.1 10 6 10ZM18 10C16.9 10 16 10.9 16 12C16 13.1 16.9 14 18 14C19.1 14 20 13.1 20 12C20 10.9 19.1 10 18 10ZM12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z" fill="currentColor"/></svg></button></div></div></div></div></div><div class="col-start-1 lg:col-span-6"><div class="cmp-article-detail medium" data-testid="article-content-section"><p class="-ml-3 md:ml-0"><span class="border-primary mb-6 block border-l-4 pl-3 md:mb-8">香港著名摇滚乐队Beyond，位于旺角洗衣街一幢唐楼内的录音室“二楼后座”，较早前已纳入市建局洗衣街与花墟道重建计划的清拆范围内。告别在即，昨日（16日）竟有贼人乘虚而入，深夜穿上黑色雨褛，赤脚上门偷去“二楼后座”的门牌，然后偷龙转凤，换上山寨门牌，以图瞒天过海，不过过程被闭路电视拍下。警方表示，昨日（16日）接获报案，案件列盗窃，交由旺角警区刑事调查队第四队跟进，暂未有人被捕。<br/></span></p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1053 / 590"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">一名身穿雨褛的赤脚男子，深夜到“二楼后座”门前，疑拆去门牌，挂上山寨门牌。（Facebook:Re:spect Music Magazine 纸谈音乐影片截图）</span></div><div class="flex w-screen md:w-full -mx-3 mb-3 mt-4 md:mx-0 overflow-x-hidden md:overflow-auto"><div class="lazyload-wrapper"/></div><p class="whitespace-pre-wrap break-words">“Re:spect Music Magazine 纸谈音乐”专页昨日（16日）在社交平台发文，指职员回到“二楼后座”时发现写上“二楼后座”的门牌丢在地上，但仔细一看发现并非原有的门牌，怀疑有人伪造，偷龙转凤挂上此山寨版门牌；惟假门牌疑尺寸不合适而掉落地上。</p><div class="grid cursor-pointer grid-flow-row grid-cols-12 gap-1"><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/></div><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1080 / 1440"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">真正的门牌被贼人盗去。（Facebook:Re:spect Music Magazine 纸谈音乐图片）</span></div><p class="whitespace-pre-wrap break-words">从专页上载一条片长20秒的闭路电视可见，显示时间是昨日深夜12时15分，一名男子身穿黑色雨褛、赤脚、低头避开闭路电视镜头走到“二楼后座”门前，进行疑似拆门牌的动作。然后低头疑捧著门牌走落楼梯离开。</p><p class="whitespace-pre-wrap break-words">事件曝光后，有网民及歌迷留言，怀疑贼人偷走门牌后，或会放到网上拍卖。</p><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="grid cursor-pointer grid-flow-row grid-cols-12 gap-1"><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/></div><p class="whitespace-pre-wrap break-words">专页表示就上述事件已到旺角警署报案，并把木盒和闭路电视片段交给警方跟进。《香港01》正向警方查询。</p><p class="whitespace-pre-wrap break-words">警方表示，昨日（16日）接获报案，指旺角洗衣街215号一录音室的门牌怀疑被人盗去。经初步调查，案件列盗窃，交由旺角警区刑事调查队第四队跟进，暂未有人被捕。</p><div class="grid cursor-pointer grid-flow-row grid-cols-12 gap-1"><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/><div class="col-span-6 general-placeholder-hk01 relative overflow-hidden [&amp;_div]:flex [&amp;_div]:items-center [&amp;_div]:justify-center [&amp;_div]:absolute [&amp;_div]:inset-0 [&amp;_div]:text-1.75rem [&amp;_div]:text-white pt-75%"/></div><p class="whitespace-pre-wrap break-words">“二楼后座”位于洗衣街215号，是香港殿堂级乐队Beyond排练及创作的地方。该单位原是Beyond成员叶世荣祖母的住所，曾分租予4个住户，而叶的祖母过世后，叶世荣将祖母的房间改造成简单的band房，再添置音乐器材，成为了Beyond创作与排练的地方，而《海阔天空》、《光辉岁月》、《长城》、《情人》等脍灸人口的歌曲，据知亦是在这里孕育出来，Beyond歌曲《原谅我今天》及《醒你》MV亦在单位取景。</p><p class="whitespace-pre-wrap break-words">翻查资料，2024年市建局宣布要启动旺角洗衣街与花墟道重建计划，而“二楼后座”所属的大厦亦被纳入清拆范围。去年叶世荣首度开放单位给公众参观，并曾举办导赏团让公众了解Beyond音乐历程。</p><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"/><div class="mb-3.5 mt-26px flex flex-wrap" data-testid="article-tag"><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">突发</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">盗窃</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">Beyond</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">01 Video</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">我主场</span></div></div></div></div><div class="hidden flex-col items-center md:flex md:row-span-3 md:row-start-1 lg:col-span-4 lg:col-start-7 group-[.is-photostory]:md:row-span-1"><div class="min-h-250px w-full mb-6 px-6 relative flex items-center justify-center"><div class="flex w-screen md:w-full"><div class="lazyload-wrapper"/></div></div></div></div></div></div><div
