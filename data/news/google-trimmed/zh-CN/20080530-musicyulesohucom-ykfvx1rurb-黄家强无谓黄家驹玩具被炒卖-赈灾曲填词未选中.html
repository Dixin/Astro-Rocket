<P><BR>&nbsp;&nbsp;&nbsp; 
2008年5月30日，香港，黄家强昨日（5月29日）公布推出“黄家驹海阔天空慈善拍卖版”体形玩具，限量生产40个，由今日起至6月8日，在拍卖网进行慈善拍卖，每个拍卖底价2,500元，所有收益全数拨捐“苗圃行动”。黄家强大赞体形造型神似，还透露稍后会推出另外两个版本公开发售，他坦言不怕玩具被炒卖，说如果竞投价钱昂贵也炒卖不起，另外两款则售价数百元。</BR></P>
<P>&nbsp;&nbsp;&nbsp; 
对于有传言指录制赈灾歌的安排被曾志伟三度改变，黄家强坦言演协确实有叫他帮忙填词，他也递交了歌词，最后没有采用不会感到失望。
	
<iframe width="350" height="59" marginwidth="0" marginheight="0" hspace="0" vspace="0" frameborder="0" scrolling="no" bordercolor="#000000" src="http://images.sohu.com/cs/button/zhongshi/2007/jufu.html"/>



	又称原本由他监制歌曲，有感于陈奕迅处理得来而交由对方监制。黄家强认为做善事为主，不是为了名分。另外，谈到莎朗&#8226;斯通对四川大地震的“报应”言论作出道歉，黄家强直斥对方没口德且没智慧，“大人不记小人过，起码她出来道歉了。” 
</P>
