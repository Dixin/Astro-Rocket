-button-desktop"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" data-svg-type="icon" class="size-6"><path d="M6 10C4.9 10 4 10.9 4 12C4 13.1 4.9 14 6 14C7.1 14 8 13.1 8 12C8 10.9 7.1 10 6 10ZM18 10C16.9 10 16 10.9 16 12C16 13.1 16.9 14 18 14C19.1 14 20 13.1 20 12C20 10.9 19.1 10 18 10ZM12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z" fill="currentColor"/></svg></button></div></div></div></div></div><div class="col-start-1 lg:col-span-6"><div class="cmp-article-detail medium" data-testid="article-content-section"><p class="whitespace-pre-wrap break-words">每年的6月30日，都是华语乐坛一个隐隐作痛的日子。殿堂级乐队Beyond的灵魂人物黄家驹，于1993年6月24日在东京富士电视台录影游戏节目时不幸从高台堕下，头部重创，留医数日后于6月30日与世长辞，终年仅31岁。</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:480 / 300"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">BEYOND组成初期曾有不同成员，于1988年结他手刘志远离队后，由黄家驹﹑叶世荣﹑黄贯中和黄家强的Beyond组合最为人熟悉。（网上图片）</span></div><div class="flex w-screen md:w-full -mx-3 mb-3 mt-4 md:mx-0 overflow-x-hidden md:overflow-auto"><div class="lazyload-wrapper"/></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1024 / 1024"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄家驹在日本录影节目时从高处跌下后脑着地，留医六天后于日本时间1993年6月30日逝世，终年31岁。（网上图片）</span></div><p class="whitespace-pre-wrap break-words">晃眼间，家驹已离开了我们整整33个寒暑。在今天这个特殊的日子，Beyond的队友以及无数乐迷纷纷表达追思，而家驹的首部传记纪录片亦在近日正式公布上映，再度勾起无限回忆。</p><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:628 / 800"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄家驹逝世33年，在华人乐坛仍然有著崇高的地位。（微博图片）</span></div><h3 class="mb-2">队友黄贯中、叶世荣凌晨发文悼挚友</h3><p class="whitespace-pre-wrap break-words">Beyond成员黄贯中（Paul）与叶世荣一如既往，在30日凌晨准时发文悼念挚友。叶世荣以简单而沉重的“永远怀念”四个字致意；</p><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1360"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄贯中与叶世荣（资料图片）</span></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:716 / 190"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">叶世荣以“永远怀念”四个字致意。（微博图片）</span></div><p class="whitespace-pre-wrap break-words">而黄贯中则写下一段令人动容的感性长文，坦言那种痛楚至今仍宛如刀割：“又到了630，从没有强逼自己要去把你追忆，要去把那些遗忘呼唤回来，因为那像刀割那么痛，可是我们的青春也都定格在里面，记得曾经的你，曾经的我，从告别当天到现在已经是33个寒暑了。你现在在哪里或许已经不重要了，因为你是真真正正活着的一个。”</p><p class="whitespace-pre-wrap break-words">字里行间满溢著对昔日并肩作战岁月的怀念，令无数乐迷瞬间泪崩。</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:715 / 516"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄贯中则写下一段令人动容的感性长文。（微博图片）</span></div><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:711 / 555"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄家驹的战友老占亦发文悼念。（微博图片）</span></div><h3 class="mb-2">黄家驹首部纪录片《真的相识过》已上映</h3><p class="whitespace-pre-wrap break-words">为了纪念家驹逝世33周年，由叶世荣与Beyond前经理人陈健添（Leslie）共同监制的官方纪录片《真的相识过》（Because of You Ka Kui），已于今年6月25日正式上映。</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1080"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄家驹首部纪录片《真的相识过》（Because of You Ka Kui）已经上映。（《真的相识过》影片截图）</span></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1080"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">纪录片由叶世荣和Beyond前经理人陈健添（图）共同监制。（《真的相识过》影片截图）</span></div><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><p class="whitespace-pre-wrap break-words">这部珍贵的纪录片全长129分钟，包含超过30分钟从未曝光的珍贵演唱会片段、音乐影像及幕后故事。摄制队亲自走访香港、北京、台北、东京、多伦多及伦敦，访问了二十多位曾在不同时期与Beyond合作的成员、团队人员及家驹的生前挚友，制作诚意十足。</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1080"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">纪录片全长129分钟，包含超过30分钟从未曝光的珍贵演唱会片段、音乐影像及幕后故事。（《真的相识过》影片截图）</span></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1080"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">纪录片还访问了二十多位曾在不同时期与Beyond合作的成员、团队人员及家驹的生前挚友。（《真的相识过》影片截图）</span></div><p class="whitespace-pre-wrap break-words">遗憾的是，Beyond另外两位成员黄家强与黄贯中并未参与是次访问；不过，片中却罕有地访问了家驹生前的两位旧女友——潘先丽与林楚麒。</p><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1080"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">黄家驹的旧女友潘先丽都有现身。（《真的相识过》影片截图）</span></div><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1080"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">林楚麒是当年黄家驹唯一认爱女友，纪录片中都有现身。（《真的相识过》影片截图）</span></div><h3 class="mb-2">林楚麒曾因“未亡人”身份掀黄家强怒火</h3><p class="whitespace-pre-wrap break-words">在受访的旧爱当中，最引人注目的莫过于当年与家驹相恋、亦是其唯一公开承认过的女友林楚麒。家驹当年离世后，曾传出林楚麒欲以“未亡人”身份出席丧礼，但遭到黄家人的强烈拒绝。黄家强早年曾忍无可忍在微博痛斥对方利用家驹的名号宣传、欺骗歌迷，并直言：“只希望她不要再提家驹了！”</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:819 / 628"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">林楚麒曾被指借跟家驹过去式的关系抽水。（网上图片）</span></div><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><p class="whitespace-pre-wrap break-words">对此，林楚麒坦言全属误会，强调自己早已退居幕后，根本不需要博眼球或自我宣传，只是偶尔在大家苦苦哀求下才会分享往事。林楚麒更感性透露，自己花了足足10多年的时间才真正接受家驹的离开，更深情告白：“在我心中已和家驹成为夫妻。”</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1920 / 1488"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">林楚麒亦是《曾经拥有》的填词人。当年家驹的遗体从日本运返香港，林楚麒头戴一朵白花，身份仿似未亡人。但她的身份却不被家驹家属承认，家强更指她“很对不起家驹”才导致分手。 (网络图片)</span></div><div class="flex flex-col">丁子朗喜迎最后一个“二字头”生日　被夺第一次后直呼：都几冲击刘颖旋秘密练歌搣甩“魔音”　恨拍篮球剧盼与谭旻萱球场上相遇黄宗泽笑吴卓羲几十岁拍拖又如何　赞张曦雯大众女神系男人都钟意钟嘉欣不信夏雨拍亲热戏加“伸俐”自肥：佢系一个好直嘅人！陈卓贤Ian激动回应被指抄歌：我未至于堕落到去抄袭！</div><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"/><div class="mb-3.5 mt-26px flex flex-wrap" data-testid="article-tag"><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">黄家驹</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">黄贯中</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">叶世荣</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">音乐</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">香港艺人动向</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">01 Video</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">OTT</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">01‌ ‌Video‌ ‌OTT</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">娱乐无穷</span></div></div></div></div><div class="hidden flex-col items-center md:flex md:row-span-3 md:row-start-1 lg:col-span-4 lg:col-start-7 group-[.is-photostory]:md:row-span-1"><div class="min-h-250px w-full mb-6 px-6 relative flex items-cen
