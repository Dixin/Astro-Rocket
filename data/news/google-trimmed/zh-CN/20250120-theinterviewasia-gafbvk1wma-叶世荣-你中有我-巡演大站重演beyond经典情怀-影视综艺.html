		<h1 id="entry-title" class="entry-title">叶世荣《你中有我》巡演大站   重演Beyond经典情怀</h1>

		
		
		
		
		
			<figure class="post-thumbnail">
				<img width="1200" height="630" src="https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV11.jpg" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" alt="" srcset="https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV11.jpg 1200w, https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV11-640x336.jpg 640w, https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV11-768x403.jpg 768w" sizes="(max-width: 1200px) 100vw, 1200px" style="width:100%;height:52.5%;max-width:1200px;"/>							</figure>

	<div id="entry-content" class="entry-content">
	
		<p>殿堂级摇滚乐队Beyond前鼓手叶世荣即将于2025年3月2日傍晚6时带着备受期待的《你中有我》巡回演唱会登陆云顶世界云星剧场，与歌迷重温青春梦想、一起追忆光辉岁月。</p>
<p>作为家比喻户晓的Beyond乐队创始成员之一，担任乐队鼓手时期的叶世荣曾参与了无数摇滚史上不可磨灭的经典名曲，包括〈海阔天空〉、〈光辉岁月〉、〈真的爱你〉、〈喜欢你〉等等。</p>
<figure id="attachment_168601" aria-describedby="caption-attachment-168601" style="width: 1200px" class="wp-caption alignnone"><img loading="lazy" class="size-full wp-image-168601" src="https://theinterview.asia/wp-content/uploads/2025/01/beyond.jpg" alt="" width="1200" height="630" srcset="https://theinterview.asia/wp-content/uploads/2025/01/beyond.jpg 1200w, https://theinterview.asia/wp-content/uploads/2025/01/beyond-640x336.jpg 640w, https://theinterview.asia/wp-content/uploads/2025/01/beyond-768x403.jpg 768w" sizes="(max-width: 1200px) 100vw, 1200px"/><figcaption id="caption-attachment-168601" class="wp-caption-text">叶世荣曾为Beyond创始成员之一，将会在演唱会演唱几首Beyond的经典歌曲。左起为叶世荣、已故主唱黄家驹、吉他手黄贯中和贝斯手黄家强。（图片来源：每日头条）</figcaption></figure>
<p>2001年开始，叶世荣以独立唱作人身份开展其个人歌曲创作及演艺事业。作为乐队解散后第一个发表个人音乐作品的成员，他不仅亲自操刀曲、编创作，更是在曲风和演唱中表达了在音乐路途上重新出发、再辟新天地的豪情壮志与积极乐观的态度，并相继在中国、港澳台、日本、新加坡、马来西亚等地区举办世界巡回演唱会。</p>
<p>《你中有我》巡回演唱会以“你中有我，我中有你，世界大同”为主题,也是叶世荣在后疫情时代的感悟。他表示：“人与人之间存在着无数种联系，唯有彼此关怀，我们才能共同克服困难。”</p>
<p>他希望通过活动、演出及巡回演唱会的形式发挥个人力量，以音乐共鸣凝聚大众力量，弘扬大爱与正能量精神，以音乐人独特魅力唱响新时代主旋律。</p>
<p>除了现场演绎主题曲《你中有我》，叶世荣还为粉丝准备了多首Beyond的经典金曲，让歌迷可以共同追忆昔日光辉，更有叶世荣独立发展二十余载以心血历练交织而成的新作演绎，以个人作品印证每一次的自我超越。</p>
<p>演唱会的另一个亮点就是邀请了高进为特别嘉宾。作为〈我的好兄弟〉、〈我们不一样〉的创作者，高进凭借2006年爆红的〈听着情歌流眼泪〉一举成名，并于2007年获得雪碧流行音乐榜“年度最佳新人奖”。在过去十年间,他先后发行了二十多张专辑与单曲，以其深情的音乐与精彩的演绎深受歌迷喜爱。</p>
<figure id="attachment_168596" aria-describedby="caption-attachment-168596" style="width: 1200px" class="wp-caption alignnone"><img loading="lazy" class="size-full wp-image-168596" src="https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV1.jpg" alt="" width="1200" height="1200" srcset="https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV1.jpg 1200w, https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV1-640x640.jpg 640w, https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV1-150x150.jpg 150w, https://theinterview.asia/wp-content/uploads/2025/01/YipSaiWing-KV1-768x768.jpg 768w" sizes="(max-width: 1200px) 100vw, 1200px"/><figcaption id="caption-attachment-168596" class="wp-caption-text">《你中有我》演唱会官方海报。（图片来源：相关单位）</figcaption></figure>
<p>此次演唱会不仅是对Beyond乐队四十年非凡音乐成就的致敬，也是一场叶世荣与高进个人音乐音乐旅程的见证。歌曲中有叶世荣的友情岁月,更有你我人生中的苦辣酸甜。2025年3月22日，《你中有我》巡回演唱会马来西亚站，诚邀您同声共唱，一起来摇滚吧！</p>
<p>演唱会票价为588令吉（VIP）、488令吉（PS1）、388令吉（PS2）、288令吉（PS3）及 168令吉（PS4），所有票价未包括4令吉的手续费。凡通过云顶积分、信用卡或现金购票的云顶云尊卡会员将获得10%折扣，仅适于VIP、PS1、PS2 及PS3票位。</p>
<h6><strong>活动详情👇</strong></h6>
<h6>【《你中有我》叶世荣巡回演唱会-马来西亚站】<br/>
<strong>日期：2025年3月22日（六）</strong><br/>
<strong>时间：傍晚6时</strong><br/>
