<p>　　新浪娱乐讯 今天（5月17日）是香港歌手黄家强[微博]和老婆Makiko结婚十周年纪念日，黄家强通过微博晒美食以及夫妻两人恩爱照片，并示爱老婆，称：“今天是我们结婚十周年，原来爱真的不容易，十年不够我们相处，我们需要一百年。”</p>
<p>　　照片中，除了有象征浪漫的鲜花和美酒美食之外，更有夫妻两人恩爱合影，夫妻俩以黑色情侣装亮相，老婆Makiko一头齐耳短发，坐与餐桌前，依偎在黄家强怀里，小鸟依人般，十分的恩爱幸福，甜蜜之意溢于言表。</p>
<p>　　此微博曝光后，网友也被两人的幸福所感染，纷纷围观并留言送上对两人的祝福，称：“隔着屏幕都能感觉到满满的幸福！”“看着我自己都跟着幸福了！”“越来越幸福，等着一百年。”</p>
<p>　　据悉，2006年，黄家强与日籍女孩Makiko结婚；2007年3月，Makiko诞下儿子黄庆阳（Keiyo）；2012年2月17日再次诞下第二个儿子。（我是弥尔）</p><div class="show_author">(责编：圈圈)</div>
