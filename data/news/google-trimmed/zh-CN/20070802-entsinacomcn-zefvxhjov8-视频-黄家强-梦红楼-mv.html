<p>　　新浪娱乐讯 前<span class="keyword">Beyond</span>(听歌)乐队成员黄家强(听歌)即将于内地发行个人首张国语专辑《她，他》。7月21日，专辑主打歌《梦红楼》将于全国多家电台同步首播。这首歌曲风特别，将电子乐与中国乐器融为一体，既有古典的味道又不失摇滚特色，与诗意的歌词搭配相宜，令人耳目一新。</p>
<p>　　无论是作为BEYOND的成员，亦或是个人发展，黄家强一直坚持着自己的音乐风格，也勇于大胆尝试。在这次的国语专辑中，黄家强加入了各种各样的音乐元素，有电子的，有摇滚的，还有IGS…等等，变化多样的音乐题材与曲风，将黄家强的个人风格表露无遗。此次曝光的主打歌《梦红楼》用中国的乐器配合西方电子乐来编曲，黄家强表示，当时的构思只是想利用中国的乐器来创作一首歌，做好之后，他感觉歌曲的旋律很有古典的味道，所以就想到用中国名著作为创作题材，于是他想到了《红楼梦》。 </p>
<p>　　歌词方面，方文山(blog)的词作很有诗意，与整首曲子搭配得当。黄家强说“这首歌对我来说是一个全新的尝试，很有趣，因为我做到自己想做的。”</p>
<p>　　《她，他》是黄家强发行的首张国语专辑，对于他来说是一个不小的挑战。在这张专辑的发行前后，黄家强经历了由丈夫到父亲身份的转变，而他也将这种幸福感觉带入新专辑之中。《哪吒离家》与歌曲粤语版《哪吒回家》分别送给儿子和父亲，专辑里另一首歌《回家的路》则是送给妻子的，整张专辑充满了对家庭的关爱之情。 </p>
