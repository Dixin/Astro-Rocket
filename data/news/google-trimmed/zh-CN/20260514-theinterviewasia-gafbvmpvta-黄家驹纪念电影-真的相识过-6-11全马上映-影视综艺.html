	<div id="entry-content" class="entry-content">
	
		<p><span style="font-weight: 400;">为纪念Beyond灵魂人物黄家驹6月10日冥诞，为他量身打造的音乐纪实电影《真的相识过》（Because of You Ka Kui ）将于6月11日全马上映。</span></p>
<figure id="attachment_203410" aria-describedby="caption-attachment-203410" style="width: 1819px" class="wp-caption aligncenter"><img loading="lazy" class="size-full wp-image-203410" src="https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-scaled.jpg" alt="" width="1819" height="2560" srcset="https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-scaled.jpg 1819w, https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-455x640.jpg 455w, https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-924x1300.jpg 924w, https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-768x1081.jpg 768w, https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-1091x1536.jpg 1091w, https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-1455x2048.jpg 1455w, https://theinterview.asia/wp-content/uploads/2026/05/Final-Poster_MY_Because-of-You-Ka-Kui-1568x2207.jpg 1568w" sizes="(max-width: 1819px) 100vw, 1819px"/><figcaption id="caption-attachment-203410" class="wp-caption-text">黄家驹纪录片《真的相识过》6月11日全马上映。（图片来源：相关单位）</figcaption></figure>
<p><span style="font-weight: 400;">本片由Beyond乐队成员叶世荣与挖掘乐队的经纪人陈健添共同监制，彭瑞祥执导，该片被视为首部全面记录黄家驹音乐人生与传奇影响的唯一大银幕纪录片。透过珍贵演出片段、未公开影像及深度访谈，《真的相识过》带领观众走进音乐背后的故事，感受黄家驹的创作初心与时代意义。</span></p>
<figure id="attachment_203407" aria-describedby="caption-attachment-203407" style="width: 2560px" class="wp-caption aligncenter"><img loading="lazy" class="size-full wp-image-203407" src="https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-scaled.jpeg" alt="" width="2560" height="1726" srcset="https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-scaled.jpeg 2560w, https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-640x432.jpeg 640w, https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-1300x876.jpeg 1300w, https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-768x518.jpeg 768w, https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-1536x1036.jpeg 1536w, https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-2048x1381.jpeg 2048w, https://theinterview.asia/wp-content/uploads/2026/05/Copy-of-Copy-of-W012-topaz-denoise-lighting-color-gigapixel-high-fidelity-v2-3840w-topaz-sharpen-1568x1057.jpeg 1568w" sizes="(max-width: 2560px) 100vw, 2560px"/><figcaption id="caption-attachment-203407" class="wp-caption-text"><span style="font-weight: 400;">透过珍贵演出片段、未公开影像及深度访谈，《真的相识过》带领观众走进音乐背后的故事，感受黄家驹的创作初心与时代意义。</span>（图片来源：相关单位）</figcaption></figure>
<p><span style="font-weight: 400;">本片特别以&#8221;音乐盛事电影&#8221;形式打造，让观众在戏院中一同聆听、共鸣、合唱， 每一场放映为一场情感共振的现场体验。</span></p>
<h2><span style="color: #ff0000;"><b>6.06举办特别放映会暨Respect纪念家驹音乐会</b></span></h2>
<p><span style="font-weight: 400;">在电影正式上映前，乐迷可率先参与6月6日在敦拉萨国际贸易中心（TRX）Aurum Theatre影院致敬盛会。当晚除了放映电影之外，还有Respect乐队带来仅此一晚的独家演出。</span></p>
<figure id="attachment_203408" aria-describedby="caption-attachment-203408" style="width: 1600px" class="wp-caption aligncenter"><img loading="lazy" class="size-full wp-image-203408" src="https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo.jpeg" alt="" width="1600" height="1200" srcset="https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo.jpeg 1600w, https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo-640x480.jpeg 640w, https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo-1300x975.jpeg 1300w, https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo-768x576.jpeg 768w, https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo-1536x1152.jpeg 1536w, https://theinterview.asia/wp-content/uploads/2026/05/The-Respect-Band-group-photo-1568x1176.jpeg 1568w" sizes="(max-width: 1600px) 100vw, 1600px"/><figcaption id="caption-attachment-203408" class="wp-caption-text"><span style="font-weight: 400;">Respect乐队将于6月6日进行现场致敬演出。</span>（图片来源：相关单位）</figcaption></figure>
<p><span style="font-weight: 400;">这是一支由香港和马来西亚摇滚音乐家组成的特别乐队，于当晚齐聚一堂，进行现场致敬演出，以纪念这位粤语摇滚传奇人物及其对摇滚乐的重要影响。同时，观众也可以获得专为此次致敬场特别打造的限量独家周边商品：</span></p>
<ul>
<li><span style="font-weight: 400;">1 张2D Aurum电影票（1 人份），含小吃和饮料</span></li>
<li><span style="font-weight: 400;">1 张A3电影海报</span></li>
<li><span style="font-weight: 400;">1套明信片</span></li>
<li><span style="font-weight: 400;">1个限量版帆布袋</span></li>
<li><span style="font-weight: 400;">1张纪念票</span></li>
</ul>
<p><span style="font-weight: 400;">《真的相识过》电影特映暨紀念黄家驹音乐会门票现已开放售票，该电影也即将登陆香港、澳门、中国以及更多地区，更多详情可浏览GSC官方网站查询。</span></p>
<p><img loading="lazy" class="aligncenter size-full wp-image-203405" src="https://theinterview.asia/wp-content/uploads/2026/05/BecauseOfYouKaKui_6.6-Promo-Visual-1_1200x1500px.png" alt="" width="1200" height="1500" srcset="https://theinterview.asia/wp-content/uploads/2026/05/BecauseOfYouKaKui_6.6-Promo-Visual-1_1200x1500px.png 1200w, https://theinterview.asia/wp-content/uploads/2026/05/BecauseOfYouKaKui_6.6-Promo-Visual-1_1200x1500px-512x640.png 512w, https://theinterview.asia/wp-content/uploads/2026/05/BecauseOfYouKaKui_6.6-Promo-Visual-1_1200x1500px-1040x1300.png 1040w, https://theinterview.asia/wp-content/uploads/2026/05/BecauseOfYouKaKui_6.6-Promo-Visual-1_1200x1500px-768x960.png 768w" sizes="(max-width: 1200px) 100vw, 1200px"/></p>
