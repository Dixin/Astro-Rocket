&nbsp;
<p><br/>　　近日，Beyond鼓手叶世荣与弟子EVER乐队飞赴北京为即将推出的新专辑拍摄新歌MV。此次拍摄MV叶世荣亲自担任指导工作，从MV的创意构思到现场的场景布置所有环节都是亲力亲为，做足准备非常认真。拍摄时叶世荣同EVER乐队每位成员都以最佳状态出境，整个拍摄过程非常顺利，仅用三天时间就完成了全部拍摄工作。</p>
<p>　　工作结束后，叶世荣表示对拍摄的MV很满意，并透露这次拍摄的MV包括了自己的新歌《荣光》还有同EVER乐队一同创作演唱的歌曲《十年》；这两首歌全部都会收录在即将推出的新专辑当中，更多好的歌曲敬请歌迷们期待稍后的新专辑。</p>
