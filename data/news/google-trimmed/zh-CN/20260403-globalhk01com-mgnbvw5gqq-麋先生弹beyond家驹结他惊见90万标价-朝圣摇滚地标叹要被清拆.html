-button-desktop"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" data-svg-type="icon" class="size-6"><path d="M6 10C4.9 10 4 10.9 4 12C4 13.1 4.9 14 6 14C7.1 14 8 13.1 8 12C8 10.9 7.1 10 6 10ZM18 10C16.9 10 16 10.9 16 12C16 13.1 16.9 14 18 14C19.1 14 20 13.1 20 12C20 10.9 19.1 10 18 10ZM12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z" fill="currentColor"/></svg></button></div></div></div></div></div><div class="col-start-1 lg:col-span-6"><div class="cmp-article-detail medium" data-testid="article-content-section"><p class="-ml-3 md:ml-0"><span class="border-primary mb-6 block border-l-4 pl-3 md:mb-8">台湾金曲奖“最佳乐团”麋先生（Mixer）麋先生，将于4月18日(星期六)，于香港Portal 举行 《马戏团运动CircUs》世界巡回演唱会香港站。五位成员上星期来港参予五月天演唱会，担任嘉宾，更抽空专程前往“二楼后座”朝圣。<br/></span></p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1200 / 1600"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">香港4月18日麋先生马戏团运动海报。（官方提供图片）</span></div><div class="flex w-screen md:w-full -mx-3 mb-3 mt-4 md:mx-0 overflow-x-hidden md:overflow-auto"><div class="lazyload-wrapper"/></div><h3 class="mb-2">麋先生来港朝圣即将清拆的“二楼后座”</h3><p class="whitespace-pre-wrap break-words">第一次踏足Beyond的二楼后座，主唱圣皓表示：“Beyond在我们心目中是一个非常经典的乐团，都有听过他们的歌啊，这一次亲身走到他们的录音室工作室，是非常感动跟震撼。因为那里是他们诞生的地方，踏进去就像走进他们的故事里面，真实感受到那些曾经在耳机里面的音乐。”</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:3096 / 1912"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">麋先生来港朝圣即将清拆的“二楼后座”。（官方提供图片）</span></div><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><h3 class="mb-2">手逸凡获叶世荣赠送鼓棍</h3><p class="whitespace-pre-wrap break-words">结他手于二楼后座，拿起Beyond家驹的古董结他试弹，得知结他是1987年的，众人高呼“哗！比我们年纪还大！”结他上贴有价钱是90几万港币，也吓了他们一跳，最后才知道，那个价钱贴是黄贯中搞笑写上去的。鼓手卢逸凡更在录音室获得了一份极具意义的礼物——Beyond鼓手叶世荣送赠的鼓棍，逸凡透露将会在四月来港开演唱会时使用这份珍贵的纪念品。鼓手逸凡被问到会否效法Beyond鼓手叶世荣当年演唱会solo 20分钟，他笑言：“如果大家真的这么想看，我是绝对奉陪的。”其他成员随即起哄：“一个半小时、两个小时也可以啊！”十分搞笑。</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1239 / 933"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">鼓手卢逸凡获叶世荣赠送鼓棍</span></div><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><p class="whitespace-pre-wrap break-words">二楼后座是Beyond乐队于80年代末至90年代的重要创作基地，乐队多首经典作品皆在此诞生，对本地乐迷乃至亚洲摇滚乐坛都具有深远意义。参观期间，麋先生得知二楼后座面临清拆，4月9号后会被香港政府回修旧区重建，整栋大厦清拆，永远消失在世上，众人均表示非常可惜，感叹：“这样珍贵的一个代表著香港摇滚历史的地方，为什么不保留？这样就从此消失，真的好可惜。幸好我们赶得上这最后一波参观。”</p><div class="-ml-3 w-screen md:ml-0 md:w-full"><div class="general-placeholder-hk01 mb-2" style="aspect-ratio:1892 / 2092"/><span class="img-caption ml-3 block text-left text-light-n6 md:ml-0">麋先生留言：心里的海阔天空，永远的光辉岁月。（官方提供图片）</span></div><h3 class="mb-2">啖家驹生前最爱的“猪扒餐”</h3><p class="whitespace-pre-wrap break-words">朝圣录音室后，麋先生更跟著 Beyond旧日的足迹，光顾Beyond当年最常光顾的餐厅，Beyond世荣电话中推介了附近一家老店，并透露黄家驹最爱吃“煎猪扒、罗宋汤及一个餐包”，而世荣自己则有时会吃牛扒。麋先生随即按图索骥前往该餐厅，品尝Beyond同款美食，他们形容这趟既是“朝圣之旅”，也是“美食之旅”。</p><div class="flex w-screen md:w-full mb-3 mt-4 min-h-250px"><div class="lazyload-wrapper"/></div><div class="flex flex-col">NMIXX演唱会2026香港加场｜门票优先/公售攻略＋购票连结＋座位表Dear Jane澳大利亚悉尼首个演唱会　Tim走落台再两度encore乐迷唔愿走金俊秀演唱会2026香港丨门票优先/公售攻略＋购票连结＋座位表Post Malone演唱会2026香港丨门票优先/公售攻略+购票连结+座位表M23 Live in HK演唱会2026｜门票攻略＋购票连结＋座位表</div><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"/><div class="mb-3.5 mt-26px flex flex-wrap" data-testid="article-tag"><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">音乐</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">演唱会</span></div><div class="my-1.5 mr-3" data-testid="article-tag"><span class="place-self-center">本地乐坛焦点</span></div></div></div></div><div class="hidden flex-col items-center md:flex md:row-span-3 md:row-start-1 lg:col-span-4 lg:col-start-7 group-[.is-photostory]:md:row-spa
