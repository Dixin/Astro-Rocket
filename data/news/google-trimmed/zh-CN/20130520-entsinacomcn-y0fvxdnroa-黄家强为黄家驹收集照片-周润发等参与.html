				<div class="img_wrapper">
					<img alt="周润发也参与纪念黄家驹的活动照片" src="http://i0.sinaimg.cn/ent/y/2013-05-20/U4350P28T3D3924263F326DT20130520085149.jpg"/>
					<span class="img_descr">周润发也参与纪念黄家驹的活动照片</span>
				</div>
				

<p>　　新浪娱乐讯 北京时间5月20日消息，据香港媒体报道，2013年是Beyond成立三十年，黄家驹逝世二十年的日子，黄家驹弟弟黄家强[微博]在这个二十年的纪念日，写了新歌《好好》送给哥哥。他还发起“今天我好好”的纪念活动，收集大家的照片作为送给黄家驹的礼物，目前已收集到包括周润发、刘德华等一众明星照片。</p>

<p>　　黄家强表示，他希望大家以一个快乐、正面的心态来纪念黄家驹，于是发起“今天我好好”纪念活动，希望所有喜欢Beyond、喜欢黄家驹的朋友一同来参与。黄家强表示，已经二十年了，虽然伤痛仍在，但活着便要精彩，这是Beyond精神，不再要有眼泪，“家驹从不喜欢哭哭啼啼，希望大家跟我一样，今年可以很快乐地告诉家驹，我们好好，不用担心。所以我们发起收集很多身边朋友、家驹好友‘过得好好’的照片。”</p>

<p>　　同时，他也欢迎全世界喜欢家驹的朋友参与，收集好的所有照片会在黄家驹六月十日生日那天砌成一个黄家驹作为送给他的生日礼物。悼念照片中有不少圈中好友，包括周润发、刘德华、陈奕迅[微博]、黄耀明、古巨基[微博]、郑伊健[微博]、草蜢、任贤齐[微博]、杨千嬅[微博]、陈小春[微博]、周柏豪[微博]、林一峰、林二汶、王菀之[微博]、吴克群[微博]、五月天[微博]、王菲等等。(苗菲)</p>
