                                    <p>曾因破坏Beyond主音黄家驹坟墓、猥亵女歌手炎明熹（Gigi）纸牌而惹上官司的网红「光头Bob」（梁俊言），今日（23日）其社交平台Threads突然发布其黑白「车头相」，并宣布其死讯，指他「身体一直长期欠佳」，并于昨天已离世，但大批网民质疑其真实性，认为他再次「博出位」呃流量。</p><ad id="ad-1"/><h2>官方帐号宣布光头Bob离世</h2><p>今日下午，「光头Bob」的Threads帐户发出帖文，上载一张梁俊言的黑白照，相中写有「梁俊言 2008-2026 享年18岁」字样。帖文内容则指：「鉴于Bob仔身体状况，一直长期欠佳加以睡眠不足 他已于昨天离开咗了我们，大家从此亦在看不到他的身影了 他的拍片生涯从今画上句号。小编上 2026-7-23」。</p><ad id="ad-2"/><p>相关阅读：Beyond黄家驹墓被毁｜KOL光头Bob涉案被捕 曾自称患有自闭症及过度活跃症</p><ad id="ad-3"/><gallery-1/><h2>光头Bob去年10月再被捕</h2><p>曾自称患有自闭症及过度活跃症的「光头Bob」，过去曾有不少出位甚至违法的行径。2024年5月，他涉嫌刑事毁坏黄家驹位于将军澳华人永远坟场的坟墓，被警方拘捕。2023年9月，他又在快餐店外对炎明熹的人形纸牌做出「强吻」等猥亵行为，并拍片上载网络，声称「好X钟意搞事，又唔X怕事」，引来网民炮轰。此外，他亦曾有捣乱山坟、饮厕所水等骇人听闻的行为。而在去年10月，他亦因涉及网红团体「白卡联盟」的刀片信威吓事件，与另外6人一同被捕。</p><ad id="ad-4"/><h2>网民质疑光头Bob死讯</h2><p>对于「光头Bob」的死讯，大部分网民都表示难以置信，认为「昨天离世，今日已有车头相」并不合常理，网民纷纷留言质疑：「真定假？」、「听日就拍片上嚟」、「寻日先去边有咁X快有车头相？」、「18岁个样生得咁急嘅？」，不少人认为这又是他吸引注意力的伎俩。翻查资料，「光头Bob」的Threads对上一次更新是在今年7月8日，当时他上载自己的儿童身份证，表示当天是自己18岁生日。</p><ad id="ad-5"/><p>相关阅读：「白卡联盟」恐吓案｜盘点「白卡七子」出位劣行 破坏黄家驹墓最轰动</p><ad id="ad-6"/>
