<P align="center">黄家强坚持着自己的音乐，延续着Beyond的灵魂</P>

<P>　　Beyond乐队堪称香港乐坛的不朽传奇。《光辉岁月》、《真的爱你》这些歌曲，即使不喜欢摇滚的人，也很熟悉。在乐队主唱黄家驹离世后，Beyond仍然坚持自己的精神，然而几年前乐队成员因音乐理念不同，各自单飞。昨日，黄家驹的弟弟黄家强<SPAN class="articleLink">(黄家强新闻,黄家强音乐,黄家强说吧)</SPAN>携首张全国语大碟《她，他》来到西安，参与录制陕西卫视的《唱唱翻斗星》节目，他告诉记者，即使唱片的市场再不好，他依旧在自己的道路上坚持着自己的音乐，延续着Be－yond的灵魂。
<iframe width="350" height="250" marginwidth="0" marginheight="0" hspace="0" vspace="0" frameborder="0" scrolling="no" bordercolor="#000000" src="http://images.sohu.com/chat_online/market/marketpip.html"/>
	
<iframe width="350" height="59" marginwidth="0" marginheight="0" hspace="0" vspace="0" frameborder="0" scrolling="no" bordercolor="#000000" src="http://images.sohu.com/cs/button/zhongshi/2007/jufu.html"/>	</P>
<P>　　为儿子推迟唱片计划</P>
<P>　　在黄家强身上，看不到摇滚人士常有的愤怒，有的是一个成熟男人的优雅和一个初为人父的温情。不久前黄家强做了爸爸，黄家强说，宝贝儿子的诞生对他的生活产生了很大的影响，为了能够照顾自己的妻儿，他推迟了新专辑的发行时间，甚至还影响到了他的曲风。黄家强说，因为儿子的出生，他把整张专辑都做得比以前更温暖、更柔和了，并且他还专门为儿子写了一首歌《哪吒离家》，新专辑中还有一首非常独特的《梦红楼》，这首由方文山填词的歌曲，完美地将电子乐与中国乐器相融合，让人耳目一新。</P>
<P>　　新专辑取名《她，他》，看起来是一个很让人费解的名字。对此，黄家强解释说：“《她，他》本取自徐若瑄的一首歌名。因为在我看来，世界是由男人和女人组成的，专辑取名《她，他》就可以代表整个人类，涵盖人与人之间奇奇妙妙复复杂杂的感情，这与专辑里歌曲的内容也是相契合的。”</P>
<P>　　更喜欢内地乐坛</P>
<P>　　对于香港乐坛，黄家强向记者表示了他的不满和担忧。他指出，全香港就靠那么四五个人做了差不多90％的歌，结果歌的风格都一样，完全没有性格，“那种病态的感觉我看了就讨厌”。虽说是不满，黄家强说自己并不会放弃。</P>
<P>　　黄家强对内地乐坛却有着很高的评价和期许，他表示，内地的乐坛有着更大的空间，大家都互相尊重彼此的音乐，并有很多很出色、很有个性的音乐人，比如汪峰、许巍、窦唯等，希望可以跟他们交流合作。黄家强强调：“我会永远做一个不随波逐流的音乐人。”</P>
<P>　　从未放弃Beyond精神</P>
<P>　　在很多歌迷眼中，Beyond的歌从不是唱给一个人听的，他们的歌包含着对很多人的关怀。黄家强说这种人文关怀，他永远不会丢弃的。“在我的新专辑中，我为处于战火地区的儿童写了一首公益歌曲《远方的哭泣》，希望可以有更大的号召力，让大家都去帮助那些可怜的孩子们。还有一些歌，是关注家庭暴力的，Beyond精神，我不会放弃。”</P>
<P>　　Beyond的解散，让很多歌迷觉得遗憾。黄家强觉得，既然每个人都有不同的音乐理想和坚持，那勉强在一起也不会做出好的音乐，只会让乐队因为音乐不好而慢慢被大家遗忘，那是谁都不愿意看到的。当被问及Beyond会不会有朝一日重组时，黄家强表示，他们现在都在做着自己的音乐，有了自己不同的风格，并没有统一的新作品，所以在现阶段是不可能重组的，他们更不会打着重组的幌子为了赚钱而开演唱会，所以希望大家可以谅解，给他们多一些时间来做自己的东西。“有人说我们有矛盾，那是我们在创作理念上的矛盾，做音乐是开心的，既然不开心，那就分开。”</P>
<P>　　</P>
