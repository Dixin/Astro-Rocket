                                    <p>今日（6月30日）是殿堂级乐队Beyond灵魂人物黄家驹逝世33年。Beyond在1993年6月24日到东京富士电视台录影游戏节目《想做什么就做什么》（ウッチャンナンチャンのウリナリ!!）时，期间黄家驹不慎从高台堕下令头部重创，经过多日在东京女子医科大学医院留医抢救，最终不幸于6月30日逝世，终年31岁。</p><ad id="ad-1"/><h2>黄贯中「将我们的青春也都定格在里面」</h2><p>Beyond两位成员黄贯中（Paul）和叶世荣今日（30日）凌晨分别于微博留言悼念挚友，黄贯中说：「又到了630，从没有强逼自己要去把你追忆，要去把那些遗忘呼唤回来，因为那像刀割那么痛，可是我们的青春也都定格在里面，记得曾经的你，曾经的我，从告别当天到现在已经是33个寒暑了。你现在在哪里或许已经不重要了，因为你是真真正正活着的一个。」叶世荣则以「永远怀念」忆故友。</p><ad id="ad-2"/><p>相关阅读：黄家驹逝世31年丨黄贯中贴合照念故友：日子并没有把事情冲淡 叶世荣四字尽诉心中情</p><ad id="ad-3"/><gallery-1/><h2>黄家驹首个纪录片《真的相识过》已上映</h2><p>为了纪念黄家驹逝世33年，叶世荣和Beyond前经理人陈健添（Leslie）共同监制，黄家驹首个纪录片《真的相识过》（Because of You Ka Kui）已于今年6月25日上映，电影将带乐迷深入认识这位殿堂级乐队Beyond的灵魂人物，回顾他传奇的音乐旅程。影片全长129分钟，除了包括超过30分钟的演唱会片段，更收录从未曝光珍贵音乐、影像及故事外，亦走访香港、北京、台北、东京、多伦多及伦敦六地，访问逾二十位曾在Beyond不同时期的成员、团队工作人员与黄家驹的亲密好友。当中两位黄家驹旧女友潘先丽与林楚麒，但Beyond队友黄家强与黄贯中未有参与受访。</p><ad id="ad-4"/><h2>林楚麒是黄家驹唯一公开承认的女友</h2><p>林楚麒是黄家驹唯一公开承认的女友，在黄家驹离世后，曾传出林楚麒想以「未亡人」身份出席丧3礼，但遭其家人拒绝，黄家强亦试过在微博公开力数对方：「如果不是林小姐利用家驹的未亡人身份来宣传，我是不会说她的，只希望她不要再提家驹了，我不想家驹的歌迷被她欺骗，这是非常正常的事。」但林楚麒称全属误会：「我已经不当幕前，有需要拿别人来宣传自己吗？偶尔跟大家说我们的往事，也衹是因为大家的苦苦哀求我才开始说的。更好笑的是也有些人觉得我是为了博眼球，想别人关注我的微博。说实话，别人关不关注我也没得益，我有甚么需要去博呢？」 ​​​林楚麒更曾声称花了10多年时间才接受黄家驹的离开：「在我心中已和家驹成为夫妻。」</p><ad id="ad-5"/><p>相关阅读：黄家驹逝世30周年丨昔日战友撰文悼念挚友 黄贯中慨叹：呢度仍是沙漠</p><ad id="ad-6"/><h2><strong><span id="cke_bm_48012S" style="display: none;"> </span>林楚麒与黄家驹照片</strong>：</h2><gallery-2/>
