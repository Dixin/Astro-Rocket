      "/></div></div><p style="text-indent: 0px;">  11月1日，叶世荣「你中有我」巡回演唱会成都站收官。从《金属狂人》的炸裂开场到《海阔天空》的万人大合唱，那些熟悉的旋律贯穿整晚。《喜欢你》的前奏引发全场共鸣，这是独属于蓉城的浪漫互动。</p><p style="text-indent: 0px;">  经典与新作交织，《光辉岁月》的激昂与《蓝蓝的天》的温柔碰撞，40余首曲目串联起三代人的青春记忆。</p><p style="text-indent: 0px;">  演唱会上，叶世荣解释自己现在很少打鼓的原因，背后的故事令人动容。这一次，他拿起鼓槌，为现场观众伴奏，全场齐声大合唱《真的爱你》。</p><p style="text-indent: 0px;">  下一站，叶世荣将赴合肥摇滚之约。</p></span> <div id="articleEdit"><span class="tiyi1 domPC">【纠错】 <div id="advisebox01" class="tiyi01" style="display:none;"><div><iframe id="jc_link1" border="0" marginwidth="0" framespacing="0" marginheight="0" frameborder="0" noresize="noresize" scrolling="no" vspale="0" style="width:600px;height:350px;float:left;"/></div> <div class="tiyi03"/></div></span> <span class="editor"> 【责任编辑:王碧姣】 </span></div></div> <div class="columBox relatedNews" data="datasource:202511038601a8741b55447aacf6d9747284eb3f" datatype="content"> <div class="col-cont"><ul/></div></div> <div class="nextpage clearfix" style="display:none;"><div class="nextpage-tit">阅读下一篇：</div> <div class="nextpage-cont"/></div> <div class="ad_right domPC" style="margin-bottom:20px"><ins data-ycad-slot="399" style="text-decoration: none;"/></div> <div class="domPC"><ins data-ycad-slot="2168" style="text-decoration: none;"/></div> <div class="domPC"><ins data-ycad-slot="2169" style="text-decoration: none;"/></div> <div class="bookList clearfix domPC"><ul>
