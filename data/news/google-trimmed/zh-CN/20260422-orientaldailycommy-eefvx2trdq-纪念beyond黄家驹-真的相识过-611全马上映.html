                    <div itemprop="articleBody" class="article article-primary story" id="&quot;article_story_1&quot;" data-storyId="813254">
                                                    

                            <p>（吉隆坡22日讯）为纪念Beyond灵魂人物黄家驹而打造的音乐纪实电影《真的相识过》（Because of You Ka Kui ），将于6月11日全马戏团上映！电影特别选在6月11日上映，紧接家驹6月10日生日，意义非凡。&nbsp;</p>

                            
                            
                                                                                

                            <p>本片由叶世荣与陈健添监制，彭瑞祥执导，不仅突破传统纪录片形式，更以沉浸式大银幕体验，全面展现黄家驹的音乐理念、精神价值及其深远的文化影响力。透过珍贵演出片段、未公开影像及深度访谈，《真的相识过》带领观众走进音乐背后的故事，感受黄家驹的创作初心与时代意义。</p>

                            
                            
                                                                                

                            <p>本片特别以"音乐盛事电影"形式打造，让观众在戏院中一同聆听、共鸣、合唱， 每一场放映为一场情感共振的现场体验。</p><img alt="" src="https://www.orientaldaily.com.my/images/uploads/news/2026/APR_2026/20260422/Poster_Ka_Kui.jpg" style="width:200px" title="" caption="" class="">

                            
                            
                                                            
                                <div id="odn3-story-1x1-p3" class="ads manual-render">
            </div>

                                                                                

                            

                            
                            
                                                                                

                            <p><strong>电影特映 × Respect纪念家驹音乐会</strong></p>

                            
                                                            
                                
                                
                                                                    <div id="odn3-story-mrec-1" class="ads " data-label="true" style="display: none">
        <h6>Advertisement</h6>
                    
            </div>

                                                            
                                                                                

                            <p>在电影正式上映前，乐迷可率先参与6月6日在 Aurum Theatre - The Exchange TRX影院致敬盛会。当晚将呈现特别优先放映，并于放映后带来现场致敬音乐会，向黄家驹致敬。同时，将推出专为此次致敬场特别打造的限量独家周边商品，仅限本次活动打造。更多票务详情即将公布，敬请期待。</p>
