			<IMG alt="关淑怡本来有意与黄家强一起前往非洲作探访" align="middle" src="https://photocdn.sohu.com/20100410/Img271426158.jpg"/>
关淑怡本来有意与黄家强一起前往非洲作探访<BR>
<P>　　据香港媒体报道，黄家强日前完成非洲探访之旅，昨日(4月9日)出席活动时宣布6月6日将假香港Star Hall举行一场慈善音乐会，为兴建校园筹款。他表示演出嘉宾关淑怡爱行善绝不会失场。</P>
<P>　　大会更邀得张学友及关淑怡担任演出嘉宾。黄家强透露届时会播出探访片段，藉此感动大家捐钱，更即场呼吁大家鼎力支持。</P>
<P>　　<STRONG>歌手不收酬劳</STRONG></P>
<P>　　黄家强表示三位演出歌手不收酬劳，问到担不担心关淑怡临时失场？他说：“不会，她对于做慈善和有关小朋友的事很有心，大家不用担心，不好把她想成那样。”有传她很飘忽？“艺术家嘛！”黄家强表示与对方非常友好，不时邀对方任个唱嘉宾。问到有否向对方请教带孩子心得？他说：“有，她的儿子比我儿子大。”</P>
<P>　　<STRONG>讨厌争名逐利</STRONG></P>
<P>　　黄家强透露关淑怡原本有意一起前往非洲作探访：“她儿子没人照顾，所以她没去。”问到为何不带同自己3岁大的儿子黄庆阳同行？黄家强说：“以后吧，我回来都有给他看当地的片子，跟他讲那里的小朋友生活很艰辛，让他知道自己很幸福。”黄家强坦言经过多次探访，令他放下贪念，说：“争名逐利的人很讨厌。”</P>
