<div class="td-post-content">

    <figure id="attachment_1775167" style="width: 720px" class="wp-caption alignnone"><img class="size-full wp-image-1775167" src="https://www.kwongwah.com.my/wp-content/uploads/2026/04/20260421jy22.jpg" alt="" width="720" height="1080"/><figcaption class="wp-caption-text">
<div id="div-gpt-ad-1589869968715-0" style="width: 1px; height: 1px;">
                      
                   </div>
<p> 致敬黄家驹的作品《真的相识过》，将于6月11日全马上映，这场跨越时间与空间的音乐致敬之旅，势必再次点燃乐迷心中那份不灭的热血与感动。</p></figcaption></figure>
<p>为致敬华语乐坛摇滚传奇人物黄家驹的大银幕音乐致敬作品《真的相识过》（Because of You Ka Kui），将于6月11日全马上映。配合黄家驹6月10日64岁冥诞，这不仅是一部电影的推出，更被视为一场跨越世代的全国性集体致敬行动，号召各地乐迷走进戏院，一同缅怀其不朽音乐精神。</p>
<figure id="attachment_1775168" style="width: 1080px" class="wp-caption alignnone"><img class="size-full wp-image-1775168" src="https://www.kwongwah.com.my/wp-content/uploads/2026/04/20260421jy23.jpg" alt="" width="1080" height="722"/><figcaption class="wp-caption-text">《真的相识过》不仅是一部电影，更是一场音乐盛事电影。</figcaption></figure>
<p>本片由叶世荣与陈健添担任监制，彭瑞祥执导，突破传统纪录片框架，以沉浸式大银幕形式呈现，全面梳理黄家驹的音乐理念、创作初心及其深远的文化影响力。透过影像与声音的结合，让观众重新感受那段属于时代的音乐记忆。</p>      <div class="td-a-rec td-a-rec-id-custom_ad_1">
                        <span class="td-adspot-title">- Advertisement -</span>
                        <div class="td-all-devices mobile_hidden_ads">
                            <div id="Web/Content/300x250/R2">
                            
                            
                    <div id="div-gpt-ad-1557133069189-0" style="text-align:center;">
                        
                    </div> 
                            </div>                                
                        </div>                                
                    </div> 
<figure id="attachment_1775169" style="width: 1080px" class="wp-caption alignnone"><img class="size-full wp-image-1775169" src="https://www.kwongwah.com.my/wp-content/uploads/2026/04/20260421jy24.jpg" alt="" width="1080" height="770"/><figcaption class="wp-caption-text">影片中收录多段黄家驹珍贵演出片段、未公开影像以及深度访谈内容。</figcaption></figure>
<p>《真的相识过》不仅是一部电影，更是一场音乐盛事电影，影片中收录多段珍贵演出片段、未公开影像以及深度访谈，带领观众走进作品背后的故事。观众在戏院中不再只是旁观者，而是参与者，随着旋律一同共鸣、合唱，让每一场放映都成为情感交汇的现场体验。作为全球首部官方电影级音乐致敬作品，本片以电影规格打造音乐体验，结合影像叙事与现场感受，唤起横跨世代的庞大乐迷群体，再次见证黄家驹历久不衰的影响力。</p>
<figure id="attachment_1775170" style="width: 1080px" class="wp-caption alignnone"><img class="size-full wp-image-1775170" src="https://www.kwongwah.com.my/wp-content/uploads/2026/04/20260421jy25.jpg" alt="" width="1080" height="720"/><figcaption class="wp-caption-text">由叶世荣(左2）与陈健添监制、彭瑞祥执导，《真的相识过》以沉浸式大银幕手法呈现黄家驹（右）的音乐理念与时代影响力。</figcaption></figure>
<p>在电影正式上映前，乐迷可率先参与这场仅此一夜在吉隆坡敦拉萨国际贸易购物中心（The Exchange TRX）的Aurum Theatre的影院致敬盛会。当晚将呈现特别优先放映，并于放映后带来现场致敬音乐会，向黄家驹致敬。同时，将推出专为此次致敬场特别打造的限量独家周边商品，仅限本次活动打造，极具收藏价值，更多票务详情即将公布，敬请期待。</p>
<p>《真的相识过》于6月11日登陆全马戏院，随后亦计划进军香港、澳门及中国等地区上映。</p>      <div class="td-a-rec td-a-rec-id-custom_ad_1">
