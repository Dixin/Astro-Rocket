    第二届洛杉矶“和平与爱”原创作品暨Beyond经典金曲音乐会成功举行
  </font>
</H1>
  
  <div><center><H1><font size="+2">
    </font>
    </H1></center><br/></div>
  <SPAN class="subtit">

&nbsp;&nbsp;&nbsp;<SPAN id="articleSource">  美中时报</SPAN>


&nbsp;&nbsp;&nbsp;<SPAN id="articleAuthor">特约记者南林洛杉矶报道</SPAN>


</DIV>

<div id="artibody">
<p> &nbsp; &nbsp; &nbsp; &nbsp;音乐跨越国界，原创连接梦想。2026年第二届洛杉矶“和平与爱”原创作品暨Beyond经典金曲音乐会日前在洛杉矶隆重举行。来自中美文化艺术界、侨界及社区各界人士齐聚一堂，共同见证这场融合原创音乐、经典传唱、多元艺术与和平理念的文化盛宴。<br/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/180312789.png" title="15-1.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;本次活动由洛杉矶台山文化体育协会主办，YONNEYIU、TRIPLE-Y电力联合主办；LEO SHOPS、八方建筑、ALALAW（艾飞力事务所）、世界阳光女人联合总会、南加州高校联盟文艺部、美国臻宝拍卖公司、众越财富等机构协办。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;音乐会主席兼总导演由洛杉矶台山文化体育协会会长李艺菲担任。组委会委员包括薛浩虎、Yen Chen、罗宇巧、刘漫华、刘丽茹、陈晓山、南林及蒋伊萍。蒋伊萍担任舞台总监，罗宇巧、刘丽茹担任场务总监，陈晓山与罗宇巧负责宣传工作，刘漫华担任后勤总管。活动由著名双语主持人南林与Yen Chen联袂主持，首响天顿音响全程提供专业音响支持。</p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803128136.png" title="15-2.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803128558.png" title="15-3.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;原创歌曲评委团阵容强大，由特别顾问曲波、音乐会顾问钟玫，以及邢长江、杨紫萍、赵春生、韩柯友组成。现场伴奏由Wide Sky乐队倾情演绎，键盘手Jennie、鼓手Robin、吉他手Thomas及贝斯手Man默契合作，为整场演出增添专业魅力。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;洛杉矶台山文化体育协会（简称台山文体协会，LATS文体协会）</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;2019年4月在加州注册为非营利机构，下设排球俱乐部，弘扬“排球之乡”美誉。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;2022年迅速发展，依次成立乒乓球、羽毛球俱乐部、歌舞团、户外活动队、美食小分队、气排球小分队、匹克球俱乐部、柔力球队，太极拳队、体协乐队、歌手团、掼蛋俱乐部。各球类俱乐部在美东美西华人大赛中多次夺冠。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;*球类品牌：“元旦台山杯”排球精英赛，“玉兰杯”羽毛球赛、“玉兰杯”乒乓球团体赛</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;*歌舞团品牌：</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;“玉兰杯歌手大赛”、“和平与爱，致敬Beyond乐队演唱会&quot;</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;台山文体协会充满活力，团结高效。不限籍贯以球会友，歌舞联动，欢迎所有体育和歌舞爱好者加入。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;<strong>一、原创之花盛放洛城 匠心之作绽放光芒</strong></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;晚会以“原创”为核心主题拉开序幕。李艺菲会长首先致辞，阐述举办原创音乐会的初心与使命，强调原创是文化发展的根基，也是华人音乐人在海外持续发声的重要力量。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;开场舞《裁判恰恰舞》热情洋溢，为音乐会揭开序幕。随后，由玉兰杯冠军歌手Yen Chen与金牌歌手Eric Li共同演唱本届音乐会主题曲《爱是唯一答案》，将“和平与爱”的理念化作动人旋律传递给现场观众。</p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803129386.png" title="15-4.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;多首原创作品在晚会上精彩亮相，包括《又情关》《春天的旋律》《世态炎凉》《LA的阳光是最棒的情人》等佳作。其中，《又情关》由曲波作词作曲，《春天的旋律》由范春华作曲、蒋春明作词，《世态炎凉》由俞隆华独立创作，《LA的阳光是最棒的情人》则展现了华人在洛杉矶生活的独特情感与城市记忆。<br/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803129980.png" title="15-5.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;世界阳光女人联合总会带来的诗朗诵《把爸爸早日送回家》感人至深；评委邢长江创作的《大漠胡杨》视频作品则展现了原创音乐与影像艺术结合的魅力。<br/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803132605.png" title="15-6.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;晚会期间隆重举行原创歌曲颁奖典礼，向优秀原创音乐人颁发奖金、奖杯及荣誉证书。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;获得“天籁匠心奖”的作品包括：</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp; 《春天的旋律》（作曲：范春华、作词：蒋春明）；</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp; 《世态炎凉》（作曲作词：俞隆华）；</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp; 《又情关》（作词作曲：曲波）。</p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803133464.png" title="15-7.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;获得“金笔匠心奖”的作品包括：</p><p><br/> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;《冷傲》（填词：Jacky Yen）；<br/> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;《爱是唯一答案》及《LA的阳光是最棒的情人》（作词：王艺霖）。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;获得“金声演绎奖”的歌手包括：</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;蔡煜、Yen Chen、Eric Li、薛浩虎及Pure Pan。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;掌声与鲜花见证了原创音乐人的坚持与收获。正如Beyond乐队所倡导的精神一样，原创不仅是音乐的灵魂，更是文化传承最珍贵的火种。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;<strong>二、致敬Beyond精神传承广东人的文化情怀</strong></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;Beyond乐队成立于1983年，是华语乐坛最具影响力的摇滚乐队之一。Beyond的音乐不仅歌唱爱情，更关注理想、自由、和平、社会责任与人生价值，影响了一代又一代华人。香港殿堂级摇滚乐队 Beyond 的四位成员（黄家驹、黄家强、黄贯中、叶世荣）均祖籍广东省江门市台山市四九镇。台山作为著名的音乐和侨乡之都，被广大乐迷视为 Beyond 精神的根脉所在。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;广东台山已连续举办九届Beyond原创音乐活动，形成独具特色的文化品牌。作为这一品牌在海外的重要延伸，洛杉矶“和平与爱”Beyond主题音乐会今年迎来第二届盛会。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;作为广东籍侨团组织，洛杉矶台山文化体育协会始终怀抱浓厚家乡情怀，致力于将广东原创音乐文化带向世界，让海外华人通过音乐连接乡情与文化根脉。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;音乐会第二篇章中，《海阔天空》《真的爱你》《情人》《逝去日子》《大地》《亚拉伯跳舞女郎》《无悔这一生》《喜欢你》《光辉岁月》《Amani》《不再犹豫》《我是一只小小小小鸟》等经典作品轮番登场。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;蔡煜演唱《海阔天空》时，全场观众情不自禁跟唱。中国驻洛杉矶总领馆领事陈风华、台上体协李艺菲会长也走上舞台，与观众共同高歌《海阔天空》，将现场气氛推向高潮。当熟悉旋律响起，全场挥舞手机灯光，歌声此起彼伏。这一刻，没有台上台下之分，只有音乐、友谊与共同的情感共鸣。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;Beyond精神跨越珠江之畔与太平洋彼岸，在洛杉矶继续闪耀着原创与梦想的光芒。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;<strong>三、多元文化同台共鸣 和平之歌响彻洛城</strong></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;本届音乐会最大的亮点之一，是多元族裔艺术家的积极参与。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;协办方代表、非华裔实力歌手**艾飞力（Alalaw）**倾情演唱《童话》，赢得观众热烈掌声。他早在半年前便报名参与本次活动筹备工作，并积极支持音乐会发展，充分展现了音乐跨越语言与文化界限的力量。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;晚会第三篇章以“和平有爱 世界同心”为主题，多元艺术形式竞相绽放。蒙特利公园市议员饶影凡与冠军歌手Eric同台献唱，杨安立市长现场颁发荣誉证书。著名女高音杨紫萍演唱《羞答答的玫瑰》，并与赵春生联袂献唱《乡音乡情》，展现深厚艺术功底。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;台山体协颁发聘书給新聘顾问陈正雷、Yvonne Yiu、孙浩诚、LeoYing，孙晓华。</p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803133886.png" title="15-8.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;南加州高校联盟文艺部带来的舞蹈《谁家大美人》，美国禅院舞蹈队表演的《禅和舞》，世界阳光女人联合总会的诗歌朗诵，以及洛杉矶台山文体协会多个舞蹈团队带来的《花花宇宙》《Pretty Woman》《萱草花》等节目精彩纷呈。<br/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803134589.png" title="15-9.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803135120.png" title="15-10.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803135714.png" title="15-11.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803136308.png" title="15-12.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803136870.png" title="15-13.png" style="float:none;"/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;此外，体协国乐太极表演队将中华传统文化与现代舞台艺术巧妙融合，展现出中华文化的独特魅力。著名书法家孙晓华现场向协会赠送书法作品，为活动增添浓厚文化气息。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;联合主办方YONNEYIU、TRIPLE-Y电力，以及众多社区领袖、企业家和赞助商代表亲临现场支持，共同见证这一属于原创音乐与和平文化的盛会。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;从广东台山到美国洛杉矶，改变的是舞台与地域，不变的是原创音乐人追逐梦想的初心；跨越的是山海与时空，传递的是和平、友爱与文化传承的共同心愿。</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;正如晚会主题所表达的那样——</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;<strong>和平有爱，世界同心；原创之光，照亮未来。</strong></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;在全体演员与观众共同合唱的歌声中，第二届洛杉矶“和平与爱”原创作品暨Beyond经典金曲音乐会圆满落下帷幕，也为华人原创音乐在海外的发展写下了新的精彩篇章。</p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803137480.png" title="15-14.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/180313843.png" title="15-15.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803138856.png" title="15-16.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803139481.png" title="15-17.png" style="float:none;"/></p><p><br/></p><p style="text-align:center;"><img src="https://sinoustimes.com/upload/images/2026/6/1803225643.png" title="15-18.png"/><br/></p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;协办方：Yvonne Yiu, 主持人： 南林</p><p><br/></p><p> &nbsp; &nbsp; &nbsp; &nbsp;（照片摄影：美洲华联社 晓晓）</p><p><br/></p><p><br style="text-wrap-mode:wrap;"/></p><p><br/></p>
