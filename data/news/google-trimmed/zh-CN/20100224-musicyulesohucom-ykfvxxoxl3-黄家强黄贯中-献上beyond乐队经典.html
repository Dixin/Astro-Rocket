		<h1>黄家强黄贯中 献上Beyond乐队经典</h1>

			<div class="l">
			
				<img src="http://photocdn.sohu.com/20061227/Img247293757.gif" height="15px"/>

		<div class="text clear" id="contentText">
			
			
			<IMG alt="" align="middle" src="http://photocdn.sohu.com/20100224/Img270395467.jpg"/>
<BR>
<P>　　香港传奇摇滚乐队Beyond自2005年正式解散后，乐迷对三人重组开唱的呼声一直很高。虽然不知道这支超级乐队何时再聚首，但昨日记者获悉，3月20日，乐队的两位成员黄家强与黄贯中将在广州中山纪念堂举行“黄家强X黄贯中——一生乐与怒广州演唱会”。届时，两人除大唱Beyond经典金曲及个人摇滚作品外，还会与乐迷分享自己20多年来的摇滚道路及趣事。</P>
<P>&nbsp;&nbsp;&nbsp; 两人笑言，为缅怀家驹，家强透露会在演唱会中背着哥哥的红色吉他唱出《他的吉他》。“除了这一把，他还留下好多吉他给我，有把不肯送的我最珍惜，是用2000元求他卖给我的。”</P>
<P>　　被问及去年的香港演唱会上，为了贯彻摇滚精神他剪了一个摇滚味甚浓的鸡冠头，家强笑说，几年前BEYOND三人在广州天河体育场的演唱会十分火爆，让他们记忆犹新，这次，他和阿Paul也会带给广州歌迷更多惊喜。</P>
<P>　　至于是否担心只有两个人票房会受影响，家强则自信地表示，这次只有3000多座位，是上次的1/10，虽然年后这两天才卖票，但听主办单位说已经卖掉了一半，他们所考虑的，只是如何将最好的状态再次呈现给广州乐迷。</P>
<P>　　此前，家强与阿Paul还曾因一些误会而闹翻，不过最终两人还是解决了多年的误会，更戏剧性地于去年7月底携手走入红馆举行演唱会。</P>
<P>　　谈到这次冰释前嫌再合作，家强淡淡地回答说：“其实主要是因为主办单位的邀请。这次乐迷可以从Beyond年代的音乐，听到后来三人年代的歌，再听到我们的独立发展时的作品，看到我们的进步。”</P>
<P>　　</P>
