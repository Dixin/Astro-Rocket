				<h1 id="artibodyTitle" pid="28" tid="3" did="2628139" fid="1307">Beyond叶世荣：不是真心的音乐我们绝不做</h1>
				<div class="artInfo"><span id="art_source">http://www.sina.com.cn</span>&nbsp;&nbsp;<span id="pub_date">2009年07月28日14:16</span>&nbsp;&nbsp;<span id="media_name">南都周刊</span></div>

				
				
				<div class="blkContainerSblkCon" id="artibody">

					<center><img style="border:1px #000 solid;" src="http://i3.sinaimg.cn/ent/y/2009-07-28/U2389P28T3D2628139F326DT20090728141608.jpg" alt="Beyond叶世荣：不是真心的音乐我们绝不做"><br><img src="http://i0.sinaimg.cn/home/c.gif" height="5" width="1" style="border:0"><br>这是Beyond乐队（从左到右：黄贯中、黄家强、刘德华、黄家驹、叶世荣）当年意气风发时与刘德华的一张合照。不是风华正茂，而是一去不返式的辉煌。 <br><br/></br></br></img></br></img></center><center><img style="border:1px #000 solid;" src="http://i2.sinaimg.cn/ent/y/2009-07-28/U2389P28T3D2628139F329DT20090728141608.jpg" alt="Beyond叶世荣：不是真心的音乐我们绝不做"><br><img src="http://i0.sinaimg.cn/home/c.gif" height="5" width="1" style="border:0"><br>Beyond乐队的《光辉岁月》、《大地》、《乐与怒》等专辑，成了香港流行音乐史上难得的摇滚作品，当然也是乐<br><br/></br></br></img></br></img></center><center><img style="border:1px #000 solid;" src="http://i1.sinaimg.cn/ent/y/2009-07-28/U2389P28T3D2628139F328DT20090728141608.jpg" alt="Beyond叶世荣：不是真心的音乐我们绝不做"><br><img src="http://i0.sinaimg.cn/home/c.gif" height="5" width="1" style="border:0"><br>《光辉岁月》<br><br/></br></br></img></br></img></center><center><img style="border:1px #000 solid;" src="http://i0.sinaimg.cn/ent/y/2009-07-28/U2389P28T3D2628139F358DT20090728141608.jpg" alt="Beyond叶世荣：不是真心的音乐我们绝不做"><br><img src="http://i0.sinaimg.cn/home/c.gif" height="5" width="1" style="border:0"><br>Beyond乐队<br><br/></br></br></img></br></img></center>
					

<p>　　那个年代，音乐是纯粹的快乐。少量的宣传费，普通的包装手段，贫乏的媒体渠道，没有打榜黑幕，没有绯闻炒作，音乐在口口相传中，成了流行，甚至经典。Beyond, 这支颇具传奇色彩的乐队，在香港的快餐文化和商业机制的摧残下，坚持了自己的鲜明个性，就算是情情爱爱，也被他们演绎得大气磅礴、振奋人心。他们用真情实感，用不让自由被蚕食的决绝写成的音乐，成了一代人的精神鼓励，一代人的青春写照。</p>

<p><strong>　　Beyond</strong></p>

<p>　　香港著名摇滚乐队，成立于1983年，得奖无数，有很多首歌曲成为经典歌曲，家喻户晓、久唱不衰。其间经历了“五人Beyond”、“四人Beyond”和“三人Beyond”时期。2000年暂时解散，2005年宣布正式解散。Beyond被公认为华语乐坛上最成功和最有影响力的乐队之一，Beyond不但在香港、中国内地及台湾均有大量乐迷，即使远在日本、马来西亚等国也有大量的歌迷。</p>

<p><strong>　　对话人/宋寻</strong></p>

<p><strong>　　Beyond的地下乐队之旅</strong></p>

<p><strong>　　“第一次演唱会来了300多人，我们已经很开心了”</strong></p>

<p>　　1983年，Beyond于本年成军，组成是为了参加一场音乐比赛，演出自己作品得到冠军，当时的成员是黄家驹、叶世荣和邬林。1984年，他们一边工作一边玩BAND,偶尔在一些酒吧等地做小演出，家强正式加入了Beyond；1985年，Beyond以地下乐团的身份，向银行贷款租下港岛明爱中心，开了一场赔钱的演唱会——“永远等待”，黄贯中加入；1986年，他们亲力亲为做了一张名为《再见理想》的唱片，刘志远加入Beyond。所谓四年的“地下乐队”之旅，他们在理想和现实的交锋中，以无畏者的姿态自由驰骋；他们在无所顾忌的音乐世界，直抒胸臆，愤怒直接，但并不低靡。</p>

<p>　　南都娱乐：你们在1985年的“永远等待”第一次小型演唱会，据说非常不理想？</p>

<p>　　叶世荣：搞这个演唱会是因为当时很多乐队都是翻唱国外的摇滚乐，但是我们自己却写了很多歌。而且我们以前做的演出都是“拼盘”，我们非常希望有一首真正属于Beyond的音乐会。所以自己掏钱搞了小型音乐会。虽然预留给各大唱片公司的位子都是空着的，但是现场观众来了300多人，我们已经非常满足了。</p>

<p>　　南都娱乐：刘志远加入后，Beyond是5个人的乐队，那时的Beyond是什么样子的呢？</p>

<p>　　叶世荣：我们开始的时候是我跟黄家驹组这个乐队，后来加入另外两位，后来整合之后就变成一个比较稳定的阵容。家驹、家强、黄贯中还有我，四个人。后来发现家驹在唱现场的时候，他需要兼顾的事太多了，要弹吉他，还要唱歌，很忙。我希望他可以集中精力在一个地方，所以就找来刘志远，因为他在现场能弹吉他，也能弹键盘，音乐会变丰富一些。家驹唱的时候也会更舒服。刘志远在编曲上的能力还是很强的，有他自己的想法，不过合作了一两张唱片，他就离开乐队了，和别人组了“浮世绘”。</p>

<p>　　南都娱乐：那他走了以后，家驹岂不是又手忙脚乱了？</p>

<p>　　叶世荣：我们也考虑到这个方面，所以那个时候我举手了。我要弥补这个乐队的不足。所以就去学习很多键盘电子合成的东西。其实在《大地》唱片之前，我们都不太懂电脑，只会用节排器。后来从不懂到懂，利用模本的东西放在唱片里面。刘志远在电子合成的部分我是用节排器来替代的。所以，从某个意义来说，是我替代了刘志远。</p>

<p>　　南都娱乐：在这一阶段Beyond被视为地下乐队，是不是因为乐队那时候创作的音乐类型没有后期主流化？</p>

<p>　　叶世荣：地下乐队只是一个特有的名词，一些没有出过唱片，只是有一些Show的表演，都被统称为地下乐队。其实，我并不觉得以前我们玩的音乐风格很 “地下”，只不过是偏摇滚一些。那个时候，香港没多少人接受摇滚乐。可以说那时的香港乐队都是“地下”乐队。</p>

<p>　　南都娱乐：是不是因为初期你们的音乐还带着点叛逆顽劣和自哀自怨色彩，所以才会让人觉得比较另类和自我吧。</p>

<p>　　叶世荣：年轻的时候肯定有相对抱怨比较多的时候。不开心，不公平，都想利用音乐去表达和宣泄。在抱怨的过程中，同时安慰自己，关爱和博爱的心慢慢地建立了，这是个必然的转变过程。</p>

<p><strong>　　鼎盛一时的Beyond</strong></p>

<p><strong>　　“不能说我们对商业化运作妥协，只是我们的想法很明确了”</strong></p>

<p>　　1988年，刘志远离队，Beyond凭借《大地》和《喜欢你》，得到了香港大众的认可；1989年，Beyond前往北京首都体育馆举办演唱会，成为最早在内地演唱的香港歌手；1991年，他们也正式踏上香港歌手心目中最佳的演唱会圣地“红”；1992年，Beyond结束了与新艺宝长期合作的关系，将发展重心移往日本；1993年，主唱黄家驹因意外身亡。1988年—1992年的Beyond，是最为春风得意的时期。音乐风格开始变得朗朗上口，却不失大家风范，乐队从地下走到了地上，拥有了一呼百应的感召力，影响力蔓延了整个时代。</p>

<p>　　南都娱乐：据传是因为经纪人说如果专辑再卖得不好，就不能再出专辑了，所以你们在音乐风格上有所改变。正是因为慢慢的转变，才得到了大众的认可。那是不是能说Beyond之后的音乐更加商业化了呢？</p>

<p>　　叶世荣：我们发了几张唱片，销量都很一般。当时一些乐评人、歌手、乐队都觉得我们很奇怪，觉得Beyond的音乐不商业，不主流。这也是正常的，我们组乐队刚刚开始的时候，我们听的音乐，受到一些外国、前卫的摇滚乐的影响，所以写出的东西都带有那种味道。我们不懂写流行歌曲。后来，不能说我们是对商业化运作的乐坛妥协，只是我们当时的想法很明确，做音乐是为了让更多人接受和认可。Beyond的歌曲旋律和歌词内容一定要吸引人，但在编曲和弹奏上我们可以满足自己的兴趣，做得随性些。</p>

<p>　　南都娱乐：没有妥协过？</p>

<p>　　叶世荣：不是真心的音乐我们从来不做。</p>

<p>　　南都娱乐：1988年，你们是第一个到北京演出的香港艺人，20年前的北京，在你的眼中是什么样的？</p>

<p>　　叶世荣：那时有个朋友介绍说，北京的一个文化教育演出，问我们要不要演，我们就答应了。第一次来北京，觉得满好玩的。那时候北京没有高楼，都是平房，很多地方是农地。来看演出的观众不多，大部分都是抱着好奇的心态，想看看“香港乐队”、“香港的摇滚乐”是什么样子的。</p>

<p>　　南都娱乐：为什么早在1990年就出了国语专辑？</p>

<p>　　叶世荣：是为了开拓台湾市场，那时候香港都没几个人能把国语说好。我们几个自己也说得不好。</p>

<p>　　南都娱乐：红极一时的生活，和你想像中一样吗？</p>

<p>　　叶世荣：最初玩音乐的时候毫不觉得有压力，因为我们只需要专注于音乐上。但开始了出唱片的生涯后，便发觉要做很多与音乐无关的事情。一般的宣传通告又不会提及多少有关音乐的东西！最初的确很难受，觉得自己好似被迫做一些无关痛痒的事情。</p>

<p>　　南都娱乐：后来为什么去日本发展？</p>

<p>　　叶世荣：我们去日本的原因是为了学习。当时香港能够容纳乐队的空间不大了，同时又看到日本乐队的音乐非常棒，制作技术好。我们觉得在日本，摇滚的空间相对来讲会大很多。</p>

<p>　　南都娱乐：但是听说特别不顺利？</p>

<p>　　叶世荣：后来才发现日本的经纪公司，希望我们走偶像路线。就是实力派偶像。与日本监制合作，他主张在编曲上用多点华丽的元素，但我们希望粗犷些。所以上通告的时候会发生不太开心的事情，而且还要上一些无聊的节目，更没想到会因此失去了家驹。</p>

<p><strong>　　“后Beyond”时期</strong></p>

<p><strong>　　“家驹离开之后的好几张唱片，里面的风格很杂，没有方向”</strong></p>

<p>　　乐队灵魂人物黄家驹的离世，无疑给这支乐队宣判了死刑。三个的Beyond，愤怒与伤感交织的情绪，让他们力不从心、常思枯竭。在质疑、批判、同情中步履维艰。2000年，三人终于分道扬镳。虽然间或聚首重述兄弟情，抑或有争吵之声不绝于耳，但Beyond时代一去不返，已成了不争的事实。</p>

<p>　　南都娱乐：家驹的离开，不仅从情感上给你们带来了巨大的打击，也让乐队的前景不容乐观。</p>

<p>　　叶世荣：他是Beyond的灵魂人物，也是我们的老大。他的想法比较有见地，也很能说。跟我们讨论问题，最后肯定是他赢的。经常说得我们三个人都怕，没法和他吵。不过通常，家驹的决定都是正确的。所以家驹走了后，我们也少了主心骨，大家都陷在突如其来的悲痛中。</p>

<p>　　南都娱乐：有人会拿三个人的Beyond乐队和四个人的Beyond乐队来相比，你们这些方面受的压力是不是很大？金字招牌是不是也特别沉重？</p>

<p>　　叶世荣：我也理解他们肯定会比。其实都无所谓，很正常。严格来讲，四个人的时候，我们的音乐就比较宽厚，三个人的Beyond乐队变得比较消沉一点。因为老大离开了，骨子里面有悲凉的情绪还是蛮重的。</p>

<p>　　南都娱乐：从某种程度来说，家驹的才华，会不会成为了你们三个人难以逾越的鸿沟？</p>

<p>　　叶世荣：不可否认，家驹很聪明，很有才华，创作很快，写得也很好。同时他弹唱都很出色。乐队其他的两个人也很好。总之他们三个人都是音乐天才，我们就是跟着他学习音乐的制作、创作和唱歌的。不过我们四个人喜欢的东西都不一样，黄家强喜欢英式的摇滚；贯中喜欢重型的摇滚；家驹喜欢流行摇滚；我喜欢比较电子的一些东西。所以风格是不一样的。</p>

<p>　　南都娱乐：黄家驹离开后，你们接下来的那几张专辑是不是有刻意想要维持他的风格？</p>

<p>　　叶世荣：我们知道维持不了的，也替代不了。我们三个走自己的路，希望延续我们的精神。所以家驹离开之后的好几张唱片，里面的风格很杂，很多尝试，没有方向。我们也变得比较迷茫。</p>

<p>　　南都娱乐：所以有了解散的念头？</p>

<p>　　叶世荣：1999年底我们乐队就有这个想法，就是想一个人做自己的音乐，做自己的事情。正好我们和唱片公司和约也满了。以前在乐队里面我很少唱歌，很少写歌。我希望把时间精力放在鼓上，帮助这个乐队，当然，我也希望自己的作品能被别人喜欢。所以在乐队里面，我的作品比较少，既然自己唱歌不比其他成员好，还是干脆努力把鼓打好。后来，我觉得用自己的嗓子去表现自己的旋律，是最直接的。当我在舞台上看到歌迷听到我的歌曲有共鸣时，感觉太棒了。所以，我想自己做歌手。</p>

<p>　　南都娱乐：你不是曾经说过自己唱功不好吗？</p>

<p>　　叶世荣：我在2001年发表《美丽的时光机器》以后，很认真地听，发现自己的声音在表达时有很大的问题。我真的很想去找个地方锻炼，香港那个地方太小了，所以那个时候，内地深圳有很多酒吧，我就去演，去唱。后来胆子变大了，就跑得更远了。整个广东省，后来去北方。现在好多了。</p>

<p>　　南都娱乐：你和黄家强、黄贯中经常见面吗？</p>

<p>　　叶世荣：几乎没有，很少。大家都各忙各的事情，加上我又在内地发展。</p>

<p>　　南都娱乐：有传闻说，黄家强和黄贯中的矛盾，是因为版税引起的。就利益上你们是怎么分配的呢？</p>

<p>　　叶世荣：但我们是Beyond乐队，不是谁谁谁的乐队，所以我们演出是平均分配。创作方面，版权的收入当然是给作者。就是谁写的版权就归谁。而且他们两人也没有传闻中那么不和，乐队里面成员的意见肯定是有的，这也比较正常。7月份贯中和家强举办了演唱会，其实非常好的，来证明他们之间的感觉仍是好的，不好是不会同台演出的。</p>

<p><strong>　　记者手记</strong></p>

<p><strong>　　叶世荣的随遇而安</strong></p>

<p>　　在Beyond中，叶世荣虽然并不出众，但是他的优点，也是其他几人所不具备的。和他面对面坐着，可以随处发现他的随和和亲切。咖啡馆偶遇歌迷，也可以开开心心地聊上许久。他谦虚，从不否认自己的短处，并且虚心学习。他随遇而安，每每提及曾经的辉煌，他都会报以淡然的一笑，然后说：“谁知道我以后不会更好呢？”他已经不再是那个黄家驹光辉的背后，沉默内向的小子了。也许这样的功力是需要修炼的，自信、成熟、智慧、淡泊就是时间所赋予他的宝贵财富。</p>
