 黄家驹《真的相识过》音乐纪录片放映结束后，戏院内即场举行“THE RE:SPECT BAND音乐会”，潘先丽（左三）及司徒志辉（右三）演唱多首Beyond歌曲。</figcaption></img></figure></div></div><div class="entry-content entry clearfix"><div itemprop="articleBody"><p><span class="article-content-tag-links">Beyond</span>乐队已故主音<span class="article-content-tag-links">黄家驹</span>《<span class="article-content-tag-links">真的相识过</span>》音乐记录片昨晚举行特别放映场，随后也在戏院内举行“THE RE:SPECT BAND音乐会”，黄家驹前女友Kim<span class="article-content-tag-links">潘先丽</span>及大马摇滚乐团“<span class="article-content-tag-links">异种</span>”主唱兼贝斯手<span class="article-content-tag-links">司徒志辉</span>，在音乐会上演唱多首Beyond歌曲致敬黄家驹。潘先丽是黄家驹其中一任前女友，黄家驹在2人分手后曾写一首歌《曾是拥有》送给潘先丽，她指自己每唱必哭，昨晚现场演唱时却罕有的未掉泪，让她大赞自己“这次我好叻（厉害）啊！”</p><p>本月10日是黄家驹64岁冥诞，《真的相识过》音乐纪录片则定于11日起在大马、香港上映，以纪念这位香港摇滚乐的灵魂人物。这部被视为首部全面记录黄家驹音乐人生与传奇影响的唯一大银幕纪录片，是由Beyond乐队前经纪人<span class="article-content-tag-links">陈健添</span>（Leslie）与乐队成员<span class="article-content-tag-links">叶世荣</span>共同监制，并由<span class="article-content-tag-links">彭瑞祥</span>执导，全片长130分钟，陈健添及彭瑞祥昨晚也特地出席纪录片放映会现场。</p><div class="code-block code-block-7" style="margin: 8px auto; text-align: center; display: block; clear: both;"><div style="color:#777777;text-align:center;font-size: 12px">Advertisement</div><div id="div-gpt-ad-1545447264610-5" style="text-align:center; margin-bottom:1.846em;">  </div></div><figure id="attachment_2381600" aria-describedby="caption-attachment-2381600" style="width: 1054px" class="wp-caption alignnone"><img decoding="async" class="size-full wp-image-2381600" src="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege.webp" alt="黄家驹在二人分手后曾写歌送给潘先丽，她昨晚现场演唱这首《曾是拥有》难得的未掉泪，让她不禁夸自己“好叻！”" width="1054" height="690" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege.webp 1054w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege-300x196.webp 300w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege-1024x670.webp 1024w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege-768x503.webp 768w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege-250x164.webp 250w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/gwgewgege-600x393.webp 600w" sizes="(max-width: 1054px) 100vw, 1054px"><figcaption id="caption-attachment-2381600" class="wp-caption-text">黄家驹在二人分手后曾写歌送给潘先丽，她昨晚现场演唱这首《曾是拥有》难得的未掉泪，让她不禁夸自己“好叻！”</figcaption></img></figure><div class="code-block code-block-8" style="margin: 8px auto; text-align: center; display: block; clear: both;">
</div><p>《真的相识过》记录黄家驹从最初玩音乐、组乐团，一路奋斗到登上事业巅峰的音乐旅程，并找来多位当年与Beyond一起玩音乐、合作过的音乐人、制作人等受访，当中还惊喜见到罗大佑。电影由构思到完成历时超过20年，除了可看到黄家驹生前如何创作、写歌、录制卡带demo等，也集结Beyond过去在香港、北京、台北、东京、吉隆坡等地举行演唱会、拍摄MV等珍贵片段，以及其他后台从未曝光的影像纪录。</p><div class="code-block code-block-10" style="margin: 8px auto; text-align: center; display: block; clear: both;"><div id="div-gpt-ad-1545447264610-7">  </div></div><figure id="attachment_2381601" aria-describedby="caption-attachment-2381601" style="width: 1054px" class="wp-caption alignnone"><img decoding="async" class="size-full wp-image-2381601" src="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe.webp" alt="《真的相识过》音乐纪录片导演彭瑞祥（左）及Beyond乐队前经纪人Leslie陈健添，6日晚上特地来马出席纪录片放映会。" width="1054" height="690" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe.webp 1054w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe-300x196.webp 300w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe-1024x670.webp 1024w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe-768x503.webp 768w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe-250x164.webp 250w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/fewfefewfwewfwe-600x393.webp 600w" sizes="(max-width: 1054px) 100vw, 1054px"><figcaption id="caption-attachment-2381601" class="wp-caption-text">《真的相识过》音乐纪录片导演彭瑞祥（左）及Beyond乐队前经纪人Leslie陈健添，6日晚上特地来马出席纪录片放映会。</figcaption></img></figure><p>昨晚电影放映会结束后，也在戏院内举行“THE RE:SPECT BAND音乐会”，在台上演出的有黄家驹生前其中一任女友Kim潘先丽、大马摇滚乐团“异种”主唱兼贝斯手司徒志辉、曾与Beyond合作的<span class="article-content-tag-links">LMF</span>乐手<span class="article-content-tag-links">老占</span>（麦文威）等，他们演唱多首Beyond歌曲，包括《光辉岁月》、《真的爱你》、《不再犹豫》、《海阔天空》、《真的相识过》音乐纪录片主题曲《Because Of You》等，现场粉丝也随歌曲投入气氛当中，哼唱Beyond的歌曲集体缅怀黄家驹。</p><div class="code-block code-block-11" style="margin: 8px auto; text-align: center; display: block; clear: both;"><div id="div-gpt-ad-1545447264610-8" style="text-align:center; margin-bottom:1.846em;"><div style="color:#777777;text-align:center;font-size: 12px">ADVERTISEMENT</div>  </div></div><figure id="attachment_2381602" aria-describedby="caption-attachment-2381602" style="width: 1054px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-full wp-image-2381602" src="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw.webp" alt="潘先丽（右）与异种成员洪喜乐（左）的演唱带动现场气氛。" width="1054" height="690" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw.webp 1054w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw-300x196.webp 300w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw-1024x670.webp 1024w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw-768x503.webp 768w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw-250x164.webp 250w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/ewttewetw-600x393.webp 600w" sizes="auto, (max-width: 1054px) 100vw, 1054px"><figcaption id="caption-attachment-2381602" class="wp-caption-text">潘先丽（右）与异种成员洪喜乐（左）的演唱带动现场气氛。</figcaption></img></figure><p>黄家驹于1993年6月24日，在日本东京富士电视台录制游戏节目《小内小南的想做什么就做什么》时，不慎从约3公尺高的舞台上坠落，后脑先着地导致严重脑伤。经过6天的留医抢救，最终于日本时间1993年6月30日下午4时15分不幸逝世，终年31岁。</p><div class="code-block code-block-16" style="margin: 8px 0; clear: both;"><figure id="attachment_2381603" aria-describedby="caption-attachment-2381603" style="width: 1054px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-full wp-image-2381603" src="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe.webp" alt="现场来的都是Beyond、黄家驹歌迷，大家唱着Beyond的经典歌曲，集体缅怀黄家驹。" width="1054" height="690" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe.webp 1054w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe-300x196.webp 300w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe-1024x670.webp 1024w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe-768x503.webp 768w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe-250x164.webp 250w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/errhhrrhe-600x393.webp 600w" sizes="auto, (max-width: 1054px) 100vw, 1054px"><figcaption id="caption-attachment-2381603" class="wp-caption-text">现场来的都是Beyond、黄家驹歌迷，大家唱着Beyond的经典歌曲，集体缅怀黄家驹。</figcaption></img></figure><figure id="attachment_2381604" aria-describedby="caption-attachment-2381604" style="width: 1054px" class="wp-caption alignnone"><img loading="lazy" decoding="async" class="size-full wp-image-2381604" src="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere.webp" alt="黄家驹《真的相识过》音乐纪录片放映会及音乐会6日晚上在TRX Aurum Theatre戏院举行，获得众多粉丝出席支持。" width="1054" height="690" srcset="https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere.webp 1054w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere-300x196.webp 300w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere-1024x670.webp 1024w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere-768x503.webp 768w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere-250x164.webp 250w, https://webcdn.guangming.com.my/wp-content/uploads/2026/06/rgregrere-600x393.webp 600w" sizes="auto, (max-width: 1054px) 100vw, 1054px"><figcaption id="caption-attachment-2381604" class="wp-caption-text">黄家驹《真的相识过》音乐纪录片放映会及音乐会6日晚上在TRX Aurum Theatre戏院举行，获得众多粉丝出席支持。</figcaption></img></figure><p>&nbsp;</p><div class="code-block code-block-13" style="margin: 8px 0; clear: both;">  <div id="div-gpt-ad-1545447264610-9">  </div><div id="div-gpt-ad-1545447264610-4">  </div><div id="div-gpt-ad-1545447264610-10">  </div><div id="div-gpt-ad-1630982445971-0">  </div></div></div></div>  <div class="post-footer post-footer-on-bottom"><div class="share-links  share-centered icons-only"><div class="share-title">
